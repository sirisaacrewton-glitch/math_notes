# 命題論理（Propositional Logic）

命題論理の構文と真理値による意味論、関数的完全性と標準形、自然演繹、健全性と完全性（リンデンバウムの方法とカルマールの方法）、コンパクト性定理（完全性・ケーニッヒの補題・超フィルターによる三つの証明）。直観主義命題論理（NJ、ハイティング代数とクリプキ意味論による健全性・完全性、選言特性）。

<p class="mn-msc">MSC2020: 03B05</p>
