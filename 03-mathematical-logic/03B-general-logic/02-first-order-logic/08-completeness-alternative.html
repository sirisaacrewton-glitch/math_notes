# 完全性定理の別証明 {#logic:page-completeness-alternative keywords="alternative proofs of the completeness theorem, reduction to propositional logic, König's lemma, Gödel's proof, Herbrand, tableaux"}

\ref{logic:page-completeness} では、無矛盾な集合をリンデンバウムの補題で極大に延ばしてモデルを作った。本ページでは、一階述語論理の文を「量化子の付いた部分を一つの命題変数とみなす」ことで命題論理の論理式として読み、一階述語論理のモデルの存在を**命題論理の完全性とコンパクト性に帰着させる**証明を与える。可算な言語では、命題論理のコンパクト性をケーニッヒの補題で示せる（\ref{logic:binary-konig}）ので、これは**ケーニッヒの補題による完全性定理の証明**になる。この帰着は、ゲーデル自身が完全性定理を証明したときの考え方（一階の充足可能性を可算個の命題論理式の充足可能性に帰着させる）を、ヘンキンの証拠と組み合わせた形で再現したものである。最後に、同じくケーニッヒの補題を使うタブローの方法を紹介する。

## 記法と定義の確認 {#logic:sec-alt-notation}

::: notation
- 一階述語論理の導出、無矛盾性、派生規則、新しい定数についての一般化、定数の追加についての保存性は \ref{logic:deduction-system}, \ref{logic:derived-propositional}, \ref{logic:derived-quantifier}, \ref{logic:derived-equality}, \ref{logic:generalization-constants}, \ref{logic:conservativity-constants} のとおり。
- 命題論理の論理式・真理値割り当て・自然演繹・完全性・コンパクト性は \ref{logic:prop-formula}, \ref{logic:truth-assignment}, \ref{logic:prop-deduction}, \ref{logic:prop-completeness}, \ref{logic:prop-compactness} のとおり。
- 言語 $\mathcal{L}$ は可算とする。$\mathcal{L}$ に可算無限個の新しい定数記号 $C$ を加えた言語を $\mathcal{L}^{\ast}$ とする。
:::

## 一階の文を命題論理の論理式として読む {#logic:sec-alt-prime}

::: definition 素文と命題的な読み {#logic:prime-sentence keywords="prime sentences, propositional skeleton" index="素文|そぶん"}
言語 $\mathcal{K}$ の文のうち、原子文（$\bot$ を除く）と、$\forall x\,\varphi$ の形の文を**素文**という。素文全体を命題変数の集合 $\mathrm{PV}_{\mathcal{K}}$ とみなす。読み方の一意性（\ref{logic:unique-readability-formulas}）より、$\mathcal{K}$ の任意の文は、素文から $\bot$ と $\to$ だけで一通りに組み立てられる。したがって、$\mathcal{K}$ の文は $\mathrm{PV}_{\mathcal{K}}$ 上の命題論理の論理式でもある。素文への真理値割り当て $V\colon\mathrm{PV}_{\mathcal{K}}\to\{0,1\}$ に対し、$\mathcal{K}$ の文 $\sigma$ の命題論理としての真理値を $\bar{V}(\sigma)$ と書く。
:::

::: intuition
$\forall x\,P(x)\to P(c)$ を命題論理の目で見ると、二つの無関係な命題 $p=\forall x\,P(x)$, $q=P(c)$ の含意 $p\to q$ にすぎず、恒真式ではない。一階述語論理の意味は、素文の間のこのような関係（「$\forall x\,P(x)$ が真なら $P(c)$ も真」）に宿っている。以下では、その関係を**公理として**命題論理の側に書き込むことで、一階のモデルを命題論理の割り当てから作る。
:::

::: lemma 命題論理の導出は一階の導出 {#logic:prop-derivation-lift}
$\mathcal{K}$ の文の集合 $\Delta$ と文 $\sigma$ について、$\mathrm{PV}_{\mathcal{K}}$ 上の命題論理の自然演繹で $\Delta\vdash\sigma$ ならば、一階述語論理の自然演繹でも $\Delta\vdash_{\mathcal{K}}\sigma$。とくに、一階で無矛盾な文の集合は、命題論理としても無矛盾であり、したがって（命題論理の完全性定理より）命題論理として充足可能である。
:::

::: proof
命題論理の自然演繹の規則（仮定、$\to$I, $\to$E, RAA）は、一階述語論理の自然演繹の規則でもある。命題論理の導出の各節点の論理式は $\mathcal{K}$ の文なので、同じ木がそのまま一階の導出である（導出に関する帰納法）。後半：命題論理として $\Delta\vdash\bot$ なら一階でも $\Delta\vdash\bot$。対偶をとり、命題論理の完全性定理（\ref{logic:prop-completeness}）の「無矛盾なら充足可能」を使う。
:::

## 帰着のための公理 {#logic:sec-alt-axioms}

::: definition 量化子と等号の公理 {#logic:quantifier-equality-axioms}
言語 $\mathcal{K}$ の閉項全体を $T^{0}$ とする。次の $\mathcal{K}$ の文からなる集合を $Q_{\mathcal{K}}$ とする。
1. **（例化公理）** $\forall x\,\varphi\to\varphi[t/x]$（$\mathrm{FV}(\varphi)\subset\{x\}$, $t\in T^{0}$）。
2. **（等号公理）** $t=t$（$t\in T^{0}$）と、$s=t\to(\varphi[s/x]\to\varphi[t/x])$（$s,t\in T^{0}$, $\mathrm{FV}(\varphi)\subset\{x\}$）。

これらはすべて一階の自然演繹で導出できる（$\forall$E と $\to$I、$=$I、$=$E と $\to$I。閉項は常に代入可能）。
:::

::: definition 全称型のヘンキン公理 {#logic:universal-henkin-axioms keywords="universal Henkin axioms"}
$\mathcal{L}^{\ast}$ の組 $(x,\varphi)$（$\mathrm{FV}(\varphi)\subset\{x\}$）を $(x_{k},\varphi_{k})_{k\in\omega}$ と数え上げ、証拠 $e_{k}\in C=\{d_{0},d_{1},\dots\}$ を $k$ に関する再帰で「$\varphi_{0},\dots,\varphi_{k}$ のどれにも現れず、$e_{0},\dots,e_{k-1}$ のどれとも異なる $d_{j}$ のうち $j$ が最小のもの」と選ぶ（現れる定数と既に使った定数は有限個なので存在する）。
$$
H^{\forall}_{k}\defeq\bigl(\varphi_{k}[e_{k}/x_{k}]\to\forall x_{k}\,\varphi_{k}\bigr)
$$
を**全称型のヘンキン公理**という。「$\varphi$ の反例があるなら、$e_{k}$ はその反例である」という内容で、\ref{logic:henkin-theory} の存在型のヘンキン公理（$\neg\varphi$ に対するもの）と同値な役割を果たす。
:::

::: lemma 公理を加えても無矛盾 {#logic:alt-axioms-consistent}
$\Gamma_{0}$ を $\mathcal{L}$ の文の無矛盾な集合とする。$A\defeq\Gamma_{0}\cup\{H^{\forall}_{k}:k\in\omega\}\cup Q_{\mathcal{L}^{\ast}}$ は $\mathcal{L}^{\ast}$ で無矛盾である。
:::

::: proof
**Step 1.** $\Delta_{k}\defeq\Gamma_{0}\cup\{H^{\forall}_{j}:j<k\}$ が無矛盾であることを $k$ に関する帰納法で示す。$k=0$ は \ref{logic:conservativity-constants} による。$\Delta_{k}$ が無矛盾で $\Delta_{k}\cup\{H^{\forall}_{k}\}$ が矛盾するなら、演繹定理と \ref{logic:derived-propositional} の 6 から $\Delta_{k}\vdash\varphi_{k}[e_{k}/x_{k}]$ かつ $\Delta_{k}\vdash\neg\forall x_{k}\,\varphi_{k}$。$e_{k}$ は $\varphi_{k}$ にも $\Delta_{k}$ の元にも現れない（$\Gamma_{0}$ の元は $C$ の元を含まず、$j<k$ の $H^{\forall}_{j}$ に現れる $C$ の元は $\varphi_{j}$ に現れるものと $e_{j}$ だが、$e_{k}$ は $\varphi_{j}$（$j\le k$）に現れず $e_{j}$ とも異なる）ので、\ref{logic:generalization-constants} より $\Delta_{k}\vdash\forall x_{k}\,\varphi_{k}$。$\neg$E で $\Delta_{k}\vdash\bot$ となり矛盾する。

**Step 2.** 構文論的コンパクト性（\ref{logic:derivability-basic} の 3）から $\Gamma_{0}\cup\{H^{\forall}_{k}:k\in\omega\}$ は無矛盾（矛盾の導出が使う前提はある $\Delta_{k}$ に含まれる）。$Q_{\mathcal{L}^{\ast}}$ の元はすべて導出できるので、加えても導出可能な文は変わらない（カット）。よって $A$ は無矛盾である。
:::

## 命題論理の割り当てから一階のモデルへ {#logic:sec-alt-model}

::: theorem 命題論理の割り当てからの項モデル {#logic:valuation-term-model keywords="term model from a propositional valuation"}
$V$ を、$\mathrm{PV}_{\mathcal{L}^{\ast}}$ 上の真理値割り当てで、$A\setminus\Gamma_{0}$ のすべての元（全称型のヘンキン公理と $Q_{\mathcal{L}^{\ast}}$）について $\bar{V}=1$ となるものとする。閉項 $t,s$ について $t\sim s\iff V(t=s)=1$ と定めると、$\sim$ は同値関係で、項モデル（\ref{logic:term-model} と同じ定義。$P^{\mathcal{M}}=\{([\vec{t}]):V(P(\vec{t}))=1\}$）$\mathcal{M}_{V}$ が well-defined に定まり、$\mathcal{L}^{\ast}$ の任意の文 $\sigma$ について
$$
\mathcal{M}_{V}\models\sigma\iff\bar{V}(\sigma)=1 .
$$
:::

::: proof
**Step 1（等号）.** 等号公理から、$V(t=t)=1$。$\varphi\defeq(x=s)$（$x$ は $s$ に現れない変数）とした等号公理 $s=t\to(s=s\to t=s)$ の真理値が $1$ で $V(s=s)=1$ なので、$V(s=t)=1$ なら $V(t=s)=1$（真理値の計算）。推移律も $\varphi\defeq(r=x)$ で同様。関数記号と関係記号についての合同性も、$\varphi\defeq(f(\vec{u})=f(u_{1},\dots,x,\dots,u_{n}))$ や $\varphi\defeq P(u_{1},\dots,x,\dots,u_{n})$ の等号公理を成分ごとに使えば得られる（\ref{logic:derived-equality} の証明と同じ手順を、導出の代わりに真理値の計算で行う）。よって項モデルは well-defined で、閉項の値は $t^{\mathcal{M}_{V}}=[t]$ である。

**Step 2（真理値の対応、論理的複雑さに関する帰納法）.** 原子文 $s=t$, $P(\vec{t})$ では定義から、$\bot$ では両辺偽。含意 $\alpha\to\beta$ では、命題論理の真理値の定義と充足の定義がともに「前件が偽か後件が真」なので、帰納法の仮定から従う。

**Step 3（全称文）.** $\sigma=\forall x\,\varphi$ は素文である。
- $V(\sigma)=1$ のとき：例化公理 $\forall x\,\varphi\to\varphi[t/x]$ の真理値が $1$ なので、すべての閉項 $t$ で $\bar{V}(\varphi[t/x])=1$。$c(\varphi[t/x])<c(\sigma)$ なので帰納法の仮定より $\mathcal{M}_{V}\models\varphi[t/x]$。領域は閉項の値で尽くされ、意味論的代入補題より $\mathcal{M}_{V}\models\forall x\,\varphi$。
- $V(\sigma)=0$ のとき：$(x,\varphi)=(x_{k},\varphi_{k})$ とすると、全称型のヘンキン公理 $\varphi[e_{k}/x]\to\forall x\,\varphi$ の真理値が $1$ なので $\bar{V}(\varphi[e_{k}/x])=0$。帰納法の仮定より $\mathcal{M}_{V}\not\models\varphi[e_{k}/x]$、意味論的代入補題より $\mathcal{M}_{V}\not\models\forall x\,\varphi$。

::: hypcheck
- **例化公理**：Step 3 の $V(\sigma)=1$ の場合。**全称型のヘンキン公理**：$V(\sigma)=0$ の場合。二種類の公理で、素文 $\forall x\,\varphi$ の命題的な真理値が、その代入例の真理値に正しく連動するようにしている。
- **等号公理**：Step 1。これがないと、$V(c=d)=1$ でも $c,d$ が同一視されない、あるいは解釈が well-defined にならない。
- ここでは極大無矛盾集合を使っていない。$V$ が「どの文が真か」をすべて決めており、リンデンバウムの補題の役割を果たしている。
:::
:::

::: theorem 命題論理への帰着 {#logic:reduction-to-propositional keywords="reduction of first-order satisfiability to propositional satisfiability" index="命題論理への帰着|めいだいろんりへのきちゃく"}
可算な言語 $\mathcal{L}$ の文の集合 $\Gamma_{0}$ について、次は同値である。
1. $\Gamma_{0}$ はモデルをもつ。
2. $A=\Gamma_{0}\cup\{H^{\forall}_{k}\}\cup Q_{\mathcal{L}^{\ast}}$ は $\mathrm{PV}_{\mathcal{L}^{\ast}}$ 上の命題論理として充足可能である。
3. $A$ のすべての有限部分集合は、命題論理として充足可能である。
:::

::: proof
**1 ⇒ 3.** $\mathcal{M}\models\Gamma_{0}$ とする。$A$ の有限部分集合 $F$ に現れる証拠を $e_{k_{1}},\dots,e_{k_{m}}$ とし、番号順に解釈を決めて $\mathcal{L}^{\ast}$ 構造 $\mathcal{M}^{\ast}$ に拡大する：$\mathcal{M}^{\ast}\models\forall x_{k}\,\varphi_{k}$ ならば $e_{k}$ を任意の元、そうでなければ $\varphi_{k}$ の反例となる元に解釈する（$\varphi_{k}$ に現れる証拠はそれ以前に解釈済みである。有限個の選択なので選択公理は要らない）。すると $\mathcal{M}^{\ast}$ は $\Gamma_{0}$、$F$ に含まれるヘンキン公理、および $Q_{\mathcal{L}^{\ast}}$（妥当な文）をすべて満たす。$V(\pi)\defeq1\iff\mathcal{M}^{\ast}\models\pi$（$\pi$ は素文）とおくと、充足の定義から $\bar{V}(\sigma)=1\iff\mathcal{M}^{\ast}\models\sigma$ がすべての文で成り立ち、$V$ は $F$ を充足する。

**3 ⇒ 2.** 命題論理のコンパクト性定理（\ref{logic:prop-compactness}）。$\mathrm{PV}_{\mathcal{L}^{\ast}}$ は可算なので、ケーニッヒの補題による証明（証明 2）で足り、選択公理は要らない。

**2 ⇒ 1.** $A$ を充足する $V$ に \ref{logic:valuation-term-model} を適用すると、$\mathcal{M}_{V}\models\Gamma_{0}$。その $\mathcal{L}$ への縮小が $\Gamma_{0}$ のモデルである。
:::

::: theorem ケーニッヒの補題による完全性定理 {#logic:completeness-via-konig keywords="completeness via König's lemma"}
（選択公理なし）可算な言語の文の無矛盾な集合はモデルをもつ。したがって可算な言語の完全性定理（\ref{logic:completeness}）が、リンデンバウムの補題（ツォルンの補題）の代わりにケーニッヒの補題（\ref{logic:binary-konig}）を使って、選択公理なしに証明される。
:::

::: proof
$\Gamma_{0}$ を無矛盾とする。\ref{logic:alt-axioms-consistent} より $A$ は一階で無矛盾で、その有限部分集合も無矛盾である。\ref{logic:prop-derivation-lift} より、各有限部分集合は命題論理として充足可能である。\ref{logic:reduction-to-propositional}（3 ⇒ 1）より $\Gamma_{0}$ はモデルをもつ。論理式の集合への拡張と完全性定理への言い換えは \ref{logic:model-existence}, \ref{logic:completeness-equivalence} と同じである。

::: hypcheck
- **ケーニッヒの補題**：命題論理のコンパクト性（証明 2）を通じて使った。ここでは有限部分集合ごとの充足可能性を、命題論理の**弱い**完全性（有限集合についての完全性。\ref{logic:weak-completeness-kalmar} のカルマールの方法でも得られる）から得ているので、極大無矛盾集合を作る議論はどこにも現れない。
- **選択公理**：使っていない。
- **一階の導出が果たす役割**：\ref{logic:alt-axioms-consistent} で、ヘンキン公理を加えても無矛盾であることを示すのにだけ使った（新しい定数についての一般化）。
:::
:::

::: remark ゲーデルの証明との関係 {#logic:goedel-original-remark}
ゲーデルの最初の完全性定理の証明（1929 年の学位論文と 1930 年の論文）は、文を冠頭標準形に直したうえで、証拠を新しい変数として段階的に導入した有限個の命題論理式の列を作り、「どの段階も命題論理として充足可能なら、全体を同時に充足する割り当てがあり、そこからモデルが読み取れる」という形で、一階の充足可能性を可算個の命題論理式の充足可能性に帰着させるものだった、とされる（原論文の細部は本サイトでは確認していない）。本ページの証明は、この「命題論理への帰着」を、冠頭標準形の代わりにヘンキンの証拠を使って行ったものである。
:::

## タブローの方法 {#logic:sec-alt-tableaux}

ケーニッヒの補題を使う完全性定理の証明として、もう一つよく知られているのが**タブロー**（意味論的タブロー）の方法である。概略を述べる（本サイトではタブローの体系を定義しないので、以下は紹介にとどめる）。

::: fact タブローによる完全性 {#logic:tableau-completeness}
文 $\sigma$ を否定した $\neg\sigma$ から出発し、「$\alpha\to\beta$ が真なら $\alpha$ が偽か $\beta$ が真」のように、論理式を分解する規則に従って枝分かれする木（タブロー）を系統的に作る。全称文は、枝に現れる閉項すべてについての例化を、存在文（全称文の否定）は新しい定数による例化を、公平な順番で繰り返し適用する。すべての枝が矛盾（$\varphi$ と $\neg\varphi$ がともに現れる）で閉じれば、ケーニッヒの補題によりその木は有限であり、その有限の木から $\sigma$ の証明が得られる。閉じない枝があれば、その枝に現れる原子文を真とする項モデルで $\neg\sigma$ が真になる（ヒンティッカ集合の方法）。この証明は、ベートとヒンティッカの仕事に遡り、スマリヤンの教科書『First-Order Logic』で体系的に述べられている。
:::

::: supplement
**三つの証明の比較.** (1) ヘンキンの方法（\ref{logic:page-completeness}）：無矛盾な集合を極大に延ばす。ツォルンの補題を使えば言語の大きさによらない。(2) 命題論理への帰着（本ページ）：一階の問題を命題論理のコンパクト性の問題に変える。可算の場合はケーニッヒの補題、一般の場合は超フィルター（\ref{logic:page-prop-compactness} の証明 3）を使う。(3) タブローの方法：証明を系統的に探索し、失敗したらその探索の枝から反例を読み取る。証明の探索と反例の構成が同じ手続きの両面であることがはっきり見え、決定手続きの研究（論理式の妥当性は一般には決定できないが、証明を探し続けることはできる、という半決定性）とつながる。
:::

## 問題 {#logic:sec-alt-problems}

::: problem {#logic:prob-alt-no-axioms}
\ref{logic:reduction-to-propositional} で、例化公理を $A$ から除くと 2 ⇒ 1 が成り立たなくなる例を挙げよ。
:::

::: solution
$\Gamma_{0}=\{\forall x\,P(x),\neg P(c)\}$ はモデルをもたない。しかし素文 $\forall x\,P(x)$ と $P(c)$ は命題論理としては独立なので、$V(\forall x\,P(x))=1$, $V(P(c))=0$ とすれば $\Gamma_{0}$ は充足され、全称型のヘンキン公理（$\bar{V}(\varphi[e/x]\to\forall x\,\varphi)$ は後件が真なら $1$）と等号公理も適当に満たせる。例化公理 $\forall x\,P(x)\to P(c)$ があって初めて、この割り当てが排除される。
:::

::: problem {#logic:prob-alt-herbrand}
$\Gamma_{0}$ がモデルをもたないならば、$A$ の有限部分集合で、命題論理として充足可能でないものがあることを確かめよ。このとき、その有限集合はどのような文からなるか。
:::

::: solution
\ref{logic:reduction-to-propositional} の 3 ⇒ 1 の対偶による。その有限集合は、$\Gamma_{0}$ の有限個の文、有限個の全称型のヘンキン公理、有限個の例化公理と等号公理（どれも特定の閉項についての例）からなる。「一階の矛盾は、有限個の具体的な代入例の命題論理的な矛盾として現れる」というこの形は、エルブランの定理の考え方に近い。
:::
