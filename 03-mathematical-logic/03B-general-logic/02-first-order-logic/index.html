# 一階述語論理（First-Order Predicate Logic）

構文（読み方の一意性・代入）、意味論（構造と充足関係）、形式的証明（自然演繹）、健全性定理、完全性定理（ヘンキンの方法。系としてコンパクト性定理と弱い形のレーヴェンハイム–スコーレムの定理）、完全性定理の別証明（命題論理への帰着とケーニッヒの補題）、クレイグの補間定理とロビンソンの統合無矛盾性定理（補題として、共通言語で分離できない理論の組の合併がモデルをもつこと）。

<p class="mn-msc">MSC2020: 03B10, 03C40</p>

- [一般論理 › 命題論理](../../../03-mathematical-logic/03B-general-logic/01-propositional-logic/index.html)（全体、3 ページ）：真理値による意味論と命題論理の完全性・コンパクト性（完全性定理の別証明で使う）
