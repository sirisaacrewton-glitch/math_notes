# カリー＝ハワード同型対応（The Curry–Howard Correspondence）

直観主義論理の自然演繹と単純型付きラムダ計算の対応（証明＝項、証明の正規化＝β 簡約）と強正規化、ゲーデルの体系 T（高い型の原始再帰、アッカーマン関数）、System F（二階の型、還元可能性候補、データ型の符号化）。

<p class="mn-msc">MSC2020: 03B40, 03B38, 03F55</p>
