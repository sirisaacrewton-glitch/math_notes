# 一般論理（General Logic）

命題論理と一階述語論理の構文・意味論・証明体系と完全性定理、様相論理（クリプキ意味論・完全性・決定可能性）。

<p class="mn-msc">MSC2020: 03B</p>

## 分野

<div class="mn-cards">
<a class="mn-card" href="01-propositional-logic/index.html"><span class="mn-card-title">命題論理</span><span class="mn-card-en">Propositional Logic</span><span class="mn-card-desc">命題論理の構文と真理値による意味論、関数的完全性と標準形、自然演繹、健全性と完全性（リンデンバウムの方法とカルマールの方法）、コンパクト性定理（完全性・ケーニッヒの補題・超フィルターによる三つの証明）。</span><span class="mn-card-count">3 ページ</span></a>
<a class="mn-card" href="02-first-order-logic/index.html"><span class="mn-card-title">一階述語論理</span><span class="mn-card-en">First-Order Predicate Logic</span><span class="mn-card-desc">構文（読み方の一意性・代入）、意味論（構造と充足関係）、形式的証明（自然演繹）、健全性定理、完全性定理（ヘンキンの方法。系としてコンパクト性定理と弱い形のレーヴェンハイム–スコーレムの定理）、完全性定理の別証明（命題論理への帰着とケーニッヒの補題）、クレイグの補間定理とロビンソンの統合無矛盾性定理（補題として、共通言語で分離できない理論の組の合併がモデルをもつこと）。</span><span class="mn-card-count">9 ページ</span></a>
<a class="mn-card" href="03-modal-logic/index.html"><span class="mn-card-title">様相論理</span><span class="mn-card-en">Modal Logic</span><span class="mn-card-desc">正規様相論理 K, K4, T, B, S4, S5, GL の公理系、クリプキ意味論、健全性・完全性・決定可能性、カノニカルモデル、GL のタブロー、不完全な様相論理。（Boolos『The Logic of Provability』第 1, 4, 5, 6, 10, 11 章に対応）</span><span class="mn-card-count">7 ページ</span></a>
