# 代数的閉体の量化子消去 {#model:page-acf keywords="algebraically closed fields, ACF, quantifier elimination test, completeness of ACF_p, Lefschetz principle, Hilbert's Nullstellensatz, model theory of fields"}

前のページでは、稠密線形順序の量化子消去を、存在量化子を一つずつ構文論的に消して示した。体の場合に同じことを直接行うのは多項式の計算が煩雑になる。本ページでは、量化子消去を**二つのモデルとその共通の部分構造**の言葉で判定する方法（\ref{model:qe-test}）を示し、それを使って代数的閉体の理論 $\mathrm{ACF}$ の量化子消去（\ref{model:acf-qe}）を証明する。代数側で使うのは、商体と代数閉包の存在・一意性という標準的な事実だけである。帰結として、標数を固定した代数的閉体の理論の完全性、レフシェッツの原理、ヒルベルトの零点定理（弱形）が得られる。

## 記法と定義の確認 {#model:sec-acf-notation}

::: notation
- 量化子消去、$\sim_{T}$、リテラル、一つの存在量化子への帰着（\ref{model:qe-reduction}）、モデル完全性は \ref{model:page-quantifier-elimination} のとおり。
- 部分構造、図式、新しい定数の消去（\ref{model:constants-to-variables}）、埋め込みの像（\ref{model:embedding-image}）は \ref{model:page-elementary-substructures}, \ref{model:page-elementary-chains} のとおり。
- 割り当て $v$ のもとでの項の値 $t^{\mathcal{M},v}$。変数の列 $\vec{x}=(x_{1},\dots,x_{n})$ に元の列 $\vec{a}$ を割り当てることを $\vec{x}\mapsto\vec{a}$ と書き、$\mathcal{M}\models\varphi(\vec{a})$ は「$\vec{x}\mapsto\vec{a}$ のもとで $\varphi$ が真」の略記とする。
- **環の言語** $\mathcal{L}_{\mathrm{ring}}=\{0,1,+,-,\cdot\}$。$n\cdot1$ は $1+\dots+1$（$n$ 個）の略記である。
- 代数の事実（本ページでは証明しない。体論・可換環論の系列で扱う予定）：
  - (A1) 体の部分環 $A$ に対し、$A$ を含む最小の部分体（$A$ の商体 $\mathrm{Frac}(A)$）が存在し、二つの体の部分環 $A\subseteq K$, $A\subseteq K'$ について、それぞれの中の商体は $A$ の上で同型である（\ref[商体]{ring:fraction-field}）。
  - (A2) 代数的閉体 $K$ とその部分体 $F$ について、$F$ 上代数的な $K$ の元全体 $\overline{F}^{K}$ は代数的閉体で、$F$ の代数閉包である（\ref[代数的閉体の中の代数閉包]{fld:algebraic-closure-in-acf}）。
  - (A3) 体 $F$ の二つの代数閉包は $F$ の上で同型である。さらに、体の同型 $\sigma\colon F\to F'$ は代数閉包の間の同型に拡張される（\ref[代数閉包の一意性]{fld:algebraic-closure-uniqueness}）。
  - (A4) 体上の $0$ でない $d$ 次多項式の根は高々 $d$ 個である。代数的閉体は無限体である。
:::

## 生成された部分構造 {#model:sec-generated-substructure}

::: lemma 生成された部分構造 {#model:generated-substructure keywords="substructure generated by a set" index="生成された部分構造|せいせいされたぶぶんこうぞう"}
$\mathcal{M}$ を $\mathcal{L}$ 構造、$\vec{a}=(a_{1},\dots,a_{n})\in M^{n}$ とし、$n\ge1$ または $\mathcal{L}$ が定数記号をもつとする。変数 $x_{1},\dots,x_{n}$ だけを含む項 $t$ の値 $t^{\mathcal{M}}(\vec{a})\defeq t^{\mathcal{M},v}$（$v\colon\vec{x}\mapsto\vec{a}$）全体を $\langle\vec{a}\rangle^{\mathcal{M}}$ とすると、これは $\vec{a}$ を含む $\mathcal{M}$ の最小の部分構造の領域である。
:::

::: proof
仮定より項 $x_{1}$ か定数記号があるので $\langle\vec{a}\rangle^{\mathcal{M}}$ は空でない。定数 $c$ は項、$f(t_{1},\dots,t_{k})$ も項なので、$c^{\mathcal{M}}$ を含み $f^{\mathcal{M}}$ で閉じている。\ref{model:substructure} の後半より部分構造が定まる。$\vec{a}$ を含む部分構造は定数を含み関数で閉じているので、項の構成に関する帰納法ですべての $t^{\mathcal{M}}(\vec{a})$ を含む。
:::

::: lemma 量化子のない性質が同じ組の生成する部分構造 {#model:qftp-isomorphism}
$\mathcal{M},\mathcal{N}$ を $\mathcal{L}$ 構造、$\vec{a}\in M^{n}$, $\vec{b}\in N^{n}$ とし（\ref{model:generated-substructure} の仮定のもとで）、変数 $\vec{x}$ のすべてのリテラル $\lambda$ について $\mathcal{M}\models\lambda(\vec{a})\iff\mathcal{N}\models\lambda(\vec{b})$ とする。このとき $t^{\mathcal{M}}(\vec{a})\mapsto t^{\mathcal{N}}(\vec{b})$ は $\langle\vec{a}\rangle^{\mathcal{M}}$ から $\langle\vec{b}\rangle^{\mathcal{N}}$ の上への同型写像で、$a_{i}\mapsto b_{i}$ となる。
:::

::: proof
$t^{\mathcal{M}}(\vec{a})=s^{\mathcal{M}}(\vec{a})\iff\mathcal{M}\models(t=s)(\vec{a})\iff\mathcal{N}\models(t=s)(\vec{b})\iff t^{\mathcal{N}}(\vec{b})=s^{\mathcal{N}}(\vec{b})$ なので、写像は well-defined かつ単射である。全射性は定義から。定数と関数の保存は、項 $c$ と $f(t_{1},\dots,t_{k})$ の値の定義から。関係は $P(t_{1},\dots,t_{k})$ が原子論理式であることから。
:::

## 量化子消去の判定法 {#model:sec-qe-test}

::: theorem 量化子消去の判定法 {#model:qe-test keywords="model-theoretic test for quantifier elimination, common substructure" index="量化子消去の判定法|りょうかしじょうきょのはんていほう"}
（AC）$\mathcal{L}$ は定数記号を少なくとも一つもつとし、$T$ を $\mathcal{L}$ の理論とする。次の条件 $(\ast)$ が成り立てば、$T$ は量化子消去をもつ。

$(\ast)$ $T$ の任意のモデル $\mathcal{M},\mathcal{N}$ と、両方の部分構造である $\mathcal{A}$（$\mathcal{A}\subset\mathcal{M}$, $\mathcal{A}\subset\mathcal{N}$）、リテラルの連言 $\chi(\vec{x},y)$、$\vec{a}\in A^{n}$ について、$\mathcal{M}\models\exists y\,\chi(\vec{a})$ ならば $\mathcal{N}\models\exists y\,\chi(\vec{a})$。
:::

::: proof
\ref{model:qe-reduction} より、リテラルの連言 $\chi$ と変数 $y$ について、$\psi\defeq\exists y\,\chi$ が $T$ のもとで量化子のない論理式と同値であることを示せばよい。$\mathrm{FV}(\psi)=\{x_{1},\dots,x_{n}\}$（$n\ge0$）とし、
$$
\Gamma\defeq\{\theta:\theta\text{ は量化子がなく }\mathrm{FV}(\theta)\subseteq\{\vec{x}\},\ T\models\forall\vec{x}\,(\psi\to\theta)\}
$$
とおく。$\mathcal{L}$ にない相異なる定数記号 $d_{1},\dots,d_{n}$ をとり、論理式 $\varphi$ の $\vec{x}$ に $\vec{d}$ を代入した文を $\varphi(\vec{d})$ と書く。

**Step 1.** $T\cup\{\theta(\vec{d}):\theta\in\Gamma\}\models\psi(\vec{d})$ を示す。そうでないとし、$\mathcal{M}'$ を $T\cup\{\theta(\vec{d}):\theta\in\Gamma\}\cup\{\neg\psi(\vec{d})\}$ のモデル、$\mathcal{M}\defeq\mathcal{M}'\restr{\mathcal{L}}$、$a_{i}\defeq d_{i}^{\mathcal{M}'}$ とする。$\vec{x}$ のリテラル $\lambda$ で $\mathcal{M}\models\lambda(\vec{a})$ となるもの全体を $\Lambda$ とし、
$$
\Sigma\defeq T\cup\{\lambda(\vec{d}):\lambda\in\Lambda\}\cup\{\psi(\vec{d})\}
$$
を考える。

*$\Sigma$ はモデルをもつ.* もたないとすると、コンパクト性定理より有限個の $\lambda_{1},\dots,\lambda_{k}\in\Lambda$ で $T\cup\{\lambda_{1}(\vec{d}),\dots,\lambda_{k}(\vec{d}),\psi(\vec{d})\}$ がモデルをもたない。\ref{model:constants-to-variables} の 2（$\delta\defeq(\lambda_{1}\wedge\dots\wedge\lambda_{k}\wedge\psi)(\vec{d})$、束縛変数は α 同値で $\vec{x}$ と異なるものにしておく）より $T\models\forall\vec{x}\,\neg(\lambda_{1}\wedge\dots\wedge\lambda_{k}\wedge\psi)$、すなわち $T\models\forall\vec{x}\,(\psi\to\neg(\lambda_{1}\wedge\dots\wedge\lambda_{k}))$。よって $\neg(\lambda_{1}\wedge\dots\wedge\lambda_{k})\in\Gamma$ で、$\mathcal{M}'$ の性質から $\mathcal{M}\models\neg(\lambda_{1}\wedge\dots\wedge\lambda_{k})(\vec{a})$。これは $\lambda_{i}\in\Lambda$ に反する。

*$(\ast)$ を使う.* $\mathcal{N}'$ を $\Sigma$ のモデル、$\mathcal{N}\defeq\mathcal{N}'\restr{\mathcal{L}}$、$b_{i}\defeq d_{i}^{\mathcal{N}'}$ とする。$\vec{x}$ の各リテラル $\lambda$ について、$\mathcal{M}\models\lambda(\vec{a})$ なら $\lambda\in\Lambda$ で $\mathcal{N}\models\lambda(\vec{b})$、$\mathcal{M}\not\models\lambda(\vec{a})$ なら $\neg\lambda$ に同じことを使って $\mathcal{N}\not\models\lambda(\vec{b})$（$\neg\neg\lambda$ と $\lambda$ は同値）。$\mathcal{L}$ は定数をもつので、\ref{model:qftp-isomorphism} より $\langle\vec{a}\rangle^{\mathcal{M}}\cong\langle\vec{b}\rangle^{\mathcal{N}}$（$a_{i}\mapsto b_{i}$）。$\mathcal{N}$ の元の名前を付け替えて（同型な構造に取り替えて）、$\langle\vec{b}\rangle^{\mathcal{N}}=\langle\vec{a}\rangle^{\mathcal{M}}\eqdef\mathcal{A}$, $\vec{b}=\vec{a}$ としてよい。$\mathcal{N}\models\psi(\vec{a})$ なので、$(\ast)$（$\mathcal{M}$ と $\mathcal{N}$ の役を入れ替えて）より $\mathcal{M}\models\psi(\vec{a})$。これは $\mathcal{M}'\models\neg\psi(\vec{d})$ に反する。

**Step 2.** Step 1 とコンパクト性定理より、有限個の $\theta_{1},\dots,\theta_{m}\in\Gamma$ で $T\cup\{\theta_{1}(\vec{d}),\dots,\theta_{m}(\vec{d})\}\models\psi(\vec{d})$。\ref{model:constants-to-variables} の 2 を $(\theta_{1}\wedge\dots\wedge\theta_{m}\wedge\neg\psi)(\vec{d})$ に使って $T\models\forall\vec{x}\,(\theta_{1}\wedge\dots\wedge\theta_{m}\to\psi)$。逆向き $T\models\forall\vec{x}\,(\psi\to\theta_{1}\wedge\dots\wedge\theta_{m})$ は $\Gamma$ の定義から。よって $\psi\sim_{T}\theta_{1}\wedge\dots\wedge\theta_{m}$（$m=0$ なら $\top$）で、右辺は量化子がなく自由変数は $\vec{x}$ に含まれる。
:::

::: hypcheck
- **定数記号の存在**：Step 1 で $\langle\vec{a}\rangle$ が空でないこと（$n=0$ の場合）に使った。定数がない言語では、$n=0$ の場合に量化子のない文が $\bot$ の組み合わせしかなく、事情が変わる。
- **$(\ast)$**：Step 1 の最後の一か所だけ。$\mathcal{A}$ として使うのは有限個の元で生成された部分構造だけなので、$(\ast)$ はその場合に確かめれば足りる。
- **コンパクト性定理**：Step 1 の $\Sigma$ の充足可能性と Step 2。
:::

## 代数的閉体 {#model:sec-acf}

::: definition 代数的閉体の理論 {#model:acf keywords="theory of algebraically closed fields, ACF, ACF_p" index="代数的閉体の理論|だいすうてきへいたいのりろん"}
$\mathcal{L}_{\mathrm{ring}}$ の理論 $\mathrm{ACF}$ を、体の公理と、各 $n\ge1$ について
$$
\forall u_{0}\cdots\forall u_{n-1}\,\exists y\,\bigl(y^{n}+u_{n-1}y^{n-1}+\dots+u_{1}y+u_{0}=0\bigr)
$$
（$y^{k}$ は $y\cdot\cdots\cdot y$ の略記）からなるものとする。素数 $p$ について $\mathrm{ACF}_{p}\defeq\mathrm{ACF}\cup\{p\cdot1=0\}$、また $\mathrm{ACF}_{0}\defeq\mathrm{ACF}\cup\{\neg\,n\cdot1=0:n\ge1\}$ とする。モデルはそれぞれ代数的閉体、標数 $p$ の代数的閉体、標数 $0$ の代数的閉体である。
:::

::: lemma 項は多項式である {#model:terms-polynomials}
$\mathcal{L}_{\mathrm{ring}}$ の項 $t(\vec{x},y)$ に対し、整数係数の多項式 $P_{t}\in\Z[\vec{X},Y]$ で、任意の可換環 $R$ と $\vec{a},b\in R$ について $t^{R}(\vec{a},b)=P_{t}(\vec{a},b)$ となるものがある。したがって、$\vec{a}$ を含む部分環 $A\subseteq R$ について、$P_{t}(\vec{a},Y)=\sum_{k}c_{k}Y^{k}$ と $Y$ について整理した係数 $c_{k}$ は $A$ に属し、$t^{R}(\vec{a},b)=\sum_{k}c_{k}b^{k}$ である。
:::

::: proof
項の構成に関する帰納法（$P_{0}=0$, $P_{1}=1$, $P_{x_{i}}=X_{i}$, $P_{y}=Y$, $P_{t+s}=P_{t}+P_{s}$ など）。係数 $c_{k}$ は $\vec{a}$ の整数係数多項式の値なので、部分環 $A$ に属する。
:::

::: theorem ACF の量化子消去 {#model:acf-qe keywords="quantifier elimination for algebraically closed fields, Tarski, Chevalley" index="代数的閉体の量化子消去|だいすうてきへいたいのりょうかしじょうきょ"}
（AC）$\mathrm{ACF}$ は量化子消去をもつ。
:::

::: proof
\ref{model:qe-test} の $(\ast)$ を確かめる（$\mathcal{L}_{\mathrm{ring}}$ は定数 $0,1$ をもつ）。$\mathcal{M},\mathcal{N}$ を代数的閉体、$\mathcal{A}$ を両方の部分構造、$\chi(\vec{x},y)$ をリテラルの連言、$\vec{a}\in A^{n}$ とし、$\mathcal{M}\models\exists y\,\chi(\vec{a})$ と仮定する。

**Step 1（多項式の条件に直す）.** $\mathcal{A}$ は $0,1$ を含み $+,-,\cdot$ で閉じているので、$M$ と $N$ の共通の部分環 $A$ である。原子論理式 $t=s$ は $t-s=0$ と同値で、\ref{model:terms-polynomials} より $\vec{a}$ を代入すると $A$ 係数の $y$ の多項式の条件になる。係数は $A$ の中で計算されるので、$\mathcal{M}$ で計算しても $\mathcal{N}$ で計算しても同じである（\ref{model:substructure-qf} の 1）。$\bot$ を含む連言は $\mathcal{M}$ で満たされないので現れない。よって $A[Y]$ の多項式 $f_{1},\dots,f_{k}$, $g_{1},\dots,g_{l}$ があって、$M$ の元 $c$ についても $N$ の元 $c$ についても
$$
\chi(\vec{a},c)\ \text{が真}\iff f_{1}(c)=\dots=f_{k}(c)=0,\ g_{1}(c)\neq0,\dots,g_{l}(c)\neq0 .
$$
$\mathcal{M}\models\exists y\,\chi(\vec{a})$ の証拠を $c_{0}\in M$ とする。

**Step 2（等式に $0$ でない多項式がある場合）.** ある $f_{i}$ が $0$ 多項式でないとする。$F_{M}\defeq\mathrm{Frac}(A)\subseteq M$, $F_{N}\defeq\mathrm{Frac}(A)\subseteq N$ とすると、(A1) より $A$ の上の同型 $\sigma_{0}\colon F_{M}\to F_{N}$ がある。(A2) より $K_{M}\defeq\overline{F_{M}}^{M}$, $K_{N}\defeq\overline{F_{N}}^{N}$ はそれぞれ $F_{M},F_{N}$ の代数閉包で、(A3) より $\sigma_{0}$ は同型 $\sigma\colon K_{M}\to K_{N}$ に拡張される。$c_{0}$ は $0$ でない $f_{i}\in A[Y]\subseteq F_{M}[Y]$ の根なので $F_{M}$ 上代数的で、$c_{0}\in K_{M}$。$\sigma$ は環の同型で $A$ の元を動かさないので、$f_{i}(\sigma(c_{0}))=\sigma(f_{i}(c_{0}))=0$, $g_{j}(\sigma(c_{0}))=\sigma(g_{j}(c_{0}))\neq0$。よって $\sigma(c_{0})\in N$ が $\mathcal{N}$ での証拠である。

**Step 3（等式がすべて自明な場合）.** すべての $f_{i}$ が $0$ 多項式（$k=0$ を含む）なら、等式はどの $c$ でも成り立つ。$g_{j}(c_{0})\neq0$ なので各 $g_{j}$ は $0$ 多項式でない。(A4) より $g_{1}\cdots g_{l}$ の $N$ での根は有限個で、$N$ は無限なので、それ以外の $c\in N$ が証拠になる。
:::

::: hypcheck
- **代数閉性**：(A2) で $\overline{F}^{M}$ が代数的閉体になることと、(A4) で $N$ が無限であることに使った。体の公理だけでは、たとえば $\mathbb{Q}\subset\R$ で $\exists y\,y^{2}=2$ が一方でだけ真になる。
- **(A3)（代数閉包の一意性）**：Step 2。$M$ と $N$ で「$A$ 上代数的な部分」が同型であることが核心である。代数的でない元（Step 3）は、有限個の多項式の根を避けるだけでよい。
- **標数**：使っていない。$\mathcal{A}$ が共通の部分構造であることから、$M$ と $N$ の標数は自動的に一致する（$p\cdot1=0$ は量化子のない文）。
:::

::: corollary ACF の帰結 {#model:acf-consequences keywords="completeness of ACF_p, model completeness of ACF" index="ACF_p の完全性|えーしーえふぴーのかんぜんせい"}
（AC）
1. $\mathrm{ACF}$ はモデル完全である：代数的閉体 $K\subseteq L$ について $K\preccurlyeq L$。
2. $p$ が素数または $0$ のとき、$\mathrm{ACF}_{p}$ は完全である。
:::

::: proof
1. \ref{model:acf-qe} と \ref{model:qe-model-complete}。
2. $\sigma$ を文とすると、量化子のない文 $\psi\sim_{\mathrm{ACF}}\sigma$ がある。$\psi$ の原子論理式は、変数を含まない項の等式 $t=s$ で、\ref{model:terms-polynomials} より整数 $m$ について $m\cdot1=0$（$m<0$ なら $(-m)\cdot1=0$）と同値である。標数が固定されると、これらの真偽はモデルによらず決まる。よって $\psi$ の真偽も $\mathrm{ACF}_{p}$ のモデルによらず、$\mathrm{ACF}_{p}\models\sigma$ か $\mathrm{ACF}_{p}\models\neg\sigma$。$\mathrm{ACF}_{p}$ にはモデル（素体の代数閉包）があるので両立しない。
:::

::: corollary レフシェッツの原理 {#model:lefschetz-principle keywords="Lefschetz principle" index="レフシェッツの原理|れふしぇっつのげんり"}
（AC）$\mathcal{L}_{\mathrm{ring}}$ の文 $\sigma$ について次は同値である。
1. $\sigma$ は $\mathbb{C}$ で真である。
2. $\mathrm{ACF}_{0}\models\sigma$。
3. 十分大きいすべての素数 $p$ について $\mathrm{ACF}_{p}\models\sigma$。
4. 無限に多くの素数 $p$ について $\mathrm{ACF}_{p}\models\sigma$。
:::

::: proof
1 $\Leftrightarrow$ 2：$\mathbb{C}\models\mathrm{ACF}_{0}$ と $\mathrm{ACF}_{0}$ の完全性（\ref{model:acf-consequences} の 2）。2 $\Rightarrow$ 3：コンパクト性定理より有限個の $\neg\,n\cdot1=0$（$n\le N$）と $\mathrm{ACF}$ から $\sigma$ が従う。$p>N$ なら $\mathrm{ACF}_{p}$ はそれらを含意する（標数 $p$ の体で $n\cdot1=0\iff p\mid n$）。3 $\Rightarrow$ 4 は明らか。4 $\Rightarrow$ 2：2 が成り立たなければ、完全性より $\mathrm{ACF}_{0}\models\neg\sigma$ で、2 $\Rightarrow$ 3 を $\neg\sigma$ に使うと十分大きい $p$ で $\mathrm{ACF}_{p}\models\neg\sigma$ となり、4 に反する。
:::

::: corollary ヒルベルトの零点定理（弱形） {#model:weak-nullstellensatz keywords="Hilbert's Nullstellensatz, weak form, via model completeness" index="ヒルベルトの零点定理|ひるべるとのれいてんていり"}
（AC）$K$ を代数的閉体、$I\subsetneq K[X_{1},\dots,X_{n}]$ を真のイデアルとする。このとき $I$ のすべての多項式の共通の零点 $\vec{c}\in K^{n}$ が存在する。
:::

::: proof
ヒルベルトの基底定理（\ref[ヒルベルトの基底定理]{ring:hilbert-basis}）より $I=(f_{1},\dots,f_{k})$ と書ける。$I$ を含む極大イデアル $\mathfrak{m}$ をとり（\ref[極大イデアルの存在]{ring:maximal-ideal-existence}）、$L_{0}\defeq K[\vec{X}]/\mathfrak{m}$、$L$ を $L_{0}$ の代数閉包とする。$K\to L_{0}$ は単射な環準同型（体からの準同型で $1\mapsto1$）なので、$K\subseteq L$ とみなせる。$L$ において $\bar{X}_{i}$（$X_{i}$ の類）は $f_{1}=\dots=f_{k}=0$ の解である。$f_{j}$ の係数を $K$ の定数 $c_{a}$ として書いた $\mathcal{L}_{\mathrm{ring}}\cup\{c_{a}:a\in K\}$ の存在文 $\exists\vec{y}\,(f_{1}(\vec{y})=0\wedge\dots\wedge f_{k}(\vec{y})=0)$ は $L$ で真である。\ref{model:acf-consequences} の 1 より $K\preccurlyeq L$ なので、この文は $K$ でも真であり、解 $\vec{c}\in K^{n}$ がある。$I$ の元は $f_{j}$ の $K[\vec{X}]$ 係数の一次結合なので、$\vec{c}$ で $0$ になる。
:::

## 問題 {#model:sec-acf-problems}

::: problem {#model:prob-acf-definable-subsets}
代数的閉体 $K$ の部分集合 $D\subseteq K$ が、パラメータ（$K$ の元）つきの $\mathcal{L}_{\mathrm{ring}}$ の論理式 $\varphi(x)$ で定義できるなら、$D$ は有限集合か、有限集合の補集合であることを示せ。
:::

::: solution
\ref{model:acf-qe} より $\varphi(x)$ はパラメータつきの量化子のない論理式と同値で、\ref{model:qf-dnf} より、多項式 $f(x)=0$ または $g(x)\neq0$ の形のリテラルの連言の選言と同値である。$f$ が $0$ 多項式でなければ $\{f=0\}$ は有限、$0$ 多項式なら $K$。$\{g\neq0\}$ は補集合が有限か空集合。有限集合と補有限集合の全体は有限個の共通部分・合併で閉じているので、$D$ もそのいずれかである。
:::

::: problem {#model:prob-real-not-qe}
$\R$ の $\mathcal{L}_{\mathrm{ring}}$ での理論 $\mathrm{Th}(\R)$ は量化子消去をもたないことを、前問と同じ考え方で示せ。
:::

::: solution
$\varphi(x)\defeq\exists y\,x=y\cdot y$ は $[0,\infty)$ を定める。量化子のない論理式（パラメータなし）が定める $\R$ の部分集合は、前問と同じく有限集合か補有限集合（係数は整数の多項式）だが、$[0,\infty)$ はどちらでもない。
:::

::: supplement
**前提の検討.**
- 代数の事実 (A1)〜(A4) のうち、(A3) の代数閉包の一意性の証明には一般に選択公理（ツォルンの補題）が使われる。$\mathrm{ACF}$ の量化子消去そのものは、選択公理を使わない構文論的な証明（終結式による変数消去）も知られている。
- \ref{model:weak-nullstellensatz} では、極大イデアルの存在と代数閉包の存在に選択公理を使った。$K$ が可算などの場合は不要になることが知られている。

**関連する結果.**
- *シュヴァレーの定理.* 量化子消去は「構成可能集合（多項式の等式・不等式の有限個の組み合わせで定まる集合）の多項式写像による像は構成可能」という代数幾何の定理と同値な内容をもつ。Hartshorne『Algebraic Geometry』でも演習として扱われる種類の結果である（本サイトでは確かめていない）。
- *アックス–グロタンディークの定理.* 多項式写像 $\mathbb{C}^{n}\to\mathbb{C}^{n}$ が単射なら全射である。有限体では単射なら全射であることと、レフシェッツの原理（\ref{model:lefschetz-principle}）から導けることが知られている。
- *実閉体.* 順序体の言語では実閉体の理論が量化子消去をもつ（タルスキ）。問題 \ref{model:prob-real-not-qe} は、順序の記号が要ることを示している。

**高い視点から：同型類で見る.** 判定法 \ref{model:qe-test} は「量化子のない情報（部分構造 $\mathcal{A}$）が同じなら、一歩の存在の主張も同じ」という条件である。$\mathrm{ACF}$ では、$A$ の上の代数閉包が同型を除いて一つに決まる（(A3)）ことがこの条件を与える。代数閉包の一意性は、代数閉包が $A$ 上の「普遍的」な対象であることの現れで、圏論的に言えば、$A$ を含む代数的閉体への埋め込みが本質的に一通りしかない、という剛性である。たとえるなら、共通の土台 $A$ の上に建つ代数的な建物はどちらの土地でも同じ設計図で建ち、残りの空き地（超越的な元）はどちらも無限に広いので、有限個の禁止区域（根）を避けて家を建てる場所がいつでもある、ということである。
:::
