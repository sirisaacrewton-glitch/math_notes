# 初等拡大と量化子消去（Elementary Extensions and Quantifier Elimination）

部分構造と初等部分構造、タルスキ–ヴォートの判定法、レーヴェンハイム–スコーレムの定理、初等鎖、保存定理、量化子消去とモデル完全性、稠密線形順序と代数的閉体。（Chang–Keisler 第 1 章 §5、第 3 章 §1–2 の内容に相当。本文は自分の言葉で組み立てる）

<p class="mn-msc">MSC2020: 03C07, 03C10</p>
