# 型と可算モデル（Types and Countable Models）

型と型空間、型の省略定理、原子モデルと素モデル、可算範疇性（ライル–ナルジェフスキの定理）、飽和モデル、識別不能元とエーレンフォイヒト–モストフスキのモデル、ランダムグラフと 0–1 法則、フライッセ極限、ヴォートの定理（可算モデルはちょうど 2 個にならない）、有理ウリゾーン空間（カテトフ関数と往復論法）。（主に Chang–Keisler 第 2 章 §2–3、第 3 章 §3、第 5 章 §1 の内容に相当）

<p class="mn-msc">MSC2020: 03C15, 03C50, 03C35</p>
