# 超積と飽和 {#model:page-ultrapower-saturation keywords="countably incomplete ultrafilter, aleph_1-saturated ultraproduct, ultrapower, Keisler-Shelah theorem, continuum hypothesis, isomorphic ultrapowers"}

超積は、可算不完全な超フィルター（\ref{model:countably-incomplete}）を使うと、自動的に $\aleph_{1}$ 飽和になる（\ref{model:ultraproduct-saturated}）。これは、コンパクト性定理と初等図式による飽和な初等拡大の構成（\ref{model:saturated-extension}）とは別の、具体的な構成である。帰結として、連続体仮説のもとでは、初等的同値な可算構造の超冪が同型になる（\ref{model:ch-ultrapowers-isomorphic}）。これは「初等的同値 $\iff$ 同型な超冪をもつ」というケイスラー–シェラの定理の特別な場合である。

## 記法と定義の確認 {#model:sec-ups-notation}

::: notation
- 超フィルター、非単項超フィルターの存在（\ref{model:nonprincipal-ultrafilter}）、超積 $\prod_{i}\mathcal{M}_{i}/U$、ウォシュの定理（\ref{model:los-theorem}, \ref{model:los-any-assignment}）、超冪と対角写像（\ref{model:ultrapower-diagonal}）は \ref{model:page-ultraproducts} のとおり。$\lVert\varphi\rVert_{w}\defeq\{i:\mathcal{M}_{i},w_{i}\models\varphi\}$。
- $\kappa$ 飽和、$A$ 上の型、飽和モデルの一意性（\ref{model:saturated-unique}）は \ref{model:page-saturated-models} のとおり。
- **公理.** $\ZFC$ で議論する。連続体仮説 $\mathrm{CH}$（$2^{\aleph_{0}}=\aleph_{1}$）を使う箇所は明記する。
:::

## 可算不完全な超フィルター {#model:sec-countably-incomplete}

::: definition 可算不完全 {#model:countably-incomplete keywords="countably incomplete ultrafilter" index="可算不完全な超フィルター|かさんふかんぜんなちょうふぃるたー"}
$I$ 上の超フィルター $U$ が**可算不完全**であるとは、$U$ の元の列 $I_{0}\supseteq I_{1}\supseteq\cdots$ で $\bigcap_{n}I_{n}=\varnothing$ となるものが存在することをいう。
:::

::: lemma $\omega$ 上の非単項超フィルター {#model:omega-ultrafilter-incomplete}
$\N$ 上の非単項超フィルターは可算不完全である。
:::

::: proof
非単項超フィルター $U$ は補有限集合をすべて含む：有限集合 $F\in U$ なら、$F=\bigcup_{k\in F}\{k\}$ で、超フィルターの性質（有限個の合併が $U$ に属せばどれかが属する）からある $\{k\}\in U$ となり、$U$ は $k$ で生成される単項超フィルターになる。よって $I_{n}\defeq\{k:k\ge n\}\in U$ で、$\bigcap_{n}I_{n}=\varnothing$。
:::

## 超積の飽和 {#model:sec-ups-saturated}

::: theorem 超積は $\aleph_{1}$ 飽和 {#model:ultraproduct-saturated keywords="ultraproducts over countably incomplete ultrafilters are aleph_1-saturated" index="超積の飽和|ちょうせきのほうわ"}
（AC）$\mathcal{L}$ を可算の言語、$U$ を $I$ 上の可算不完全な超フィルター、$(\mathcal{M}_{i})_{i\in I}$ を $\mathcal{L}$ 構造の族とする。このとき $\mathcal{M}^{U}\defeq\prod_{i}\mathcal{M}_{i}/U$ は $\aleph_{1}$ 飽和である。
:::

::: proof
$A\subseteq M^{U}$ を可算、$p(x)$ を $A$ 上の $1$ 変数の型とする。$\mathcal{L}_{A}$ は可算なので、$p=\{\varphi_{n}(x,c_{\vec{a}_{n}}):n\in\N\}$ と並べられる（$\varphi_{n}(x,\vec{y})$ は $\mathcal{L}$ の論理式、$\vec{a}_{n}$ は $A$ の元の組。$p$ が有限なら同じ元を繰り返す）。各 $a\in A$ の代表 $g_{a}\in\prod_{i}M_{i}$ を選び、$\vec{a}_{n}(i)$ を代表の $i$ 成分の組とする。$U$ の元 $I_{0}\supseteq I_{1}\supseteq\cdots$ を $\bigcap_{n}I_{n}=\varnothing$ となるようにとる。

**Step 1（大きい集合の減少列）.**
$$
X_{n}\defeq I_{n}\cap\Bigl\{i\in I:\mathcal{M}_{i}\models\exists x\bigwedge_{k\le n}\varphi_{k}(x,\vec{a}_{k}(i))\Bigr\}
$$
とおく。$p$ は $\mathrm{Th}(\mathcal{M}^{U}_{A})$ と両立するので $\mathcal{M}^{U}\models\exists x\bigwedge_{k\le n}\varphi_{k}(x,\vec{a}_{k})$（そうでなければこの文の否定が $\mathrm{Th}(\mathcal{M}^{U}_{A})$ に属する）。ウォシュの定理（\ref{model:los-any-assignment}）より右の集合は $U$ に属し、$X_{n}\in U$。$X_{0}\supseteq X_{1}\supseteq\cdots$ で、$\bigcap_{n}X_{n}\subseteq\bigcap_{n}I_{n}=\varnothing$。

**Step 2（各成分の証拠）.** $i\in X_{0}$ について $n(i)\defeq\max\{n:i\in X_{n}\}$ は（$\bigcap X_{n}=\varnothing$ より）有限である。$b(i)\in M_{i}$ を、$\bigwedge_{k\le n(i)}\varphi_{k}(x,\vec{a}_{k}(i))$ を満たす元として選ぶ（$i\in X_{n(i)}$ なので存在する）。$i\notin X_{0}$ なら $b(i)\in M_{i}$ は任意。

**Step 3（実現）.** 各 $n$ について、$i\in X_{n}$ なら $n(i)\ge n$ なので $\mathcal{M}_{i}\models\varphi_{n}(b(i),\vec{a}_{n}(i))$。よって $\{i:\mathcal{M}_{i}\models\varphi_{n}(b(i),\vec{a}_{n}(i))\}\supseteq X_{n}\in U$ で、ウォシュの定理より $\mathcal{M}^{U}\models\varphi_{n}([b],\vec{a}_{n})$。$[b]$ は $p$ を実現する。
:::

::: hypcheck
- **可算不完全性**：Step 2 で $n(i)$ が有限であることに使った。$n(i)$ が有限なので、各成分で「有限個の条件を満たす元」を選べばよい。$U$ が可算完全（たとえば単項）だと、超積は成分の一つと同型で、飽和になるとは限らない。
- **言語と $A$ の可算性**：型を $\N$ で添字付けたこと。これが $\aleph_{1}$ 飽和（可算個のパラメータ）にとどまる理由である。
- **ウォシュの定理**：Step 1 と Step 3。成分ごとの選択（Step 2）と代表の選択に選択公理を使う。
:::

::: corollary 超冪による飽和な初等拡大 {#model:ultrapower-saturated-extension}
（AC）可算の言語の構造 $\mathcal{M}$ と、$\N$ 上の非単項超フィルター $U$ について、超冪 $\mathcal{M}^{\N}/U$ は $\mathcal{M}$ の $\aleph_{1}$ 飽和な初等拡大である（対角写像で $\mathcal{M}$ を同一視する）。
:::

::: proof
\ref{model:ultrapower-diagonal}, \ref{model:omega-ultrafilter-incomplete}, \ref{model:ultraproduct-saturated}。
:::

## 連続体仮説と同型な超冪 {#model:sec-ch-ultrapowers}

::: lemma 可算構造の超冪の濃度 {#model:ultrapower-cardinality}
（AC）$\mathcal{M}$ を可算無限の構造（可算言語）、$U$ を $\N$ 上の非単項超フィルターとすると、$\aleph_{1}\le\lvert M^{\N}/U\rvert\le2^{\aleph_{0}}$。
:::

::: proof
上界は $\lvert M^{\N}\rvert=\aleph_{0}^{\aleph_{0}}=2^{\aleph_{0}}$ から。下界：$N\defeq M^{\N}/U$ が可算とすると、$A\defeq N$ の上の型 $p(x)\defeq\{\neg\,x=c_{a}:a\in N\}$ は両立する（有限部分は $N$ が無限なので実現される）が、$N$ で実現されない。これは \ref{model:ultrapower-saturated-extension} の $\aleph_{1}$ 飽和性（$\lvert A\rvert<\aleph_{1}$）に反する。
:::

::: theorem CH のもとで同型な超冪 {#model:ch-ultrapowers-isomorphic keywords="under CH elementarily equivalent countable structures have isomorphic ultrapowers" index="同型な超冪|どうけいなちょうべき"}
（$\ZFC+\mathrm{CH}$）$\mathcal{M},\mathcal{N}$ を可算言語の可算無限構造で $\mathcal{M}\equiv\mathcal{N}$ とし、$U$ を $\N$ 上の非単項超フィルターとする。このとき $\mathcal{M}^{\N}/U\cong\mathcal{N}^{\N}/U$。
:::

::: proof
\ref{model:ultrapower-cardinality} と $\mathrm{CH}$ より、二つの超冪の濃度はともに $\aleph_{1}$。\ref{model:ultrapower-saturated-extension} よりともに $\aleph_{1}$ 飽和、すなわち飽和である。対角写像は初等的なので $\mathcal{M}^{\N}/U\equiv\mathcal{M}\equiv\mathcal{N}\equiv\mathcal{N}^{\N}/U$。飽和モデルの一意性（\ref{model:saturated-unique}）より同型である。
:::

::: hypcheck
- **CH**：濃度を $\aleph_{1}$ にそろえ、$\aleph_{1}$ 飽和を「飽和」にするために使った。$\mathrm{CH}$ が成り立たないと、超冪の濃度 $2^{\aleph_{0}}$ に対して $\aleph_{1}$ 飽和では足りない。
- **可算性**：言語の可算性は \ref{model:ultraproduct-saturated}、構造の可算性は超冪の濃度の上界に使った。
- **同じ超フィルター**：二つの超冪に同じ $U$ を使う必要は、この証明ではない（どちらも飽和で同じ濃度なら同型）。
:::

## 問題 {#model:sec-ups-problems}

::: problem {#model:prob-ultrapower-n-nonstandard}
$U$ を $\N$ 上の非単項超フィルター、$\mathcal{N}^{\ast}\defeq(\N,<)^{\N}/U$、$d$ を対角写像とする。$g_{k}(n)\defeq\max(n-k,0)$ とおく。
1. $[g_{k}]$（$k\in\N$）は相異なり、すべての標準的な元 $d(m)$ より大きいことを示せ。
2. すべての $d(m)$ より大きく、すべての $[g_{k}]$ より小さい元が $\mathcal{N}^{\ast}$ にあることを示せ。
:::

::: solution
1. $k<l$ なら $\{n:g_{l}(n)<g_{k}(n)\}\supseteq\{n:n\ge l\}$ は補有限で $U$ に属するので、ウォシュの定理より $[g_{l}]<[g_{k}]$。また $\{n:m<g_{k}(n)\}\supseteq\{n:n>m+k\}\in U$ より $d(m)<[g_{k}]$。
2. 可算集合 $A\defeq\{d(m):m\in\N\}\cup\{[g_{k}]:k\in\N\}$ の上の型 $p(x)\defeq\{c_{d(m)}<x:m\in\N\}\cup\{x<c_{[g_{k}]}:k\in\N\}$ を考える。有限部分は、$m\le M$, $k\le K$ の条件だけなので、1 より $x=[g_{K+1}]$ で実現される。よって $p$ は $A$ 上の型で、\ref{model:ultrapower-saturated-extension} の $\aleph_{1}$ 飽和性より実現される。
:::

::: problem {#model:prob-principal-not-saturated}
$U$ が $i_{0}$ で生成される単項超フィルターなら、$\prod_{i}\mathcal{M}_{i}/U\cong\mathcal{M}_{i_{0}}$ であることを示し、この場合に \ref{model:ultraproduct-saturated} の結論が成り立たない例を挙げよ。
:::

::: solution
$[g]\mapsto g(i_{0})$ は、$g\sim_{U}h\iff g(i_{0})=h(i_{0})$ なので well-defined な全単射で、ウォシュの定理（または定義）より構造を保つ。例：$\mathcal{M}_{i_{0}}=(\N,<)$ は $\aleph_{0}$ 飽和でない（問題 \ref{model:prob-n-not-saturated}）ので、$\aleph_{1}$ 飽和でもない。
:::

::: supplement
**前提の検討.**
- \ref{model:ultraproduct-saturated} は、より一般に「$\lvert I\rvert=\kappa$ 上の**良い**（good）可算不完全な超フィルターによる超積は $\kappa^{+}$ 飽和」という形に強められることが知られている（ケイスラー）。良い超フィルターの存在の証明は難しく、本サイトでは扱わない。
- \ref{model:ch-ultrapowers-isomorphic} の $\mathrm{CH}$ は外せないことが知られている：$\mathrm{CH}$ が成り立たない集合論のモデルで、$(\N,<)$ の二つの非単項超フィルターによる超冪が同型でない例がある、と言われている（本サイトでは確かめていない）。

**関連する結果.**
- *ケイスラー–シェラの定理.* $\mathcal{M}\equiv\mathcal{N}$ であることと、ある集合 $I$ 上のある超フィルター $U$ で $\mathcal{M}^{I}/U\cong\mathcal{N}^{I}/U$ となることは同値である。ケイスラーが一般化連続体仮説のもとで示し、シェラが仮説なしに示した。逆向き（同型な超冪をもてば初等的同値）は、ウォシュの定理と対角写像からすぐ従う。
- *非標準解析.* 実数の超冪 $\R^{\N}/U$ は $\aleph_{1}$ 飽和な実閉順序体で、無限小・無限大を含む。ロビンソンの非標準解析の典型的な模型である。

**高い視点から：平均をとると隙間が埋まる.** 超積は、成分ごとの構造を超フィルターという「多数決」で平均したものである。可算不完全性は、多数派がどんどん小さくなり、最後には誰も残らないような列があることを意味し、この列を使うと、可算個の条件を「成分 $i$ ごとに、$i$ が多数派に残っている間だけ満たす」という形で一つずつ少しずつ満たす元が組める（Step 2）。各成分ではたかだか有限個の条件しか満たさないのに、多数決をとると可算個すべてを満たす――局所的な有限の努力が、大域的には無限の要求を満たすという、コンパクト性の具体的な実現である。代数的には、超積は圏論での**フィルター付き余極限**（直積の、補集合が小さい部分での同一視）として理解でき、ハルモスの多進代数の議論でも超積と同様の構成が現れると言われている（本サイトでは確かめていない）。
:::
