# アックス–グロタンディークの定理 {#model:page-ax-grothendieck keywords="Ax-Grothendieck theorem, injective polynomial maps are surjective, finite fields, algebraic closure of F_p as a union of finite fields, Lefschetz principle, ultraproduct of fields, transfer from positive characteristic"}

**アックス–グロタンディークの定理**（\ref{model:ax-grothendieck}）は、「多項式写像 $\mathbb{C}^{n}\to\mathbb{C}^{n}$ が単射なら全射である」と主張する。有限集合の間では単射が全射を導くのは鳩の巣原理そのものだが、$\mathbb{C}^{n}$ は無限集合である。モデル理論による証明は、主張が（次数を固定すれば）一つの一階の文で書けることに着目し、有限体から $\mathbb{F}_{p}$ の代数閉包へ（\ref{model:ax-grothendieck-fp}）、さらに標数 $0$ へと**移す**：レフシェッツの原理（\ref{model:lefschetz-principle}）による方法と、超積（\ref{model:ultraproduct}）による方法の二通りを示す。

> 資料：本ページは特定の教科書の記述によらず、標準的な議論に従って組み立てた。

## 記法と定義の確認 {#model:sec-ag-notation}

::: notation
- 体の言語 $\mathcal{L}_{\mathrm{ring}}$、代数的閉体の理論 $\mathrm{ACF}$, $\mathrm{ACF}_{p}$ とその完全性（選択公理を使う）、レフシェッツの原理は \ref{model:acf}, \ref{model:acf-consequences}, \ref{model:lefschetz-principle} のとおり。
- 超積とウォシュの定理は \ref{model:ultraproduct}, \ref{model:los-theorem}、素数全体の上の非単項超フィルターによる体の超積が標数 $0$ であることは \ref{model:ex-ultraproduct-char-zero} のとおり。
- 体 $K$ 上の**多項式写像** $F=(F_{1},\dots,F_{n})\colon K^{n}\to K^{n}$ とは、各 $F_{i}$ が $K$ 係数の $n$ 変数多項式であるものをいう。すべての $F_{i}$ の次数が $d$ 以下のとき、$F$ を**次数 $d$ 以下**という。
- $\overline{\mathbb{F}}_{p}$ は素体 $\mathbb{F}_{p}$ の代数閉包である。その存在は体論の標準的な結果（選択公理を使う）で、ここでは引用する。$\overline{\mathbb{F}}_{p}$ の元はすべて $\mathbb{F}_{p}$ 上代数的（$\mathbb{F}_{p}$ 係数のモニック多項式の根）である。
:::

## 主張を一つの文で書く {#model:sec-ag-sentence}

::: lemma 単射なら全射、を表す文 {#model:ag-sentence keywords="the statement 'every injective polynomial map of degree <= d on K^n is surjective' is a first-order sentence" index="アックス–グロタンディークの文|あっくすぐろたんでぃーくのぶん"}
$n,d\ge1$ を固定する。$\mathcal{L}_{\mathrm{ring}}$ の文 $\sigma_{n,d}$ で、すべての体 $K$ について次が成り立つものがある：$K\models\sigma_{n,d}$ であることと、$K$ 上の次数 $d$ 以下の単射な多項式写像 $K^{n}\to K^{n}$ がすべて全射であることは同値。
:::

::: proof
次数 $d$ 以下の $n$ 変数の単項式 $x^{\alpha}=x_{1}^{\alpha_{1}}\cdots x_{n}^{\alpha_{n}}$（$\alpha_{1}+\cdots+\alpha_{n}\le d$）は有限個で、その全体を $\alpha^{(1)},\dots,\alpha^{(N)}$ と並べる。係数を表す変数 $c_{i,j}$（$1\le i\le n$, $1\le j\le N$）について、$F_{i}(\bar{x})$ を項 $\sum_{j}c_{i,j}x^{\alpha^{(j)}}$（$x^{\alpha}$ は積の項）とし、
$$
\sigma_{n,d}\defeq\forall\bar{c}\,\Bigl[\forall\bar{x}\,\forall\bar{y}\,\bigl(\textstyle\bigwedge_{i}F_{i}(\bar{x})=F_{i}(\bar{y})\to\bigwedge_{i}x_{i}=y_{i}\bigr)\to\forall\bar{z}\,\exists\bar{x}\,\textstyle\bigwedge_{i}F_{i}(\bar{x})=z_{i}\Bigr]
$$
とする。$\bar{c}$ の値を $K$ からとることは、$K$ 上の次数 $d$ 以下の多項式写像を一つ選ぶことにちょうど対応する。
:::

::: remark
「すべての次数 $d$ について」は一つの文では書けず、文の族 $\{\sigma_{n,d}:n,d\ge1\}$ になる。以下の議論は各 $\sigma_{n,d}$ ごとに行う。
:::

## 正標数での証明 {#model:sec-ag-positive}

::: lemma 有限部分集合を含む有限部分体 {#model:fp-bar-locally-finite keywords="every finite subset of the algebraic closure of F_p lies in a finite subfield" index="代数閉包の有限部分体|だいすうへいほうのゆうげんぶぶんたい"}
$\overline{\mathbb{F}}_{p}$ の有限個の元 $a_{1},\dots,a_{m}$ について、それらを含む有限部分体がある。
:::

::: proof
各 $a_{i}$ は次数 $d_{i}$ の $\mathbb{F}_{p}$ 係数のモニック多項式の根なので、$a_{i}^{d_{i}}$ は $1,a_{i},\dots,a_{i}^{d_{i}-1}$ の $\mathbb{F}_{p}$ 係数の一次結合で、帰納的に $a_{i}$ のすべての冪もそうである。したがって、$a_{1},\dots,a_{m}$ の $\mathbb{F}_{p}$ 係数の多項式の値全体 $R\defeq\mathbb{F}_{p}[a_{1},\dots,a_{m}]$ は、$a_{1}^{e_{1}}\cdots a_{m}^{e_{m}}$（$e_{i}<d_{i}$）の一次結合全体で、高々 $p^{d_{1}\cdots d_{m}}$ 個の元からなる有限集合である。$R$ は体の部分環なので整域であり、$r\ne0$ による掛け算 $R\to R$ は単射、$R$ が有限なので全射で、$rs=1$ となる $s\in R$ がある。よって $R$ は有限部分体である。
:::

::: theorem 正標数の場合 {#model:ax-grothendieck-fp keywords="injective polynomial maps on the algebraic closure of F_p are surjective" index="アックス–グロタンディークの定理（正標数）|あっくすぐろたんでぃーくのていりせいひょうすう"}
$\overline{\mathbb{F}}_{p}$ 上の単射な多項式写像 $F\colon\overline{\mathbb{F}}_{p}^{\,n}\to\overline{\mathbb{F}}_{p}^{\,n}$ は全射である。したがって、すべての $n,d$ について $\overline{\mathbb{F}}_{p}\models\sigma_{n,d}$ であり、$\mathrm{ACF}_{p}\models\sigma_{n,d}$。
:::

::: proof
$\bar{z}\in\overline{\mathbb{F}}_{p}^{\,n}$ をとる。$F$ の係数と $z_{1},\dots,z_{n}$ を含む有限部分体 $k$ を \ref{model:fp-bar-locally-finite} でとる。$F$ の係数は $k$ に属するので $F$ は $k^{n}$ を $k^{n}$ に移し、その制限 $k^{n}\to k^{n}$ は単射である。$k^{n}$ は**有限集合**なので、制限は全射（鳩の巣原理）で、$F(\bar{x})=\bar{z}$ となる $\bar{x}\in k^{n}$ がある。

後半：前半と \ref{model:ag-sentence} から $\overline{\mathbb{F}}_{p}\models\sigma_{n,d}$。$\overline{\mathbb{F}}_{p}\models\mathrm{ACF}_{p}$ で、$\mathrm{ACF}_{p}$ は**完全**（\ref{model:acf-consequences} の 2）なので、$\mathrm{ACF}_{p}\models\sigma_{n,d}$（そうでなければ $\mathrm{ACF}_{p}\models\neg\sigma_{n,d}$ となり、$\overline{\mathbb{F}}_{p}$ で矛盾）。
:::

## 標数 0 への移行 {#model:sec-ag-transfer}

::: theorem アックス–グロタンディークの定理 {#model:ax-grothendieck keywords="Ax-Grothendieck: every injective polynomial map C^n -> C^n is surjective; holds in every algebraically closed field" index="アックス–グロタンディークの定理|あっくすぐろたんでぃーくのていり"}
（AC）代数的閉体 $K$ 上の単射な多項式写像 $K^{n}\to K^{n}$ は全射である。特に $K=\mathbb{C}$ でそうである。
:::

::: proof
$K$ の標数が $p>0$ なら \ref{model:ax-grothendieck-fp} から $K\models\sigma_{n,d}$。標数 $0$ の場合を二通りに示す。

**レフシェッツの原理による方法.** \ref{model:ax-grothendieck-fp} から、すべての素数 $p$ で $\mathrm{ACF}_{p}\models\sigma_{n,d}$。レフシェッツの原理（\ref{model:lefschetz-principle} の 4 ⇒ 2）から $\mathrm{ACF}_{0}\models\sigma_{n,d}$ で、$K\models\sigma_{n,d}$。

**超積による方法.** 素数全体 $I$ 上の非単項超フィルター $U$ をとり（\ref{model:nonprincipal-ultrafilter}）、$L\defeq\prod_{p\in I}\overline{\mathbb{F}}_{p}/U$ とする。
- $\mathrm{ACF}$ の各公理は各 $\overline{\mathbb{F}}_{p}$ で真なので、ウォシュの定理（\ref{model:los-theorem}）から $L$ で真。
- \ref{model:ex-ultraproduct-char-zero} と同じ議論で、$L$ の標数は $0$。
- $\sigma_{n,d}$ は各 $\overline{\mathbb{F}}_{p}$ で真（\ref{model:ax-grothendieck-fp}）なので、ウォシュの定理から $L\models\sigma_{n,d}$。

よって $L\models\mathrm{ACF}_{0}\cup\{\sigma_{n,d}\}$ で、$\mathrm{ACF}_{0}$ の完全性から $\mathrm{ACF}_{0}\models\sigma_{n,d}$、したがって $K\models\sigma_{n,d}$。

いずれの場合も、$n$ と単射な $F$ の次数 $d$ について $K\models\sigma_{n,d}$ なので、$F$ は全射である。
:::

::: hypcheck
- **有限性（鳩の巣原理）**：\ref{model:ax-grothendieck-fp} の核心である。
- **$\overline{\mathbb{F}}_{p}$ が有限部分体の和集合であること**：係数と目標の点を一つの有限部分体に閉じ込めるのに使った（\ref{model:fp-bar-locally-finite}）。
- **次数の固定**：主張を一つの一階の文 $\sigma_{n,d}$ にするのに使った。
- **$\mathrm{ACF}_{p}$, $\mathrm{ACF}_{0}$ の完全性（選択公理）**：$\overline{\mathbb{F}}_{p}$ から $\mathrm{ACF}_{p}$ のすべてのモデルへ、超積 $L$ から $\mathbb{C}$ へと移すのに使った。
- **代数的閉体であること**：$\mathbb{Q}$ のような体では結論が成り立たない（\ref{model:prob-ag-q}）。証明では、$\overline{\mathbb{F}}_{p}$ が有限部分体の和集合であることと、完全性による移行の両方で使われている。
:::

## 問題 {#model:sec-ag-problems}

::: problem {#model:prob-ag-q}
$x\mapsto x^{3}$ は $\mathbb{Q}\to\mathbb{Q}$ の単射な多項式写像だが全射でないことを示せ。$\mathbb{R}$ では $x\mapsto x^{3}$ が全射であることと比べ、$\mathbb{R}$ 上の一変数多項式写像については「単射なら全射」が成り立つことを示せ。
:::

::: solution
単射：$x<y$ なら $y^{3}-x^{3}=(y-x)(y^{2}+xy+x^{2})>0$（第二因子は $(y+x/2)^{2}+3x^{2}/4>0$。$x=y=0$ は除かれている）。全射でない：$x^{3}=2$ となる有理数 $x=a/b$（既約）があれば $a^{3}=2b^{3}$ から $a$ は偶数、すると $b$ も偶数で矛盾。

$\mathbb{R}$ 上：単射な多項式 $f$ は定数でない。偶数次で最高次の係数が正なら（負なら $-f$ を考える）、$x\to\pm\infty$ で $f\to+\infty$ なので、$f$ はある点 $x_{0}$ で最小値 $m$ をとる。$f(a)>m+1$ となる $a<x_{0}$ と $b>x_{0}$ をとると、中間値の定理から値 $m+1$ を $(a,x_{0})$ と $(x_{0},b)$ の両方でとり、単射に反する。奇数次なら $\pm\infty$ で逆符号の無限大に発散するので、中間値の定理から全射。
:::

::: problem {#model:prob-ag-frobenius}
$x\mapsto x^{p}$ は $\overline{\mathbb{F}}_{p}\to\overline{\mathbb{F}}_{p}$ の全単射だが、その逆写像は多項式写像でないことを示せ。
:::

::: solution
単射：$x^{p}=y^{p}$ なら $(x-y)^{p}=x^{p}-y^{p}=0$（二項係数 $\binom{p}{k}$ は $0<k<p$ で $p$ で割り切れる）なので $x=y$。全射は \ref{model:ax-grothendieck-fp}（または $X^{p}-a$ の根の存在）。逆が多項式 $q$ なら、無限体 $\overline{\mathbb{F}}_{p}$ のすべての $x$ で $q(x^{p})=x$ となり、多項式 $q(X^{p})-X$ は無限個の根をもつので $0$。しかし $q(X^{p})$ の次数は $p$ の倍数で $1$ にならない。
:::

::: supplement
**前提を変えると.** 定理は、代数的閉体上の代数多様体の間の単射な正則写像は全射である、という形に一般化されることが知られている（アックス、グロタンディーク）。逆写像については、標数 $0$ の代数的閉体では全単射な多項式写像の逆写像も多項式写像であることが知られているが、正標数ではフロベニウス写像（\ref{model:prob-ag-frobenius}）のように成り立たない。「ヤコビ行列式が $0$ でない定数である多項式写像 $\mathbb{C}^{n}\to\mathbb{C}^{n}$ は単射か」という**ヤコビアン予想**は、$n\ge2$ で未解決の問題として知られている（学習データの時点での知識による）。

**似た定理.** 「有限の場合に成り立つ主張を、一階の文で書いて無限の場合へ移す」方法は、レフシェッツの原理（\ref{model:lefschetz-principle}）の典型的な応用で、零点定理の証明（\ref{model:weak-nullstellensatz}）でも使った。超積による方法は、ラムゼーの定理の有限版と無限版の行き来（コンパクト性）と同じ形をしている。

**高い視点から：有限から無限へ、正標数から標数 0 へ.** 証明は二回の「移行」からなる。まず $\overline{\mathbb{F}}_{p}$ は有限体の和集合で、その中の一つの問題は一つの有限体の中に閉じ込められるので、鳩の巣原理がそのまま使える。次に、標数 $0$ の代数的閉体は「標数 $p$ の代数的閉体の極限」（超積）であり、一階の文はその極限で保たれる。比喩で言えば、無限の駐車場（$\mathbb{C}^{n}$）での「一台一区画に止めたら全区画が埋まる」という主張を、有限の駐車場の無数の集まりの「平均的な姿」として確かめている。
:::
