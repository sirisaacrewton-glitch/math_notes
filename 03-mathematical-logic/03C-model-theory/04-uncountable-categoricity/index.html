# 非可算範疇性（Uncountable Categoricity）

安定性と EM モデル、ω 安定な理論（型の数え上げ・孤立型の稠密性・集合上の素モデル）、ヴォート対と二基数定理、強極小集合と次元、ボールドウィン–ラクランの定理とモーリーの範疇性定理。（新井『数学基礎論』§5.6 を参考）

<p class="mn-msc">MSC2020: 03C35, 03C45</p>
