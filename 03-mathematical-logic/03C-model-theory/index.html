# モデル理論（Model Theory）

構造と理論、コンパクト性、初等部分構造、ヴォートの判定法、量化子消去、型と可算モデル、飽和モデル、識別不能列、超積、安定性と非可算範疇性（モーリーの範疇性定理）。

<p class="mn-msc">MSC2020: 03C</p>

## 分野

<div class="mn-cards">
<a class="mn-card" href="01-elementary-extensions/index.html"><span class="mn-card-title">初等拡大と量化子消去</span><span class="mn-card-en">Elementary Extensions and Quantifier Elimination</span><span class="mn-card-desc">部分構造と初等部分構造、タルスキ–ヴォートの判定法、レーヴェンハイム–スコーレムの定理、初等鎖、保存定理、量化子消去とモデル完全性、稠密線形順序と代数的閉体。（Chang–Keisler 第 1 章 §5、第 3 章 §1–2 の内容に相当。本文は自分の言葉で組み立てる）</span><span class="mn-card-count">5 ページ</span></a>
<a class="mn-card" href="02-types-and-countable-models/index.html"><span class="mn-card-title">型と可算モデル</span><span class="mn-card-en">Types and Countable Models</span><span class="mn-card-desc">型と型空間、型の省略定理、原子モデルと素モデル、可算範疇性（ライル–ナルジェフスキの定理）、飽和モデル、識別不能元とエーレンフォイヒト–モストフスキのモデル。（Chang–Keisler 第 2 章 §2–3、第 3 章 §3、第 5 章 §1 の内容に相当）</span><span class="mn-card-count">4 ページ</span></a>
<a class="mn-card" href="03-ultraproducts/index.html"><span class="mn-card-title">超積</span><span class="mn-card-en">Ultraproducts</span><span class="mn-card-desc">超フィルター、超積とウォシュの定理、コンパクト性定理の意味論的証明、超冪と初等埋め込み、可算不完全な超フィルターによる飽和。（Chang–Keisler 第 4 章・第 6 章の内容に相当）</span><span class="mn-card-count">2 ページ</span></a>
<a class="mn-card" href="04-uncountable-categoricity/index.html"><span class="mn-card-title">非可算範疇性</span><span class="mn-card-en">Uncountable Categoricity</span><span class="mn-card-desc">安定性と EM モデル、ω 安定な理論（型の数え上げ・孤立型の稠密性・集合上の素モデル）、ヴォート対と二基数定理、強極小集合と次元、ボールドウィン–ラクランの定理とモーリーの範疇性定理。（新井『数学基礎論』§5.6 を参考）</span><span class="mn-card-count">7 ページ</span></a>
