# 有限オートマトンと非決定性 {#comp:page-finite-automata keywords="alphabet, string, language, deterministic finite automaton, DFA, regular language, nondeterministic finite automaton, NFA, subset construction, closure properties, regular operations"}

**有限オートマトン**は、有限個の状態だけを記憶しながら入力の文字列を一文字ずつ読み、最後に受理するかどうかを答える機械である。本ページでは、決定性有限オートマトン（DFA、\ref{comp:dfa}）と、各時点で複数の可能性を同時にたどる非決定性有限オートマトン（NFA、\ref{comp:nfa}）を定義し、両者が認識する言語のクラスが等しいこと（部分集合構成、\ref{comp:nfa-dfa-equivalence}）を示す。帰結として、DFA で認識できる言語（**正規言語**）は和・連接・スター（正規演算）と補集合・共通部分で閉じている（\ref{comp:regular-closure}）。

## 記法と定義の確認 {#comp:sec-fa-notation}

::: notation
- **アルファベット** $\Sigma$ は空でない有限集合で、その元を**文字**という。$\Sigma$ の文字の有限列を $\Sigma$ 上の**文字列**（語）といい、長さ $0$ の文字列を $\varepsilon$、文字列 $w$ の長さを $\lvert w\rvert$ と書く。文字列全体を $\Sigma^{\ast}$ と書く。$\Sigma\subseteq\Sigma^{\ast}$ とみなす（長さ $1$ の文字列）。
- 文字列 $u,v$ の**連接** $uv$ は $u$ の後に $v$ を並べた文字列である。連接は結合的で $\varepsilon$ を単位元とする（$\Sigma^{\ast}$ は $\varepsilon$ を単位元とする自由モノイド）。
- **言語**とは $\Sigma^{\ast}$ の部分集合のことである。言語 $A,B$ について
$$
\begin{aligned}
&A\cup B,\qquad A\circ B\defeq\{uv:u\in A,\ v\in B\},\\
&A^{\ast}\defeq\{w_{1}w_{2}\cdots w_{k}:k\ge0,\ w_{i}\in A\}
\end{aligned}
$$
をそれぞれ**和**、**連接**、**スター**といい、まとめて**正規演算**という（$k=0$ のとき $w_{1}\cdots w_{k}=\varepsilon$ なので $\varepsilon\in A^{\ast}$）。$\overline{A}\defeq\Sigma^{\ast}\setminus A$ は補集合。
- $\Sigma_{\varepsilon}\defeq\Sigma\cup\{\varepsilon\}$。集合 $Q$ の冪集合を $\mathcal{P}(Q)$ と書く。
:::

## 決定性有限オートマトン {#comp:sec-dfa}

::: definition 決定性有限オートマトン {#comp:dfa keywords="deterministic finite automaton, DFA, transition function, accept states" index="決定性有限オートマトン|けっていせいゆうげんおーとまとん, DFA|でぃーえふえー, 遷移関数|せんいかんすう, 受理状態|じゅりじょうたい"}
**決定性有限オートマトン**（DFA）とは、組 $M=(Q,\Sigma,\delta,q_{0},F)$ で、$Q$ は有限集合（**状態**の集合）、$\Sigma$ はアルファベット、$\delta\colon Q\times\Sigma\to Q$ は**遷移関数**、$q_{0}\in Q$ は**開始状態**、$F\subseteq Q$ は**受理状態**の集合であるものをいう。$\delta$ を文字列に延ばした $\hat{\delta}\colon Q\times\Sigma^{\ast}\to Q$ を
$$
\hat{\delta}(q,\varepsilon)\defeq q,\qquad\hat{\delta}(q,wa)\defeq\delta(\hat{\delta}(q,w),a)\quad(w\in\Sigma^{\ast},\ a\in\Sigma)
$$
で定める。$M$ が文字列 $w$ を**受理する**とは $\hat{\delta}(q_{0},w)\in F$ のことで、$M$ が受理する文字列全体を $L(M)$ と書き、$M$ が**認識する言語**という。
:::

::: definition 正規言語 {#comp:regular-language keywords="regular language" index="正規言語|せいきげんご"}
ある DFA が認識する言語を**正規言語**という。
:::

::: lemma 拡張遷移関数の性質 {#comp:delta-hat}
$\hat{\delta}(q,uv)=\hat{\delta}(\hat{\delta}(q,u),v)$（$u,v\in\Sigma^{\ast}$）。
:::

::: proof
$v$ の長さに関する帰納法。$v=\varepsilon$ なら両辺 $\hat{\delta}(q,u)$。$v=v'a$ なら $\hat{\delta}(q,uv'a)=\delta(\hat{\delta}(q,uv'),a)=\delta(\hat{\delta}(\hat{\delta}(q,u),v'),a)=\hat{\delta}(\hat{\delta}(q,u),v'a)$（帰納法の仮定と定義）。
:::

::: example 偶数個の 1 {#comp:ex-even-ones}
$\Sigma=\{0,1\}$ とし、$Q=\{e,o\}$, $q_{0}=e$, $F=\{e\}$, $\delta(q,0)=q$, $\delta(e,1)=o$, $\delta(o,1)=e$ とする。$\lvert w\rvert$ に関する帰納法で「$\hat{\delta}(e,w)=e\iff w$ の中の $1$ の個数が偶数」がわかるので、$L(M)$ は $1$ を偶数個含む文字列全体である。
:::

::: proposition 補集合・和・共通部分 {#comp:dfa-boolean}
$A,B$ が正規言語なら、$\overline{A}$, $A\cup B$, $A\cap B$ も正規言語である。
:::

::: proof
**補集合.** $M=(Q,\Sigma,\delta,q_{0},F)$ が $A$ を認識するなら、$(Q,\Sigma,\delta,q_{0},Q\setminus F)$ は $\overline{A}$ を認識する（$\hat{\delta}$ は変わらない）。

**和と共通部分（直積構成）.** $M_{k}=(Q_{k},\Sigma,\delta_{k},q_{k},F_{k})$ が $A$（$k=1$）, $B$（$k=2$）を認識するとする。$Q\defeq Q_{1}\times Q_{2}$, $\delta((p,r),a)\defeq(\delta_{1}(p,a),\delta_{2}(r,a))$, 開始状態 $(q_{1},q_{2})$ とする。$\lvert w\rvert$ に関する帰納法で $\hat{\delta}((p,r),w)=(\hat{\delta}_{1}(p,w),\hat{\delta}_{2}(r,w))$。受理状態を $F_{\cup}\defeq(F_{1}\times Q_{2})\cup(Q_{1}\times F_{2})$ とすれば $A\cup B$、$F_{\cap}\defeq F_{1}\times F_{2}$ とすれば $A\cap B$ を認識する。
:::

## 非決定性有限オートマトン {#comp:sec-nfa}

::: definition 非決定性有限オートマトン {#comp:nfa keywords="nondeterministic finite automaton, NFA, epsilon transitions" index="非決定性有限オートマトン|ひけっていせいゆうげんおーとまとん, NFA|えぬえふえー, ε 遷移|いぷしろんせんい"}
**非決定性有限オートマトン**（NFA）とは、組 $N=(Q,\Sigma,\delta,q_{0},F)$ で、$Q,\Sigma,q_{0},F$ は DFA と同じく、遷移関数が $\delta\colon Q\times\Sigma_{\varepsilon}\to\mathcal{P}(Q)$ であるものをいう。$N$ が文字列 $w$ を**受理する**とは、$w=y_{1}y_{2}\cdots y_{m}$（各 $y_{i}\in\Sigma_{\varepsilon}$）と書け、状態の列 $r_{0},r_{1},\dots,r_{m}$ で
$$
r_{0}=q_{0},\qquad r_{i+1}\in\delta(r_{i},y_{i+1})\ (0\le i<m),\qquad r_{m}\in F
$$
を満たすもの（**受理計算**）が存在することをいう。受理する文字列全体を $L(N)$ と書く。
:::

::: intuition
NFA は、読んでいる途中で「どの遷移を選ぶか」を当て推量してよい機械であり、当て推量のうちどれか一つでも受理状態にたどり着けば受理する。$\varepsilon$ 遷移は、文字を読まずに状態を変える自由な動きである。各時点で「今いる可能性のある状態の集合」を追跡すれば、この当て推量は決定的な計算に直せる。これが次の部分集合構成である。
:::

::: definition ε 閉包と到達集合 {#comp:epsilon-closure}
NFA $N$ と $R\subseteq Q$ について、$R$ から $\varepsilon$ 遷移を $0$ 回以上たどって行ける状態全体を $E(R)$ と書く（$R\subseteq E(R)$）。文字列 $w$ について、$w=y_{1}\cdots y_{m}$（$y_{i}\in\Sigma_{\varepsilon}$）と $r_{0}=q_{0}$, $r_{i+1}\in\delta(r_{i},y_{i+1})$ を満たす列の最後の状態 $r_{m}$ になりうるもの全体を $\mathrm{Reach}(w)$ と書く。$N$ が $w$ を受理する $\iff\mathrm{Reach}(w)\cap F\neq\varnothing$ である。
:::

::: lemma 到達集合の再帰 {#comp:reach-recursion}
$\mathrm{Reach}(\varepsilon)=E(\{q_{0}\})$ であり、$w\in\Sigma^{\ast}$, $a\in\Sigma$ について
$$
\mathrm{Reach}(wa)=E\Bigl(\bigcup_{r\in\mathrm{Reach}(w)}\delta(r,a)\Bigr).
$$
:::

::: proof
**$w=\varepsilon$.** $\varepsilon=y_{1}\cdots y_{m}$ なら $y_{i}$ はすべて $\varepsilon$ で、列は $q_{0}$ から $\varepsilon$ 遷移だけをたどるもの。よって $\mathrm{Reach}(\varepsilon)=E(\{q_{0}\})$。

**$\supseteq$.** 右辺の元 $s$ は、ある $r\in\mathrm{Reach}(w)$, $r'\in\delta(r,a)$ から $\varepsilon$ 遷移を $k\ge0$ 回たどったものである。$r$ に至る $w$ の列の後に、$a$ と $k$ 個の $\varepsilon$ を続ければ、$wa$ の列で $s$ に至る。

**$\subseteq$.** $s\in\mathrm{Reach}(wa)$ とし、$wa=y_{1}\cdots y_{m}$ と列 $r_{0},\dots,r_{m}=s$ をとる。$y_{i}$ のうち $\varepsilon$ でないものを並べると $wa$ になるので、最後の $\varepsilon$ でない $y_{j}$ は $a$ で、$y_{1}\cdots y_{j-1}=w$、$y_{j+1},\dots,y_{m}$ はすべて $\varepsilon$。よって $r_{j-1}\in\mathrm{Reach}(w)$, $r_{j}\in\delta(r_{j-1},a)$ で、$s$ は $r_{j}$ から $\varepsilon$ 遷移でたどれるので右辺に属する。
:::

::: theorem NFA と DFA の同値性（部分集合構成） {#comp:nfa-dfa-equivalence keywords="subset construction, powerset construction, equivalence of NFAs and DFAs" index="部分集合構成|ぶぶんしゅうごうこうせい"}
任意の NFA $N$ に対し、$L(M)=L(N)$ となる DFA $M$ が存在する。したがって、言語が正規であることと、ある NFA が認識することは同値である。
:::

::: proof
$N=(Q,\Sigma,\delta,q_{0},F)$ に対し、DFA $M\defeq(\mathcal{P}(Q),\Sigma,\delta',E(\{q_{0}\}),F')$ を
$$
\delta'(R,a)\defeq E\Bigl(\bigcup_{r\in R}\delta(r,a)\Bigr),\qquad F'\defeq\{R\subseteq Q:R\cap F\neq\varnothing\}
$$
で定める（$\mathcal{P}(Q)$ は有限）。$\lvert w\rvert$ に関する帰納法で $\hat{\delta'}(E(\{q_{0}\}),w)=\mathrm{Reach}(w)$ を示す：$w=\varepsilon$ は \ref{comp:reach-recursion} の前半、$wa$ は定義と \ref{comp:reach-recursion} の後半。よって $w\in L(M)\iff\mathrm{Reach}(w)\cap F\neq\varnothing\iff w\in L(N)$。逆向き（DFA は NFA とみなせる：$\delta_{N}(q,a)\defeq\{\delta(q,a)\}$, $\delta_{N}(q,\varepsilon)\defeq\varnothing$）は明らか。
:::

::: hypcheck
- **状態の有限性**：$\mathcal{P}(Q)$ が有限であることに使った。状態数は最大 $2^{\lvert Q\rvert}$ に増え、この増加が避けられない例があることが知られている（問題 \ref{comp:prob-nth-from-end}）。
- **$\varepsilon$ 閉包**：開始状態 $E(\{q_{0}\})$ と $\delta'$ の両方に $E$ を入れたことで、$\varepsilon$ 遷移がどの時点に入っても追跡できる（\ref{comp:reach-recursion}）。
:::

## 正規演算についての閉包性 {#comp:sec-regular-closure}

::: theorem 正規言語の閉包性 {#comp:regular-closure keywords="closure of regular languages under union, concatenation, star" index="正規言語の閉包性|せいきげんごのへいほうせい"}
$A,B$ が正規言語なら、$A\cup B$, $A\circ B$, $A^{\ast}$ も正規言語である。
:::

::: proof
\ref{comp:nfa-dfa-equivalence} より NFA を作ればよい。$A,B$ を認識する NFA を $N_{1}=(Q_{1},\Sigma,\delta_{1},q_{1},F_{1})$, $N_{2}=(Q_{2},\Sigma,\delta_{2},q_{2},F_{2})$ とし、$Q_{1}\cap Q_{2}=\varnothing$ とする。以下、指定しない遷移は $\varnothing$ とする。

**和.** 新しい状態 $q_{0}$ を開始状態とし、$\delta(q_{0},\varepsilon)\defeq\{q_{1},q_{2}\}$、他は $\delta_{1},\delta_{2}$ のまま、受理状態 $F_{1}\cup F_{2}$。受理計算は最初の $\varepsilon$ 遷移で $N_{1}$ か $N_{2}$ の受理計算に入るものに限られるので、$L=A\cup B$。

**連接.** 状態 $Q_{1}\cup Q_{2}$、開始状態 $q_{1}$、受理状態 $F_{2}$ とし、$r\in F_{1}$ について $\delta(r,\varepsilon)\defeq\delta_{1}(r,\varepsilon)\cup\{q_{2}\}$、他は $\delta_{1},\delta_{2}$ のまま。受理計算は $Q_{1}$ から $Q_{2}$ へ一度だけ（$F_{1}$ から $q_{2}$ への $\varepsilon$ 遷移で）移るので、$w$ を受理することと $w=uv$, $u\in A$, $v\in B$ と分けられることは同値である。

**スター.** 新しい状態 $q_{0}$ を開始状態かつ受理状態とし、$\delta(q_{0},\varepsilon)\defeq\{q_{1}\}$、$r\in F_{1}$ について $\delta(r,\varepsilon)\defeq\delta_{1}(r,\varepsilon)\cup\{q_{1}\}$、他は $\delta_{1}$、受理状態 $F_{1}\cup\{q_{0}\}$。$\varepsilon$ は $q_{0}$ で受理される。空でない受理計算は、$q_{0}\to q_{1}$ の後、$N_{1}$ の受理計算を $F_{1}\to q_{1}$ でつないだ列で $F_{1}$ に終わるので、$w$ を受理することと $w\in A^{\ast}$ は同値である（$q_{0}$ には戻らないので、$q_{0}$ を受理状態にしても余分な文字列は受理されない）。
:::

::: hypcheck
- **状態集合を交わらないようにする**：連接とスターで、$N_{1}$ と $N_{2}$ の計算を区別するのに使った。
- **スターの新しい開始状態**：$q_{1}$ をそのまま受理状態にすると、$N_{1}$ の途中で $q_{1}$ に戻る計算が余分な文字列を受理してしまうことがある（問題 \ref{comp:prob-star-construction}）。新しい状態 $q_{0}$ に戻る遷移がないことが要点である。
:::

## 問題 {#comp:sec-fa-problems}

::: problem {#comp:prob-star-construction}
スターの構成で、新しい状態を作らずに「$q_{1}$ を受理状態に加え、$F_{1}$ から $q_{1}$ への $\varepsilon$ 遷移を加える」だけにすると、$L(N)\neq A^{\ast}$ となる例を挙げよ。
:::

::: solution
$\Sigma=\{a,b\}$, $N_{1}$ を状態 $q_{1},r$、開始状態 $q_{1}$、受理状態 $\{r\}$、$\delta_{1}(q_{1},a)=\{r\}$, $\delta_{1}(q_{1},b)=\{q_{1}\}$ とする。$L(N_{1})=b^{\ast}a$（$b$ を $0$ 個以上並べた後に $a$）。誤った構成では $q_{1}$ が受理状態になるので $b$ が受理されるが、$b\notin(b^{\ast}a)^{\ast}$（$(b^{\ast}a)^{\ast}$ の空でない元は $a$ で終わる）。
:::

::: problem {#comp:prob-nth-from-end}
$\Sigma=\{0,1\}$、$n\ge1$ とし、$A_{n}\defeq\{w:w\text{ の末尾から }n\text{ 番目の文字が }1\}$ とする。
1. $A_{n}$ を認識する $n+1$ 状態の NFA を作れ。
2. $A_{n}$ を認識する DFA は少なくとも $2^{n}$ 個の状態をもつことを示せ。
:::

::: solution
1. 状態 $s_{0},\dots,s_{n}$、開始 $s_{0}$、受理 $\{s_{n}\}$、$\delta(s_{0},0)=\{s_{0}\}$, $\delta(s_{0},1)=\{s_{0},s_{1}\}$, $\delta(s_{i},c)=\{s_{i+1}\}$（$1\le i<n$, $c\in\{0,1\}$）。$s_{1}$ に移るのは「この $1$ が末尾から $n$ 番目」と当て推量した時点である。
2. 長さ $n$ の相異なる文字列 $u\neq v$ について、DFA $M$ が $\hat{\delta}(q_{0},u)=\hat{\delta}(q_{0},v)$ とする。$u,v$ が初めて異なる位置を $i$ 番目（$1\le i\le n$）とし、$u$ のその文字が $1$、$v$ が $0$ とする。$z\defeq0^{i-1}$ とすると、$uz$ と $vz$ の末尾から $n$ 番目は元の $i$ 番目の文字で、$uz\in A_{n}$, $vz\notin A_{n}$。しかし \ref{comp:delta-hat} より $\hat{\delta}(q_{0},uz)=\hat{\delta}(q_{0},vz)$ で、矛盾。よって長さ $n$ の $2^{n}$ 個の文字列は相異なる状態に移り、状態は $2^{n}$ 個以上ある。
:::

::: supplement
**前提の検討.**
- DFA の遷移関数は全域関数である。部分関数（定義されない遷移で拒否）を許しても、拒否用の状態を一つ加えれば同じ言語を認識する DFA になる。
- NFA の受理条件は「ある計算が受理する」という存在の条件である。「すべての計算が受理する」に変えた機械（全称的な有限オートマトン）も正規言語だけを認識することが知られている。

**関連する結果.**
- *マイヒル–ネローデの定理.* 言語 $A$ について、$u\sim_{A}v\iff$（すべての $z$ で $uz\in A\Leftrightarrow vz\in A$）で定まる同値関係の類が有限個であることと、$A$ が正規であることは同値で、類の個数が最小 DFA の状態数になる。問題 \ref{comp:prob-nth-from-end} の 2 はこの考え方の一部である。
- 正規言語は正規表現で記述される言語と一致する（次のページ）。

**高い視点から：モノイドの作用.** DFA の遷移関数は、各文字 $a$ に写像 $\delta(-,a)\colon Q\to Q$ を対応させ、\ref{comp:delta-hat} により自由モノイド $\Sigma^{\ast}$ の $Q$ への（右）作用を与える。正規言語とは、有限集合への作用と、その部分集合 $F$ と、一点 $q_{0}$ で記述できる言語のことであり、代数的には「$\Sigma^{\ast}$ から有限モノイドへの準同型の、ある部分集合の逆像」として特徴づけられる（統語モノイド）。NFA は、写像の代わりに $Q\to\mathcal{P}(Q)$ という「多価な写像」（関係）を使う機械で、部分集合構成は、関係の合成を冪集合の上の写像の合成に直す操作――圏論で言えば冪集合モナドのクライスリ圏から集合の圏への移行――に当たる。たとえれば、NFA は分身の術を使える旅人で、部分集合構成は「すべての分身の居場所を一枚の地図に書き込みながら一人で旅をする」ことである。
:::
