# 正規表現 {#comp:page-regular-expressions keywords="regular expression, Kleene's theorem, equivalence of regular expressions and finite automata, Arden's lemma, language equations, linear systems of language equations, Kleene algebra, McNaughton-Yamada"}

**正規表現**は、文字と $\varepsilon$, $\varnothing$ から正規演算（和・連接・スター）だけで言語を組み立てる記法である（\ref{comp:regular-expression}）。本ページでは、正規表現で記述できる言語がちょうど正規言語であるという**クリーネの定理**（\ref{comp:kleene}）を示す。一方向は前のページの閉包性からただちに従う。他方向では、DFA の各状態 $i$ に「$i$ から受理されるまでに読む文字列の集合」$X_{i}$ を対応させると、$X_{i}$ たちが**言語の連立一次方程式**を満たすことに注目する。一つの方程式 $X=AX\cup B$ は**アーデンの補題**（\ref{comp:arden}）で $X=A^{\ast}B$ と解けるので、変数を一つずつ消去していけば（\ref{comp:linear-system-regular}）、解が正規表現で得られる。未知数には状態の番号という添字一つしか現れない。

## 記法と定義の確認 {#comp:sec-re-notation}

::: notation
- アルファベット、文字列、言語、正規演算 $\cup,\circ,{}^{\ast}$、DFA と NFA、拡張遷移関数 $\hat{\delta}$、正規言語は \ref{comp:page-finite-automata} のとおり。NFA と DFA の同値性（\ref{comp:nfa-dfa-equivalence}）と正規演算についての閉包性（\ref{comp:regular-closure}）を使う。
- 言語 $A$ について $A^{0}\defeq\{\varepsilon\}$, $A^{n+1}\defeq A^{n}A$、$A^{\ast}=\bigcup_{n\ge0}A^{n}$。連接は結合的で、和について分配的である：$A(\bigcup_{\lambda}B_{\lambda})=\bigcup_{\lambda}AB_{\lambda}$、$(\bigcup_{\lambda}B_{\lambda})A=\bigcup_{\lambda}B_{\lambda}A$（両辺の元を書き下せば分かる）。
:::

## 正規表現 {#comp:sec-re}

::: definition 正規表現 {#comp:regular-expression keywords="regular expression" index="正規表現|せいきひょうげん"}
アルファベット $\Sigma$ 上の**正規表現**とその表す言語 $L(R)$ を、次で帰納的に定める（記号 $\varepsilon,\varnothing,\cup,\circ,{}^{\ast}$ と括弧は $\Sigma$ に属さないとする）。
1. $a\in\Sigma$ は正規表現で、$L(a)=\{a\}$。
2. $\varepsilon$ は正規表現で、$L(\varepsilon)=\{\varepsilon\}$。$\varnothing$ は正規表現で、$L(\varnothing)=\varnothing$。
3. $R_{1},R_{2}$ が正規表現なら、$(R_{1}\cup R_{2})$, $(R_{1}\circ R_{2})$, $(R_{1}^{\ast})$ も正規表現で、
$$
\begin{aligned}
&L(R_{1}\cup R_{2})=L(R_{1})\cup L(R_{2}),\quad L(R_{1}\circ R_{2})=L(R_{1})\circ L(R_{2}),\\
&L(R_{1}^{\ast})=L(R_{1})^{\ast}.
\end{aligned}
$$

括弧は誤解のない限り省き、$\circ$ も省いて $R_{1}R_{2}$ と書く。結合の強さは ${}^{\ast}$, $\circ$, $\cup$ の順とする。ある正規表現 $R$ で $A=L(R)$ となる言語を**正規表現で表せる**という。正規表現で表せる言語は、和・連接・スターで閉じている（定義の 3）。
:::

::: example
$\Sigma=\{0,1\}$ で、$0^{\ast}10^{\ast}$ は $1$ をちょうど一つ含む文字列全体、$(0\cup1)^{\ast}1(0\cup1)$ は末尾から $2$ 番目が $1$ の文字列全体、$(0^{\ast}10^{\ast}1)^{\ast}0^{\ast}$ は $1$ を偶数個含む文字列全体を表す（最後のものは、$1$ を左から二つずつ組にして区切ることで確かめられる。問題 \ref{comp:prob-re-even-ones}）。
:::

## 言語方程式とアーデンの補題 {#comp:sec-arden}

::: lemma アーデンの補題 {#comp:arden keywords="Arden's lemma, Arden's rule, least solution" index="アーデンの補題|あーでんのほだい"}
言語 $A,B$ について、方程式 $X=AX\cup B$（未知数は言語 $X$）を考える。
1. $X=A^{\ast}B$ は解であり、どの解 $X$ も $A^{\ast}B\subseteq X$ を満たす（$A^{\ast}B$ は最小の解）。
2. $\varepsilon\notin A$ なら、解は $X=A^{\ast}B$ ただ一つである。
:::

::: proof
1. *解であること.* 分配法則から $A(A^{\ast}B)\cup B=(AA^{\ast}\cup\{\varepsilon\})B$。$AA^{\ast}\cup\{\varepsilon\}=\bigcup_{n\ge1}A^{n}\cup A^{0}=A^{\ast}$ なので、これは $A^{\ast}B$。
*最小であること.* $X$ を解とする。$n$ に関する帰納法で $A^{n}B\subseteq X$：$n=0$ は $B\subseteq AX\cup B=X$。$A^{n}B\subseteq X$ なら $A^{n+1}B=A(A^{n}B)\subseteq AX\subseteq X$。よって $A^{\ast}B=\bigcup_{n}A^{n}B\subseteq X$。

2. $X$ を解とする。$X=AX\cup B$ を $n$ 回代入すると（$n$ に関する帰納法と分配法則）、
$$
X=A^{n+1}X\cup A^{n}B\cup\dots\cup AB\cup B.
$$
$w\in X$ とし $n\defeq\lvert w\rvert$ とする。$\varepsilon\notin A$ なので $A$ の元は長さ $1$ 以上で、$A^{n+1}X$ の元は長さ $n+1$ 以上である。よって $w\notin A^{n+1}X$ で、$w\in A^{n}B\cup\dots\cup B\subseteq A^{\ast}B$。1 と合わせて $X=A^{\ast}B$。
:::

::: definition 言語の連立一次方程式 {#comp:linear-system keywords="system of linear language equations, right-linear equations" index="言語の連立一次方程式|げんごのれんりついちじほうていしき"}
$n\ge1$ とし、言語 $A_{ij}$, $B_{i}$（$1\le i,j\le n$）を**係数**とする。未知の言語 $X_{1},\dots,X_{n}$ についての
$$
X_{i}=\bigcup_{j=1}^{n}A_{ij}X_{j}\cup B_{i}\qquad(1\le i\le n)
$$
を**言語の連立一次方程式**という。すべての $A_{ij}$ が $\varepsilon$ を含まないとき、**$\varepsilon$ を含まない係数**をもつという。
:::

::: theorem 連立一次方程式の解 {#comp:linear-system-regular keywords="solving linear language equations by elimination, Gaussian elimination for languages" index="消去法（言語方程式の）|しょうきょほうげんごほうていしきの"}
言語の連立一次方程式で、係数 $A_{ij}$ がどれも $\varepsilon$ を含まず、係数 $A_{ij},B_{i}$ がどれも正規表現で表せるとする。このとき、解 $(X_{1},\dots,X_{n})$ はただ一つ存在し、各 $X_{i}$ は正規表現で表せる。
:::

::: proof
$n$ に関する帰納法。

**$n=1$.** 方程式は $X_{1}=A_{11}X_{1}\cup B_{1}$ で、アーデンの補題（\ref{comp:arden} の 2）から解は $A_{11}^{\ast}B_{1}$ ただ一つ。これは正規表現で表せる。

**$n\ge2$.** 最後の方程式を
$$
X_{n}=A_{nn}X_{n}\cup C,\qquad C\defeq\bigcup_{j<n}A_{nj}X_{j}\cup B_{n}
$$
と書く。$X_{1},\dots,X_{n-1}$ を固定すれば、これは $X_{n}$ についての一つの方程式で、$\varepsilon\notin A_{nn}$ なので、アーデンの補題（2）からその解は
$$
X_{n}=A_{nn}^{\ast}C=\bigcup_{j<n}A_{nn}^{\ast}A_{nj}X_{j}\cup A_{nn}^{\ast}B_{n}\tag{*}
$$
に限る（分配法則）。$(\ast)$ を $i<n$ の方程式に代入すると、
$$
\begin{aligned}
X_{i}&=\bigcup_{j<n}A'_{ij}X_{j}\cup B'_{i}\qquad(1\le i\le n-1),\\
A'_{ij}&\defeq A_{ij}\cup A_{in}A_{nn}^{\ast}A_{nj},\quad B'_{i}\defeq B_{i}\cup A_{in}A_{nn}^{\ast}B_{n}
\end{aligned}
$$
という $n-1$ 個の未知数の連立一次方程式（**消去後の方程式**）が得られる。$A_{in}$ が $\varepsilon$ を含まないので $A_{in}A_{nn}^{\ast}A_{nj}$ の元は長さ $1$ 以上で、$A'_{ij}$ も $\varepsilon$ を含まない。$A'_{ij},B'_{i}$ は正規表現で表せる。

*一意性.* $(X_{1},\dots,X_{n})$ が元の方程式の解なら、上で見たように $(\ast)$ が成り立ち、$(X_{1},\dots,X_{n-1})$ は消去後の方程式の解である。帰納法の仮定から後者の解は一つ $(Y_{1},\dots,Y_{n-1})$ しかないので $X_{i}=Y_{i}$（$i<n$）、さらに $(\ast)$ から $X_{n}$ も決まる。

*存在.* 帰納法の仮定による消去後の方程式の解 $(Y_{1},\dots,Y_{n-1})$ をとり、$Y_{n}$ を $(\ast)$ の右辺（$X_{j}$ を $Y_{j}$ に置き換えたもの）で定める。アーデンの補題の 1 から $Y_{n}$ は第 $n$ の方程式を満たす。$i<n$ の方程式は、右辺の $Y_{n}$ に $(\ast)$ を代入すると消去後の方程式の右辺になり、それは $Y_{i}$ に等しい。

*正規性.* $Y_{1},\dots,Y_{n-1}$ は帰納法の仮定で正規表現で表せ、$Y_{n}$ はそれらと係数から和・連接・スターで作られる。
:::

## クリーネの定理 {#comp:sec-kleene}

::: lemma DFA の状態方程式 {#comp:dfa-equations keywords="state equations of a DFA" index="状態方程式（DFA の）|じょうたいほうていしきでぃーえふえーの"}
DFA $M=(Q,\Sigma,\delta,q_{0},F)$ の状態を $Q=\{1,\dots,n\}$ と番号付け、$X_{i}\defeq\{w\in\Sigma^{\ast}:\hat{\delta}(i,w)\in F\}$ とする。このとき
$$
X_{i}=\bigcup_{j=1}^{n}A_{ij}X_{j}\cup E_{i},\qquad A_{ij}\defeq\{a\in\Sigma:\delta(i,a)=j\},
$$
ただし $E_{i}\defeq\{\varepsilon\}$（$i\in F$）、$\varnothing$（$i\notin F$）。また $L(M)=X_{q_{0}}$。
:::

::: proof
$w\in X_{i}$ を長さで場合分けする。$w=\varepsilon$ なら $\hat{\delta}(i,\varepsilon)=i$ なので、$\varepsilon\in X_{i}\iff i\in F\iff\varepsilon\in E_{i}$。右辺の $A_{ij}X_{j}$ の元は長さ $1$ 以上なので、$\varepsilon$ については両辺が一致する。$w=av$（$a\in\Sigma$）なら $\hat{\delta}(i,av)=\hat{\delta}(\delta(i,a),v)$（\ref{comp:delta-hat}）なので、$j\defeq\delta(i,a)$ として $w\in X_{i}\iff v\in X_{j}\iff w\in A_{ij}X_{j}$（$a$ を含む $A_{ij}$ はこの $j$ のものだけ）。$E_{i}$ は長さ $1$ 以上の元を含まないので、両辺が一致する。$L(M)=X_{q_{0}}$ は定義から。
:::

::: theorem クリーネの定理 {#comp:kleene keywords="Kleene's theorem, regular expressions and finite automata" index="クリーネの定理|くりーねのていり"}
言語 $A\subseteq\Sigma^{\ast}$ について、$A$ が正規であることと、ある正規表現 $R$ で $A=L(R)$ となることは同値である。
:::

::: proof
**正規表現 $\Rightarrow$ 正規.** $R$ の構成に関する帰納法。$L(a)$, $L(\varepsilon)$, $L(\varnothing)$ は、それぞれ状態 $2$ 個、$1$ 個、$1$ 個の DFA（受理状態を適切に選び、残りの遷移は拒否用の状態に送る）で認識される。複合的な $R$ は、帰納法の仮定と \ref{comp:regular-closure} による。

**正規 $\Rightarrow$ 正規表現.** $A=L(M)$ となる DFA $M$ をとる。\ref{comp:dfa-equations} の方程式は言語の連立一次方程式で、係数 $A_{ij}$ は $\Sigma$ の部分集合（有限個の文字の和として正規表現で表せる。空なら $\varnothing$）なので $\varepsilon$ を含まず、$E_{i}$ も正規表現 $\varepsilon$ か $\varnothing$ で表せる。$(X_{i})_{i}$ はその解なので、\ref{comp:linear-system-regular} の一意性から、消去法で得られる解と一致し、各 $X_{i}$ は正規表現で表せる。とくに $A=X_{q_{0}}$ も正規表現で表せる。
:::

::: example 1 を偶数個含む文字列 {#comp:ex-arden-even-ones}
$1$ を偶数個読んだ状態 $1$（開始・受理）と奇数個読んだ状態 $2$ の DFA の方程式は
$$
X_{1}=0X_{1}\cup1X_{2}\cup\varepsilon,\qquad X_{2}=0X_{2}\cup1X_{1}.
$$
第 2 式とアーデンの補題から $X_{2}=0^{\ast}1X_{1}$。第 1 式に代入して $X_{1}=(0\cup10^{\ast}1)X_{1}\cup\varepsilon$、再びアーデンの補題で $X_{1}=(0\cup10^{\ast}1)^{\ast}$。これは上の例の $(0^{\ast}10^{\ast}1)^{\ast}0^{\ast}$ と同じ言語を表す（どちらも $L(M)$ なので）。
:::

::: hypcheck
- **係数が $\varepsilon$ を含まないこと**：アーデンの補題の一意性（\ref{comp:arden} の 2）と、消去後の係数が再び $\varepsilon$ を含まないこと（\ref{comp:linear-system-regular} の証明）に使った。DFA の状態方程式では、係数が文字の集合なので自動的に満たされる。
- **解の一意性**：クリーネの定理で、DFA から定めた $X_{i}$ が消去法の解と一致することに本質的に使った。一意性がなければ、消去法が「別の解」を与えるおそれがある。
- **状態の有限性**：未知数が有限個で、消去が $n$ 段で終わることに使った。
- **DFA であること**：\ref{comp:dfa-equations} で $\hat{\delta}(i,av)=\hat{\delta}(\delta(i,a),v)$ を使った。NFA でも、$X_{i}$ を「$i$ から受理状態に至る経路のラベル全体」とし、$\varepsilon$ 遷移を除いておけば同じ形の方程式が得られる。
:::

## 問題 {#comp:sec-re-problems}

::: problem {#comp:prob-arden-nonunique}
$\varepsilon\in A$ のとき、方程式 $X=AX\cup B$ の解は一つとは限らないことを、$A=\{\varepsilon\}$ の場合に示せ。また、そのときの最小の解を求めよ。
:::

::: solution
$A=\{\varepsilon\}$ なら方程式は $X=X\cup B$、すなわち $B\subseteq X$ で、$B$ を含むどの言語も解である（$B\neq\Sigma^{\ast}$ なら $B$ と $\Sigma^{\ast}$ は異なる解）。最小の解は $A^{\ast}B=\{\varepsilon\}B=B$ で、\ref{comp:arden} の 1 と一致する。
:::

::: problem {#comp:prob-arden-ends-01}
$\{0,1\}$ 上で $01$ で終わる文字列全体を認識する DFA（状態 $1$：開始、状態 $2$：直前が $0$、状態 $3$：直前の二文字が $01$（受理））の方程式を立て、消去法で正規表現を求めよ。
:::

::: solution
遷移は $\delta(1,0)=2$, $\delta(1,1)=1$, $\delta(2,0)=2$, $\delta(2,1)=3$, $\delta(3,0)=2$, $\delta(3,1)=1$ で、
$$
X_{1}=1X_{1}\cup0X_{2},\quad X_{2}=0X_{2}\cup1X_{3},\quad X_{3}=1X_{1}\cup0X_{2}\cup\varepsilon.
$$
$X_{3}$ を消去する（$A_{33}=\varnothing$ なので $A_{33}^{\ast}=\{\varepsilon\}$ で、$X_{3}$ は右辺そのもの）：
$$
X_{1}=1X_{1}\cup0X_{2},\qquad X_{2}=(0\cup10)X_{2}\cup11X_{1}\cup1.
$$
$X_{2}=(0\cup10)^{\ast}(11X_{1}\cup1)$ を第 1 式に代入して
$$
X_{1}=\bigl(1\cup0(0\cup10)^{\ast}11\bigr)X_{1}\cup0(0\cup10)^{\ast}1,
$$
よって $X_{1}=\bigl(1\cup0(0\cup10)^{\ast}11\bigr)^{\ast}0(0\cup10)^{\ast}1$。これは $(0\cup1)^{\ast}01$ と同じ言語を表す（どちらも同じ DFA の $X_{1}$ を表すので）。
:::

::: problem {#comp:prob-re-even-ones}
例の三つ目 $(0^{\ast}10^{\ast}1)^{\ast}0^{\ast}$ が $1$ を偶数個含む文字列全体を表すことを示せ。
:::

::: solution
$\subseteq$：$0^{\ast}10^{\ast}1$ の元は $1$ をちょうど二つ含むので、右辺の元の $1$ の個数は偶数。$\supseteq$：$1$ を $2k$ 個含む $w$ について、$2s$ 番目の $1$（$s=1,\dots,k$）の直後で区切ると、$w=v_{1}\cdots v_{k}z$ で各 $v_{s}$ は $1$ をちょうど二つ含み $1$ で終わるので $0^{\ast}10^{\ast}1$ に属し、$z$ は $1$ を含まないので $0^{\ast}$ に属する。
:::

::: supplement
**前提の検討.**
- 消去の順番は任意で、順番によって異なる（が同じ言語を表す）正規表現が得られる。得られる式の長さは状態数について指数的に増えうる。
- 正規表現に補集合や共通部分を加えても、表せる言語は正規言語のままである（\ref{comp:dfa-boolean}）。ただし、表現の長さは大幅に短くなりうることが知られている。

**関連する結果.**
- *マクノートン–ヤマダの方法.* $R^{(k)}_{ij}$ を「状態 $i$ から $j$ まで、途中で $\{1,\dots,k\}$ の状態だけを通る文字列全体」とし、$R^{(k)}_{ij}=R^{(k-1)}_{ij}\cup R^{(k-1)}_{ik}(R^{(k-1)}_{kk})^{\ast}R^{(k-1)}_{kj}$ という再帰で正規表現を作る方法もある。これは添字が三つ必要になるが、消去法と同じことを、すべての始点 $i$ について同時に行っていることに当たる（行列の言葉ではフロイド–ワーシャル法）。
- *クリーネ代数.* 正規表現の間の等式は、$\cup,\circ,{}^{\ast},\varnothing,\varepsilon$ についての有限個の公理と、アーデンの補題に当たる推論規則（$ax+b\le x\Rightarrow a^{\ast}b\le x$）から導けることが知られている（コーゼンによるクリーネ代数の完全性）。問題 \ref{comp:prob-arden-ends-01} の二つの式が等しいことも、この体系で導ける。
- 文脈自由文法は、一次でない（未知数どうしの連接を含む）言語方程式の最小解として言語を定める。不動点としての見方は \ref{comp:page-fixed-points} で扱う。

**高い視点から：ガウスの消去法としてのクリーネの定理.** 言語の集合 $\mathcal{P}(\Sigma^{\ast})$ は、$\cup$ を和、連接を積とする（積が可換でない）半環である。DFA の状態方程式は、この半環の上の連立一次方程式 $\vec{X}=A\vec{X}+\vec{B}$ で、アーデンの補題は「$x=ax+b$ の解は $x=a^{\ast}b$」という一変数の解の公式に当たる。スター $a^{\ast}=1+a+a^{2}+\cdots$ は $(1-a)^{-1}$ の等比級数展開の類似で、「$\varepsilon\notin a$」は「$a$ が小さい（収束する）」という条件の類似である。本ページの消去法は、まさにガウスの消去法で一つずつ未知数を消していく手順になっている。行列で書けば解は $\vec{X}=A^{\ast}\vec{B}$（$A^{\ast}$ は行列の推移閉包）で、マクノートン–ヤマダの方法はこの行列 $A^{\ast}$ の全成分を一度に計算する方法である。
:::
