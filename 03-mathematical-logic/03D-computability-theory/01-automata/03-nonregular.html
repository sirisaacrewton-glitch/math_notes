# 反復補題と非正規言語 {#comp:page-nonregular keywords="pumping lemma for regular languages, nonregular languages, Myhill-Nerode theorem, minimal DFA, right congruence"}

有限オートマトンの記憶は有限なので、十分長い文字列を読むと同じ状態を二度通る。その間の部分は何度繰り返しても（あるいは除いても）受理は変わらない。これが正規言語の**反復補題**（\ref{comp:pumping-regular}）で、言語が正規で**ない**ことを示す標準的な道具である。さらに、正規性を完全に特徴づける**マイヒル–ネローデの定理**（\ref{comp:myhill-nerode}）を示し、最小の DFA が一意であることを導く。

## 記法と定義の確認 {#comp:sec-nonreg-notation}

::: notation
- 文字列・言語・DFA・拡張遷移関数 $\hat{\delta}$ とその性質 $\hat{\delta}(q,uv)=\hat{\delta}(\hat{\delta}(q,u),v)$（\ref{comp:delta-hat}）、正規言語は \ref{comp:page-finite-automata} のとおり。
- 文字列 $w$ と $i\ge0$ について $w^{i}$ は $w$ を $i$ 回連接したもの（$w^{0}=\varepsilon$）。$0^{n}$ は $0$ を $n$ 個並べた文字列。
:::

## 反復補題 {#comp:sec-pumping}

::: theorem 正規言語の反復補題 {#comp:pumping-regular keywords="pumping lemma for regular languages" index="反復補題（正規言語）|はんぷくほだいせいきげんご"}
$A$ を正規言語とする。ある $p\ge1$（**反復長**）があって、$\lvert s\rvert\ge p$ を満たす任意の $s\in A$ は $s=xyz$ と分解でき、
1. すべての $i\ge0$ について $xy^{i}z\in A$、
2. $\lvert y\rvert\ge1$、
3. $\lvert xy\rvert\le p$

を満たす。
:::

::: proof
$A=L(M)$, $M=(Q,\Sigma,\delta,q_{0},F)$ とし、$p\defeq\lvert Q\rvert$ とする。$s=a_{1}\cdots a_{n}\in A$, $n\ge p$ とし、$r_{l}\defeq\hat{\delta}(q_{0},a_{1}\cdots a_{l})$（$0\le l\le n$）とおく。$r_{0},\dots,r_{p}$ は $p+1$ 個の状態なので、鳩の巣原理より $0\le j<l\le p$ で $r_{j}=r_{l}$ となるものがある。$x\defeq a_{1}\cdots a_{j}$, $y\defeq a_{j+1}\cdots a_{l}$, $z\defeq a_{l+1}\cdots a_{n}$ とすると $\lvert y\rvert=l-j\ge1$, $\lvert xy\rvert=l\le p$。$q\defeq r_{j}$ とおくと $\hat{\delta}(q,y)=r_{l}=q$ なので、$i$ に関する帰納法と \ref{comp:delta-hat} で $\hat{\delta}(q,y^{i})=q$。よって
$$
\hat{\delta}(q_{0},xy^{i}z)=\hat{\delta}(\hat{\delta}(\hat{\delta}(q_{0},x),y^{i}),z)=\hat{\delta}(q,z)=\hat{\delta}(q_{0},s)\in F .
$$
:::

::: example 非正規言語 {#comp:ex-0n1n}
$B\defeq\{0^{n}1^{n}:n\ge0\}$ は正規でない。正規とし、反復長 $p$ をとる。$s\defeq0^{p}1^{p}\in B$ を $s=xyz$ と分解すると、条件 3 より $xy$ は $0$ だけからなり、条件 2 より $y=0^{k}$（$k\ge1$）。すると $xy^{2}z=0^{p+k}1^{p}\notin B$ で、条件 1 に反する。
:::

::: hypcheck
- **状態の有限性**：反復長 $p=\lvert Q\rvert$ を決めた。
- **鳩の巣原理を最初の $p+1$ 個に使ったこと**：条件 3 $\lvert xy\rvert\le p$ が得られた。例のように、条件 3 は $y$ の位置を限定して矛盾を導くのに便利である。
- 反復補題は正規性の**必要条件**にすぎない。反復補題を満たすが正規でない言語がある（問題 \ref{comp:prob-pumping-not-sufficient}）。
:::

## マイヒル–ネローデの定理 {#comp:sec-myhill-nerode}

::: definition 区別可能性 {#comp:nerode-equivalence keywords="Myhill-Nerode equivalence, distinguishing extension" index="マイヒル–ネローデの同値関係|まいひるねろーでのどうちかんけい"}
言語 $A\subseteq\Sigma^{\ast}$ について、文字列 $u,v$ が **$A$ で同値**であるとは、すべての $z\in\Sigma^{\ast}$ について $uz\in A\iff vz\in A$ となることをいい、$u\equiv_{A}v$ と書く。そうでないとき、$uz\in A$ と $vz\in A$ の一方だけが成り立つ $z$ を、$u,v$ を**区別する**文字列という。
:::

::: lemma 同値関係の性質 {#comp:nerode-basic}
$\equiv_{A}$ は同値関係で、右からの連接と両立する：$u\equiv_{A}v$ なら任意の $w$ について $uw\equiv_{A}vw$。
:::

::: proof
同値関係であることは定義から。$u\equiv_{A}v$ なら、任意の $z$ について $(uw)z=u(wz)\in A\iff v(wz)\in A$。
:::

::: theorem マイヒル–ネローデの定理 {#comp:myhill-nerode keywords="Myhill-Nerode theorem, minimal DFA" index="マイヒル–ネローデの定理|まいひるねろーでのていり, 最小 DFA|さいしょうでぃーえふえー"}
言語 $A$ について次は同値である。
1. $A$ は正規である。
2. $\equiv_{A}$ の同値類は有限個である。

さらに、そのとき $\equiv_{A}$ の同値類の個数 $k$ は、$A$ を認識する DFA の状態数の最小値に等しい。
:::

::: proof
**1 $\Rightarrow$ 2（と状態数 $\ge k$）.** $A=L(M)$, $M=(Q,\Sigma,\delta,q_{0},F)$ とする。$\hat{\delta}(q_{0},u)=\hat{\delta}(q_{0},v)$ なら、任意の $z$ について \ref{comp:delta-hat} より $\hat{\delta}(q_{0},uz)=\hat{\delta}(q_{0},vz)$ なので $uz\in A\iff vz\in A$、すなわち $u\equiv_{A}v$。したがって $u\mapsto\hat{\delta}(q_{0},u)$ で同じ状態に行く文字列は同じ類に属し、類の個数は $\lvert Q\rvert$ 以下である。

**2 $\Rightarrow$ 1（と $k$ 状態の DFA）.** 類 $[u]$ の全体を $Q_{A}$ とし（$k$ 個）、
$$
\delta_{A}([u],a)\defeq[ua],\qquad q_{A}\defeq[\varepsilon],\qquad F_{A}\defeq\{[u]:u\in A\}
$$
と定める。$\delta_{A}$ は \ref{comp:nerode-basic} より代表の取り方によらない。$F_{A}$ も well-defined：$u\equiv_{A}v$ なら $z=\varepsilon$ をとって $u\in A\iff v\in A$。$\lvert w\rvert$ に関する帰納法で $\hat{\delta}_{A}([\varepsilon],w)=[w]$ なので、$w\in L(M_{A})\iff[w]\in F_{A}\iff w\in A$。よって $M_{A}\defeq(Q_{A},\Sigma,\delta_{A},q_{A},F_{A})$ は $A$ を認識する $k$ 状態の DFA である。
:::

::: corollary 最小 DFA の一意性 {#comp:minimal-dfa-unique}
$A$ を認識する DFA で状態数が最小の $M$ は、到達可能な状態の名前の付け替えを除いて $M_{A}$ に一致する：全単射 $h\colon Q\to Q_{A}$ で、$h(q_{0})=q_{A}$, $h(\delta(q,a))=\delta_{A}(h(q),a)$, $h[F]=F_{A}$ となるものがある。
:::

::: proof
状態数が最小なら、すべての状態は $q_{0}$ から到達可能である（到達できない状態を除いてもよいので）。$h(\hat{\delta}(q_{0},u))\defeq[u]$ とすると、\ref{comp:myhill-nerode} の 1 $\Rightarrow$ 2 の証明より well-defined で、全射。$\lvert Q\rvert=k=\lvert Q_{A}\rvert$ なので全単射である。$h(\delta(\hat{\delta}(q_{0},u),a))=h(\hat{\delta}(q_{0},ua))=[ua]=\delta_{A}([u],a)$。$\hat{\delta}(q_{0},u)\in F\iff u\in A\iff[u]\in F_{A}$。
:::

::: example マイヒル–ネローデによる証明
$B=\{0^{n}1^{n}\}$ では、$m\neq n$ のとき $0^{m}$ と $0^{n}$ は $1^{m}$ で区別される（$0^{m}1^{m}\in B$, $0^{n}1^{m}\notin B$）。よって $\equiv_{B}$ の類は無限個で、$B$ は正規でない。
:::

## 問題 {#comp:sec-nonreg-problems}

::: problem {#comp:prob-squares-nonregular}
$\Sigma=\{1\}$ とし、$C\defeq\{1^{n^{2}}:n\ge0\}$ は正規でないことを反復補題で示せ。
:::

::: solution
正規とし、反復長 $p$ をとる。$s\defeq1^{p^{2}}=xyz$, $1\le\lvert y\rvert\le p$ とすると、$\lvert xy^{2}z\rvert=p^{2}+\lvert y\rvert$ で、$p^{2}<p^{2}+\lvert y\rvert\le p^{2}+p<(p+1)^{2}$ なので平方数でない。よって $xy^{2}z\notin C$ で矛盾。
:::

::: problem {#comp:prob-pumping-not-sufficient}
$\Sigma=\{a,b,c\}$ とし、$D\defeq\{a^{i}b^{j}c^{k}:i,j,k\ge0,\ i=1\Rightarrow j=k\}$ とする。$D$ は反復補題の結論を（$p=2$ で）満たすが、正規でないことを示せ。
:::

::: solution
*反復補題.* $s=a^{i}b^{j}c^{k}\in D$, $\lvert s\rvert\ge2$ とする。$i=0$ なら、$s$ の最初の文字を $y$ とする（$x=\varepsilon$）。$y$ を繰り返しても除いても $a$ は現れないので $D$ に属する。$i=2$ なら $y=aa$（$x=\varepsilon$）とすると、$a$ の個数は $2+2(t-1)$（$t$ 回繰り返し）で $1$ にはならない。$i=1$ または $i\ge3$ なら $y=a$（$x=\varepsilon$）とする：$i=1$ なら $j=k$ で、$a$ の個数がいくつになっても条件を満たす。$i\ge3$ なら $a$ の個数は $i-1+t\ge2$ で $1$ にならない。いずれも $\lvert xy\rvert\le2$。
*非正規.* $D$ が正規なら、$D\cap L(ab^{\ast}c^{\ast})=\{ab^{n}c^{n}\}$ は正規（\ref{comp:dfa-boolean}, \ref{comp:kleene}）。$ab^{m}$ と $ab^{n}$（$m\neq n$）は $c^{m}$ で区別されるので、\ref{comp:myhill-nerode} より正規でなく、矛盾。
:::

::: supplement
**前提の検討.**
- 反復補題は正規言語の性質を「長い文字列の局所的な繰り返し」で捉えたもので、問題 \ref{comp:prob-pumping-not-sufficient} のように十分条件ではない。マイヒル–ネローデの定理は必要十分条件である。
- \ref{comp:minimal-dfa-unique} の最小 DFA は、状態の対の区別可能性を表で計算することで、与えられた DFA から実際に求められる（最小化アルゴリズム）。

**関連する結果.**
- *文脈自由言語の反復補題.* 文脈自由言語にも、二か所を同時に繰り返す形の反復補題がある（この系列の後のページ）。
- *統語モノイド.* 左右からの連接に両立する同値関係（$xuy\in A\iff xvy\in A$）の商は有限モノイドになり、$A$ が正規であることと統語モノイドが有限であることは同値である。シュッツェンベルガーの定理は、これが非周期的であることと、$A$ がスターなしの正規表現で書けることを結びつける、と知られている。

**高い視点から：普遍的なオートマトン.** マイヒル–ネローデのオートマトン $M_{A}$ は、$A$ を認識する到達可能な DFA の圏の**終対象**である：任意の到達可能な DFA $M$ から $M_{A}$ への射（遷移を保つ写像）がただ一つある（\ref{comp:minimal-dfa-unique} の $h$）。状態とは「これまでに読んだものについて、未来の判定に関係する情報」のことであり、$\equiv_{A}$ はそれ以外の情報をすべて忘れる商である。たとえれば、$M_{A}$ は、過去の経緯を問わず「この先何を見れば合格か」だけを書いた最も簡潔な受験票である。
:::
