# 文脈自由文法とプッシュダウンオートマトン {#comp:page-context-free keywords="context-free grammar, CFG, derivation, leftmost derivation, parse tree, Chomsky normal form, pushdown automaton, PDA, equivalence of CFGs and PDAs, context-free language"}

**文脈自由文法**は、変数を書き換え規則で置き換えていくことで文字列を生成する仕組みで、入れ子の構造（括弧の対応、$0^{n}1^{n}$ など）を記述できる（\ref{comp:cfg}）。それを認識する機械は、有限オートマトンにスタック（後入れ先出しの無限の記憶）を加えた**プッシュダウンオートマトン**（\ref{comp:pda}）である。本ページでは、文法の標準形であるチョムスキー標準形（\ref{comp:chomsky-normal-form}）を示し、文脈自由文法とプッシュダウンオートマトンが同じ言語のクラスを定めること（\ref{comp:cfg-pda-equivalence}）を両方向について証明する。

## 記法と定義の確認 {#comp:sec-cfg-notation}

::: notation
- 文字列・言語・連接・NFA は \ref{comp:page-finite-automata} のとおり。$\Sigma_{\varepsilon}=\Sigma\cup\{\varepsilon\}$。
- 集合 $X$ の元の有限列（$X$ 上の文字列）全体を $X^{\ast}$ と書く。
:::

## 文脈自由文法 {#comp:sec-cfg}

::: definition 文脈自由文法 {#comp:cfg keywords="context-free grammar, variables, terminals, rules, derivation, context-free language" index="文脈自由文法|ぶんみゃくじゆうぶんぽう, 導出（文法の）|どうしゅつぶんぽうの, 文脈自由言語|ぶんみゃくじゆうげんご"}
**文脈自由文法**（CFG）とは、組 $G=(V,\Sigma,R,S)$ で、$V$ は有限集合（**変数**）、$\Sigma$ は $V$ と交わらない有限集合（**終端記号**）、$R$ は $V\times(V\cup\Sigma)^{\ast}$ の有限部分集合（**規則**。$(A,w)\in R$ を $A\to w$ と書く）、$S\in V$ は**開始変数**であるものをいう。
1. $u,v\in(V\cup\Sigma)^{\ast}$ について、$u=xAy$, $v=xwy$ で $A\to w\in R$ となるとき $u\Rightarrow v$（$u$ は $v$ を**一段で生成する**）と書く。さらに $x\in\Sigma^{\ast}$（書き換えた変数が最も左の変数）のとき $u\Rightarrow_{\mathrm{lm}}v$ と書く。
2. $\Rightarrow$ の反射推移閉包を $\Rightarrow^{\ast}$ と書く（$u\Rightarrow^{\ast}v$ は $u=u_{0}\Rightarrow u_{1}\Rightarrow\cdots\Rightarrow u_{n}=v$ となる列（**導出**）があること）。
3. $L(G)\defeq\{w\in\Sigma^{\ast}:S\Rightarrow^{\ast}w\}$ を $G$ の**生成する言語**といい、ある CFG が生成する言語を**文脈自由言語**という。
:::

::: example
$G=(\{S\},\{0,1\},\{S\to0S1,\ S\to\varepsilon\},S)$ は $\{0^{n}1^{n}:n\ge0\}$ を生成する（$S\Rightarrow^{\ast}0^{n}S1^{n}$ が $n$ に関する帰納法でわかり、変数を含まない文字列に至るには $S\to\varepsilon$ を一度使うしかない）。この言語は正規でない（\ref{comp:ex-0n1n}）ので、文脈自由言語は正規言語より真に多い。
:::

::: lemma 最左導出 {#comp:leftmost-derivation}
$A\in V$, $w\in\Sigma^{\ast}$ について、$A\Rightarrow^{\ast}w$ なら、各段が $\Rightarrow_{\mathrm{lm}}$ である導出 $A\Rightarrow_{\mathrm{lm}}^{\ast}w$ が（同じ段数で）存在する。
:::

::: proof
段数 $n$ に関する帰納法で、「$u\Rightarrow^{\ast}w$（$w\in\Sigma^{\ast}$）の $n$ 段の導出があれば $n$ 段の最左導出がある」を示す。$n=0$ は自明。$u=u_{0}\Rightarrow u_{1}\Rightarrow^{\ast}w$ とし、帰納法の仮定で $u_{1}\Rightarrow^{\ast}w$ を最左導出に直しておく。$u=xAy$（$x\in\Sigma^{\ast}$、$A$ は最左の変数）とする。最初の段で $A$ を書き換えていれば終わり。そうでなければ $u_{1}=xAy'$ で、$A$ は $u_{1}$ でも最左の変数なので、$u_{1}$ からの最左導出の最初の段は $A\to v$ による $xAy'\Rightarrow_{\mathrm{lm}}xvy'$。二つの段を入れ替えた $xAy\Rightarrow_{\mathrm{lm}}xvy\Rightarrow xvy'$ を考え、$xvy\Rightarrow xvy'\Rightarrow^{\ast}w$（$n-1$ 段）に帰納法の仮定を使う。
:::

## チョムスキー標準形 {#comp:sec-cnf}

::: definition チョムスキー標準形 {#comp:cnf keywords="Chomsky normal form" index="チョムスキー標準形|ちょむすきーひょうじゅんけい"}
CFG $G$ が**チョムスキー標準形**であるとは、すべての規則が $A\to BC$（$B,C\in V\setminus\{S\}$）か $A\to a$（$a\in\Sigma$）の形で、例外として $S\to\varepsilon$ だけを許すことをいう。
:::

::: theorem チョムスキー標準形 {#comp:chomsky-normal-form keywords="every context-free language is generated by a grammar in Chomsky normal form" index="チョムスキー標準形への変換|ちょむすきーひょうじゅんけいへのへんかん"}
任意の文脈自由言語は、チョムスキー標準形の CFG で生成される。
:::

::: proof
$G=(V,\Sigma,R,S)$ から、生成する言語を変えずに次の変換を順に施す。

**Step 1（新しい開始変数）.** 新しい変数 $S_{0}$ と規則 $S_{0}\to S$ を加え、$S_{0}$ を開始変数にする。$S_{0}$ は規則の右辺に現れない。

**Step 2（$\varepsilon$ 規則の除去）.** $A\Rightarrow^{\ast}\varepsilon$ となる変数（**消去可能**な変数）の集合 $N$ を、「$A\to w$ で $w$ のすべての記号が既に $N$ に入っている変数なら $A$ を加える」を繰り返して求める（有限回で止まる）。各規則 $A\to w$ について、$w$ の中の消去可能な変数の出現を残す・消すのすべての組み合わせで得られる規則 $A\to w'$ を加え、その後 $S_{0}$ 以外の $A\to\varepsilon$ をすべて除く。$S_{0}\in N$ なら $S_{0}\to\varepsilon$ を残す。導出の中で $\varepsilon$ に消える変数を、その親の規則で最初から書かなかったことにすれば、生成される $\varepsilon$ でない文字列は変わらない（導出の長さに関する帰納法で確かめられる）。

**Step 3（単位規則の除去）.** $A\to B$（$B\in V$）の形の規則を除く。変数の組 $(A,B)$ で、単位規則だけで $A\Rightarrow^{\ast}B$ となるものを求め（有限）、各 $B\to w$（単位規則でない）について $A\to w$ を加え、単位規則をすべて除く。単位規則の列を一つの規則にまとめただけなので言語は変わらない。

**Step 4（長い右辺と終端記号の分離）.** 各終端記号 $a$ に新しい変数 $U_{a}$ と規則 $U_{a}\to a$ を用意し、長さ $2$ 以上の右辺に現れる $a$ を $U_{a}$ に置き換える。右辺が $A\to B_{1}B_{2}\cdots B_{k}$（$k\ge3$）の規則は、新しい変数 $C_{1},\dots,C_{k-2}$ で $A\to B_{1}C_{1}$, $C_{1}\to B_{2}C_{2}$, …, $C_{k-2}\to B_{k-1}B_{k}$ に分ける。これらも言語を変えない。

残る規則は $A\to BC$, $A\to a$, $S_{0}\to\varepsilon$ で、$S_{0}$ は右辺に現れない（Step 1 の性質は Step 2〜4 で保たれる）。
:::

## プッシュダウンオートマトン {#comp:sec-pda}

::: definition プッシュダウンオートマトン {#comp:pda keywords="pushdown automaton, PDA, stack alphabet" index="プッシュダウンオートマトン|ぷっしゅだうんおーとまとん, スタック|すたっく"}
**プッシュダウンオートマトン**（PDA）とは、組 $P=(Q,\Sigma,\Gamma,\delta,q_{0},F)$ で、$Q,\Sigma,q_{0},F$ は NFA と同様、$\Gamma$ は有限集合（**スタック記号**）、
$$
\delta\colon Q\times\Sigma_{\varepsilon}\times\Gamma_{\varepsilon}\to\mathcal{P}(Q\times\Gamma_{\varepsilon})
$$
は遷移関数であるものをいう。$(r,b)\in\delta(q,a,c)$ は「状態 $q$ で、入力 $a$ を読み（$a=\varepsilon$ なら読まず）、スタックの一番上の $c$ を取り除き（$c=\varepsilon$ なら何もせず）、$b$ を積んで（$b=\varepsilon$ なら積まず）、状態 $r$ に移る」ことを表す。

**時点表示**（計算の瞬間の様子）は $(q,x,\gamma)\in Q\times\Sigma^{\ast}\times\Gamma^{\ast}$（状態、残りの入力、スタックの中身（左が一番上））で、$(r,b)\in\delta(q,a,c)$ のとき $(q,ax,c\gamma)\vdash(r,x,b\gamma)$ と書き、$\vdash$ の反射推移閉包を $\vdash^{\ast}$ とする。$P$ が $w$ を**受理する**とは、ある $f\in F$ と $\gamma$ について $(q_{0},w,\varepsilon)\vdash^{\ast}(f,\varepsilon,\gamma)$ となることをいう。
:::

::: lemma スタックの下は触られない {#comp:pda-stack-extension}
$(q,x,\gamma)\vdash^{\ast}(r,y,\gamma')$ なら、任意の $\beta\in\Gamma^{\ast}$ と $z\in\Sigma^{\ast}$ について $(q,xz,\gamma\beta)\vdash^{\ast}(r,yz,\gamma'\beta)$。
:::

::: proof
一段ごとに、遷移はスタックの一番上と入力の先頭しか見ないので、下に $\beta$、後ろに $z$ を付け加えても同じ遷移が使える。段数に関する帰納法。
:::

## 文法からオートマトンへ {#comp:sec-cfg-to-pda}

::: theorem CFG から PDA へ {#comp:cfg-to-pda}
任意の CFG $G$ に対し、$L(P)=L(G)$ となる PDA $P$ が存在する。
:::

::: proof
$G=(V,\Sigma,R,S)$ とし、$\Gamma\defeq V\cup\Sigma\cup\{\$\}$（$\$$ は新しい記号）とする。状態 $q_{\mathrm{s}},q_{\mathrm{l}},q_{\mathrm{a}}$ と、規則ごとの補助状態を使い、次の動きをする $P$ を作る（開始 $q_{\mathrm{s}}$、受理 $\{q_{\mathrm{a}}\}$）。
1. $q_{\mathrm{s}}$ から、入力を読まずに $\$$ を積み、次に $S$ を積んで $q_{\mathrm{l}}$ に移る（補助状態一つ）。
2. $q_{\mathrm{l}}$ で一番上が変数 $A$ のとき、規則 $A\to w$（$w=X_{1}\cdots X_{k}$）を一つ選び、$A$ を取り除いて $X_{k},\dots,X_{1}$ の順に積み（補助状態 $k-1$ 個を経由。$k=0$ なら取り除くだけ）、$q_{\mathrm{l}}$ に戻る。結果としてスタックの上に $w$ が左から順に並ぶ。
3. $q_{\mathrm{l}}$ で一番上が終端記号 $a$ のとき、入力 $a$ を読んでそれを取り除く。
4. $q_{\mathrm{l}}$ で一番上が $\$$ のとき、それを取り除いて $q_{\mathrm{a}}$ に移る。

2 の一連の動きを一段とみなした $(q_{\mathrm{l}},z,A\gamma)\vdash^{\ast}(q_{\mathrm{l}},z,w\gamma)$ を「展開」、3 を「照合」と呼ぶ。

**$L(G)\subseteq L(P)$.** $w\in L(G)$ とし、最左導出 $S=u_{0}\Rightarrow_{\mathrm{lm}}\cdots\Rightarrow_{\mathrm{lm}}u_{n}=w$ をとる（\ref{comp:leftmost-derivation}）。$u_{i}=x_{i}\alpha_{i}$（$x_{i}\in\Sigma^{\ast}$、$\alpha_{i}$ は空か変数で始まる）と書き、$w=x_{i}y_{i}$ とする（最左導出では $x_{i}$ は $w$ の接頭辞）。$i$ に関する帰納法で $(q_{\mathrm{s}},w,\varepsilon)\vdash^{\ast}(q_{\mathrm{l}},y_{i},\alpha_{i}\$)$ を示す。$i=0$ は 1。$i\to i+1$：$\alpha_{i}=A\beta$ で $A\to v$ を使ったとすると、展開で $(q_{\mathrm{l}},y_{i},v\beta\$)$、続いて $v\beta$ の先頭の終端記号の並び（$x_{i+1}$ の $x_{i}$ より後の部分）を照合して $(q_{\mathrm{l}},y_{i+1},\alpha_{i+1}\$)$。$i=n$ で $\alpha_{n}=\varepsilon$, $y_{n}=\varepsilon$ となり、4 で受理する。

**$L(P)\subseteq L(G)$.** 受理計算は 1 の後、$q_{\mathrm{l}}$ で展開と照合を繰り返し、4 で終わる（$q_{\mathrm{a}}$ からの遷移はなく、$\$$ はスタックの底にあるので 4 は最後の段）。$q_{\mathrm{l}}$ にいる時点で、それまでに読んだ入力を $x$、スタックを $\beta\$$ とすると $S\Rightarrow^{\ast}x\beta$ であることを、段数に関する帰納法で示す。最初は $x=\varepsilon$, $\beta=S$。展開は $A\beta'\mapsto v\beta'$ で、$x A\beta'\Rightarrow xv\beta'$。照合は $a\beta'\mapsto\beta'$ で、読んだ入力が $xa$ になり $x(a\beta')=(xa)\beta'$。4 の直前は $\beta=\varepsilon$ で、入力をすべて読んでいるので $S\Rightarrow^{\ast}w$。
:::

## オートマトンから文法へ {#comp:sec-pda-to-cfg}

::: lemma PDA の正規化 {#comp:pda-normalization}
任意の PDA $P$ に対し、$L(P')=L(P)$ となる PDA $P'$ で、次を満たすものがある。
1. 受理状態はただ一つ $q_{\mathrm{acc}}$ で、受理する直前にスタックを空にする（$P'$ は $(q_{0},w,\varepsilon)\vdash^{\ast}(q_{\mathrm{acc}},\varepsilon,\varepsilon)$ のときに限り $w$ を受理する）。
2. 各遷移は、一つの記号を積むか、一つの記号を取り除くかのどちらか一方だけを行う。
:::

::: proof
1. 新しい底記号 $\$$ を最初に積み、元の受理状態から入力を読まずに新しい状態 $q_{\mathrm{e}}$ に移れるようにし、$q_{\mathrm{e}}$ で $\$$ 以外を取り除き続け、最後に $\$$ を取り除いて $q_{\mathrm{acc}}$ に移る。
2. 積みも取り除きもしない遷移は、新しい記号を積んですぐ取り除く二段に分ける。両方を行う遷移（$c$ を取り除き $b$ を積む）は、新しい中間状態を経由して二段に分ける。

いずれも受理する文字列を変えない。
:::

::: theorem PDA から CFG へ {#comp:pda-to-cfg}
任意の PDA $P$ に対し、$L(G)=L(P)$ となる CFG $G$ が存在する。
:::

::: proof
\ref{comp:pda-normalization} の形の $P=(Q,\Sigma,\Gamma,\delta,q_{0},\{q_{\mathrm{acc}}\})$ について、変数 $A_{pq}$（$p,q\in Q$）、開始変数 $A_{q_{0}q_{\mathrm{acc}}}$、次の規則をもつ $G$ を作る。
- 各 $p,q,r,s\in Q$, $u\in\Gamma$, $a,b\in\Sigma_{\varepsilon}$ で、$(r,u)\in\delta(p,a,\varepsilon)$ かつ $(q,\varepsilon)\in\delta(s,b,u)$ のとき、$A_{pq}\to aA_{rs}b$。
- 各 $p,q,r\in Q$ について $A_{pq}\to A_{pr}A_{rq}$。
- 各 $p\in Q$ について $A_{pp}\to\varepsilon$。

**主張.** $x\in\Sigma^{\ast}$ について、$A_{pq}\Rightarrow^{\ast}x\iff(p,x,\varepsilon)\vdash^{\ast}(q,\varepsilon,\varepsilon)$。

*$\Leftarrow$（計算の段数 $n$ に関する帰納法）.* $n=0$ なら $p=q$, $x=\varepsilon$ で $A_{pp}\to\varepsilon$。$n>0$ とする。正規化 2 より最初の段は積む動き（空のスタックからは取り除けない）、最後の段は取り除く動き（最後にスタックが空）である。
- 計算の途中（最初と最後以外の時点）でスタックが空にならない場合：最初に積んだ記号 $u$ は最後の段で取り除かれる記号に等しい。最初の段 $(r,u)\in\delta(p,a,\varepsilon)$、最後の段 $(q,\varepsilon)\in\delta(s,b,u)$ とし、$x=ayb$ と書くと、中間の計算 $(r,yb,u)\vdash^{\ast}(s,b,u)$ では $u$ が底に残り続けるので、$u$ を除いた計算 $(r,y,\varepsilon)\vdash^{\ast}(s,\varepsilon,\varepsilon)$（\ref{comp:pda-stack-extension} の逆向きも同じ理由で成り立つ）が $n-2$ 段である。帰納法の仮定より $A_{rs}\Rightarrow^{\ast}y$、よって $A_{pq}\Rightarrow aA_{rs}b\Rightarrow^{\ast}ayb=x$。
- 途中でスタックが空になる時点がある場合：その時点の状態を $r$、それまでに読んだ入力を $x_{1}$、残りを $x_{2}$ とすると、$(p,x_{1},\varepsilon)\vdash^{\ast}(r,\varepsilon,\varepsilon)$ と $(r,x_{2},\varepsilon)\vdash^{\ast}(q,\varepsilon,\varepsilon)$ はどちらも $n$ 段未満。帰納法の仮定と $A_{pq}\to A_{pr}A_{rq}$。

*$\Rightarrow$（導出の段数に関する帰納法）.* 最初の規則が $A_{pp}\to\varepsilon$ なら自明。$A_{pq}\to aA_{rs}b$ なら $x=ayb$, $A_{rs}\Rightarrow^{\ast}y$ で、帰納法の仮定より $(r,y,\varepsilon)\vdash^{\ast}(s,\varepsilon,\varepsilon)$。\ref{comp:pda-stack-extension} で底に $u$、後ろに $b$ を付けて $(r,yb,u)\vdash^{\ast}(s,b,u)$。前後に規則のもとになった二つの遷移をつなげて $(p,ayb,\varepsilon)\vdash(r,yb,u)\vdash^{\ast}(s,b,u)\vdash(q,\varepsilon,\varepsilon)$。$A_{pq}\to A_{pr}A_{rq}$ なら $x=x_{1}x_{2}$ と分けて、二つの計算を \ref{comp:pda-stack-extension}（後ろに $x_{2}$ を付ける）でつなぐ。

主張を $p=q_{0}$, $q=q_{\mathrm{acc}}$ に使えば、正規化 1 より $L(G)=L(P)$。
:::

::: corollary CFG と PDA の同値性 {#comp:cfg-pda-equivalence keywords="a language is context-free iff some PDA recognizes it" index="CFG と PDA の同値性|しーえふじーとぴーでぃーえーのどうちせい"}
言語が文脈自由であることと、ある PDA が認識することは同値である。とくに正規言語は文脈自由である（NFA はスタックを使わない PDA とみなせる）。
:::

::: proof
\ref{comp:cfg-to-pda} と \ref{comp:pda-to-cfg}。
:::

::: hypcheck
- **最左導出**（\ref{comp:leftmost-derivation}）：CFG から PDA への証明で、スタックの一番上の変数を常に展開すればよいことの根拠になった。
- **正規化**（\ref{comp:pda-normalization}）：PDA から CFG への証明で、計算の最初が積む動き・最後が取り除く動きであること、受理がスタックを空にした時点に限られることに使った。
- **スタックの局所性**（\ref{comp:pda-stack-extension}）：計算を区切ったりつないだりするすべての箇所。スタックが後入れ先出しであることがこの性質を与え、変数 $A_{pq}$ による分解を可能にしている。
:::

## 問題 {#comp:sec-cfg-problems}

::: problem {#comp:prob-balanced-parentheses}
$\Sigma=\{(,)\}$ で、規則 $S\to SS\mid(S)\mid\varepsilon$ の文法が生成する言語は、括弧の対応がとれた文字列（左から数えてどの接頭辞でも「$($ の個数 $\ge$ $)$ の個数」で、全体では等しい）の全体であることを示せ。
:::

::: solution
*生成される文字列は対応がとれている*：導出の段数に関する帰納法（$SS$ は二つの対応のとれた文字列の連接、$(S)$ は対応のとれた文字列を括弧で囲んだもの、どちらも条件を保つ）。
*逆*：対応のとれた $w\neq\varepsilon$ の長さに関する帰納法。$h(k)\defeq$（$w$ の最初の $k$ 文字の中の $($ の個数 $-$ $)$ の個数）とする。$h(k)=0$ となる最小の $k\ge1$ をとる。$k<\lvert w\rvert$ なら $w=w_{1}w_{2}$ と分けると両方とも対応がとれていて短いので $S\Rightarrow SS\Rightarrow^{\ast}w_{1}w_{2}$。$k=\lvert w\rvert$ なら、$w$ は $($ で始まり $)$ で終わり、$w=(v)$ で $v$ の接頭辞の $h$ は $1$ 以上（$k$ の最小性）なので $v$ は対応がとれている。$S\Rightarrow(S)\Rightarrow^{\ast}(v)$。
:::

::: problem {#comp:prob-pda-0n1n}
$\{0^{n}1^{n}:n\ge0\}$ を認識する PDA を作れ。
:::

::: solution
状態 $q_{1}$（開始）, $q_{2},q_{3},q_{4}$（受理は $q_{1},q_{4}$）。$\delta(q_{1},\varepsilon,\varepsilon)\ni(q_{2},\$)$、$\delta(q_{2},0,\varepsilon)\ni(q_{2},0)$、$\delta(q_{2},1,0)\ni(q_{3},\varepsilon)$、$\delta(q_{3},1,0)\ni(q_{3},\varepsilon)$、$\delta(q_{3},\varepsilon,\$)\ni(q_{4},\varepsilon)$。$0$ を読むたびに積み、$1$ を読むたびに取り除き、底の $\$$ に戻ったら受理する（$q_{1}$ は $\varepsilon$ を受理するため）。
:::

::: supplement
**前提の検討.**
- PDA は非決定的に定義した。決定性 PDA が認識する言語（決定性文脈自由言語）は文脈自由言語より真に少ないことが知られている（たとえば $\{ww^{R}\}$（$w^{R}$ は逆順）は決定性でない）。Sipser 第 2 章 §4 で扱われる。決定性文脈自由言語のページ（\ref{comp:page-dcfl}）を参照。
- 正規化（\ref{comp:pda-normalization}）は、受理の条件を「スタックが空」にしても「受理状態」にしても認識できる言語のクラスが同じであることを示している。

**関連する結果.**
- 文脈自由言語は和・連接・スターで閉じているが、共通部分と補集合では閉じていない（次のページ）。
- チョムスキー標準形の文法について、長さ $n$ の文字列が生成されるかどうかは $O(n^{3})$ の動的計画法（CYK 法）で判定できる。
- 文脈自由文法と、代数（多項式の連立方程式）との対応：各変数を「その変数から導かれる文字列の集合」とすると、規則は言語についての連立多項式方程式になり、文脈自由言語はその最小解として得られる（シュッツェンベルガーの代数的な特徴づけ）。

**高い視点から：再帰と記憶.** 正規言語が「有限の記憶」で、反復（スター）で記述されるのに対し、文脈自由言語は「スタック」という再帰呼び出しの記憶で、自分自身を中に含む規則（$S\to0S1$）で記述される。PDA から文法への構成の変数 $A_{pq}$ は「状態 $p$ から $q$ への、スタックを元に戻す計算」で、これは関数呼び出しの入口と出口の組にほかならない。たとえれば、文法は入れ子の設計図、PDA は設計図を左から順に読みながら、まだ閉じていない括弧を積み上げていく職人である。
