# オートマトンと形式言語（Automata and Formal Languages）

決定性・非決定性有限オートマトン、正規表現とクリーネの定理（アーデンの補題と言語方程式による）、反復補題と非正規言語、文脈自由文法とプッシュダウンオートマトン、文脈自由言語の反復補題、言語方程式と不動点定理、決定性文脈自由言語。（Sipser 第 1・2 章を参考にする。本文は自分の言葉で組み立てる）

<p class="mn-msc">MSC2020: 03D05</p>
