# 写像還元とポストの対応問題 {#comp:page-mapping-reducibility keywords="computable function, mapping reducibility, many-one reducibility, EQ_TM not recognizable, Post correspondence problem, PCP undecidable, modified PCP"}

前のページの還元を**写像還元**として定式化する：$A\le_{\mathrm{m}}B$ とは、入力を変換する計算可能関数 $f$ で「$w\in A\iff f(w)\in B$」となるものがあることである（\ref{comp:mapping-reducible}）。写像還元は決定可能性だけでなく認識可能性も伝えるので、$EQ_{\mathsf{TM}}$ が認識可能でも補認識可能でもないことが示せる（\ref{comp:eqtm-neither}）。後半では、ドミノを並べるだけの組合せ的な問題である**ポストの対応問題**が決定不能であること（\ref{comp:pcp-undecidable}）を、計算履歴をドミノで組み立てる還元で示す。

## 記法と定義の確認 {#comp:sec-map-notation}

::: notation
- TM、判定機、認識可能・決定可能、$A_{\mathsf{TM}}$, $E_{\mathsf{TM}}$ とその決定不能性、時点表示、計算履歴は \ref{comp:page-decidability}, \ref{comp:page-reducibility} のとおり。
- 認識可能な言語の補集合が認識可能なら決定可能（問題 \ref{comp:prob-decidable-complement}）。補集合が認識可能な言語を**補認識可能**という。
:::

## 写像還元 {#comp:sec-mapping}

::: definition 計算可能関数と写像還元 {#comp:mapping-reducible keywords="computable function, mapping reducibility, many-one reduction" index="計算可能関数|けいさんかのうかんすう, 写像還元|しゃぞうかんげん"}
1. 関数 $f\colon\Sigma^{\ast}\to\Sigma^{\ast}$ が**計算可能**であるとは、すべての入力 $w$ の上で停止し、そのときテープに $f(w)$ だけを残す TM があることをいう。
2. 言語 $A,B$ について、計算可能な $f$ で、すべての $w$ について $w\in A\iff f(w)\in B$ となるものがあるとき、$A$ は $B$ に**写像還元可能**であるといい、$A\le_{\mathrm{m}}B$ と書く。$f$ を $A$ から $B$ への**還元**という。
:::

::: proposition 写像還元の基本性質 {#comp:mapping-basic}
1. $\le_{\mathrm{m}}$ は反射的かつ推移的である。$A\le_{\mathrm{m}}B$ なら $\overline{A}\le_{\mathrm{m}}\overline{B}$。
2. $A\le_{\mathrm{m}}B$ で $B$ が決定可能なら $A$ も決定可能。
3. $A\le_{\mathrm{m}}B$ で $B$ が認識可能なら $A$ も認識可能。
:::

::: proof
1. 恒等関数と、還元の合成（計算可能関数の合成は、二つの機械を続けて動かせば計算できる）。後半は同じ $f$ で $w\notin A\iff f(w)\notin B$。
2. $B$ の判定機 $M$ と還元 $f$ について、「$f(w)$ を計算し、$M$ を $f(w)$ の上で動かしてその答えを出す」機械は判定機で $A$ を決定する。
3. 同じ構成で、$M$ を $B$ を認識する機械にする。
:::

::: example
\ref{comp:etm-undecidable} の証明の $\langle M,w\rangle\mapsto\langle M_{1}\rangle$ は $A_{\mathsf{TM}}\le_{\mathrm{m}}\overline{E_{\mathsf{TM}}}$ を与える（$M$ が $w$ を受理する $\iff L(M_{1})\neq\varnothing$）。符号でない入力は、$\overline{E_{\mathsf{TM}}}$ に属さない固定の文字列（たとえばすべて拒否する機械の符号）に送ればよい。
:::

::: theorem $EQ_{\mathsf{TM}}$ は認識可能でも補認識可能でもない {#comp:eqtm-neither keywords="EQ_TM is neither Turing-recognizable nor co-Turing-recognizable" index="EQ_TM の認識不能性|いーきゅーてぃーえむのにんしきふのうせい"}
$EQ_{\mathsf{TM}}$ はチューリング認識可能でなく、その補集合 $\overline{EQ_{\mathsf{TM}}}$ もチューリング認識可能でない。
:::

::: proof
\ref{comp:co-atm-unrecognizable} より $\overline{A_{\mathsf{TM}}}$ は認識可能でない。\ref{comp:mapping-basic} の 1, 3 より、$A_{\mathsf{TM}}\le_{\mathrm{m}}\overline{EQ_{\mathsf{TM}}}$ を示せば $EQ_{\mathsf{TM}}$ は認識可能でなく、$A_{\mathsf{TM}}\le_{\mathrm{m}}EQ_{\mathsf{TM}}$ を示せば $\overline{EQ_{\mathsf{TM}}}$ は認識可能でない（$\overline{A_{\mathsf{TM}}}\le_{\mathrm{m}}\overline{EQ_{\mathsf{TM}}}$ と $\overline{A_{\mathsf{TM}}}\le_{\mathrm{m}}EQ_{\mathsf{TM}}$ になるので）。入力 $\langle M,w\rangle$ に対し、

> $M_{1}$：すべての入力を拒否する。$M_{2}$：すべての入力を受理する。$M_{3}$：入力を無視して $M$ を $w$ の上で動かし、$M$ が受理すれば受理する。

とする。$L(M_{3})=\Sigma^{\ast}$（$M$ が $w$ を受理するとき）、$\varnothing$（そうでないとき）。よって $\langle M,w\rangle\mapsto\langle M_{1},M_{3}\rangle$ は $A_{\mathsf{TM}}\le_{\mathrm{m}}\overline{EQ_{\mathsf{TM}}}$、$\langle M,w\rangle\mapsto\langle M_{2},M_{3}\rangle$ は $A_{\mathsf{TM}}\le_{\mathrm{m}}EQ_{\mathsf{TM}}$ を与える。
:::

## ポストの対応問題 {#comp:sec-pcp}

::: definition ポストの対応問題 {#comp:pcp keywords="Post correspondence problem, PCP, dominos, match" index="ポストの対応問題|ぽすとのたいおうもんだい"}
**ドミノ**とは文字列の組 $\bigl[\tfrac{t}{b}\bigr]$（$t$ を上、$b$ を下という）のことである。ドミノの有限集合 $P=\{[t_{1}/b_{1}],\dots,[t_{k}/b_{k}]\}$ の**一致**とは、添字の空でない列 $i_{1},\dots,i_{l}$（重複可）で $t_{i_{1}}\cdots t_{i_{l}}=b_{i_{1}}\cdots b_{i_{l}}$ となるものをいう。$\mathit{PCP}\defeq\{\langle P\rangle:P\text{ は一致をもつ}\}$。

**修正版**（MPCP）は、一致が最初のドミノ $[t_{1}/b_{1}]$ から始まる（$i_{1}=1$）ことを要求するもので、$\mathit{MPCP}\defeq\{\langle P\rangle:P\text{ は }1\text{ から始まる一致をもつ}\}$。
:::

::: example
$P=\{[b/ca],\ [a/ab],\ [ca/a],\ [abc/c]\}$ では、列 $2,1,3,2,4$ が一致を与える：上は $a\cdot b\cdot ca\cdot a\cdot abc=abcaaabc$、下は $ab\cdot ca\cdot a\cdot ab\cdot c=abcaaabc$。
:::

::: lemma TM の受理から MPCP へ {#comp:atm-to-mpcp}
$A_{\mathsf{TM}}\le_{\mathrm{m}}\mathit{MPCP}$。
:::

::: proof
TM $M=(Q,\Sigma,\Gamma,\delta,q_{0},q_{\mathrm{acc}},q_{\mathrm{rej}})$ は、左端で左に動こうとしない（左端に印を置き、そこで右に戻るように修正すれば認識する言語を変えずにそうできる）と仮定してよい。入力 $\langle M,w\rangle$（$w=w_{1}\cdots w_{n}$）から、記号 $\#\notin\Gamma\cup Q$ を使って次のドミノの集合 $P'$ を作る。
1. 最初のドミノ：$[\ \#\ /\ \#q_{0}w_{1}\cdots w_{n}\#\ ]$。
2. $q\neq q_{\mathrm{rej}}$, $\delta(q,a)=(r,b,\mathrm{R})$ ごとに $[\ qa\ /\ br\ ]$。
3. $q\neq q_{\mathrm{rej}}$, $\delta(q,a)=(r,b,\mathrm{L})$ と各 $c\in\Gamma$ について $[\ cqa\ /\ rcb\ ]$。
4. 各 $a\in\Gamma$ について $[\ a\ /\ a\ ]$。
5. $[\ \#\ /\ \#\ ]$ と $[\ \#\ /\ \sqcup\#\ ]$。
6. 各 $a\in\Gamma$ について $[\ aq_{\mathrm{acc}}\ /\ q_{\mathrm{acc}}\ ]$ と $[\ q_{\mathrm{acc}}a\ /\ q_{\mathrm{acc}}\ ]$。
7. $[\ q_{\mathrm{acc}}\#\#\ /\ \#\ ]$。

ここで $q\neq q_{\mathrm{acc}}$ も仮定する（$\delta$ は停止状態で定義されない）。

**$M$ が $w$ を受理するなら一致がある.** 受理計算履歴 $C_{1}=q_{0}w,\ C_{2},\dots,C_{l}$ をとる。最初のドミノの後、下が上より $C_{1}\#$ だけ長い状態から始め、各 $C_{i}$ について、上に $C_{i}\#$ を読み進めながら下に $C_{i+1}\#$ を書くようにドミノを選ぶ：ヘッドの周り（状態記号を含む二〜三文字）は 2 または 3 のドミノ、それ以外の文字は 4、区切りは 5（ヘッドが右端の空白に進む場合は $[\#/\sqcup\#]$ で空白を補う）。こうして下が上より $C_{i+1}\#$ だけ長い状態になる。$C_{l}$ に $q_{\mathrm{acc}}$ が現れた後は、6 で $q_{\mathrm{acc}}$ の隣の文字を一つずつ消した時点表示を下に書いていき、下が上より $q_{\mathrm{acc}}\#$ だけ長くなったところで 7 を置くと、上と下が一致する。

**一致があるなら $M$ は $w$ を受理する.** 一致を最初のドミノから順に置いていく途中では、上はつねに下の接頭辞である（一致の上と下は同じ文字列なので、途中の上の文字列は最終的な文字列の接頭辞であり、下も同様で、上は下より短いか等しい）。最初のドミノの後、下は上より $\#C_{1}\#$ の分だけ先にある。$q_{\mathrm{acc}}$ を含まない間に使えるドミノは 2〜5 で、2・3 のドミノの上はちょうど一つの状態記号を含み、上を下に合わせるには、上に $C_{i}\#$ を並べたとき下に並ぶのは（ドミノの形から）$C_{i}$ から $M$ の一段で得られる時点表示 $C_{i+1}$ と $\#$ に限られる。したがって、下に現れる時点表示の列は $M$ の $w$ の上の計算の最初の部分である。上と下の長さの差は $q_{\mathrm{acc}}$ が現れるまで正のまま縮まらない（2〜5 のドミノは、上で読み進めた分と同じかそれ以上を下に書く）ので、一致が完成するには $q_{\mathrm{acc}}$ が現れなければならない（6・7 だけが上を下より長く伸ばす）。よって $M$ の計算は受理状態に達する。

$\langle M,w\rangle\mapsto\langle P'\rangle$ は計算可能なので、これは写像還元である。
:::

::: lemma MPCP から PCP へ {#comp:mpcp-to-pcp}
$\mathit{MPCP}\le_{\mathrm{m}}\mathit{PCP}$。
:::

::: proof
新しい記号 $\star,\diamond$ を使う。文字列 $u=u_{1}\cdots u_{m}$ について $\star u\defeq\star u_{1}\star u_{2}\cdots\star u_{m}$、$u\star\defeq u_{1}\star\cdots u_{m}\star$、$\star u\star\defeq\star u_{1}\star\cdots\star u_{m}\star$ とする。$P'=\{[t_{1}/b_{1}],\dots,[t_{k}/b_{k}]\}$ に対し、
$$
P\defeq\{[\star t_{1}/\star b_{1}\star],\ [\star t_{i}/b_{i}\star]\ (1\le i\le k),\ [\star\diamond/\diamond]\}
$$
とする。$P$ のドミノのうち、上と下が同じ記号で始まるのは最初のものだけ（上はすべて $\star$ で始まり、下は最初のもの以外は $\star$ で始まらない）なので、$P$ の一致は最初のドミノで始まり、最後は $[\star\diamond/\diamond]$ で終わる（下の末尾の余分な $\star$ を上の $\star$ で埋めるため）。$\star$ を取り除くと $P'$ の $1$ から始まる一致が得られ、逆に $P'$ の $1$ から始まる一致からは、最初のドミノを $[\star t_{1}/\star b_{1}\star]$、他を $[\star t_{i}/b_{i}\star]$ にし、最後に $[\star\diamond/\diamond]$ を付けて $P$ の一致が得られる。
:::

::: theorem ポストの対応問題の決定不能性 {#comp:pcp-undecidable keywords="PCP is undecidable" index="ポストの対応問題の決定不能性|ぽすとのたいおうもんだいのけっていふのうせい"}
$\mathit{PCP}$ は決定可能でない。
:::

::: proof
\ref{comp:atm-to-mpcp}, \ref{comp:mpcp-to-pcp} と \ref{comp:mapping-basic} の 1 より $A_{\mathsf{TM}}\le_{\mathrm{m}}\mathit{PCP}$。$\mathit{PCP}$ が決定可能なら \ref{comp:mapping-basic} の 2 より $A_{\mathsf{TM}}$ も決定可能となり、\ref{comp:atm-undecidable} に反する。
:::

::: hypcheck
- **計算履歴**：\ref{comp:atm-to-mpcp} のドミノは、受理計算履歴を「上が一つ遅れて下を追いかける」形で書くためのものである。
- **修正版を経由すること**：最初のドミノを強制しないと、たとえば $[a/a]$ だけで一致ができてしまう。\ref{comp:mpcp-to-pcp} の $\star$ の工夫が最初のドミノを強制する。
- **左端の仮定**：3 のドミノは状態記号の左に文字 $c$ があることを前提とするので、左端で左に動かない機械に修正しておいた。
:::

## 問題 {#comp:sec-map-problems}

::: problem {#comp:prob-pcp-unary}
一文字のアルファベット $\{1\}$ 上のポストの対応問題は決定可能であることを示せ。
:::

::: solution
ドミノ $[1^{a_{i}}/1^{b_{i}}]$ の差を $d_{i}\defeq a_{i}-b_{i}$ とする。一致は、各ドミノの使用回数 $n_{i}\ge0$（総和が正）で $\sum n_{i}d_{i}=0$ となることと同値（並べ方は関係ない）。$d_{i}=0$ のドミノがあれば一致がある。そうでなければ、正の $d_{i}$ と負の $d_{j}$ が両方あれば $n_{i}=-d_{j}$, $n_{j}=d_{i}$ で一致があり、どちらかしかなければ一致はない。この場合分けは決定可能である。
:::

::: problem {#comp:prob-mapping-atm-complete}
任意のチューリング認識可能な言語 $A$ について $A\le_{\mathrm{m}}A_{\mathsf{TM}}$ であることを示せ。
:::

::: solution
$A=L(M)$ とし、$f(w)\defeq\langle M,w\rangle$ とする。$f$ は計算可能で、$w\in A\iff M$ が $w$ を受理する $\iff f(w)\in A_{\mathsf{TM}}$。
:::

::: supplement
**前提の検討.**
- 写像還元は「一回だけ相手の問題を呼び出し、その答えをそのまま使う」還元である。答えを反転したり、何度も呼び出したりするより一般の還元はチューリング還元（この系列の後のページ）で、たとえば $\overline{A_{\mathsf{TM}}}$ は $A_{\mathsf{TM}}$ にチューリング還元できるが写像還元はできない（\ref{comp:mapping-basic} の 3 と \ref{comp:co-atm-unrecognizable}）。
- ポストの対応問題は、ドミノが $2$ 種類以下なら決定可能、$5$ 種類以上（最近の結果ではさらに少数）で決定不能になることが知られている。

**関連する結果.**
- *完全性.* 問題 \ref{comp:prob-mapping-atm-complete} より、$A_{\mathsf{TM}}$ は認識可能な言語の中で $\le_{\mathrm{m}}$ について最大（**完全**）である。$\mathit{HALT}_{\mathsf{TM}}$ や $\mathit{PCP}$ も同じ意味で完全である。
- *形式言語への応用.* ポストの対応問題から、二つの文脈自由文法の生成する言語が交わるか、文脈自由文法が曖昧か、などが決定不能であることが導かれる。

**高い視点から：前順序としての難しさ.** $\le_{\mathrm{m}}$ は言語全体の上の前順序で、その同値類（多対一次数）は「同じだけ難しい問題の類」である。決定可能な言語（自明なものを除く）は最小の類をなし、$A_{\mathsf{TM}}$ は認識可能な言語の中の最大の類をなす。この二つの間にどれだけの類があるかは、ポストの問題として知られる深い問いで、チューリング次数の理論で扱われる。ポストの対応問題は、機械とは無関係に見える「ドミノ並べ」の中に計算の全体が埋め込まれていることを示しており、たとえるなら、パズルの盤面の上で計算機の動きを再現する、という仕掛けである。
:::
