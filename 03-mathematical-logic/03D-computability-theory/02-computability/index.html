# 計算可能性理論（Computability Theory）

逐次実行・for・while と簡単な基本命令だけをもつプログラミング言語 L で計算可能性を定義し、原始再帰関数（＝for プログラム）、アッカーマン関数、一般再帰関数、レジスタ機械を扱う。次にチューリング機械を導入して L との同値性とチューリング完全性を示し、決定可能性・停止問題・還元・ライスの定理・ポストの対応問題（Sipser 第 3〜5 章を参考）を扱った後、万能プログラム・クリーネの標準形・smn 定理と再帰定理で締めくくる。

<p class="mn-msc">MSC2020: 03D10, 03D20, 03D35</p>

## 前提知識

- [計算理論 › オートマトンと形式言語](../../../03-mathematical-logic/03D-computability-theory/01-automata/index.html)（全体、7 ページ）：有限オートマトンと文脈自由文法（決定可能性の例として使う）
