# ポストの定理 {#comp:page-post-theorem keywords="Post's theorem, Sigma_{n+1} = recognizable in the n-th jump, Delta_{n+1} = computable in the n-th jump, use principle, relativized Kleene normal form, bounded quantifiers, Sigma_n-complete sets"}

算術的階層（\ref{comp:arithmetical-hierarchy}）は量化子の交代の回数で集合を分類し、ジャンプ $\varnothing^{(n)}$（\ref{comp:jump}）は停止問題を繰り返し相対化したものである。**ポストの定理**（\ref{comp:post-theorem}）は両者をつなぐ：$\Sigma_{n+1}$ の集合はちょうど $\varnothing^{(n)}$ を神託として認識可能な集合であり、$\Delta_{n+1}$ の集合はちょうど $\varnothing^{(n)}$ にチューリング還元可能な集合である。証明の要は、神託機械の停止する計算は神託の有限個の値しか使わないという**使用の原理**（\ref{comp:use-principle-sets}）と、$\Sigma_{n}$ が**有界量化子**で閉じていること（\ref{comp:bounded-quantifiers}）である。

> 資料：新井『数学基礎論』§6.3（算術的階層とポストの定理）を参考にした（本文は写していない）。本サイトの神託機械（\ref{comp:oracle-tm}）に合わせて、使用の原理を「神託への問い合わせとその答えの有限な表」の形で定式化した。

## 記法と定義の確認 {#comp:sec-pt-notation}

::: notation
- 神託機械 $M^{B}$、チューリング還元 $\le_{\mathrm{T}}$、ジャンプ $B'$ とその性質、算術的階層 $\Sigma_{n},\Pi_{n},\Delta_{n}$ とその基本性質、$\Sigma_{1}$ と認識可能性は \ref{comp:oracle-tm}, \ref{comp:turing-reduction-basic}, \ref{comp:jump}, \ref{comp:jump-properties}, \ref{comp:arithmetical-hierarchy}, \ref{comp:hierarchy-basic}, \ref{comp:sigma1-recognizable} のとおり。
- 集合 $A$ が **$B$ で認識可能**とは、神託機械 $M$ で $A=L(M^{B})$ となるものがあることをいう。$B$ で決定可能（$A\le_{\mathrm{T}}B$）なら $B$ で認識可能。
- 自然数の有限列・有限集合は自然数で符号化し、$(w)_{i}$ は $w$ の符号する列の第 $i$ 成分（計算可能）とする。
:::

## 使用の原理と有界量化子 {#comp:sec-pt-lemmas}

::: lemma 使用の原理 {#comp:use-principle-sets keywords="use principle: halting oracle computations query only finitely many oracle values; relativized normal form" index="使用の原理（集合の神託）|しようのげんりしゅうごうのしんたく"}
神託機械 $M$ について、決定可能な関係 $T_{M}(x,t,D)$ で、すべての集合 $B$ と入力 $x$ について
$$
M^{B}\text{ は }x\text{ を受理する}\iff\exists t\,\exists D\,\bigl[T_{M}(x,t,D)\wedge D\subseteq\chi_{B}\bigr]
$$
となるものがある。関数を神託とする場合の同様の原理は \ref{comp:use-principle} で扱った。ここで $D$ は有限な部分関数 $\N\rightharpoonup\{0,1\}$（の符号）を動き、$D\subseteq\chi_{B}$ は「$D(y)=1$ なら $y\in B$、$D(y)=0$ なら $y\notin B$」を意味する。
:::

::: proof
$T_{M}(x,t,D)$ を「$D$ は有限な部分関数の符号で、$M$ を入力 $x$ の上で、問い合わせ $y$ には $D(y)$ で答えながら $t$ 段だけ模倣すると、すべての問い合わせが $D$ の定義域に属し、その間に受理する」とする。模倣は有限段なので $T_{M}$ は決定可能。

**⇒.** $M^{B}$ が $x$ を $t$ 段で受理するとき、その計算中の問い合わせ全体 $\{y_{1},\dots,y_{k}\}$ とその答え $\chi_{B}(y_{i})$ を $D$ とすれば $D\subseteq\chi_{B}$ で、模倣は実際の計算と同じなので $T_{M}(x,t,D)$。

**⇐.** $D\subseteq\chi_{B}$ なら、模倣で $D$ が返す答えは $B$ の答えと一致するので、$t$ 段までの模倣は $M^{B}$ の実際の計算に等しく、$M^{B}$ は $x$ を受理する。
:::

::: lemma 有界量化子 {#comp:bounded-quantifiers keywords="Sigma_n and Pi_n are closed under bounded quantifiers" index="有界量化子（算術的階層）|ゆうかいりょうかしさんじゅつてきかいそう"}
$n\ge0$ について、$\Sigma_{n}$ と $\Pi_{n}$ は有界量化子 $\exists i<k$, $\forall i<k$（$k$ は変数）で閉じている。すなわち $C(\vec{x},i)$ が $\Sigma_{n}$（$\Pi_{n}$）なら、$\exists i<k\,C$ と $\forall i<k\,C$（$k$ を新たな変数とする関係）も $\Sigma_{n}$（$\Pi_{n}$）。
:::

::: proof
$n$ に関する帰納法。$n=0$：決定可能な関係に有界量化子を付けたものは、$i=0,\dots,k-1$ を順に調べれば決定できる。

$n\to n+1$。$C$ が $\Sigma_{n+1}$ で、$C(\vec{x},i)\iff\exists y\,E(\vec{x},i,y)$（$E$ は $\Pi_{n}$。\ref{comp:hierarchy-basic} の 3 で先頭の $\exists$ をまとめた）とする。
- $\exists i<k\,\exists y\,E\iff\exists u\,[(u)_{0}<k\wedge E(\vec{x},(u)_{0},(u)_{1})]$ で、括弧内は $\Pi_{n}$（決定可能な関係との $\wedge$。\ref{comp:hierarchy-basic} の 3）なので全体は $\Sigma_{n+1}$。
- $\forall i<k\,\exists y\,E\iff\exists w\,\forall i<k\,E(\vec{x},i,(w)_{i})$。⇐ は明らか。⇒ は、各 $i<k$ で $E(\vec{x},i,y)$ となる最小の $y_{i}$ をとり、列 $(y_{0},\dots,y_{k-1})$ の符号を $w$ とすればよい。帰納法の仮定から $\forall i<k\,E(\vec{x},i,(w)_{i})$ は $\Pi_{n}$ なので、全体は $\Sigma_{n+1}$。

$\Pi_{n+1}$ については、補集合をとって $\Sigma_{n+1}$ の場合に帰着する（$\neg\forall i<k\,C\iff\exists i<k\,\neg C$ など、\ref{comp:hierarchy-basic} の 1）。
:::

::: hypcheck
- **列の符号化の計算可能性**：二つ目の項目で、有限個の証拠 $y_{i}$ を一つの $w$ にまとめるのに使った。有界でない $\forall i$ ではこれができないことが、階層が量化子の交代で真に上がる理由である。
:::

## ポストの定理 {#comp:sec-pt-theorem}

::: theorem ポストの定理 {#comp:post-theorem keywords="Post's theorem: Sigma_{n+1} iff recognizable in 0^(n); Delta_{n+1} iff Turing reducible to 0^(n); 0^(n) is Sigma_n-complete" index="ポストの定理|ぽすとのていり"}
$n\ge0$ について次が成り立つ。
1. 集合 $A$ が $\Sigma_{n+1}$ であることと、$A$ が $\varnothing^{(n)}$ で認識可能であることは同値である。
2. $\varnothing^{(n+1)}$ は $\Sigma_{n+1}$ であり、すべての $\Sigma_{n+1}$ の集合は $\varnothing^{(n+1)}$ に写像還元できる（$\varnothing^{(n+1)}$ は **$\Sigma_{n+1}$ 完全**）。
3. $A$ が $\Delta_{n+1}$ であることと、$A\le_{\mathrm{T}}\varnothing^{(n)}$ であることは同値である。
:::

::: proof
**Step 1（1 ⇒ 2）.** ある $n$ で 1 が成り立つとする。$\varnothing^{(n+1)}=(\varnothing^{(n)})'$ は $\varnothing^{(n)}$ で認識可能（\ref{comp:jump-properties} の 1）なので、1 から $\Sigma_{n+1}$。$A$ が $\Sigma_{n+1}$ なら 1 から $\varnothing^{(n)}$ で認識可能で、\ref{comp:jump-properties} の 3 より $A\le_{\mathrm{m}}(\varnothing^{(n)})'=\varnothing^{(n+1)}$。

**Step 2（$n=0$ での 1）.** $\varnothing$ を神託とする機械は、問い合わせの答えがいつも「いいえ」なので通常の機械で模倣でき、逆も明らか。よって「$\varnothing$ で認識可能」は「認識可能」と同じで、\ref{comp:sigma1-recognizable} から 1 が成り立つ。

**Step 3（$n$ での 1, 2 から $n+1$ での 1）.** $B\defeq\varnothing^{(n+1)}$ とする。

*⇒.* $A$ を $\Sigma_{n+2}$ とし、$x\in A\iff\exists y\,C(x,y)$（$C$ は $\Pi_{n+1}$）と書く。$\overline{C}$ は $\Sigma_{n+1}$ なので、$n$ での 2 から $\overline{C}\le_{\mathrm{m}}B$、したがって $C\le_{\mathrm{T}}B$（\ref{comp:turing-reduction-basic} の 2 と推移性）。「$y=0,1,2,\dots$ の順に、$B$ に問い合わせながら $C(x,y)$ を判定し、真になれば受理する」神託機械は $A$ を $B$ で認識する。

*⇐.* $A=L(M^{B})$ とする。\ref{comp:use-principle-sets} より
$$
\begin{aligned}
x\in A\iff\exists t\,\exists D\,\bigl[&T_{M}(x,t,D)\wedge\forall y\in\mathrm{dom}\,D\\
&\bigl((D(y)=1\to y\in B)\wedge(D(y)=0\to y\notin B)\bigr)\bigr].
\end{aligned}
$$
$n$ での 2 から「$y\in B$」は $\Sigma_{n+1}$、「$y\notin B$」は $\Pi_{n+1}$ で、どちらも $\Sigma_{n+2}$ に含まれる（\ref{comp:hierarchy-basic} の 2）。決定可能な前件との $\to$（$\vee$ の形）、$\wedge$、有界量化子 $\forall y\in\mathrm{dom}\,D$（$D$ の符号で上から抑えられる）で $\Sigma_{n+2}$ は閉じている（\ref{comp:hierarchy-basic} の 3 と \ref{comp:bounded-quantifiers}）。$T_{M}$ は決定可能で、先頭の $\exists t\,\exists D$ をまとめれば、全体は $\Sigma_{n+2}$。

以上と帰納法から、すべての $n$ で 1 と 2 が成り立つ。

**Step 4（3）.** $A\le_{\mathrm{T}}\varnothing^{(n)}$ なら $A$ と $\overline{A}$ はともに $\varnothing^{(n)}$ で決定可能、したがって認識可能で、1 から $\Sigma_{n+1}$、すなわち $A$ は $\Delta_{n+1}$（\ref{comp:hierarchy-basic} の 1）。逆に $A$ と $\overline{A}$ が $\Sigma_{n+1}$ なら、1 からどちらも $\varnothing^{(n)}$ で認識可能で、二つの神託機械を交互に一段ずつ動かして先に受理した方で答えれば、$A$ を $\varnothing^{(n)}$ で決定できる（\ref{comp:prob-decidable-complement} の相対化）。
:::

::: hypcheck
- **使用の原理**：Step 3 の ⇐ で、神託 $B$ への依存を「有限個の $B$ の値」に押し込めるのに使った。これがないと、$M^{B}$ の受理を算術の量化子で書けない。
- **有界量化子での閉性**：Step 3 の ⇐ で、有限表 $D$ の各値が正しいことをまとめて述べるのに使った。
- **ジャンプの性質**：Step 1 で、$\varnothing^{(n+1)}$ の上界（認識可能性）と完全性（写像還元）の両方に使った。
:::

::: corollary ジャンプの列と階層 {#comp:jump-hierarchy keywords="0^(n) < 0^(n+1); Sigma_n \ Pi_n nonempty via jumps" index="ジャンプの列|じゃんぷのれつ"}
$n\ge1$ について $\varnothing^{(n)}$ は $\Sigma_{n}$ だが $\Pi_{n}$ でない。また $\varnothing^{(n)}<_{\mathrm{T}}\varnothing^{(n+1)}$。
:::

::: proof
$\varnothing^{(n)}$ が $\Pi_{n}$ なら、$\Sigma_{n}$ でもあるので $\Delta_{n}$ で、ポストの定理の 3 から $\varnothing^{(n)}\le_{\mathrm{T}}\varnothing^{(n-1)}$。しかし \ref{comp:jump-properties} の 2 より $(\varnothing^{(n-1)})'\not\le_{\mathrm{T}}\varnothing^{(n-1)}$。後半は同じ \ref{comp:jump-properties} の 2 と、$\varnothing^{(n)}\le_{\mathrm{T}}\varnothing^{(n+1)}$（\ref{comp:jump-properties} の 1, 3 から $\varnothing^{(n)}\le_{\mathrm{m}}\varnothing^{(n+1)}$）。
:::

## 問題 {#comp:sec-pt-problems}

::: problem {#comp:prob-pt-fin}
$\mathit{FIN}=\{e:W_{e}\text{ は有限}\}$（\ref{comp:hierarchy-examples}）が $\varnothing''$ で決定可能であることを、ポストの定理を使って示せ。
:::

::: solution
$\mathit{FIN}$ は $\Sigma_{2}$ なので $\Delta_{3}$（\ref{comp:hierarchy-basic} の 2）。ポストの定理の 3（$n=2$）から $\mathit{FIN}\le_{\mathrm{T}}\varnothing''$。
:::

::: problem {#comp:prob-pt-tot}
$\mathit{TOT}$ は $\varnothing'$ で認識可能でないが、$\varnothing''$ で決定可能であることを示せ。ただし $\mathit{TOT}$ が $\Sigma_{2}$ でないこと（$\Pi_{2}$ 完全であること）は認めてよい。
:::

::: solution
$\varnothing'$ で認識可能なら、ポストの定理の 1（$n=1$）から $\Sigma_{2}$ になり、仮定に反する。$\mathit{TOT}$ は $\Pi_{2}\subseteq\Delta_{3}$ なので、3（$n=2$）から $\varnothing''$ で決定可能。
:::

::: supplement
**前提を変えると.** 神託を任意の集合 $B$ にしても同じ議論が通り、「$\Sigma_{n+1}^{B}$（$B$ で決定可能な関係から始めた階層）はちょうど $B^{(n)}$ で認識可能な集合」という相対化されたポストの定理が得られる。量化子を関数の上に動かすと解析的階層（\ref{comp:page-analytical-hierarchy}）になり、そこでは $\Delta^{1}_{1}$ が超算術的集合と一致する（スースリン–クリーネの定理。\ref{comp:page-hyperarithmetic}）。

**似た定理.** $\Sigma_{n}$ の関係は、算術の言語で有界量化子だけの論理式に $n$ 個の交互の量化子を付けた論理式で定義できる関係とも一致することが知られており（\ref{comp:tm-sigma-definable} はその $n=1$ の一方向）、ポストの定理と合わせて、計算・論理・量化子の三つの見方が一致する。ジャンプの列の「間」の次数については、フリードバーグ–ムチニクの定理（\ref{comp:page-friedberg-muchnik}）がある。

**高い視点から：神託は「一つ上の量化子」.** $\varnothing'$ を神託にもつことは、「ある計算が止まるか」という $\exists$ 一つ分の質問に、一段で答えてもらえることを意味する。$\varnothing^{(n)}$ は $n$ 段の交互の量化子をまとめて答えてくれる神託であり、それを使って探索（$\exists$）をもう一つ行えるのが $\Sigma_{n+1}$ である。比喩で言えば、量化子の階段を一段上がるごとに、下の段の質問すべてに答える案内人を一人雇うことになる。使用の原理は、その案内人に聞く質問が、どの計算でも有限個で済むことを保証している。
:::
