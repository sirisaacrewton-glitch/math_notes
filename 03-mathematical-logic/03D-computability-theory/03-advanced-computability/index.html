# 計算可能性の発展（Advanced Topics in Computability）

計算可能性理論の応用と発展：論理的理論の決定可能性（プレスブルガー算術の決定可能性、算術の決定不能性）、チューリング還元と神託機械、跳躍、算術的階層とポストの定理、フリードバーグ–ムチニクの定理（優先論法）、単純集合と低集合、創造的集合（1 完全性）とマイヒルの同型定理、ライス–シャピロの定理、指数集合の完全性（FIN・TOT・COF）、低基底定理、解析的階層と Π¹₁ 標準形、計算可能順序数とスペクターの有界性定理。（Sipser 第 6 章を参考。算術的階層以降は Sipser にないので、新井『数学基礎論』第 6 章で補う）

<p class="mn-msc">MSC2020: 03D20, 03D25, 03D32, 03D55, 03D60</p>
