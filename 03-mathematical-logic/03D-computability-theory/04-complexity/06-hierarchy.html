# 階層定理と相対化 {#comp:page-hierarchy keywords="space hierarchy theorem, time hierarchy theorem, space constructible, time constructible, diagonalization, NL ≠ PSPACE, P ≠ EXPTIME, relativization, oracle, Baker-Gill-Solovay"}

資源を増やせば、真に多くの問題が解けるようになる。これを述べるのが**階層定理**（領域は \ref{comp:space-hierarchy}、時間は \ref{comp:time-hierarchy}）で、証明は停止問題と同じ**対角線論法**を、資源を制限して行う。系として $\mathrm{NL}\subsetneq\mathrm{PSPACE}$、$\mathrm{P}\subsetneq\mathrm{EXPTIME}$ が得られる（\ref{comp:hierarchy-separations}）。一方で、P 対 NP 問題は対角線論法では解けないことが、**相対化**の議論で示される：神託 $A$ で $\mathrm{P}^{A}=\mathrm{NP}^{A}$ となるもの（\ref{comp:bgs-equal}）と、神託 $B$ で $\mathrm{P}^{B}\neq\mathrm{NP}^{B}$ となるもの（\ref{comp:bgs-separate}）がある（ベイカー–ギル–ソロヴェイ）。

## 記法と定義の確認 {#comp:sec-hier-notation}

::: notation
- $\mathrm{TIME}$、$\mathrm{SPACE}$（読み取り専用入力をもつ模型、\ref{comp:logspace-model}）、P、NP、PSPACE、EXPTIME、L、NL、サヴィッチの定理、TQBF の PSPACE 完全性（\ref{comp:tqbf-complete}）は \ref{comp:page-time-complexity}, \ref{comp:page-np}, \ref{comp:page-space-complexity}, \ref{comp:page-logspace} のとおり。
- 神託機械（\ref{comp:oracle-tm}）は \ref{comp:page-turing-reducibility} のとおり。神託への問い合わせは一段で答えが得られる。
- $\mathrm{EXPSPACE}\defeq\bigcup_{k}\mathrm{SPACE}(2^{n^{k}})$。
:::

## 領域階層定理 {#comp:sec-space-hierarchy}

::: definition 領域構成可能 {#comp:space-constructible keywords="space constructible function" index="領域構成可能|りょういきこうせいかのう"}
$f\colon\N\to\N$ が**領域構成可能**とは、$f(n)\ge\log n$ で、入力 $1^{n}$ から $f(n)$ の二進表記を領域 $O(f(n))$ で計算する決定性の機械があることをいう。$\log n$, $n^{k}$, $2^{n}$ などはどれも領域構成可能である。
:::

::: theorem 領域階層定理 {#comp:space-hierarchy keywords="space hierarchy theorem" index="領域階層定理|りょういきかいそうていり"}
$f$ が領域構成可能なら、領域 $O(f(n))$ で決定できるが、領域 $o(f(n))$ では決定できない言語がある。
:::

::: proof
**判定機 $D$.** 入力 $w$（長さ $n$）について：
1. $f(n)$ を計算し、作業テープに $f(n)$ 升の範囲の印を付ける。以後この範囲を出ようとしたら拒否する。
2. $w$ が $\langle M\rangle10^{j}$（$M$ は 2 テープの TM の符号、$j\ge0$）の形でなければ拒否する。
3. $M$ を $w$ の上で模倣する。模倣の段数を数え、$2^{f(n)}$ 段を超えたら拒否する（計数器は $f(n)$ ビット）。
4. $M$ が受理したら拒否、拒否したら受理する。

$D$ は使用領域 $O(f(n))$ の判定機で、$A\defeq L(D)\in\mathrm{SPACE}(f(n))$。

**$A$ は領域 $o(f(n))$ で決定できない.** 領域 $g(n)=o(f(n))$ の判定機 $M$ が $A$ を決定するとする。$D$ による $M$ の模倣は、$M$ の作業テープの記号を符号化して書くので、$M$ の 1 升に $D$ の定数 $c_{M}$ 升を使う（$c_{M}$ は $M$ のテープ記号の数による）。また $M$ の使用領域 $g(n)$ の計算の段数は、時点表示の個数 $n\cdot2^{O(g(n))}$ 以下（\ref{comp:nl-in-p} の計算）。$g=o(f)$ なので、十分大きい $n$ では $c_{M}g(n)\le f(n)$ かつ $n\cdot2^{O(g(n))}\le2^{f(n)}$（$f(n)\ge\log n$ を使う）。そこで $j$ を大きくとって $w\defeq\langle M\rangle10^{j}$ の長さ $n$ をそのように大きくすると、$D$ は $M$ の $w$ の上の計算を最後まで模倣でき、$M$ と逆の答えを出す。よって $w\in A\iff w\notin L(M)$ で、$M$ が $A$ を決定することに矛盾する。
:::

## 時間階層定理 {#comp:sec-time-hierarchy}

::: definition 時間構成可能 {#comp:time-constructible keywords="time constructible function" index="時間構成可能|じかんこうせいかのう"}
$t\colon\N\to\N$ が**時間構成可能**とは、$t(n)\ge n\log n$ で、入力 $1^{n}$ から $t(n)$ の二進表記を時間 $O(t(n))$ で計算する決定性の機械があることをいう。
:::

::: theorem 時間階層定理 {#comp:time-hierarchy keywords="time hierarchy theorem" index="時間階層定理|じかんかいそうていり"}
$t$ が時間構成可能なら、時間 $O(t(n))$ で決定できるが、時間 $o(t(n)/\log t(n))$ では決定できない言語がある。
:::

::: proof
\ref{comp:space-hierarchy} と同じ対角化を行う。判定機 $D$ は、入力 $w=\langle M\rangle10^{j}$ について、$t(n)$ を計算し、段数の計数器を $\lfloor t(n)/\log t(n)\rfloor$ に設定して $M$（単一テープ）を模倣し、計数器が尽きたら拒否、$M$ が答えを出したら逆の答えを出す。

**模倣の時間.** 模倣では、各段ごとに (a) $M$ の遷移表の照合と (b) 計数器の更新が要る。$D$ を多テープ機械で作り、$M$ の符号（長さは $n$ によらない定数）と計数器（$O(\log t(n))$ ビット）を、$M$ のヘッドの近くに置いて一緒に動かす。すると一段の模倣は $O(\log t(n))$ 段で済み（定数は $M$ による）、全体で $O(t(n)/\log t(n)\cdot\log t(n))=O(t(n))$。$t(n)$ の計算も $O(t(n))$ で、\ref{comp:multitape-time} を使わずに単一テープで実装する工夫（データをヘッドの近くに保つ）も含めて、$D$ は時間 $O(t(n))$ で動くとする。この実装の詳細は本サイトでは省略した（Sipser の第 9 章に詳しい）。

**対角化.** $M$ が時間 $g(n)=o(t(n)/\log t(n))$ で $L(D)$ を決定するとする。$M$ の一段の模倣に $D$ は $c_{M}\log t(n)$ 段程度を使うので、十分大きい $n$ では $D$ の計数器の範囲内で $M$ の計算が終わり、$D$ は $M$ と逆の答えを出す。\ref{comp:space-hierarchy} と同じく矛盾する。
:::

::: corollary 階層定理による分離 {#comp:hierarchy-separations keywords="NL ≠ PSPACE, P ≠ EXPTIME, PSPACE ≠ EXPSPACE" index="計算量クラスの分離|けいさんりょうくらすのぶんり"}
$\mathrm{NL}\subsetneq\mathrm{PSPACE}\subsetneq\mathrm{EXPSPACE}$、$\mathrm{P}\subsetneq\mathrm{EXPTIME}$。
:::

::: proof
$\mathrm{NL}\subseteq\mathrm{SPACE}(\log^{2}n)$（サヴィッチ）で、$\log^{2}n=o(n)$ なので、領域階層定理により $\mathrm{SPACE}(\log^{2}n)\subsetneq\mathrm{SPACE}(n)\subseteq\mathrm{PSPACE}$。$\mathrm{PSPACE}\subseteq\mathrm{SPACE}(2^{n})$ で、どの $n^{k}$ も $o(2^{n})$ なので、領域階層定理で $\mathrm{SPACE}(2^{n})$ に $\mathrm{PSPACE}$ に属さない言語がある。時間についても、$\mathrm{P}\subseteq\mathrm{TIME}(2^{n})$ で、時間階層定理から $\mathrm{TIME}(2^{n})\subsetneq\mathrm{TIME}(2^{2n})\subseteq\mathrm{EXPTIME}$（$2^{n}=o(2^{2n}/2n)$）。$\mathrm{P}$ のどの言語も $\mathrm{TIME}(n^{k})\subseteq\mathrm{TIME}(2^{n})$ に属するので、$\mathrm{P}\subsetneq\mathrm{EXPTIME}$。
:::

## 相対化 {#comp:sec-relativization}

::: definition 神託付きの計算量クラス {#comp:oracle-classes keywords="relativized complexity classes, P^A, NP^A" index="相対化|そうたいか"}
言語 $A$ について、$\mathrm{P}^{A}$（$\mathrm{NP}^{A}$）を、神託 $A$ をもつ決定性（非決定性）の神託機械が多項式時間で決定できる言語全体とする。
:::

::: theorem 神託 A で P と NP が一致する {#comp:bgs-equal keywords="Baker-Gill-Solovay, oracle with P^A = NP^A"}
$\mathrm{P}^{\mathrm{TQBF}}=\mathrm{NP}^{\mathrm{TQBF}}$。
:::

::: proof
$\mathrm{P}^{\mathrm{TQBF}}\subseteq\mathrm{NP}^{\mathrm{TQBF}}\subseteq\mathrm{NPSPACE}$：多項式時間の神託機械は多項式長の問い合わせしかせず、各問い合わせは TQBF $\in$ PSPACE（\ref{comp:tqbf-complete}）を直接計算して答えられる。サヴィッチの定理で $\mathrm{NPSPACE}=\mathrm{PSPACE}$。$\mathrm{PSPACE}\subseteq\mathrm{P}^{\mathrm{TQBF}}$：TQBF は PSPACE 完全なので、$B\in\mathrm{PSPACE}$ の入力を多項式時間で TQBF の問いに変換し、神託に一度尋ねればよい。
:::

::: theorem 神託 B で P と NP が異なる {#comp:bgs-separate keywords="Baker-Gill-Solovay, oracle with P^B ≠ NP^B" index="ベイカー–ギル–ソロヴェイの定理|べいかーぎるそろゔぇいのていり"}
$\{0,1\}$ 上の言語 $B$ で $\mathrm{P}^{B}\neq\mathrm{NP}^{B}$ となるものがある。
:::

::: proof
$L_{B}\defeq\{1^{n}:B\text{ は長さ }n\text{ の文字列を含む}\}$ は、どの $B$ についても $\mathrm{NP}^{B}$ に属する（長さ $n$ の文字列を非決定的に選び、神託に尋ねる）。$L_{B}\notin\mathrm{P}^{B}$ となる $B$ を段階的に作る。

多項式時間の神託機械を $M_{1},M_{2},\dots$ と並べる（各機械が無限回現れるように、または実行時間 $n^{i}$ の時計を付けて並べる）。$M_{i}$ の実行時間を $n^{i}$ とする。段階 $i$ で、まだ扱っていない十分大きい長さ $n_{i}$ を、(a) それまでの段階で尋ねられた文字列や $B$ に入れた文字列のどれよりも長く、(b) $n_{i}^{i}<2^{n_{i}}$ となるように選ぶ。$M_{i}$ を入力 $1^{n_{i}}$ の上で動かし、神託の問い合わせには、それまでに決めた $B$ の部分で答える（まだ決めていない文字列は $B$ に入れないと決める）。
- $M_{i}$ が受理したら、長さ $n_{i}$ の文字列は $B$ に入れない。すると $1^{n_{i}}\notin L_{B}$ なのに $M_{i}$ は受理する。
- $M_{i}$ が拒否したら、長さ $n_{i}$ の文字列で $M_{i}$ が尋ねなかったもの（$M_{i}$ は高々 $n_{i}^{i}<2^{n_{i}}$ 個しか尋ねないので、ある）を一つ $B$ に入れる。$M_{i}$ の計算は変わらない（尋ねた文字列への答えは変えていない）ので、$1^{n_{i}}\in L_{B}$ なのに $M_{i}$ は拒否する。

以後の段階では長さ $n_{i}$ より長い文字列しか変えないので、$M_{i}$ の $1^{n_{i}}$ の上の計算は最終的な $B$ についても同じである。よってどの $M_{i}$ も $L_{B}$ を決定しない。
:::

::: hypcheck
- **構成可能性**：階層定理の $D$ が $f(n)$, $t(n)$ を所定の資源で計算して範囲を区切るのに使った。構成可能でない関数では、階層定理が成り立たない場合がある（ボロディンのギャップ定理）ことが知られている。
- **$\log t(n)$ の損失**：時間階層定理で、模倣の一段ごとに計数器を更新する費用に由来する。領域では計数器を同じ升目で再利用できるので、損失がない。
- **神託への問い合わせの数が多項式**：\ref{comp:bgs-separate} で、尋ねられない文字列があること（$n^{i}<2^{n}$）に使った。
- **対角化は相対化する**：階層定理の証明は、神託機械に対してもそのまま通る（$D$ も同じ神託をもてばよい）。\ref{comp:bgs-equal} と \ref{comp:bgs-separate} から、相対化する議論だけでは P 対 NP 問題は解けない。
:::

## 問題 {#comp:sec-hier-problems}

::: problem {#comp:prob-nl-ne-pspace-direct}
$\mathrm{L}\neq\mathrm{PSPACE}$ を示せ。また、L と P、P と PSPACE のうち少なくとも一方は異なることを示せ。
:::

::: solution
$\mathrm{L}\subseteq\mathrm{NL}\subsetneq\mathrm{PSPACE}$（\ref{comp:hierarchy-separations}）。$\mathrm{L}\subseteq\mathrm{P}\subseteq\mathrm{PSPACE}$ で、両方が等号なら $\mathrm{L}=\mathrm{PSPACE}$ となり矛盾する。
:::

::: problem {#comp:prob-exptime-complete}
$\mathrm{E}\defeq\{\langle M,w,1^{k}\rangle:\text{決定性 TM }M\text{ は }w\text{ を }2^{k}\text{ 段以内に受理する}\}$ は EXPTIME に属し P に属さないことを示せ（EXPTIME の言語はすべて $\le_{\mathrm{P}}$ で $\mathrm{E}$ に還元できることを使ってよい）。
:::

::: solution
$\mathrm{E}\in\mathrm{EXPTIME}$：$M$ を $2^{k}$ 段模倣すればよく、入力の長さ $N\ge k$ について時間 $2^{O(N)}$ の多項式倍。$\mathrm{E}\in\mathrm{P}$ なら、EXPTIME のすべての言語が $\mathrm{E}$ に多項式時間で還元されるので P に属し、$\mathrm{P}=\mathrm{EXPTIME}$ となって \ref{comp:hierarchy-separations} に矛盾する。（還元：$A\in\mathrm{TIME}(2^{n^{c}})$ を決める $M$ について $w\mapsto\langle M,w,1^{\lvert w\rvert^{c}+d}\rangle$。）
:::

::: supplement
**前提の検討.**
- 非決定性の時間階層定理も成り立つことが知られている（クックなど）が、対角化で「逆の答えを出す」のが非決定性では難しいので、証明は工夫を要する。
- 時間階層定理の $\log t(n)$ の損失は、多テープ機械の模倣の効率（ヘニー–スターンズ）に由来し、模型を変えると改善できる場合がある。

**関連する結果.**
- *自然な証明の壁*（ラズボロフ–ルーディック）と*代数化の壁*（アーロンソン–ウィグダーソン）：回路の下界や相対化しない議論についても、P 対 NP を解くのに使えない手法の種類が知られている。
- *多項式階層* $\mathrm{PH}$：$\Sigma_{k}^{\mathrm{P}}=\mathrm{NP}^{\Sigma_{k-1}^{\mathrm{P}}}$ で定める階層で、算術的階層（\ref{comp:arithmetical-hierarchy}）の多項式時間版である。$\mathrm{PH}\subseteq\mathrm{PSPACE}$。

**高い視点から：対角線論法の射程.** 階層定理は、停止問題の決定不能性（\ref{comp:halting-L}）と同じ対角線論法を「時計付き」で行ったものである：資源の上限 $f$ を決めると、上限内の機械はすべて数え上げられ、それらと逆の答えを出す機械は、上限内では作れないが少し多くの資源では作れる。ベイカー–ギル–ソロヴェイの定理は、この論法が「神託の中身を見ない」ことを利用して、その限界を示した。比喩で言えば、対角線論法は「どんな鍵のかかった箱にも同じように働く道具」で、だからこそ、箱の中身（計算の具体的な構造）に依存する問題には使えない。P 対 NP を解くには、計算の中身を見る（相対化しない）技法が必要だと考えられている。
:::
