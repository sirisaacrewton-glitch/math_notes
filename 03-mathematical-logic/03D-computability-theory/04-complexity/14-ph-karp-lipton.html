# 多項式階層の特徴づけとカープ–リプトンの定理 {#comp:page-ph-karp-lipton keywords="polynomial hierarchy, quantifier characterization, oracle characterization Sigma_{k+1}^P = NP^{Sigma_k^P}, P/poly, self-reducibility of SAT, Karp-Lipton theorem, collapse of the polynomial hierarchy"}

多項式階層（\ref{comp:polynomial-hierarchy}）は交代機械で定義した。本ページでは、それが**長さを制限した交互の量化子**で特徴づけられること（\ref{comp:ph-quantifiers}）と、**神託**を使った定義 $\Sigma_{k+1}^{\mathrm{P}}=\mathrm{NP}^{\Sigma_{k}^{\mathrm{P}}}$ と一致すること（\ref{comp:ph-oracle}）を示す。これらは前ページまでで「認めて」使っていたものである（\ref{comp:prob-alt-collapse}）。応用として、**カープ–リプトンの定理**（\ref{comp:karp-lipton}）——NP の言語がすべて多項式の大きさの回路族をもつなら、多項式階層は第 2 層で崩壊する——を示す。

> 資料：本ページは特定の教科書の記述によらず、標準的な議論に従って組み立てた。

## 記法と定義の確認 {#comp:sec-kl-notation}

::: notation
- 交代チューリング機械、計算の木の受理のラベル付け、$\Sigma_{k}$ 交代機械、$\Sigma_{k}^{\mathrm{P}}$, $\Pi_{k}^{\mathrm{P}}$ とその基本性質は \ref{comp:alternating-tm}, \ref{comp:polynomial-hierarchy}, \ref{comp:ph-basic} のとおり。$\Sigma_{0}^{\mathrm{P}}=\Pi_{0}^{\mathrm{P}}\defeq\mathrm{P}$ とする。
- 神託付きのクラス $\mathrm{NP}^{A}$ は \ref{comp:oracle-classes}、クラス $\mathcal{C}$ について $\mathrm{NP}^{\mathcal{C}}\defeq\bigcup_{A\in\mathcal{C}}\mathrm{NP}^{A}$。
- ブール回路・回路族・大きさは \ref{comp:boolean-circuit}、P・NP（検証機による定義）・多項式時間還元・クック–レヴィンの定理は \ref{comp:class-p}, \ref{comp:class-np}, \ref{comp:poly-reduction}, \ref{comp:cook-levin} のとおり。
- 文字列の組 $\langle u,v\rangle$ は多項式時間で符号化・復号できる符号で表す。「$\lvert y\rvert\le p(\lvert x\rvert)$ の $y$ についての量化」を $\exists^{p}y$, $\forall^{p}y$ と書く。
:::

## 量化子による特徴づけ {#comp:sec-kl-quantifiers}

::: theorem 量化子による特徴づけ {#comp:ph-quantifiers keywords="A is in Sigma_k^P iff x in A <-> exists y1 forall y2 ... R(x,y1,...,yk) with R in P and polynomially bounded quantifiers" index="多項式階層の量化子による特徴づけ|たこうしきかいそうのりょうかしによるとくちょうづけ"}
$k\ge1$ とする。言語 $A$ が $\Sigma_{k}^{\mathrm{P}}$ に属することと、多項式 $p$ と P に属する $(k+1)$ 項関係 $R$ で
$$
x\in A\iff\exists^{p}y_{1}\,\forall^{p}y_{2}\,\exists^{p}y_{3}\cdots\mathsf{Q}^{p}y_{k}\ R(x,y_{1},\dots,y_{k})
$$
（量化子は交互に $k$ 個）となるものがあることは同値である。$\Pi_{k}^{\mathrm{P}}$ は $\forall$ から始まる形で同様。
:::

::: proof
**⇐.** 交代機械 $M$ を次のように作る：存在状態で $y_{1}$ の各ビット（と長さ）を一つずつ非決定的に選び、全称状態に移って $y_{2}$ を選び、……と $k$ ブロックを選んだ後、決定的に $R(x,y_{1},\dots,y_{k})$ を多項式時間で計算して受理・拒否する。切り替わりは $k-1$ 回で、時間は多項式。各ブロックの選択は、その時点までに選んだ文字列だけに依存する木の分岐なので、計算の木の受理のラベル付けは、量化子を外側から順に評価したものとちょうど一致する（$\exists$ ブロックの頂点は子のどれかが受理なら受理、$\forall$ ブロックはすべてが受理なら受理）。

**⇒.** $A$ を時間 $T(n)$（多項式）の $\Sigma_{k}$ 交代判定機 $M$ が決定するとし、各時点表示の次の時点表示は高々 $b$ 個とする。長さ $T(n)$ の $\{0,\dots,b-1\}$ の列（**選択列**）を、長さ $T(n)\lceil\log_{2}b\rceil$ の二進文字列で表す。選択列 $c_{1},\dots,c_{k}$ が与えられたとき、$M$ を入力 $x$ の上で次のように走らせる：いま第 $i$ ブロックにいる（存在・全称の切り替わりが $i-1$ 回あった）なら、$c_{i}$ のまだ使っていない次の値を、現在の時点表示の次の時点表示の個数で割った余りで選択を決める。$R(x,c_{1},\dots,c_{k})$ を「この走らせ方で受理状態に達する」とすると、$R$ は多項式時間で決定できる。

**主張.** 第 $i$ ブロックの頂点 $v$（$c_{i}$ のうちすでに $j$ 個を使った）について、$v$ が受理（ラベル付けの意味）であることと、
$$
\mathsf{Q}_{i}(c_{i}\text{ の残り})\ \mathsf{Q}_{i+1}c_{i+1}\cdots\mathsf{Q}_{k}c_{k}\ [\,v\text{ から上の規則で走らせると受理}\,]
$$
は同値である（$\mathsf{Q}_{i}$ は $i$ が奇数なら $\exists$）。$v$ から先の残り時間に関する帰納法で示す。
- $v$ が停止状態なら、走らせ方によらず結果は決まり、使われない変数の量化は意味をもたない。
- $v$ が第 $i$ ブロックの存在状態（$\mathsf{Q}_{i}=\exists$）なら、$v$ が受理 $\iff$ ある子 $u$ が受理。$u$ が同じブロックなら、帰納法の仮定から「$\exists$（$c_{i}$ の次の値で $u$ を選ぶ）$\exists$（$c_{i}$ のさらに残り）$\cdots$」で、二つの $\exists$ はまとめて「$\exists$（$c_{i}$ の残り）」になる（割った余りで選ぶので、どの子もある値で選べる）。$u$ が次のブロックなら、帰納法の仮定は $\mathsf{Q}_{i+1}c_{i+1}\cdots$ で始まり、$c_{i}$ の残りは使われないので、その量化を前に付けても同値。
- 全称状態も同様（$\exists$ を $\forall$ に替える）。

$v$ を開始時点表示（第 1 ブロック、$j=0$）とすれば、$x\in A\iff\exists c_{1}\forall c_{2}\cdots\mathsf{Q}_{k}c_{k}\,R(x,c_{1},\dots,c_{k})$。ブロックの切り替わりが $k-1$ 回以下なので $k$ 個の量化子で足りる。$\Pi_{k}^{\mathrm{P}}$ は補集合（\ref{comp:ph-basic} の 2）と否定を内側に移すことによる。
:::

::: hypcheck
- **切り替わりの回数の上限**：ブロックの番号が $k$ を超えないことに使った。
- **割った余りで選ぶこと**：選択列のどの値も合法な選択を与え、かつどの子もある値で選べること（量化の範囲が子の全体と対応すること）に使った。
- **ブロックの中の選択は前のブロックの選択だけに依存**：量化子の順序が木の分岐の順序と合うことの核心である。
:::

## 神託による特徴づけ {#comp:sec-kl-oracle}

::: theorem 神託による特徴づけ {#comp:ph-oracle keywords="Sigma_{k+1}^P = NP^{Sigma_k^P}" index="多項式階層と神託|たこうしきかいそうとしんたく"}
すべての $k\ge0$ について $\Sigma_{k+1}^{\mathrm{P}}=\mathrm{NP}^{\Sigma_{k}^{\mathrm{P}}}$。
:::

::: proof
$k=0$ は $\mathrm{NP}^{\mathrm{P}}=\mathrm{NP}=\Sigma_{1}^{\mathrm{P}}$（P の神託への質問は機械自身が多項式時間で答えられる）。$k\ge1$ とする。

**⊆.** $A\in\Sigma_{k+1}^{\mathrm{P}}$ を \ref{comp:ph-quantifiers} で $x\in A\iff\exists^{p}y_{1}\,B(x,y_{1})$ と書く。$B(x,y_{1})\defeq\forall^{p}y_{2}\cdots R$ は（$\langle x,y_{1}\rangle$ の言語として）\ref{comp:ph-quantifiers} から $\Pi_{k}^{\mathrm{P}}$ で、補集合 $\overline{B}$ は $\Sigma_{k}^{\mathrm{P}}$。非決定性の神託機械は、$y_{1}$ を推測し、神託 $\overline{B}$ に $\langle x,y_{1}\rangle$ を質問して、答えが「いいえ」なら受理する。

**⊇.** $A=L(N^{O})$（$N$ は時間 $q(n)$ の非決定性神託機械、$O\in\Sigma_{k}^{\mathrm{P}}$）とする。$N$ の計算の枝は、非決定的な選択の列と、神託の答えの列で決まる。$x\in A$ であることは次と同値である：
$$
\exists^{q}(\text{選択の列}\ g,\ \text{答えの列}\ a)\ \Bigl[\,V(x,g,a)\wedge\bigwedge_{a_{j}=\text{はい}}z_{j}\in O\wedge\bigwedge_{a_{j}=\text{いいえ}}z_{j}\notin O\,\Bigr]
$$
ここで $V$ は「$g$ と $a$ に従って $N$ を走らせると受理する」（多項式時間）、$z_{j}$ はその走らせ方での第 $j$ の質問。$z\in O$ は $\Sigma_{k}$ の形、$z\notin O$ は $\Pi_{k}$ の形で、どちらも先頭に意味のない量化子を補えば $\Sigma_{k+1}$ の形 $\exists u_{1}\forall u_{2}\cdots$ になる。高々 $q(n)$ 個の連言は、各ブロックの変数を組にまとめて一つの $\Sigma_{k+1}$ の形にでき（変数は互いに別なので量化子を外に並べられる）、先頭の $\exists$ は外側の $\exists(g,a)$ とまとめられる。長さはすべて多項式で抑えられ、内側の関係は多項式時間。\ref{comp:ph-quantifiers} から $A\in\Sigma_{k+1}^{\mathrm{P}}$。
:::

## カープ–リプトンの定理 {#comp:sec-kl-karp-lipton}

::: definition P/poly {#comp:p-poly keywords="P/poly: languages with polynomial-size circuit families" index="P/poly|ぴーすらっしゅぽり"}
言語 $A$ が **$\mathrm{P}/\mathrm{poly}$** に属するとは、多項式 $s$ があって $\mathrm{SIZE}_{A}(n)\le s(n)$（\ref{comp:boolean-circuit} の 3）となることをいう。
:::

::: lemma 延長の言語 {#comp:sat-extension-language keywords="the language of formulas with a partial assignment that extends to a satisfying one is in NP; finding satisfying assignments with a decision procedure" index="延長の言語|えんちょうのげんご"}
$\mathrm{EXT}\defeq\{\langle\varphi,\pi\rangle:\varphi\text{ は } v\text{ 変数の命題論理式、}\pi\in\{0,1,\ast\}^{v}\text{ は部分割り当てで、充足する割り当てに延長できる}\}$ は NP に属する。さらに、$\langle\varphi,\pi\rangle$ の長さは $\pi$ によらず $\varphi$ だけで決まるように符号化でき、$\mathrm{EXT}$ を長さ $m$ の入力で正しく決定する回路 $D$ が与えられれば、$v$ 回 $D$ を呼ぶ多項式時間の手続きで、充足可能な $\varphi$ の充足する割り当てが得られる。
:::

::: proof
NP：証明書は延長した割り当てそのもの。手続き：$\pi\defeq\ast^{v}$ から始め、$i=1,\dots,v$ について、$\pi$ の第 $i$ 成分を $0$ にしたものを $D$ が受理すればそれを、そうでなければ第 $i$ 成分を $1$ にしたものを新しい $\pi$ とする。$\langle\varphi,\pi\rangle\in\mathrm{EXT}$ が各段階で保たれる（$0$ で延長できなければ $1$ で延長できる）ので、最後の $\pi$ は充足する割り当て。
:::

::: theorem カープ–リプトンの定理 {#comp:karp-lipton keywords="if NP is contained in P/poly then Sigma_2^P = Pi_2^P and PH collapses to its second level" index="カープ–リプトンの定理|かーぷりぷとんのていり"}
$\mathrm{NP}\subseteq\mathrm{P}/\mathrm{poly}$ なら $\Pi_{2}^{\mathrm{P}}=\Sigma_{2}^{\mathrm{P}}$ で、したがって $\mathrm{PH}=\Sigma_{2}^{\mathrm{P}}$。
:::

::: proof
$\Pi_{2}^{\mathrm{P}}\subseteq\Sigma_{2}^{\mathrm{P}}$ を示せば、補集合をとって等号が成り立ち（\ref{comp:ph-basic} の 2）、\ref{comp:prob-alt-collapse} から $\mathrm{PH}=\Sigma_{2}^{\mathrm{P}}$。

$A\in\Pi_{2}^{\mathrm{P}}$ を $x\in A\iff\forall^{p}y\,\exists^{p}z\,R(x,y,z)$ と書く（\ref{comp:ph-quantifiers}）。$\{\langle x,y\rangle:\exists^{p}z\,R\}\in\mathrm{NP}$ なので、クック–レヴィンの定理（\ref{comp:cook-levin}）から多項式時間の $f$ で $\exists^{p}z\,R(x,y,z)\iff f(x,y)$ が充足可能、となるものがある。$\lvert x\rvert=n$ について、$\lvert y\rvert\le p(n)$ の範囲で $\langle f(x,y),\pi\rangle$ の長さは多項式 $M(n)$ 以下。仮定から $\mathrm{EXT}\in\mathrm{P}/\mathrm{poly}$ で、長さ $m$ の入力を正しく決定する大きさ $s(m)$ 以下の回路がある。
$$
x\in A\iff\exists(D_{1},\dots,D_{M(n)})\ \forall^{p}y\ \mathrm{OK}(x,y,D_{1},\dots,D_{M(n)})
$$
を示す。ここで $D_{m}$ は大きさ $s(m)$ 以下の回路の記述、$\mathrm{OK}$ は「\ref{comp:sat-extension-language} の手続きが、入力の長さ $m$ に応じて $D_{m}$ を使って $f(x,y)$ に出す割り当てが、$f(x,y)$ を充足する」という関係である。$\mathrm{OK}$ は多項式時間で判定でき（回路の評価と割り当ての検査）、量化される文字列の長さは多項式なので、右辺は $\Sigma_{2}$ の形で、$A\in\Sigma_{2}^{\mathrm{P}}$。
- $x\in A$ なら、$D_{m}$ として $\mathrm{EXT}$ を長さ $m$ で正しく決定する回路をとる。すべての $y$ で $f(x,y)$ は充足可能なので、\ref{comp:sat-extension-language} の手続きは充足する割り当てを出し、右辺が成り立つ。
- $x\notin A$ なら、$f(x,y)$ が充足不能な $y$ がある。どんな $D$ を使っても、出された割り当ては $f(x,y)$ を充足しない（そもそも充足する割り当てがない）ので、右辺は成り立たない。
:::

::: hypcheck
- **検査が回路の正しさに依存しないこと**：$x\notin A$ の場合、どんな（誤った）回路を推測しても、充足しない割り当ては検査で必ず見破られる。これが「回路を存在量化子で推測する」ことを可能にしている。
- **自己帰着性（\ref{comp:sat-extension-language}）**：判定の回路から割り当てを作るのに使った。判定の答えだけでは、$\forall y$ の中で正しさを多項式時間で検査できない。
- **大きさが多項式であること**：推測する回路の記述の長さを多項式に抑えるのに使った。
:::

## 問題 {#comp:sec-kl-problems}

::: problem {#comp:prob-kl-p-ppoly}
$\mathrm{P}\subseteq\mathrm{P}/\mathrm{poly}$ を示せ。また、$\mathrm{NP}\subseteq\mathrm{P}/\mathrm{poly}$ が成り立てば、$\mathrm{coNP}\subseteq\mathrm{P}/\mathrm{poly}$ も成り立つことを示せ。
:::

::: solution
前半は \ref{comp:time-to-size}（多項式時間の機械から多項式の大きさの回路族が得られる）。後半：$A\in\mathrm{coNP}$ なら $\overline{A}\in\mathrm{NP}\subseteq\mathrm{P}/\mathrm{poly}$ で、$\overline{A}$ を決定する回路の出力に NOT ゲートを一つ加えれば $A$ を決定する。
:::

::: problem {#comp:prob-kl-np-conp}
$\mathrm{NP}^{\mathrm{NP}}=\Sigma_{2}^{\mathrm{P}}$ と、$\mathrm{NP}=\mathrm{coNP}$ なら $\mathrm{NP}^{\mathrm{NP}}=\mathrm{NP}$ となることを示せ。
:::

::: solution
前半は \ref{comp:ph-oracle} の $k=1$。後半：$\mathrm{NP}=\mathrm{coNP}$ は $\Sigma_{1}^{\mathrm{P}}=\Pi_{1}^{\mathrm{P}}$ で、\ref{comp:prob-alt-collapse} から $\Sigma_{2}^{\mathrm{P}}=\Sigma_{1}^{\mathrm{P}}=\mathrm{NP}$。
:::

::: supplement
**前提を変えると.** カープ–リプトンの定理の結論は、$\Sigma_{2}^{\mathrm{P}}$ より小さいクラスへの崩壊（$\mathrm{PH}=\mathrm{ZPP}^{\mathrm{NP}}$ など）に改良できることが知られている（ここでは扱わない）。同じ方法で、$\mathrm{PSPACE}\subseteq\mathrm{P}/\mathrm{poly}$ なら $\mathrm{PSPACE}=\Sigma_{2}^{\mathrm{P}}$、$\mathrm{EXP}\subseteq\mathrm{P}/\mathrm{poly}$ なら $\mathrm{EXP}=\Sigma_{2}^{\mathrm{P}}$ となることが知られている（メイヤー）。

**似た定理.** 量化子による特徴づけと神託による特徴づけは、計算可能性理論の算術的階層とポストの定理（\ref{comp:post-theorem}）の「多項式時間版」である：$\Sigma_{n+1}^{0}$ が $\varnothing^{(n)}$ で認識可能な集合であるのに対し、$\Sigma_{k+1}^{\mathrm{P}}$ は $\Sigma_{k}^{\mathrm{P}}$ の神託をもつ非決定性多項式時間で認識される言語である。ただし計算可能性理論と違い、多項式階層が真の階層かどうか（$\mathrm{P}\ne\mathrm{NP}$ を含む）は未解決である。

**高い視点から：推測して検査する.** カープ–リプトンの証明の要点は、「正しい回路があるなら、それを推測すればよい。誤った回路を推測しても、出てきた答えは検査で見破れる」という点にある。比喩で言えば、難しい問題の解き方を書いた「虎の巻」が短いなら、試験官は「どんな問題を出しても虎の巻で解けて、しかも答えの検算が通る」ような虎の巻の存在を問えばよく、偽の虎の巻は検算で必ず落ちる。そのため、短い虎の巻が存在するという仮定（$\mathrm{NP}\subseteq\mathrm{P}/\mathrm{poly}$）は、量化子の交代を一段節約させ、階層を崩壊させる。
:::
