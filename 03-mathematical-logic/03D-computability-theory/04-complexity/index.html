# 計算複雑性（Computational Complexity）

時間計算量とクラス P・NP、クック–レヴィンの定理と NP 完全問題、領域計算量（サヴィッチの定理、PSPACE、L と NL、NL = coNL）、階層定理と相対化、確率的計算（素数判定・分岐プログラムを含む）と量子計算、ブール回路・交代と多項式階層・対話証明（IP = PSPACE）・並列計算（NC と P 完全性）、近似アルゴリズムと暗号（一方向関数・落とし戸関数）、多項式階層の特徴づけとカープ–リプトンの定理、ラドナーの定理、BPP と多項式階層（アドルマン、シプサー–ガーチ–ラウテマン）。（Sipser 第 7〜10 章を参考にする。量子計算は資料なし）

<p class="mn-msc">MSC2020: 68Q15, 68Q17, 68Q12, 68W25, 94A60</p>
