# チャイティンの不完全性定理 {#comp:page-chaitin-incompleteness keywords="Chaitin's incompleteness theorem, a sound c.e. theory proves only finitely many lower bounds on Kolmogorov complexity, Berry paradox, bits of Omega, only finitely many bits of Omega are provable"}

ほとんどすべての文字列は圧縮できない（\ref{comp:incompressible-exist}）。しかし、「この文字列は複雑さ $L$ より大きい」という主張は、どんな健全で計算可能に枚挙できる公理系でも、$L$ が十分大きいと一つも証明できない（**チャイティンの不完全性定理**、\ref{comp:chaitin-k}）。同じく、停止確率 $\Omega$ の二進展開の桁のうち、そのような公理系で決定できるのは有限個だけである（\ref{comp:chaitin-omega-bits}）。前者はベリーの逆理（「$L$ 文字以内では記述できない最初の文字列」）を計算に置き換えたもので、後者は $\Omega$ のランダム性（\ref{comp:omega-random}）から従う。

> 資料：本ページは特定の教科書の記述によらず、標準的な議論に従って組み立てた。公理系は、証明できる主張の集合が計算可能に枚挙できるものとして抽象的に扱う。

## 記法と定義の確認 {#comp:sec-ch-notation}

::: notation
- 記述の複雑さ $K(x)$、その計算不能性の証明（機械 $B$ による）、非圧縮な文字列の存在は \ref{comp:kolmogorov-complexity}, \ref{comp:k-uncomputable}, \ref{comp:incompressible-exist} のとおり。$\mathrm{bin}(n)$ は $n$ の二進表記。
- 停止確率 $\Omega=0.\omega_{1}\omega_{2}\cdots$ とそのランダム性、マルチン＝レーフ検定は \ref{comp:chaitin-omega}, \ref{comp:omega-random}, \ref{comp:ml-test} のとおり。
- **複雑さについての公理系**とは、組 $(x,n)$（文字列と自然数）の認識可能な集合 $T$ のことで、$(x,n)\in T$ を「$T$ は $K(x)>n$ を証明する」と読む。$T$ が**健全**とは、$(x,n)\in T$ なら実際に $K(x)>n$ であることをいう。$\Omega$ の桁についての公理系も同様に、組 $(i,b)$ の認識可能な集合で、健全とは $(i,b)$ が属するなら $\omega_{i}=b$ であることとする。
:::

::: remark
算術の言語で「$K(x)>n$」や「$\omega_{i}=b$」を表す文を書くことができ、標準モデルで正しい（健全な）認識可能な理論 $T$ について、$T$ が証明するそれらの文の全体は（証明を枚挙して）認識可能な集合になる。この意味で、以下の結果は算術の理論についての不完全性定理を与える（文の構成はここでは確かめていない）。
:::

## 複雑さの下界は少ししか証明できない {#comp:sec-ch-k}

::: theorem チャイティンの不完全性定理 {#comp:chaitin-k keywords="a sound c.e. theory cannot prove K(x) > L for any x once L is large" index="チャイティンの不完全性定理|ちゃいてぃんのふかんぜんせいていり"}
健全な複雑さの公理系 $T$ について、定数 $L$ があって、$n\ge L$ となる $(x,n)\in T$ は存在しない。一方、$K(x)>L$ を満たす $x$ は無限個ある。
:::

::: proof
次の機械 $B$ を考える：入力 $\mathrm{bin}(n)$ について、$T$ を枚挙し、$m\ge n$ となる最初の組 $(x,m)$ を見つけたら $x$ を出力して止まる。$T$ がすべての $n$ についてそのような組を含むとすると、$B$ はすべての入力で止まり、$y_{n}\defeq B(\mathrm{bin}(n))$ について、**健全性**から $K(y_{n})>m\ge n$。一方、$\langle B,\mathrm{bin}(n)\rangle$ は $y_{n}$ の記述なので、\ref{comp:k-uncomputable} の証明と同じく
$$
K(y_{n})\le\log_{2}n+1+c_{B}
$$
（$c_{B}$ は $B$ の符号の長さによる定数）。十分大きい $n$ で $\log_{2}n+1+c_{B}<n$ なので矛盾。よって、ある $L$ について $m\ge L$ となる組は $T$ に属さない（$m\ge n$ となる組がない $n$ を $L$ とすればよい）。

後半：各長さ $\ell$ に $K(x)\ge\ell$ となる $x$ がある（\ref{comp:incompressible-exist}）ので、$\ell>L$ の長さごとに一つずつとれば無限個。
:::

::: hypcheck
- **健全性**：$K(y_{n})>n$ を導くのに使った。健全でない（誤った主張を含む）公理系では結論は成り立たない（すべての $(x,n)$ を含む $T$ は認識可能だが健全でない）。
- **$T$ の認識可能性**：機械 $B$ を作るのに使った。
- 定数 $L$ は $B$ の符号の長さ、すなわち $T$ を枚挙する機械の記述の長さで抑えられる（$\log_{2}n+1+c_{B}<n$ となる最小の $n$）。
:::

## Ω の桁 {#comp:sec-ch-omega}

::: theorem Ω の桁は有限個しか決定できない {#comp:chaitin-omega-bits keywords="a sound c.e. theory determines only finitely many bits of Omega" index="Ω の桁の決定|おめがのけたのけってい"}
健全な $\Omega$ の桁の公理系 $T$ が含む組 $(i,b)$ の位置 $i$ は有限個である。
:::

::: proof
位置が無限個あるとする。$T$ を枚挙し、新しい位置が現れるたびに記録して、相異なる位置の組の列 $(i_{1},b_{1}),(i_{2},b_{2}),\ldots$ を計算可能に得る。$N_{n}\defeq\max(i_{1},\dots,i_{n})$ として
$$
V_{n}\defeq\{\sigma\in\{0,1\}^{N_{n}}:\text{すべての }j\le n\text{ で }\sigma\text{ の第 }i_{j}\text{ 桁}=b_{j}\}
$$
とすると、$(V_{n})$ は一様に認識可能（実際は一様に計算可能な有限集合）で、$\lambda([V_{n}])=2^{-n}$（$n$ 個の桁を指定する）。**健全性**から $\Omega$ の二進展開はすべての $[V_{n}]$ に属する。よって $\Omega$ はマルチン＝レーフ検定 $(V_{n})$ に落ち、\ref{comp:omega-random} に反する。
:::

## 問題 {#comp:sec-ch-problems}

::: problem {#comp:prob-ch-uncomputable}
\ref{comp:chaitin-k} から、$K$ が計算可能でないこと（\ref{comp:k-uncomputable}）を導け。
:::

::: solution
$K$ が計算可能なら、$T\defeq\{(x,n):K(x)>n\}$ は決定可能（とくに認識可能）で健全。\ref{comp:chaitin-k} から、ある $L$ について $n\ge L$ の組を含まないが、$K(x)>L$ となる $x$ がある（後半）ので $(x,L)\in T$ となり矛盾。
:::

::: problem {#comp:prob-ch-finite-omega}
有限個の桁なら $\Omega$ の桁を決定する健全な公理系がある（自明に）ことを確かめ、\ref{comp:chaitin-omega-bits} が「有限個」より強く言えないことを説明せよ。
:::

::: solution
最初の $k$ 桁 $\omega_{1},\dots,\omega_{k}$ について、有限集合 $T\defeq\{(i,\omega_{i}):i\le k\}$ は決定可能で健全（それが「計算できる」ことは、有限集合なので値を書き込めばよい、という非一様な意味である）。よってどんな有限個の桁も、ある健全な公理系で決定できる。\ref{comp:chaitin-omega-bits} は、一つの公理系で決定できる桁が有限個であることを述べ、その個数の上限は公理系に依存する。
:::

::: supplement
**前提を変えると.** 健全性を「無矛盾性」に弱めると、\ref{comp:chaitin-k} は一般には成り立たない形になる（誤った下界を証明する無矛盾な理論がありうる）が、算術の $\Sigma_{1}$ 健全な理論については同様の結論が得られることが知られている。また、$L$ は理論の「情報量」（理論を枚挙する機械の記述の長さ）に比例して取れる、という形で、「公理系は自分の複雑さを大きく超える複雑さを証明できない」と解釈されることが多い（この解釈には異論もあるとされる）。

**似た定理.** ゲーデルの第一不完全性定理（\ref{pt:page-diagonal-first-incompleteness}）が対角化（嘘つきのパラドックス）によるのに対し、チャイティンの定理はベリーのパラドックスによる。$\Omega$ の桁についての結果は、$\Omega$ が「どんな健全な理論にとっても、ほとんどすべての桁がランダムな事実である」ことを示す。

**高い視点から：短い説明では長い主張を裏付けられない.** 「この文字列は $L$ ビットより短くは記述できない」と証明できれば、その証明を探す手続きそのものが、その文字列の短い記述になってしまう。公理系の記述の長さが $L$ よりずっと短ければ、これは矛盾である。比喩で言えば、「この荷物は 10 kg より重い」と保証する検査所の保証書が、検査所そのものより軽い封筒で届くことはありえない、という種類の制約である。
:::
