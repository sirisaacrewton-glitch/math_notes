# 型なしラムダ計算（Untyped Lambda Calculus）

型なしラムダ計算（項・α 同値・β 簡約）、チャーチ–ロッサーの定理、不動点定理とラムダ定義可能性（計算可能関数との一致）、組合せ論理。型付きの体系は証明論の「型理論」の系列で扱う。

<p class="mn-msc">MSC2020: 03B40</p>
