# 計算理論（Theory of Computation）

オートマトンと形式言語、計算可能性理論（プログラミング言語 L、原始再帰関数と一般再帰関数、レジスタ機械とチューリング機械、決定可能性と還元、万能プログラム・smn 定理・再帰定理）、その発展（論理的理論の決定可能性、チューリング還元と算術的階層）、計算複雑性、コルモゴロフ複雑性とアルゴリズム的ランダムネス、型なしラムダ計算。

<p class="mn-msc">MSC2020: 03D</p>

## 分野

<div class="mn-cards">
<a class="mn-card" href="01-automata/index.html"><span class="mn-card-title">オートマトンと形式言語</span><span class="mn-card-en">Automata and Formal Languages</span><span class="mn-card-desc">決定性・非決定性有限オートマトン、正規表現とクリーネの定理（アーデンの補題と言語方程式による）、反復補題と非正規言語、文脈自由文法とプッシュダウンオートマトン、文脈自由言語の反復補題、言語方程式と不動点定理、決定性文脈自由言語。（Sipser 第 1・2 章を参考にする。本文は自分の言葉で組み立てる）</span><span class="mn-card-count">7 ページ</span></a>
<a class="mn-card" href="02-computability/index.html"><span class="mn-card-title">計算可能性理論</span><span class="mn-card-en">Computability Theory</span><span class="mn-card-desc">逐次実行・for・while と簡単な基本命令だけをもつプログラミング言語 L で計算可能性を定義し、原始再帰関数（＝for プログラム）、アッカーマン関数、一般再帰関数、レジスタ機械を扱う。次にチューリング機械を導入して L との同値性とチューリング完全性を示し、決定可能性・停止問題・還元・ライスの定理・ポストの対応問題（Sipser 第 3〜5 章を参考）を扱った後、万能プログラム・クリーネの標準形・smn 定理と再帰定理で締めくくる。</span><span class="mn-card-count">12 ページ</span></a>
<a class="mn-card" href="03-advanced-computability/index.html"><span class="mn-card-title">計算可能性の発展</span><span class="mn-card-en">Advanced Topics in Computability</span><span class="mn-card-desc">計算可能性理論の応用と発展：論理的理論の決定可能性（プレスブルガー算術の決定可能性、算術の決定不能性）、チューリング還元と神託機械、跳躍、算術的階層とポストの定理、フリードバーグ–ムチニクの定理（優先論法）、単純集合と低集合、解析的階層と Π¹₁ 標準形、計算可能順序数とスペクターの有界性定理。（Sipser 第 6 章を参考。算術的階層以降は Sipser にないので、新井『数学基礎論』第 6 章で補う）</span><span class="mn-card-count">9 ページ</span></a>
<a class="mn-card" href="04-complexity/index.html"><span class="mn-card-title">計算複雑性</span><span class="mn-card-en">Computational Complexity</span><span class="mn-card-desc">時間計算量とクラス P・NP、クック–レヴィンの定理と NP 完全問題、領域計算量（サヴィッチの定理、PSPACE、L と NL、NL = coNL）、階層定理と相対化、確率的計算（素数判定・分岐プログラムを含む）と量子計算、ブール回路・交代と多項式階層・対話証明（IP = PSPACE）・並列計算（NC と P 完全性）、近似アルゴリズムと暗号（一方向関数・落とし戸関数）。（Sipser 第 7〜10 章を参考にする。量子計算は資料なし）</span><span class="mn-card-count">13 ページ</span></a>
<a class="mn-card" href="05-algorithmic-randomness/index.html"><span class="mn-card-title">アルゴリズム的ランダムネス</span><span class="mn-card-en">Algorithmic Randomness</span><span class="mn-card-desc">記述の長さ（コルモゴロフ複雑性）と非圧縮性、接頭辞なしコルモゴロフ複雑性、クラフトの不等式、マルチン＝レーフのランダムネス、レヴィン–シュノアの定理、チャイティンの Ω。</span><span class="mn-card-count">3 ページ</span></a>
<a class="mn-card" href="06-lambda-calculus/index.html"><span class="mn-card-title">型なしラムダ計算</span><span class="mn-card-en">Untyped Lambda Calculus</span><span class="mn-card-desc">型なしラムダ計算（項・α 同値・β 簡約）、チャーチ–ロッサーの定理、不動点定理とラムダ定義可能性（計算可能関数との一致）、組合せ論理。型付きの体系は証明論の「型理論」の系列で扱う。</span><span class="mn-card-count">2 ページ</span></a>
