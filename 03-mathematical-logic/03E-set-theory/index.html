# 集合論（Set Theory）

公理的集合論。基礎事項から無限組合せ論・構成可能集合・強制法まで。章立ては Kunen『Set Theory』(1980) を参考にしている。

<p class="mn-msc">MSC2020: 03E</p>

## 分野

<div class="mn-cards">
<a class="mn-card" href="01-basics/index.html"><span class="mn-card-title">基礎事項</span><span class="mn-card-en">Foundations</span><span class="mn-card-desc">ZFC の公理、順序数と超限再帰、基数と基数演算、選択公理、共終数、ケーニッヒの定理。（Kunen 第 I 章に対応）</span><span class="mn-card-count">13 ページ</span></a>
<a class="mn-card" href="02-infinitary-combinatorics/index.html"><span class="mn-card-title">無限組合せ論</span><span class="mn-card-en">Infinitary Combinatorics</span><span class="mn-card-desc">概素族、マーティンの公理とその同値物、ススリン問題、木、閉非有界フィルター、◇ と ◇⁺、分割関係とエルデシュ–ラドーの定理。（主に Kunen 第 II 章に対応）</span><span class="mn-card-count">14 ページ</span></a>
<a class="mn-card" href="03-well-founded-sets/index.html"><span class="mn-card-title">整礎集合</span><span class="mn-card-en">The Well-Founded Sets</span><span class="mn-card-desc">累積階層とランク、整礎関係、基礎の公理、整礎関係上の帰納法と再帰。（Kunen 第 III 章に対応）</span><span class="mn-card-count">6 ページ</span></a>
<a class="mn-card" href="04-consistency-proofs/index.html"><span class="mn-card-title">相対無矛盾性の初歩</span><span class="mn-card-en">Easy Consistency Proofs</span><span class="mn-card-desc">相対化と絶対性、H(κ)、反映定理。（Kunen 第 IV 章に対応）</span><span class="mn-card-count">6 ページ</span></a>
<a class="mn-card" href="05-definability/index.html"><span class="mn-card-title">定義可能性</span><span class="mn-card-en">Defining Definability</span><span class="mn-card-desc">定義可能性の形式化、順序数定義可能集合 OD と HOD。（Kunen 第 V 章に対応）</span><span class="mn-card-count">2 ページ</span></a>
<a class="mn-card" href="06-constructible-sets/index.html"><span class="mn-card-title">構成可能集合</span><span class="mn-card-en">The Constructible Sets</span><span class="mn-card-desc">L の基本性質、L における ZF、構成可能性公理、L での AC と GCH、L における ◇。（Kunen 第 VI 章に対応）</span><span class="mn-card-count">4 ページ</span></a>
<a class="mn-card" href="07-forcing/index.html"><span class="mn-card-title">強制法</span><span class="mn-card-en">Forcing</span><span class="mn-card-desc">ジェネリック拡大、強制関係、M[G] における ZFC、有限部分関数・大きい部分関数による強制、ブール値モデル。（Kunen 第 VII 章に対応）</span><span class="mn-card-count">8 ページ</span></a>
<a class="mn-card" href="08-iterated-forcing/index.html"><span class="mn-card-title">反復強制法</span><span class="mn-card-en">Iterated Forcing</span><span class="mn-card-desc">積強制、コーエンモデル、クレパ仮説の独立性、イーストン強制、反復強制と MA + ¬CH の無矛盾性。（Kunen 第 VIII 章に対応）</span><span class="mn-card-count">7 ページ</span></a>
