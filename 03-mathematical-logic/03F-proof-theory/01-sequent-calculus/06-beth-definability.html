# ベートの定義可能性定理 {#pt:page-beth-definability keywords="Beth definability theorem, implicit definition, explicit definition, Padoa's method"}

理論 $T$ のすべてのモデルで、関係記号 $P$ の解釈が他の記号の解釈から一通りに決まるとき、$P$ は $T$ で**暗に定義される**という。ベートの定義可能性定理は、このとき $P$ が他の記号の論理式で**明示的に定義される**ことを主張する（\ref{pt:beth-definability}）。証明は、$P$ の写し $P'$ を用意して「$P$ と $P'$ は一致する」という帰結を作り、そこにクレイグの補間定理（\ref{logic:craig-interpolation}）を使って、共通の言語の論理式 $\theta$ を取り出すことによる。前のページの前原の方法と組み合わせると、$\theta$ を導出から計算することもできる（補足）。

## 記法と定義の確認 {#pt:sec-beth-notation}

::: notation
- 言語・構造・充足・縮小 $\mathcal{M}\restr{\mathcal{L}}$ は \ref{logic:page-semantics} のとおり。縮小の補題（\ref{logic:reduct-lemma}）、定数の代入の意味（\ref{logic:constant-substitution-semantics}）、定数の置き換え $\varphi[y/c]$（\ref{logic:constant-replacement}, \ref{logic:constant-replacement-properties}）を使う。
- 文の集合 $T$ と文 $\sigma$ について、$T\models\sigma$ は「$T$ のすべてのモデルで $\sigma$ が真」の意味である（\ref{logic:model}）。
- クレイグの補間定理（\ref{logic:craig-interpolation}）とコンパクト性定理（\ref{logic:compactness}）を使う。
- 本ページを通して、$\mathcal{L}$ は言語（等号・定数記号・関数記号を含んでよい）、$P$ は $\mathcal{L}$ に属さない $n$ 項関係記号（$n\ge1$）、$x_{1},\dots,x_{n}$ は相異なる変数で、$\vec{x}=(x_{1},\dots,x_{n})$ と書く。
:::

## 暗の定義と明示的な定義 {#pt:sec-beth-definitions}

::: definition 暗に定義される・明示的に定義される {#pt:implicit-explicit-definition keywords="implicit definability, explicit definability" index="暗に定義される|あんにていぎされる, 明示的に定義される|めいじてきにていぎされる, 暗の定義|あんのていぎ"}
$T$ を $\mathcal{L}\cup\{P\}$ の文の集合とする。
1. $P$ が $T$ で**暗に定義される**とは、$T$ の任意の二つのモデル $\mathcal{M},\mathcal{M}'$ について、$\mathcal{M}\restr{\mathcal{L}}=\mathcal{M}'\restr{\mathcal{L}}$ ならば $P^{\mathcal{M}}=P^{\mathcal{M}'}$ であることをいう。
2. $P$ が $T$ で**明示的に定義される**とは、$\mathcal{L}$ の論理式 $\theta$ で $\mathrm{FV}(\theta)\subseteq\{x_{1},\dots,x_{n}\}$ かつ
$$
T\models\forall\vec{x}\,\bigl(P(\vec{x})\leftrightarrow\theta\bigr)
$$
を満たすものが存在することをいう。
:::

::: proposition 明示的なら暗に定義される {#pt:explicit-implies-implicit}
$P$ が $T$ で明示的に定義されるなら、暗に定義される。
:::

::: proof
$\theta$ を明示的な定義とし、$\mathcal{M},\mathcal{M}'\models T$, $\mathcal{M}\restr{\mathcal{L}}=\mathcal{M}'\restr{\mathcal{L}}$ とする。二つは同じ領域 $M$ をもつ。$\vec{a}\in M^{n}$ を任意にとり、割り当て $v$ を $v(x_{i})=a_{i}$ となるようにとる。$\theta$ は $\mathcal{L}$ の論理式なので、縮小の補題（\ref{logic:reduct-lemma}）より
$$
\mathcal{M},v\models\theta\iff\mathcal{M}\restr{\mathcal{L}},v\models\theta\iff\mathcal{M}',v\models\theta .
$$
両端はそれぞれ $\vec{a}\in P^{\mathcal{M}}$, $\vec{a}\in P^{\mathcal{M}'}$ と同値である（明示的な定義が $\mathcal{M},\mathcal{M}'$ で真）。よって $P^{\mathcal{M}}=P^{\mathcal{M}'}$。
:::

::: example 暗の定義の例 {#pt:beth-example}
$\mathcal{L}=\{Q,R\}$（1 項関係記号）、$P$ を 1 項関係記号とし、$T$ を次の三つの文とする。
$$
\begin{aligned}
&\forall x\,(P(x)\to Q(x)),\qquad\forall x\,\neg(P(x)\wedge R(x)),\\
&\forall x\,\bigl(Q(x)\to P(x)\vee R(x)\bigr).
\end{aligned}
$$
$T$ のモデルでは、第 1・第 2 の文より $P\subseteq Q\setminus R$、第 3 の文より $Q\setminus R\subseteq P$ なので $P=Q\setminus R$ である。したがって $P$ は $T$ で暗に定義され、実際 $\theta=Q(x)\wedge\neg R(x)$ が明示的な定義である。この例では $\theta$ がすぐに見つかるが、ベートの定理は、暗の定義からつねに $\theta$ が存在することを保証する。
:::

## 記号の付け替え {#pt:sec-beth-renaming}

$P$ と同じ項数の新しい関係記号 $P'$（$\mathcal{L}\cup\{P\}$ に属さない）をとる。論理式 $\sigma$ の中の $P$ の出現をすべて $P'$ に書き換えたものを $\sigma'$ とし（構造的再帰：原子論理式 $P(\vec{t})$ を $P'(\vec{t})$ にし、他の原子論理式はそのまま、$\to$ と $\forall$ は成分ごと）、$T'\defeq\{\sigma':\sigma\in T\}$ とする。

::: lemma 記号の付け替え {#pt:symbol-renaming}
$\mathcal{K}$ を $P,P'$ を含む言語、$\mathcal{N}$ を $\mathcal{K}$ 構造とし、$\mathcal{N}^{\flat}$ を、$P$ の解釈だけを $P^{\mathcal{N}^{\flat}}\defeq P'^{\mathcal{N}}$ に取り替えた $\mathcal{K}$ 構造とする。$P'$ を含まない $\mathcal{K}$ の論理式 $\sigma$ と割り当て $v$ について
$$
\mathcal{N},v\models\sigma'\iff\mathcal{N}^{\flat},v\models\sigma .
$$
:::

::: proof
項は関係記号を含まないので、項の値は $\mathcal{N}$ と $\mathcal{N}^{\flat}$ で等しい。$\sigma$ に関する帰納法で示す。
- $\sigma=P(\vec{t})$：$\mathcal{N},v\models P'(\vec{t})\iff\vec{t}^{\,\mathcal{N},v}\in P'^{\mathcal{N}}=P^{\mathcal{N}^{\flat}}\iff\mathcal{N}^{\flat},v\models P(\vec{t})$。
- $\sigma$ がその他の原子論理式（$\bot$, 等式, $P,P'$ 以外の関係記号）：$\sigma'=\sigma$ で、$\sigma$ に現れる記号の解釈は $\mathcal{N}$ と $\mathcal{N}^{\flat}$ で一致する。
- $\to$ と $\forall$：充足の定義（\ref{logic:satisfaction}）と帰納法の仮定（$\forall$ では割り当てを取り替えたものに対して）。
:::

## ベートの定理 {#pt:sec-beth-theorem}

::: theorem ベートの定義可能性定理 {#pt:beth-definability keywords="Beth definability theorem" index="ベートの定義可能性定理|べーとのていぎかのうせいていり"}
$T$ を $\mathcal{L}\cup\{P\}$ の文の集合とする。$P$ が $T$ で暗に定義されるならば、明示的に定義される。
:::

::: proof
**Step 1（写しとの一致）.** $\mathcal{L}\cup\{P,P'\}$ に属さない相異なる定数記号 $c_{1},\dots,c_{n}$ をとり、$\vec{c}=(c_{1},\dots,c_{n})$, $\mathcal{K}\defeq\mathcal{L}\cup\{P,P',c_{1},\dots,c_{n}\}$ とする。$\mathcal{K}$ の構造について
$$
T\cup T'\cup\{P(\vec{c})\}\models P'(\vec{c})
\tag{1}
$$
を示す。$\mathcal{N}$ を $T\cup T'\cup\{P(\vec{c})\}$ のモデルとする。$\mathcal{M}\defeq\mathcal{N}\restr{(\mathcal{L}\cup\{P\})}$ は $T$ のモデルである（縮小の補題）。$\mathcal{M}'\defeq\mathcal{N}^{\flat}\restr{(\mathcal{L}\cup\{P\})}$ とすると、$\sigma\in T$ について $\mathcal{N}\models\sigma'$ だから、\ref{pt:symbol-renaming} と縮小の補題より $\mathcal{M}'\models\sigma$。よって $\mathcal{M}'$ も $T$ のモデルである。$\mathcal{M},\mathcal{M}'$ は同じ領域と同じ $\mathcal{L}$ の解釈をもつので $\mathcal{M}\restr{\mathcal{L}}=\mathcal{M}'\restr{\mathcal{L}}$。$P$ が暗に定義されることから
$$
P^{\mathcal{N}}=P^{\mathcal{M}}=P^{\mathcal{M}'}=P'^{\mathcal{N}} .
$$
$\mathcal{N}\models P(\vec{c})$ なので $\vec{c}^{\,\mathcal{N}}\in P^{\mathcal{N}}=P'^{\mathcal{N}}$、すなわち $\mathcal{N}\models P'(\vec{c})$。

**Step 2（有限個の文への縮小）.** (1) とコンパクト性定理より、$T\cup T'\cup\{P(\vec{c})\}$ の有限部分集合 $\Sigma_{0}$ で $\Sigma_{0}\models P'(\vec{c})$ となるものがある。$\Sigma_{0}\subseteq T_{0}\cup T_{0}'\cup\{P(\vec{c})\}$ となる有限の $T_{0}\subseteq T$ をとり、$\varphi$ を $T_{0}$ の元の連言（$T_{0}=\varnothing$ なら $\top$）とする。$\varphi'$ は $T_{0}'$ の元の連言で（付け替えは $\to,\bot$ と可換なので略記とも可換）、
$$
\varphi\wedge P(\vec{c})\models\varphi'\to P'(\vec{c}).
\tag{2}
$$
実際、左辺を満たし $\varphi'$ を満たす $\mathcal{K}$ 構造は $\Sigma_{0}$ を満たすので $P'(\vec{c})$ を満たす。

**Step 3（補間）.** (2) の左辺は $\mathcal{L}_{1}\defeq\mathcal{L}\cup\{P,\vec{c}\}$ の文、右辺は $\mathcal{L}_{2}\defeq\mathcal{L}\cup\{P',\vec{c}\}$ の文で、$\mathcal{L}_{1}\cap\mathcal{L}_{2}=\mathcal{L}\cup\{\vec{c}\}$、$\mathcal{L}_{1}\cup\mathcal{L}_{2}=\mathcal{K}$ である。クレイグの補間定理（\ref{logic:craig-interpolation}）より、$\mathcal{L}\cup\{\vec{c}\}$ の文 $\theta^{\ast}$ で
$$
\varphi\wedge P(\vec{c})\models\theta^{\ast},\qquad\theta^{\ast}\models\varphi'\to P'(\vec{c})
\tag{3}
$$
を満たすものがある。

**Step 4（写しを元に戻す）.** $\theta^{\ast}\models\varphi\to P(\vec{c})$ を示す。$\mathcal{L}_{1}$ 構造 $\mathcal{A}$ で $\mathcal{A}\models\theta^{\ast}$ となるものをとり、$P'$ を $P'^{\mathcal{N}}\defeq P^{\mathcal{A}}$ と解釈して $\mathcal{K}$ 構造 $\mathcal{N}$ に拡大する。縮小の補題より $\mathcal{N}\models\theta^{\ast}$、(3) より $\mathcal{N}\models\varphi'\to P'(\vec{c})$。\ref{pt:symbol-renaming} より $\mathcal{N}^{\flat}\models\varphi\to P(\vec{c})$ で、$P^{\mathcal{N}^{\flat}}=P'^{\mathcal{N}}=P^{\mathcal{N}}$ だから $\mathcal{N}^{\flat}=\mathcal{N}$。縮小の補題で $\mathcal{A}\models\varphi\to P(\vec{c})$。

(3) の前半と合わせる（(3) は $\mathcal{K}$ 構造についての帰結だが、$\mathcal{L}_{1}$ 構造は $P'$ を任意に解釈して $\mathcal{K}$ 構造に拡大できるので、縮小の補題より $\mathcal{L}_{1}$ 構造についても成り立つ）。$T\supseteq T_{0}$ で $T$ のモデルは $\varphi$ を満たすので、$\mathcal{L}_{1}$ 構造について
$$
T\models P(\vec{c})\leftrightarrow\theta^{\ast}.
\tag{4}
$$

**Step 5（定数を変数に戻す）.** \ref{pt:alpha-clean} により、$\theta^{\ast}$ を α 同値で束縛変数に $x_{1},\dots,x_{n}$ を含まない文に取り替えてよい（α 同値な論理式は同じ真偽をもち（\ref{pt:alpha-semantics}）、変数以外の記号は変わらないので、(4) と $\theta^{\ast}$ が $\mathcal{L}\cup\{\vec{c}\}$ の文であることは保たれる）。$\theta^{\ast}$ は文なので、これで $x_{1},\dots,x_{n}\notin\mathrm{Var}(\theta^{\ast})$ となる。$\theta\defeq\theta^{\ast}[x_{1}/c_{1}]\cdots[x_{n}/c_{n}]$ とおくと、$\theta$ は $\mathcal{L}$ の論理式で、\ref{logic:constant-replacement-properties} の 5 より $\mathrm{FV}(\theta)\subseteq\{x_{1},\dots,x_{n}\}$。$\theta_{0}\defeq\theta^{\ast}$, $\theta_{k}\defeq\theta_{k-1}[x_{k}/c_{k}]$ とすると $\theta=\theta_{n}$ で、$x_{k}\notin\mathrm{Var}(\theta_{k-1})$ だから置き換えの単射性（\ref{logic:constant-replacement-injective}）より $\theta_{k}[c_{k}/x_{k}]=\theta_{k-1}$。これを $k=n,\dots,1$ と続けて
$$
\theta[c_{n}/x_{n}]\cdots[c_{1}/x_{1}]=\theta^{\ast}.
$$
$\mathcal{M}$ を $T$ のモデル（$\mathcal{L}\cup\{P\}$ 構造）、$\vec{a}\in M^{n}$ とし、$c_{i}$ を $a_{i}$ と解釈して $\mathcal{L}_{1}$ 構造 $\mathcal{M}_{\vec{a}}$ に拡大する。縮小の補題より $\mathcal{M}_{\vec{a}}\models T$、(4) より $\mathcal{M}_{\vec{a}}\models P(\vec{c})\leftrightarrow\theta^{\ast}$。$P(\vec{c})\leftrightarrow\theta^{\ast}$ は $P(\vec{x})\leftrightarrow\theta$ に $[c_{n}/x_{n}]\cdots[c_{1}/x_{1}]$ を施したものなので、\ref{logic:constant-substitution-semantics} より、$v(x_{i})=a_{i}$ となる割り当て $v$ について $\mathcal{M}_{\vec{a}},v\models P(\vec{x})\leftrightarrow\theta$。縮小の補題で $\mathcal{M},v\models P(\vec{x})\leftrightarrow\theta$。$\vec{a}$ は任意なので $\mathcal{M}\models\forall\vec{x}\,(P(\vec{x})\leftrightarrow\theta)$。
:::

::: hypcheck
- **暗の定義**：Step 1 だけで使った。そこで比べた二つのモデル $\mathcal{M},\mathcal{M}'$ は、一つの構造 $\mathcal{N}$ の $P$ と $P'$ から作ったものである。
- **コンパクト性定理**：Step 2 で、$T$ が無限のときに有限個の文 $\varphi$ に帰着するために使った。$T$ が有限なら不要である。クレイグの補間定理が文一つずつについての定理なので、この帰着が要る。
- **クレイグの補間定理**：Step 3。共通の言語が $\mathcal{L}\cup\{\vec{c}\}$ であることが、$\theta^{\ast}$ が $P,P'$ を含まないことを保証する。これがこの証明の核心である。
- **新しい定数記号**：補間定理を文に使うため、$P(\vec{x})$ の自由変数を定数 $\vec{c}$ に置き換えた（Step 1）。$\vec{c}$ が $T$ に現れないことは、Step 5 の拡大 $\mathcal{M}_{\vec{a}}$ が $T$ のモデルのままであることに使った。
- **記号の付け替え**（\ref{pt:symbol-renaming}）：Step 1 で $T'$ から $T$ へ、Step 4 で $P'$ から $P$ へ戻すときに使った。
:::

::: remark 定義に使われる記号 {#pt:beth-finite-part}
Step 3 で $\mathcal{L}_{1},\mathcal{L}_{2}$ を、$\varphi$ に現れる $\mathcal{L}$ の記号と $P,P',\vec{c}$ だけからなる言語にとってもよい。すると $\theta$ は $T$ の有限部分 $T_{0}$ に現れる $\mathcal{L}$ の記号だけで書ける。
:::

## 問題 {#pt:sec-beth-problems}

::: problem {#pt:prob-beth-padoa}
（パドアの方法）$\mathcal{L}=\{Q\}$（1 項関係記号）、$T=\{\forall x\,(P(x)\to Q(x))\}$ とする。$P$ が $T$ で明示的に定義されないことを示せ。
:::

::: solution
\ref{pt:explicit-implies-implicit} より、暗に定義されないことを示せばよい。領域 $\{0\}$ で $Q=\{0\}$ とし、$P=\varnothing$ と $P=\{0\}$ の二つの $\mathcal{L}\cup\{P\}$ 構造を考える。どちらも $T$ のモデルで、$\mathcal{L}$ への縮小は等しいが $P$ の解釈が異なる。
:::

::: problem {#pt:prob-beth-copy}
$P$ が $T$ で暗に定義されることと、$T\cup T'\models\forall\vec{x}\,(P(\vec{x})\leftrightarrow P'(\vec{x}))$（$\mathcal{L}\cup\{P,P'\}$ 構造について）が同値であることを示せ。
:::

::: solution
($\Rightarrow$) Step 1 と同じ議論で、$T\cup T'$ のモデル $\mathcal{N}$ について $P^{\mathcal{N}}=P'^{\mathcal{N}}$ となる。これは右辺の文が $\mathcal{N}$ で真であることにほかならない。

($\Leftarrow$) $\mathcal{M},\mathcal{M}'\models T$, $\mathcal{M}\restr{\mathcal{L}}=\mathcal{M}'\restr{\mathcal{L}}$ とする。$\mathcal{M}$ を $P'^{\mathcal{N}}\defeq P^{\mathcal{M}'}$ で $\mathcal{L}\cup\{P,P'\}$ 構造 $\mathcal{N}$ に拡大する。縮小の補題より $\mathcal{N}\models T$。$\mathcal{N}^{\flat}\restr{(\mathcal{L}\cup\{P\})}=\mathcal{M}'$ なので、\ref{pt:symbol-renaming} と縮小の補題より $\mathcal{N}\models T'$。仮定より $P^{\mathcal{M}}=P^{\mathcal{N}}=P'^{\mathcal{N}}=P^{\mathcal{M}'}$。
:::

::: problem {#pt:prob-beth-unique}
$\theta_{1},\theta_{2}$ がともに $P$ の $T$ での明示的な定義なら、$T\models\forall\vec{x}\,(\theta_{1}\leftrightarrow\theta_{2})$ であり、さらに $T\restr{\mathcal{L}}\defeq\{\sigma:\sigma\text{ は }\mathcal{L}\text{ の文で }T\models\sigma\}$ について $T\restr{\mathcal{L}}\models\forall\vec{x}\,(\theta_{1}\leftrightarrow\theta_{2})$ であることを示せ。
:::

::: solution
前半：$T$ のモデル $\mathcal{M}$ と $v$ について、$\mathcal{M},v\models\theta_{1}\iff\mathcal{M},v\models P(\vec{x})\iff\mathcal{M},v\models\theta_{2}$。後半：前半の文 $\forall\vec{x}\,(\theta_{1}\leftrightarrow\theta_{2})$ は $\mathcal{L}$ の文で $T$ から帰結するので、$T\restr{\mathcal{L}}$ の元である。
:::

::: supplement
**前提の検討.**
- *$P$ が関係記号であること.* 関数記号 $f$ についても同様の定理が成り立つ（$f(\vec{x})=y$ を表す関係記号に置き換えて考える）ことが一般に知られている。本サイトでは確かめていない。
- *逆向き*（\ref{pt:explicit-implies-implicit}）は補間定理を使わない。補間定理が要るのは「暗 $\Rightarrow$ 明示」の向きだけである。逆向きの対偶は、定義できないことを二つのモデルで示す**パドアの方法**（問題 \ref{pt:prob-beth-padoa}）である。

**関連する結果.**
- *構文論的な証明.* $\mathcal{L}$ が関係記号だけからなり、$T$ が有限で等号を使わない場合には、Step 3 の代わりに前原の補題（\ref{pt:maehara-lemma}、\ref{pt:maehara-craig}）を使い、シーケント $\varphi,P(\vec{x}),\varphi'\Rightarrow P'(\vec{x})$ を分割 $[\varphi,P(\vec{x})\,;\varphi']\Rightarrow[\ ;P'(\vec{x})]$ で補間すれば、定数を経由せずに $\theta$ をカットのない導出から計算できる。ただし $T\cup T'\models\dots$ から $\mathsf{LK}$ での導出を得るには等号なしの完全性が要る（\ref{pt:maehara-semantic-remark}）。
- *$\mathsf{GL}$ のベートの定理*は \ref{pt:gl-beth} で、補間定理だけから同じ形で導いた。
- *有限構造.* 構造を有限のものに制限すると、補間定理もベートの定理も一般には成り立たなくなることが知られている（有限モデル理論。本サイトでは扱わない）。

**高い視点から：指紋と似顔絵.** 暗の定義は「$\mathcal{L}$ の情報がわかれば $P$ は一通りに決まる」という**一意性**の主張で、明示的な定義は「$P$ を $\mathcal{L}$ の言葉で書き下す方法がある」という**存在**の主張である。指紋（$\mathcal{L}$ の情報）で人物（$P$）が特定できるなら、その人物の似顔絵（$\theta$）が必ず描ける、と言っているようなものである。一般の数学では一意性から構成は従わないことが多いので、一階述語論理でこれが成り立つのは特筆すべき性質である。

圏論的に言い直すと、$T$ のモデルの圏から $\mathcal{L}$ 構造の圏への忘却関手が対象について単射である（暗の定義）ならば、$T$ は $\mathcal{L}$ のある理論の**定義による拡大**になっている（明示的な定義）、ということである（これは本サイトの要約である）。代数論理では、ハルモスの多進代数の枠組みで、ベートの定理を代数の性質として述べ直したドゥエニョの研究があると言われている（本サイトでは原論文を確かめていない）。
:::
