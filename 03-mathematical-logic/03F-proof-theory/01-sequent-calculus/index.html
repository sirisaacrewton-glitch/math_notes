α 同値、導出図の固有変数・束縛変数の付け替え（高さとカットのない形を保つ代入）、シーケント計算 LK、自然演繹・LK・ヒルベルト流の同値性、ゲンツェンのカット除去定理、前原の方法による補間定理、ベートの定義可能性定理、エルブランの定理。（参考書なし。順序数解析の系列はこの後に置く）
