# ペアノ算術と Σ 論理式 {#pt:page-peano-arithmetic keywords="Peano arithmetic, PA, numerals, induction axiom, Sigma formulas, Sigma_1 completeness, Delta formulas, standard model"}

不完全性定理の対象となる理論**ペアノ算術** $\PA$ を定め、その基本的な性質を調べる。中心となるのは **Σ 完全性**、すなわち「真な Σ 文は $\PA$ で証明できる」という定理である。Σ 文は、有界でない全称量化子と否定を（原子論理式の否定を除いて）含まない文で、「ある計算が停止する」「ある文に証明がある」といった主張はこの形で書ける。後のページで、証明可能性述語が Σ 論理式で書けること（\ref{pt:page-arithmetization}）と組み合わせて、導出可能性条件の証明に使う。

本ページでは、「$\PA\vdash\varphi$」を示すのに、完全性定理を使って「$\PA$ のすべてのモデルで $\varphi$ が成り立つ」ことを示す。こうすると、$\PA$ の中の形式的な導出を書き下す代わりに、$\PA$ のモデルの中で通常の数学の推論ができる。

## 記法と定義の確認 {#pt:sec-pa-notation}

::: notation
- 言語 $\mathcal{L}_{\mathrm{ar}}=\{0,S,+,\times,<\}$ と標準構造 $\mathcal{N}$ は \ref{logic:language} の直後の例と \ref{logic:structure} の例のとおり。$\times$ は $\cdot$ とも書き、$S(t)$ を $St$ と書くこともある。
- 導出可能性 $\Sigma\vdash\varphi$ は一階述語論理の自然演繹による（\ref{logic:derivability}）。完全性定理（\ref{logic:completeness}）より、文の集合 $T$ と論理式 $\varphi$ について、$T\vdash\varphi$ は「$T$ のすべてのモデル $\mathcal{M}$ とすべての割り当て $v$ で $\mathcal{M},v\models\varphi$」と同値である。
- 有界量化子：変数 $x$ を含まない項 $t$ について $\forall x<t\,\varphi\defeq\forall x\,(x<t\to\varphi)$、$\exists x<t\,\varphi\defeq\exists x\,(x<t\wedge\varphi)$。$t\le s\defeq(t<s\vee t=s)$。
- 構造 $\mathcal{M}$ の中の元と演算を、誤解のない限り $0,S,+,\cdot,<$ と同じ記号で書く（たとえば $0^{\mathcal{M}}$ を $0$ と書く）。
:::

## ペアノ算術 {#pt:sec-pa-definition}

::: definition ペアノ算術 {#pt:peano-arithmetic keywords="Peano arithmetic, PA, induction axiom" index="ペアノ算術|ぺあのさんじゅつ, 帰納法の公理|きのうほうのこうり"}
次の $\mathcal{L}_{\mathrm{ar}}$ の文を**ペアノ算術** $\PA$ の公理という。
$$
\begin{aligned}
&(\mathrm{S1})\ \forall x\,\neg\,S(x)=0, &&(\mathrm{S2})\ \forall x\forall y\,(S(x)=S(y)\to x=y),\\
&(\mathrm{A1})\ \forall x\,(x+0=x), &&(\mathrm{A2})\ \forall x\forall y\,(x+S(y)=S(x+y)),\\
&(\mathrm{M1})\ \forall x\,(x\cdot0=0), &&(\mathrm{M2})\ \forall x\forall y\,(x\cdot S(y)=x\cdot y+x),\\
&(\mathrm{O1})\ \forall x\,\neg\,x<0, &&(\mathrm{O2})\ \forall x\forall y\,(x<S(y)\leftrightarrow x<y\vee x=y),
\end{aligned}
$$
および、各論理式 $\varphi$ と変数 $x$ について、$\mathrm{FV}(\varphi)\setminus\{x\}=\{y_{1},\dots,y_{k}\}$ として
$$
(\mathrm{Ind}_{\varphi,x})\quad\forall y_{1}\cdots\forall y_{k}\,\bigl(\varphi[0/x]\wedge\forall x\,(\varphi\to\varphi[S(x)/x])\to\forall x\,\varphi\bigr)
$$
（**帰納法の公理**。$y_{1},\dots,y_{k}$ の並べ方は \ref{pt:syntax-predicates} の全称閉包 $\mathrm{cl}$ に合わせて固定する。並べ方によって定理は変わらない）。$\PA$ はこれらの公理全体の集合である。$\PA\vdash\varphi$ のとき、$\varphi$ は $\PA$ の**定理**であるという。
:::

::: remark
- 公理を文（全称閉包）にしたのは、本サイトの自然演繹が局所的な帰結関係をとっているためである（\ref{logic:global-consequence}）。自由変数を含む論理式を前提に置くと、その変数について $\forall$I ができない。
- $S(x)$ は $\varphi$ の中で $x$ に代入可能である。実際、$S(x)$ に現れる変数は $x$ だけで、$\varphi$ の中で自由な $x$ の出現が $\forall x$ の作用域に入ることはない（\ref{logic:substitutable}）。
- 公理の集合は、ヒルベルト流など他の証明体系で公理化しても、定理の集合は同じである（完全性定理により、どちらも「$\PA$ のすべてのモデルで真」と一致する）。
:::

::: definition 数項 {#pt:numeral keywords="numeral" index="数項|すうこう"}
自然数 $n$ に対し、閉項 $\underline{n}$ を $\underline{0}\defeq0$、$\underline{n+1}\defeq S(\underline{n})$ で定め、$n$ の**数項**という。
:::

::: proposition 標準構造は PA のモデルである {#pt:standard-model}
$\mathcal{N}\models\PA$。とくに $\PA$ は無矛盾である。
:::

::: proof
$\mathrm{S1}$–$\mathrm{O2}$ は自然数の性質そのものである（$\mathrm{O2}$ は「$m<n+1\iff m<n$ または $m=n$」）。帰納法の公理：$y_{i}$ に値 $b_{i}$ を割り当てた割り当てを $u$ とし、$A\defeq\{n\in\N:\mathcal{N},u[x\mapsto n]\models\varphi\}$ とおく。前件が成り立つなら、意味論的代入補題（\ref{logic:semantic-substitution}）より $0\in A$ かつ「$n\in A\Rightarrow n+1\in A$」なので、自然数の帰納法により $A=\N$、すなわち後件 $\forall x\,\varphi$ が成り立つ。無矛盾性は \ref{logic:satisfiable-consistent} による。
:::

::: lemma 定義可能な集合についての帰納法 {#pt:model-induction keywords="induction in models of PA"}
$\mathcal{M}\models\PA$ とし、$\varphi$ を論理式、$x$ を変数、$v$ を割り当てとする。$A\defeq\{a\in M:\mathcal{M},v[x\mapsto a]\models\varphi\}$ が $0\in A$ と「$a\in A\Rightarrow S(a)\in A$」を満たせば $A=M$。
:::

::: proof
$\mathcal{M}\models\mathrm{Ind}_{\varphi,x}$ を割り当て $v$ で読む。意味論的代入補題より、$\mathcal{M},v\models\varphi[0/x]$ は $0\in A$ と同値、$\mathcal{M},v\models\forall x\,(\varphi\to\varphi[S(x)/x])$ は「すべての $a$ について $a\in A\Rightarrow S(a)\in A$」と同値である（$S(x)$ の値は $v[x\mapsto a]$ のもとで $S(a)$）。よって $\mathcal{M},v\models\forall x\,\varphi$、すなわち $A=M$。
:::

::: intuition
$\PA$ のモデル $\mathcal{M}$ の中では、**論理式で定義できる**集合についてだけ帰納法が使える。$\mathcal{M}$ が超準モデル（\ref{logic:ex-nonstandard-arithmetic}）なら、標準的な元 $\underline{n}^{\mathcal{M}}$ 全体は $0$ を含み $S$ で閉じているが $M$ 全体ではないので、この集合は論理式で定義できない。
:::

## PA の基本的な定理 {#pt:sec-pa-basic}

以下の命題では、$\mathcal{M}$ を $\PA$ の任意のモデルとし、$M$ の元について主張を示す。主張はすべて $\mathcal{L}_{\mathrm{ar}}$ の論理式（全称閉包）で書けるので、完全性定理によりそれらは $\PA$ の定理である。帰納法を使うときは、帰納法を適用する集合を定義する論理式を明示する。

::: proposition 後者と加法 {#pt:pa-addition}
$\PA$ の任意のモデルの任意の元 $a,b,c$ について次が成り立つ。
1. $a=0$ または、ある $b$ で $a=S(b)$。
2. $0+a=a$、$S(a)+b=S(a+b)$。
3. $a+b=b+a$、$(a+b)+c=a+(b+c)$。
4. $a+c=b+c$ ならば $a=b$。
:::

::: proof
**1.** $\varphi\defeq(x=0\vee\exists y\,x=S(y))$ に \ref{pt:model-induction} を使う。$0$ は前者を満たし、$S(a)$ は $y\mapsto a$ で後者を満たす。

**2.** 前半：$\varphi\defeq(0+x=x)$。$0+0=0$ は $\mathrm{A1}$。$0+a=a$ なら $0+S(a)=S(0+a)=S(a)$（$\mathrm{A2}$）。後半：$a$ を固定し $\varphi\defeq(S(y)+x=S(y+x))$（$y\mapsto a$）。$x=0$ では両辺 $S(a)$（$\mathrm{A1}$）。$S(a)+b=S(a+b)$ なら $S(a)+S(b)=S(S(a)+b)=S(S(a+b))=S(a+S(b))$（$\mathrm{A2}$ を二回）。

**3.** 可換性：$b$ を固定し $\varphi\defeq(x+y=y+x)$（$y\mapsto b$）に帰納法。$x=0$ は 2 の前半と $\mathrm{A1}$。$a+b=b+a$ なら $S(a)+b=S(a+b)=S(b+a)=b+S(a)$（2 の後半と $\mathrm{A2}$）。結合性：$a,b$ を固定し $c$ について帰納法。$c=0$ は $\mathrm{A1}$。$(a+b)+S(c)=S((a+b)+c)=S(a+(b+c))=a+S(b+c)=a+(b+S(c))$。

**4.** $a,b$ を固定し $c$ について帰納法（$\varphi\defeq(y+x=z+x\to y=z)$）。$c=0$ は $\mathrm{A1}$。$a+S(c)=b+S(c)$ なら $S(a+c)=S(b+c)$ で、$\mathrm{S2}$ より $a+c=b+c$、帰納法の仮定より $a=b$。
:::

::: proposition 乗法 {#pt:pa-multiplication}
$\PA$ の任意のモデルの任意の元 $a,b,c$ について、$0\cdot a=0$、$S(a)\cdot b=a\cdot b+b$、$a\cdot b=b\cdot a$、$a\cdot(b+c)=a\cdot b+a\cdot c$、$(a\cdot b)\cdot c=a\cdot(b\cdot c)$、$a\cdot S(0)=a$。
:::

::: proof
いずれも最後の変数についての帰納法で、\ref{pt:pa-addition} を使う。
- $0\cdot a=0$：$0\cdot0=0$（$\mathrm{M1}$）、$0\cdot S(a)=0\cdot a+0=0$（$\mathrm{M2}$, $\mathrm{A1}$）。
- $S(a)\cdot b=a\cdot b+b$：$b=0$ で両辺 $0$。$S(a)\cdot S(b)=S(a)\cdot b+S(a)=(a\cdot b+b)+S(a)=S((a\cdot b+b)+a)$、一方 $a\cdot S(b)+S(b)=(a\cdot b+a)+S(b)=S((a\cdot b+a)+b)$。加法の可換性・結合性より $(a\cdot b+b)+a=(a\cdot b+a)+b$。
- 可換性：$b$ を固定して $a$ について帰納法。$0\cdot b=0=b\cdot0$。$S(a)\cdot b=a\cdot b+b=b\cdot a+b=b\cdot S(a)$。
- 分配律：$c$ について帰納法。$a\cdot(b+0)=a\cdot b=a\cdot b+a\cdot0$。$a\cdot(b+S(c))=a\cdot S(b+c)=a\cdot(b+c)+a=(a\cdot b+a\cdot c)+a=a\cdot b+(a\cdot c+a)=a\cdot b+a\cdot S(c)$。
- 結合性：$c$ について帰納法。$c=0$ で両辺 $0$。$(a\cdot b)\cdot S(c)=(a\cdot b)\cdot c+a\cdot b=a\cdot(b\cdot c)+a\cdot b=a\cdot(b\cdot c+b)=a\cdot(b\cdot S(c))$（分配律）。
- $a\cdot S(0)=a\cdot0+a=0+a=a$。
:::

::: proposition 順序 {#pt:pa-order}
$\PA$ の任意のモデルの任意の元 $a,b,c$ について次が成り立つ。
1. $a<S(a)$、$0<S(a)$。
2. $a<b$ かつ $b<c$ ならば $a<c$。
3. $a<b$ ならば $S(a)\le b$。
4. $\neg\,a<a$。
5. $a<b$、$a=b$、$b<a$ のちょうど一つが成り立つ。
6. $a<b\iff$ ある $c$ で $a+S(c)=b$。
:::

::: proof
**1.** $a<S(a)$ は $\mathrm{O2}$（右辺の $a=a$）。$0<S(a)$ は $a$ についての帰納法：$0<S(0)$ は前半、$0<S(a)$ なら $\mathrm{O2}$ より $0<S(S(a))$。

**2.** $a,b$ を固定し $c$ について帰納法（$\varphi\defeq(y<z\wedge z<x\to y<x)$）。$c=0$ では $b<0$ が $\mathrm{O1}$ に反する。$b<S(c)$ なら $\mathrm{O2}$ より $b<c$ または $b=c$。前者なら帰納法の仮定で $a<c$、後者なら $a<c$ は仮定そのもの。いずれも $\mathrm{O2}$ より $a<S(c)$。

**3.** $a$ を固定し $b$ について帰納法。$b=0$ は $\mathrm{O1}$ より前件が偽。$a<S(b)$ なら $\mathrm{O2}$ より $a<b$ または $a=b$。$a=b$ なら $S(a)=S(b)$。$a<b$ なら帰納法の仮定より $S(a)\le b$、$\mathrm{O2}$ より $S(a)<S(b)$。

**4.** 帰納法。$\neg\,0<0$ は $\mathrm{O1}$。$\neg\,a<a$ として $S(a)<S(a)$ と仮定すると、$\mathrm{O2}$ より $S(a)<a$ または $S(a)=a$。前者なら 1 と 2 より $a<S(a)<a$ から $a<a$、後者なら 1 より $a<S(a)=a$。いずれも矛盾。

**5.** 少なくとも一つ：$b$ を固定し $a$ について帰納法。$a=0$：1 の前半の \ref{pt:pa-addition} の 1 より $b=0$ か $b=S(b')$ で、後者なら 1 より $0<b$。$a\to S(a)$：$a<b$ なら 3 より $S(a)<b$ または $S(a)=b$。$a=b$ なら 1 より $b<S(a)$。$b<a$ なら 1, 2 より $b<S(a)$。高々一つ：$a<b$ と $a=b$ は 4 に反し、$a<b$ と $b<a$ は 2 と 4 に反する。

**6.** $\Leftarrow$：$a$ を固定し $c$ について帰納法。$a+S(0)=S(a+0)=S(a)$ で 1 より $a<S(a)$。$a<a+S(c)$ なら $\mathrm{O2}$ より $a<S(a+S(c))=a+S(S(c))$。$\Rightarrow$：$a$ を固定し $b$ について帰納法。$b=0$ は前件が偽。$a<S(b)$ なら $a<b$ または $a=b$。$a=b$ なら $c=0$ で $a+S(0)=S(a)=S(b)$。$a<b$ なら帰納法の仮定より $a+S(c)=b$ で、$a+S(S(c))=S(a+S(c))=S(b)$。
:::

::: proposition 強い帰納法と最小元の原理 {#pt:pa-strong-induction keywords="strong induction, least number principle" index="最小数原理|さいしょうすうげんり"}
$\mathcal{M}\models\PA$、$\varphi,x,v$ と $A$ を \ref{pt:model-induction} のとおりとする。
1. すべての $a$ について「$b<a$ となるすべての $b$ が $A$ に属すれば $a\in A$」ならば、$A=M$。
2. $A\neq\varnothing$ ならば、$A$ は $<$ についての最小元をもつ。
:::

::: proof
**1.** $B\defeq\{a:b<a\text{ となるすべての }b\text{ について }b\in A\}$ とおく。$B$ は論理式 $\forall z\,(z<x\to\varphi[z/x])$（$z$ は新しい変数）で定義できる。$0\in B$ は $\mathrm{O1}$ による。$a\in B$ なら仮定より $a\in A$ で、$\mathrm{O2}$ より $b<S(a)$ は $b<a$ か $b=a$ なので $S(a)\in B$。\ref{pt:model-induction} より $B=M$。任意の $a$ について $a\in B$ と仮定から $a\in A$。

**2.** $A$ が最小元をもたないとする。$A'\defeq M\setminus A$（$\neg\varphi$ で定義される）に 1 を使う。$b<a$ となるすべての $b$ が $A'$ に属するのに $a\in A$ なら、$a$ は $A$ の最小元（\ref{pt:pa-order} の 5 により、$A$ の元 $c$ は $a<c$ か $c=a$ を満たす）となり仮定に反する。よって $a\in A'$。1 より $A'=M$、すなわち $A=\varnothing$。
:::

## 数項と標準的な元 {#pt:sec-pa-numerals}

::: lemma 標準的な元 {#pt:standard-part keywords="standard elements, initial segment"}
$\mathcal{M}\models\PA$ とし、$d(n)\defeq\underline{n}^{\mathcal{M}}$ と定める。任意の $n,m\in\N$ について次が成り立つ。
1. $d(0)=0$、$d(n+1)=S(d(n))$、$d(n+m)=d(n)+d(m)$、$d(nm)=d(n)\cdot d(m)$。
2. $\mathcal{M}\models\forall x\,\bigl(x<\underline{n}\leftrightarrow x=\underline{0}\vee\cdots\vee x=\underline{n-1}\bigr)$（$n=0$ のとき右辺は $\bot$）。
3. $n<m\iff d(n)<d(m)$。とくに $d$ は単射である。
4. $a\in M$ が $a<d(n)$ を満たせば、ある $k<n$ で $a=d(k)$。
:::

::: proof
**1.** $d(0),d(n+1)$ は数項の定義そのもの。和：$m$ に関する（メタの）帰納法。$d(n+0)=d(n)=d(n)+0$（$\mathrm{A1}$）、$d(n+m+1)=S(d(n+m))=S(d(n)+d(m))=d(n)+S(d(m))=d(n)+d(m+1)$（$\mathrm{A2}$）。積も同様に $\mathrm{M1},\mathrm{M2}$ と和の場合から。

**2.** $n$ に関する帰納法。$n=0$ は $\mathrm{O1}$。$n$ で成り立てば、$\mathrm{O2}$ より $x<S(\underline{n})\leftrightarrow x<\underline{n}\vee x=\underline{n}$ で、帰納法の仮定から $n+1$ で成り立つ。

**3.** $n<m$ なら 2 より $d(n)<d(m)$（右辺の選言の一つ）。$n\ge m$ なら $d(n)<d(m)$ とすると 2 より $d(n)=d(k)$（ある $k<m\le n$）。一方 $k<n$ なので前半より $d(k)<d(n)=d(k)$ となり \ref{pt:pa-order} の 4 に反する。単射性：$n\neq m$ なら $n<m$ か $m<n$ で、$d(n)<d(m)$ か $d(m)<d(n)$、\ref{pt:pa-order} の 4 より $d(n)\neq d(m)$。

**4.** 2 による。
:::

::: corollary 数項の計算 {#pt:numeral-computation}
任意の $n,m\in\N$ と閉項 $t$ について、次は $\PA$ の定理である。
$$
\begin{aligned}
&\underline{n}+\underline{m}=\underline{n+m},\quad\underline{n}\cdot\underline{m}=\underline{nm},\quad t=\underline{t^{\mathcal{N}}},\quad\neg\,\underline{n}=\underline{m}\ (n\neq m),\\
&\underline{n}<\underline{m}\ (n<m),\quad\neg\,\underline{n}<\underline{m}\ (n\ge m).
\end{aligned}
$$
:::

::: proof
\ref{pt:standard-part} と完全性定理による。閉項 $t$ については、項に関する帰納法で $t^{\mathcal{M}}=d(t^{\mathcal{N}})$（1 による）。
:::

::: intuition
$d$ は標準構造 $\mathcal{N}$ から任意のモデル $\mathcal{M}$ への埋め込みであり（1, 3）、その像は $\mathcal{M}$ の**始切片**である（4）。すなわち、どのモデルも「始めの部分に本物の自然数のコピーをもち、その先に（あれば）超準的な元が続く」形をしている。
:::

## Σ 論理式と Σ 完全性 {#pt:sec-sigma}

::: definition Σ 論理式と Δ 論理式 {#pt:sigma-formula keywords="Sigma formula, Sigma_1 formula, strict Sigma formula, Delta formula, bounded quantifier" index="Σ 論理式|しぐまろんりしき, Δ 論理式|でるたろんりしき, 有界量化|ゆうかいりょうか"}
1. **狭義の Σ 論理式**全体を、原子論理式とその否定をすべて含み、$\varphi,\psi$ を含めば $\varphi\wedge\psi$、$\varphi\vee\psi$、$\exists x\,\varphi$、$\forall x<t\,\varphi$（$x$ は $t$ に現れない）を含む最小の論理式の集合と定める。
2. 論理式 $\varphi$ が **Σ 論理式**であるとは、ある狭義の Σ 論理式 $\psi$ で $\PA\vdash\forall\vec{x}\,(\varphi\leftrightarrow\psi)$（$\vec{x}$ は $\varphi,\psi$ の自由変数）となるものがあることをいう。文である Σ 論理式を **Σ 文**という。
3. $\varphi$ と $\neg\varphi$ がともに Σ 論理式であるとき、$\varphi$ を **Δ 論理式**という。
:::

::: remark
文献では Σ 論理式を **Σ₁ 論理式**と呼ぶことが多い。本系列では Boolos に従い、階層の上の方（Σ₂ など）は使わないので添字を省く。狭義の Σ 論理式では否定は原子論理式の直前にしか現れず、有界でない全称量化子は現れない。
:::

::: proposition Σ 論理式と Δ 論理式の閉包性 {#pt:sigma-closure}
1. Σ 論理式全体は $\wedge,\vee,\exists x$、有界量化 $\forall x<t$, $\exists x<t$ で閉じている。
2. Δ 論理式全体は、原子論理式を含み、$\neg,\wedge,\vee,\to$ と有界量化で閉じている。
:::

::: proof
**1.** $\varphi\leftrightarrow\varphi'$, $\psi\leftrightarrow\psi'$ が $\PA$ の定理（全称閉包）で $\varphi',\psi'$ が狭義の Σ 論理式なら、$\varphi\wedge\psi\leftrightarrow\varphi'\wedge\psi'$ などは $\PA$ の定理である（どのモデルでも同じ集合を定義するので）。$\exists x<t\,\varphi'=\exists x\,(x<t\wedge\varphi')$ は狭義の Σ 論理式である（$x<t$ は原子論理式）。

**2.** 原子論理式とその否定は狭義の Σ 論理式である。否定：$\varphi$ が Δ なら $\neg\varphi$ と $\neg\neg\varphi$（$\varphi$ と同値）は Σ。連言・選言：$\neg(\varphi\wedge\psi)\leftrightarrow\neg\varphi\vee\neg\psi$、$\neg(\varphi\vee\psi)\leftrightarrow\neg\varphi\wedge\neg\psi$ と 1 による。$\to$ は $\neg\varphi\vee\psi$ と同値。有界量化：$\neg\forall x<t\,\varphi\leftrightarrow\exists x<t\,\neg\varphi$、$\neg\exists x<t\,\varphi\leftrightarrow\forall x<t\,\neg\varphi$ は論理的に（したがって $\PA$ で）成り立ち、1 による。
:::

::: theorem Σ 論理式は上に保たれる {#pt:sigma-upward}
$\mathcal{M}\models\PA$、$d$ を \ref{pt:standard-part} のとおりとする。狭義の Σ 論理式 $\varphi$ と $\N$ に値をとる割り当て $v$ について、$\mathcal{N},v\models\varphi$ ならば $\mathcal{M},d\circ v\models\varphi$。
:::

::: proof
性質「$\N$ に値をとる**すべての**割り当て $v$ について $\mathcal{N},v\models\varphi\Rightarrow\mathcal{M},d\circ v\models\varphi$」をもつ論理式の集合が、狭義の Σ 論理式の定義の生成元を含み、各操作で閉じていることを示せば、最小性より狭義の Σ 論理式はすべてこの性質をもつ。

**Step 1（項）.** 任意の項 $t$ について $t^{\mathcal{M},d\circ v}=d(t^{\mathcal{N},v})$。項に関する帰納法で、\ref{pt:standard-part} の 1 による。

**Step 2（原子論理式とその否定）.** Step 1 より、$t=s$ と $t<s$ の真偽は、$\mathcal{N},v$ での値 $n,m$ についての $n=m$, $n<m$ と、$\mathcal{M},d\circ v$ での $d(n)=d(m)$, $d(n)<d(m)$ の間で一致する（\ref{pt:standard-part} の 3。単射性と順序の保存）。したがって原子論理式もその否定も性質をもつ。$\bot$ と $\neg\bot$ は自明。

**Step 3（$\wedge,\vee$）.** 略記の意味（\ref{logic:abbreviation-semantics}）から直ちに従う。

**Step 4（$\exists x$）.** $\mathcal{N},v\models\exists x\,\varphi$ ならある $n$ で $\mathcal{N},v[x\mapsto n]\models\varphi$。仮定（割り当て $v[x\mapsto n]$ について）より $\mathcal{M},d\circ(v[x\mapsto n])\models\varphi$ で、$d\circ(v[x\mapsto n])=(d\circ v)[x\mapsto d(n)]$ なので $\mathcal{M},d\circ v\models\exists x\,\varphi$。

**Step 5（$\forall x<t$）.** $\mathcal{N},v\models\forall x<t\,\varphi$ とし、$m\defeq t^{\mathcal{N},v}$ とおく。Step 1 より $t^{\mathcal{M},d\circ v}=d(m)$（$x\notin\mathrm{var}(t)$ なので、$x$ の値を書き換えても $t$ の値は変わらない。一致補題）。$a<d(m)$ とすると、\ref{pt:standard-part} の 4 より $a=d(k)$、$k<m$。仮定より $\mathcal{N},v[x\mapsto k]\models\varphi$、帰納法の仮定より $\mathcal{M},(d\circ v)[x\mapsto a]\models\varphi$。よって $\mathcal{M},d\circ v\models\forall x<t\,\varphi$。

::: hypcheck
- **$\mathcal{M}$ の標準部分が始切片であること**（\ref{pt:standard-part} の 4）：Step 5 の有界全称量化子の場合。有界でない全称量化子 $\forall x\,\psi$ は、$\mathcal{N}$ のすべての元で $\psi$ が成り立っても、$\mathcal{M}$ の超準的な元（標準部分の外の元）で偽になりうるので、この議論では扱えない（実際に保たれない例は、第一不完全性定理から得られる）。
- **否定を原子論理式に限ること**：Step 2。$\neg\exists x\,\varphi$ は $\mathcal{N}$ で真でも、$\mathcal{M}$ の超準的な元が証拠になって偽になりうる。
:::
:::

::: theorem Σ 完全性 {#pt:sigma-completeness keywords="Sigma_1 completeness, provable Sigma completeness" index="Σ 完全性|しぐまかんぜんせい"}
$\varphi(x_{1},\dots,x_{k})$ を Σ 論理式、$n_{1},\dots,n_{k}\in\N$ とする。$\mathcal{N}\models\varphi[n_{1},\dots,n_{k}]$ ならば $\PA\vdash\varphi[\underline{n_{1}}/x_{1}]\cdots[\underline{n_{k}}/x_{k}]$。とくに、真な Σ 文は $\PA$ で証明できる。
:::

::: proof
**Step 1.** 狭義の Σ 論理式 $\psi$ で $\PA\vdash\forall\vec{x}\,(\varphi\leftrightarrow\psi)$ となるものをとる。$\mathcal{N}\models\PA$（\ref{pt:standard-model}）なので $\mathcal{N}\models\psi[\vec{n}]$。

**Step 2.** $\mathcal{M}\models\PA$ を任意にとる。\ref{pt:sigma-upward} より $\mathcal{M}\models\psi[d(n_{1}),\dots,d(n_{k})]$、したがって $\mathcal{M}\models\varphi[d(n_{1}),\dots,d(n_{k})]$。$d(n_{i})=\underline{n_{i}}^{\mathcal{M}}$ で数項は閉項（どこにでも代入可能）なので、意味論的代入補題（\ref{logic:semantic-substitution}）を $i=1,\dots,k$ の順に使って、$\mathcal{M}\models\varphi[\underline{n_{1}}/x_{1}]\cdots[\underline{n_{k}}/x_{k}]$。

**Step 3.** $\mathcal{M}$ は任意なので、完全性定理より $\PA\vdash\varphi[\underline{n_{1}}/x_{1}]\cdots[\underline{n_{k}}/x_{k}]$。

::: hypcheck
- **$\mathcal{N}\models\PA$**：Step 1 で、$\varphi$ の真理を狭義の Σ 論理式 $\psi$ の真理に移すのに使う。
- **完全性定理**：Step 3。Σ 完全性は構文論的に（数項についての計算と論理式の構成に関する帰納法で）直接証明することもでき、その場合は $\PA$ の帰納法の公理をほとんど使わない（ロビンソン算術で成り立つ）。後のページ（\ref{pt:page-formalized-sigma-completeness}）でこの定理を $\PA$ の中で形式化するときは、構文論的な証明の方を形式化する。
:::
:::

::: corollary Δ 論理式の決定性 {#pt:delta-decidable}
$\varphi(\vec{x})$ が Δ 論理式なら、任意の $\vec{n}$ について $\PA\vdash\varphi(\underline{\vec{n}})$ または $\PA\vdash\neg\varphi(\underline{\vec{n}})$ であり、前者は $\mathcal{N}\models\varphi[\vec{n}]$ のとき、後者はそうでないときに成り立つ。
:::

::: proof
$\varphi$ と $\neg\varphi$ はともに Σ 論理式で、どちらか一方が $\mathcal{N}$ で真である。Σ 完全性による。
:::

::: remark Σ 完全性の意味 {#pt:sigma-completeness-remark}
Σ 文の否定は、一般に Σ 文ではない（Π 文と呼ばれる形になる）。第一不完全性定理（\ref{pt:page-diagonal-first-incompleteness}）で構成される、真だが $\PA$ で証明できない文は、この Π 文の形をしている。たとえばゴールドバッハ予想は Π 文で書け、その否定は Σ 文である。したがって、もしゴールドバッハ予想が $\PA$ で証明も反証もできないならば、予想は真である（偽なら否定は真な Σ 文で、Σ 完全性により $\PA$ で証明され、予想は反証されてしまう）。
:::

## 問題 {#pt:sec-pa-problems}

::: problem {#pt:prob-pa-cancellation}
$\PA\vdash\forall x\forall y\forall z\,(x+z<y+z\leftrightarrow x<y)$ と $\PA\vdash\forall x\forall y\,(x\le y\leftrightarrow\exists z\,(x+z=y))$ を示せ。
:::

::: solution
$\mathcal{M}\models\PA$ で示す。後者：$a<b$ なら \ref{pt:pa-order} の 6 より $a+S(c)=b$、$a=b$ なら $a+0=b$。逆に $a+c=b$ なら、\ref{pt:pa-addition} の 1 より $c=0$（$a=b$）か $c=S(c')$（6 より $a<b$）。前者：$a<b$ なら $a+S(c)=b$ で、$(a+z)+S(c)=(a+S(c))+z=b+z$（可換性・結合性）なので $a+z<b+z$。逆に $a+z<b+z$ で $a<b$ でないとすると、三分律より $a=b$ か $b<a$。前者なら $a+z<a+z$ で \ref{pt:pa-order} の 4 に反し、後者なら今示したことから $b+z<a+z$ で、2 と 4 に反する。
:::

::: problem {#pt:prob-sigma-examples}
次の論理式が Σ 論理式（さらに Δ 論理式）であることを示せ。(1) $x\mid y\defeq\exists z\,(z\cdot x=y)$、(2) $x$ が素数であること $\mathrm{Prime}(x)$。
:::

::: solution
(1) $\exists z\,(z\cdot x=y)$ は狭義の Σ 論理式である。$\PA$ の任意のモデルで、$z\cdot x=y$ なら $x=0$ のとき $y=0$ で $z=0$ としてよく、$x\neq0$ なら $z\le y$（$z\cdot x=z\cdot S(x')=z\cdot x'+z\ge z$。問題 \ref{pt:prob-pa-cancellation} の後半）。よって $\PA\vdash x\mid y\leftrightarrow\exists z<S(y)\,(z\cdot x=y)$ で、右辺は有界量化だけからなるので Δ 論理式である（\ref{pt:sigma-closure} の 2）。

(2) $\mathrm{Prime}(x)\defeq\underline{1}<x\wedge\forall y<x\,(y\mid x\to y=\underline{1})$（$y=0$ は $0\mid x$ が $x=0$ を意味し、$1<x$ と両立しないので問題ない）。(1) より $y\mid x$ は Δ で、Δ 論理式は $\to,\wedge$ と有界量化で閉じているので、$\mathrm{Prime}(x)$ は Δ 論理式である。
:::

::: problem {#pt:prob-not-sigma-complete-pi}
$\mathcal{N}$ で真な文 $\forall x\,\neg\,S(x)=x$ は $\PA$ で証明できることを示せ。一方、これは狭義の Σ 論理式ではないことを確認し、Σ 完全性の範囲外の真な文でも $\PA$ で証明できるものがあることを述べよ。
:::

::: solution
$\mathcal{M}\models\PA$ で $x$ についての帰納法：$S(0)\neq0$ は $\mathrm{S1}$。$S(a)\neq a$ として $S(S(a))=S(a)$ なら $\mathrm{S2}$ より $S(a)=a$ で矛盾。よって完全性定理から $\PA\vdash\forall x\,\neg\,S(x)=x$。この文は有界でない全称量化子を含み、狭義の Σ 論理式の定義の操作では作れない。Σ 完全性は十分条件を与えるだけで、$\PA$ は多くの Π 文も証明する。不完全性定理が示すのは、**すべての**真な Π 文を証明することはできない、ということである。
:::

::: supplement
**高い視点から：Σ 完全性は「上方への絶対性」である.** \ref{pt:sigma-upward} は、Σ 論理式が「始切片への延長」で保たれることを言っている。これは集合論で、Σ₁ 論理式が推移的な構造の拡大で上に保たれる（証拠が小さい構造にあれば大きい構造にもある）という絶対性の現象と同じ形である。有界量化子は「すでに見えている範囲」だけを調べ、存在量化子は「証拠を一つ見せる」だけなので、構造を外側に広げても真理は失われない。逆に全称量化子は「すべてを調べ尽くす」ことを要求するので、新しい元が加わると偽になりうる。計算論の言葉では、Σ 文は「探索すればいつか証拠が見つかる」主張（半決定可能な主張）であり、Σ 完全性は「そのような証拠は形式的な証明に変換できる」ことを述べている。
:::
