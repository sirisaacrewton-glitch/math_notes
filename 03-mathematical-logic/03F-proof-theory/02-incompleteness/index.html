# 算術と不完全性定理（Arithmetic and the Incompleteness Theorems）

ペアノ算術、Σ 論理式と Σ₁ 完全性、β 関数と有限列のコード化、ロビンソン算術 Q と計算可能関数の表現可能性定理、構文の算術化と証明可能性述語、導出可能性条件、対角化定理、第一・第二不完全性定理、ロッサーとタルスキの定理、レーブの定理。（Boolos 第 2・3 章、田中編『不完全性定理と算術の体系』第 I 部に対応）

<p class="mn-msc">MSC2020: 03F40, 03F30</p>

## 前提知識

- [一般論理 › 一階述語論理](../../../03-mathematical-logic/03B-general-logic/02-first-order-logic/index.html)（全体、9 ページ）：一階述語論理の構文・意味論・完全性定理
- [証明論と型理論 › 証明体系とカット除去](../../../03-mathematical-logic/03F-proof-theory/01-sequent-calculus/index.html)（全体、6 ページ）：ヒルベルト流の体系と自然演繹の同値性（算術化はヒルベルト流で行う）
- [計算理論 › 計算可能性理論](../../../03-mathematical-logic/03D-computability-theory/02-computability/index.html)（全体、12 ページ）：クリーネの標準形と停止問題（4 ページ目、表現可能性定理で使う）
