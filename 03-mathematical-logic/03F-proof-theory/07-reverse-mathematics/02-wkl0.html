# 弱ケーニッヒの補題と同値な定理 {#logic:page-rm-wkl0 keywords="WKL0, weak Konig's lemma, Sigma01 separation, recursively inseparable sets, Heine-Borel theorem, compactness of [0,1], uniform continuity, maximum principle, Brouwer fixed point theorem, reverse mathematics"}

$\mathsf{WKL}_{0}$ は、$\mathsf{RCA}_{0}$ に**弱ケーニッヒの補題**「無限の二分木は道をもつ」（\ref{pt:wkl-atr-axioms}）を加えた体系である。本ページでは、まず $\mathsf{WKL}$ が「互いに素な二つの $\Sigma^{0}_{1}$ 集合は集合で分離できる」という**$\Sigma^{0}_{1}$ 分離原理**と同値であることを示し（\ref{logic:wkl-separation}）、計算可能に分離できない二つの計算可能枚挙集合を使って $\mathsf{WKL}_{0}\neq\mathsf{RCA}_{0}$ を導く（\ref{logic:wkl-not-rca}）。次に、$[0,1]$ の**ハイネ–ボレルの被覆定理**が $\mathsf{RCA}_{0}$ の上で $\mathsf{WKL}$ と同値であること（\ref{logic:heine-borel-wkl}）を示す。これは「カントール空間のコンパクト性」が弱ケーニッヒの補題そのものであることの表れである。最後に、連続関数の一様連続性・有界性・最大値の存在、ブラウワーの不動点定理がどれも $\mathsf{WKL}_{0}$ と同値になること（\ref{logic:wkl-equivalents}）を述べる。

> 主な資料は田中一之『逆数学と 2 階算術』第 2 章 §2.3。証明は自分の言葉で組み立て直し、ハイネ–ボレルの定理から弱ケーニッヒの補題を導く部分は評価を補った。

## 記法と定義の確認 {#logic:sec-rm2-notation}

::: notation
- 二階算術、$\mathsf{RCA}_{0}$, $\mathsf{WKL}_{0}$、二分木と道、$2^{<\N}$、$\sigma\subseteq\tau$（始切片）は \ref{pt:page-soa-subsystems} のとおり（\ref{pt:big-five}, \ref{pt:wkl-atr-axioms}）。$\sigma i$ は $\sigma$ の後に文字 $i\in\{0,1\}$ を付けた列。
- $\mathsf{RCA}_{0}$ での実数・実数列・区間縮小法・連続関数の符号は \ref{logic:page-rm-rca0} のとおり（\ref{logic:rm-real}, \ref{logic:rm-nested-intervals}, \ref{logic:rm-continuous-code}）。
- 指数 $\varphi_{e}$ とクリーネの $T$ 述語は \ref{comp:page-universal-smn} のとおり。
:::

## Σ⁰₁ 分離原理 {#logic:sec-rm2-separation}

::: definition Σ⁰₁ 分離原理 {#logic:sigma01-separation keywords="Sigma01 separation principle" index="Σ⁰₁ 分離原理|しぐまぜろわんぶんりげんり"}
$\Sigma^{0}_{1}$ 論理式 $\varphi_{0}(n),\varphi_{1}(n)$（$X$ は自由に現れない）について
$$
\forall n\,\neg(\varphi_{0}(n)\wedge\varphi_{1}(n))\to\exists X\,\forall n\,\bigl((\varphi_{0}(n)\to n\in X)\wedge(\varphi_{1}(n)\to n\notin X)\bigr)
$$
を **$\Sigma^{0}_{1}$ 分離原理**（$\Sigma^{0}_{1}\text{-}\mathsf{SEP}$）という。
:::

::: remark
仮定を「$\forall n\,(\varphi_{0}(n)\leftrightarrow\neg\varphi_{1}(n))$」に強めると、結論の $X$ は $\{n:\varphi_{0}(n)\}$ そのものになり、$\Delta^{0}_{1}$ 内包公理と同じ主張になる。分離原理は「二つの集合の間に、どこでもよいから境界線を引ける」という主張で、境界線の引き方は一意でない。
:::

::: theorem 弱ケーニッヒの補題と Σ⁰₁ 分離 {#logic:wkl-separation keywords="WKL is equivalent to Sigma01 separation" index="弱ケーニッヒの補題と分離原理|じゃくけーにっひのほだいとぶんりげんり"}
$\mathsf{RCA}_{0}$ の上で、$\mathsf{WKL}$ と $\Sigma^{0}_{1}\text{-}\mathsf{SEP}$ は同値である。
:::

::: proof
**$\mathsf{WKL}\Rightarrow\Sigma^{0}_{1}\text{-}\mathsf{SEP}$.** $\varphi_{i}(n)\equiv\exists m\,\theta_{i}(m,n)$（$\theta_{i}$ は有界）とし、互いに素とする。二分木
$$
\begin{aligned}
T\defeq\bigl\{t\in2^{<\N}:{}&\forall m,n<\lvert t\rvert\,\bigl((\theta_{0}(m,n)\to t(n)=1)\\
&\qquad\wedge(\theta_{1}(m,n)\to t(n)=0)\bigr)\bigr\}
\end{aligned}
$$
は $\Sigma^{0}_{0}$ 内包公理で存在し、始切片で閉じている。$T$ は無限：各 $k$ について、長さ $k$ の列 $t$ を「$m,n<k$ で $\theta_{0}(m,n)$ なら $t(n)=1$、そうでなければ $0$」と定めると、$\theta_{1}(m',n)$ も成り立つ $n$ は（$\varphi_{0},\varphi_{1}$ が互いに素なので）ないから $t\in T$。$\mathsf{WKL}$ で道 $f$ をとり $X\defeq\{n:f(n)=1\}$ とする。$\varphi_{0}(n)$ なら、ある $m$ で $\theta_{0}(m,n)$ で、$k>m,n$ について $f\restr k\in T$ から $f(n)=1$。$\varphi_{1}$ も同様。

**$\Sigma^{0}_{1}\text{-}\mathsf{SEP}\Rightarrow\mathsf{WKL}$.** $T$ を無限二分木とする。各 $\sigma$ と $i\in\{0,1\}$ について「$\sigma i$ を延長する $T$ の元が有限個しかない」は、「ある $k$ で、長さ $k$ の $\sigma i$ の延長が $T$ にない」と同値で、$\Sigma^{0}_{1}$ 論理式 $\exists k\,\eta_{i}(k,\sigma)$（$\eta_{i}$ は有界）で書ける。これを「先に止まった方」に修正した
$$
\psi_{i}(\sigma)\defeq\exists k\,\bigl(\eta_{i}(k,\sigma)\wedge\forall k'<k\,\neg\eta_{1-i}(k',\sigma)\bigr)\quad(\text{$i=1$ では }\forall k'\le k)
$$
は互いに素な $\Sigma^{0}_{1}$ 論理式である（同じ $k$ で両方成り立つ場合は $\psi_{0}$ に入れるよう、不等号の向きを決めた）。分離原理で、$\psi_{0}(\sigma)\to\sigma\in X$, $\psi_{1}(\sigma)\to\sigma\notin X$ となる $X$ をとる。原始再帰で $s_{0}\defeq\varnothing$、$s_{n+1}\defeq s_{n}1$（$s_{n}\in X$ のとき）、$s_{n}0$（そうでないとき）とし、$f\defeq\bigcup_{n}s_{n}$ とする。

$n$ に関する帰納法で「$s_{n}$ を延長する $T$ の元は無限個ある」（$\Pi^{0}_{1}$ の形に書ける：各 $k$ について長さ $k$ の延長が $T$ にある）を示す。$n=0$ は $T$ が無限であることから。$s_{n}$ で成り立つとすると、$s_{n}0$ と $s_{n}1$ の少なくとも一方は無限個の延長をもつ。$s_{n}\in X$ のとき $s_{n+1}=s_{n}1$。もし $s_{n}1$ の延長が有限個なら、$\eta_{1}$ が成り立つ最小の $k_{1}$ があり、$s_{n}0$ の延長は無限個なので $\eta_{0}$ はどの $k$ でも成り立たず、$\psi_{1}(s_{n})$、したがって $s_{n}\notin X$ となり矛盾。$s_{n}\notin X$ の場合も同様（$\psi_{0}(s_{n})$ なら $s_{n}\in X$）。帰納法は $\Pi^{0}_{1}$ 帰納法（\ref{pt:rca0-basic} の 2）で行える。よってすべての $s_{n}\in T$ で、$f$ は $T$ の道である。
:::

::: lemma 計算可能に分離できない集合 {#logic:recursively-inseparable keywords="recursively inseparable c.e. sets" index="計算可能に分離できない集合|けいさんかのうにぶんりできないしゅうごう"}
$A_{i}\defeq\{e:\varphi_{e}(e)\downarrow=i\}$（$i=0,1$）は互いに素な計算可能枚挙集合で、$A_{0}\subseteq X$ かつ $A_{1}\cap X=\varnothing$ となる計算可能な集合 $X$ は存在しない。
:::

::: proof
$A_{i}$ は $e\mapsto\varphi_{e}(e)$ を計算して値が $i$ なら停止する手続きの定義域なので計算可能枚挙で、値は一つなので互いに素。計算可能な $X$ が分離するとし、その特性関数の指数を $a$ とする（$\varphi_{a}=\chi_{X}$）。$a\in X$ なら $\varphi_{a}(a)=1$ で $a\in A_{1}$、$A_{1}\cap X=\varnothing$ に反する。$a\notin X$ なら $\varphi_{a}(a)=0$ で $a\in A_{0}\subseteq X$ に反する。
:::

::: corollary WKL₀ は RCA₀ より真に強い {#logic:wkl-not-rca keywords="WKL0 is stronger than RCA0, Kleene tree"}
$\mathrm{REC}$ は $\mathsf{WKL}_{0}$ のモデルでない。したがって $\mathsf{RCA}_{0}\nvdash\mathsf{WKL}$。
:::

::: proof
$A_{0},A_{1}$ はパラメータのない $\Sigma^{0}_{1}$ 論理式で定義される（$T$ 述語を表す有界な論理式を使う。\ref{comp:sigma-semidecidable}）。ω モデル $\mathrm{REC}$ では論理式が本当の $A_{i}$ を定義するので、$\Sigma^{0}_{1}$ 分離原理が成り立つなら計算可能な分離集合があり、\ref{logic:recursively-inseparable} に反する。\ref{logic:wkl-separation} により $\mathsf{WKL}$ も成り立たない。$\mathrm{REC}\models\mathsf{RCA}_{0}$（\ref{pt:omega-rca0}）なので、$\mathsf{RCA}_{0}\nvdash\mathsf{WKL}$（健全性）。
:::

::: remark
証明を具体的にたどると、計算可能な無限二分木で、計算可能な道をもたないもの（**クリーネの木**）が得られる：\ref{logic:wkl-separation} の前半の木 $T$ を $A_{0},A_{1}$ について作ればよい。道は $A_{0}$ と $A_{1}$ を分離する集合の特性関数で、計算可能なものはない。
:::

## ハイネ–ボレルの定理 {#logic:sec-rm2-heine-borel}

::: definition 開集合の符号と被覆 {#logic:open-cover-code keywords="codes for open sets, open cover of [0,1]" index="開被覆（二階算術）|かいひふくにかいさんじゅつ"}
有理数 $p<q$ の開区間 $(p,q)$ を数でコード化し、コードの集合 $U$ を**開集合の符号**とする（コード $i$ の区間を $(p_{i},q_{i})$ と書く）。実数 $x$ が $U$ に属するとは、ある $i\in U$ で $p_{i}<x<q_{i}$ となることとする。$U$ が $[0,1]$ を**覆う**とは、$0\le x\le1$ となるすべての実数 $x$ が $U$ に属することをいう。**ハイネ–ボレルの定理**とは「$[0,1]$ を覆う開集合の符号 $U$ に対し、有限部分集合 $U'\subseteq U$ で $[0,1]$ を覆うものがある」という主張である。
:::

::: theorem ハイネ–ボレルの定理と弱ケーニッヒの補題 {#logic:heine-borel-wkl keywords="Heine-Borel theorem is equivalent to WKL" index="ハイネ–ボレルの定理（逆数学）|はいねぼれるのていりぎゃくすうがく"}
$\mathsf{RCA}_{0}$ の上で、ハイネ–ボレルの定理と $\mathsf{WKL}$ は同値である。
:::

::: intuition
二分木の節点 $s$ に、二進の区間 $[a_{s},b_{s}]$（$s$ を二進小数の最初の桁とする区間）を対応させると、木の道は $[0,1]$ の点に対応する。被覆に入っていない区間の節点を集めた木が無限なら、弱ケーニッヒの補題で道があり、その道の点は被覆されないので矛盾する。したがってその木は有限で、ある深さで全部の区間が被覆の有限個の区間に入る。

::: proof
**$\mathsf{WKL}\Rightarrow$ ハイネ–ボレル.** $s\in2^{<\N}$ に有理数 $a_{s}\defeq\sum_{i<\lvert s\rvert}s(i)2^{-i-1}$, $b_{s}\defeq a_{s}+2^{-\lvert s\rvert}$ を対応させる。$s\subseteq t$ なら $[a_{t},b_{t}]\subseteq[a_{s},b_{s}]$。$U$ が $[0,1]$ を覆うとし、
$$
T\defeq\{s\in2^{<\N}:\neg\exists i<\lvert s\rvert\,(i\in U\wedge p_{i}<a_{s}\wedge b_{s}<q_{i})\}
$$
とする（$\Sigma^{0}_{0}$ 内包公理で存在し、始切片で閉じている）。

*$T$ は道をもたない.* 道 $f$ があるとすると、区間縮小法（\ref{logic:rm-nested-intervals}）で $x\defeq\lim_{n}a_{f\restr n}=\lim_{n}b_{f\restr n}\in[0,1]$ がある。$U$ が覆うので、ある $i\in U$ で $p_{i}<x<q_{i}$。$\delta\defeq\min(x-p_{i},q_{i}-x)>0$ について、$2^{-n}<\delta$ かつ $n>i$ となる $n$ をとると、$x\in[a_{s},b_{s}]$（$s=f\restr n$）でその長さは $2^{-n}$ なので $p_{i}<a_{s}$, $b_{s}<q_{i}$、すなわち $s\notin T$ となり矛盾。

*有限部分被覆.* $\mathsf{WKL}$ から $T$ は有限で、ある $n$ で長さ $n$ の列は $T$ に属さない。すなわち長さ $n$ のどの $s$ にも、$i<n$, $i\in U$ で $p_{i}<a_{s}\le b_{s}<q_{i}$ となるものがある。$U'\defeq\{i\in U:i<n\}$（有限集合で、$\Sigma^{0}_{0}$ 内包公理で存在する）とすると、$x\in[0,1]$ はある長さ $n$ の $s$ の $[a_{s},b_{s}]$ に属する（$x$ の近似から $s$ を決められる。境界の点はどちらの区間でもよい）ので、$U'$ に属する。

**ハイネ–ボレル $\Rightarrow\mathsf{WKL}$.** 道をもたない二分木 $T$ が有限であることを示す（対偶で $\mathsf{WKL}$ が得られる）。$s$ に**三進の区間** $I_{s}\defeq[c_{s},c_{s}+3^{-\lvert s\rvert}]$, $c_{s}\defeq\sum_{i<\lvert s\rvert}2s(i)\,3^{-i-1}$ を対応させる（$I_{s0},I_{s1}$ は $I_{s}$ の左右の三分の一）。$I_{s}$ の中央の開区間 $G_{s}\defeq(c_{s}+3^{-\lvert s\rvert-1},c_{s}+2\cdot3^{-\lvert s\rvert-1})$ を**隙間**という。$B\defeq\{s\notin T:\forall i<\lvert s\rvert\,(s\restr i\in T)\}$（$s$ の真の始切片はすべて $T$ に属する、すなわち $T$ に属さない極小の列の集合）とし、
$$
J_{s}\defeq\bigl(c_{s}-3^{-\lvert s\rvert-1},\ c_{s}+3^{-\lvert s\rvert}+3^{-\lvert s\rvert-1}\bigr)\quad(s\in B)
$$
（$I_{s}$ を両側に $3^{-\lvert s\rvert-1}$ 広げた開区間）とする。開集合の符号 $U\defeq\{J_{s}:s\in B\}\cup\{G_{s}:s\in2^{<\N}\}\cup\{(-1,0'),(1',2)\}$ を考える。ただし最後の二つは $[0,1]$ の外側を覆う区間で、$0',1'$ は省略して $(-1,0)$ と $(1,2)$ の代わりに端点を少し内側に寄せたものとする（$0$ と $1$ はカントール集合の点なので、$J_{s}$ に覆わせる）。

*$U$ は $[0,1]$ を覆う.* $x\in[0,1]$ がどの隙間にも属さないとする。原始再帰で $f(n)$ を、$x$ が $I_{f\restr n\,0}$ に属するなら $0$、$I_{f\restr n\,1}$ に属するなら $1$ と定める（$x$ は $I_{f\restr n}$ の中央の隙間に属さないので、二つのどちらかに属し、隙間の幅 $3^{-n-1}$ より細かい $x$ の近似で判定できる）。$f$ は $T$ の道でないので、ある $n$ で $f\restr n\notin T$、最小の $n$ をとると $f\restr n\in B$ で、$x\in I_{f\restr n}\subseteq J_{f\restr n}$。

*$J_{s}$ は互いに交わらず、カントール集合の点を他から守る.* $s,t\in B$ は（$B$ が極小の元の集合なので）比較不能で、共通の始切片 $r$ の後で分かれる。$I_{s}$ と $I_{t}$ の間には幅 $3^{-\lvert r\rvert-1}$ の隙間 $G_{r}$ があり、$J_{s},J_{t}$ の広げた分の和は $3^{-\lvert s\rvert-1}+3^{-\lvert t\rvert-1}\le2\cdot3^{-\lvert r\rvert-2}<3^{-\lvert r\rvert-1}$ なので交わらない。また、$I_{s}$ の左端の点 $c_{s}$（カントール集合の点）を含む $U$ の区間は、隙間でも他の $J_{t}$ でもないので $J_{s}$ だけである。

*有限性.* ハイネ–ボレルの定理で有限部分被覆 $U'$ をとる。前段落から、すべての $s\in B$ で $J_{s}\in U'$。よって $B$ は有限で、$N$ を $B$ の元の長さの最大より大きくとる。長さ $N$ の $t\in T$ があるとすると、点 $c_{t}$（カントール集合の点）はある $J_{s}\in U'$（$s\in B$）に属し、$J_{s}$ に含まれるカントール集合の点は $I_{s}$ の点だけなので（$J_{s}$ の広げた部分は隣の隙間の中にある）、$c_{t}\in I_{s}$、すなわち $s\subseteq t$。$s\notin T$ なのに $t\in T$ は $T$ が始切片で閉じていることに反する。よって $T$ の元の長さはすべて $N$ 未満で、$T$ は有限である。
:::

## 連続関数の性質と WKL₀ {#logic:sec-rm2-continuous}

::: theorem 一様連続性 {#logic:wkl-uniform-continuity keywords="continuous functions on [0,1] are uniformly continuous in WKL0" index="一様連続性（WKL₀）|いちようれんぞくせいだぶりゅけーえるぜろ"}
$\mathsf{WKL}_{0}$ で次が証明できる：定義域が $[0,1]$ を含む連続関数 $f$ は $[0,1]$ 上で一様連続である。すなわち、各 $n$ に有理数 $\delta>0$ があって、$x,y\in[0,1]$, $\lvert x-y\rvert<\delta$ なら $\lvert f(x)-f(y)\rvert<2^{-n}$。
:::

::: proof
$f$ の符号を $\Phi$ とし、$n$ を固定する。開集合の符号
$$
U\defeq\{i:\exists j<i\,\bigl((p_{i},q_{i},c_{j},d_{j})\in\Phi\wedge d_{j}-c_{j}<2^{-n-1}\bigr)\}
$$
（$j$ は値の区間 $[c_{j},d_{j}]$ のコード）を考える。$x\in[0,1]$ は定義域に属するので、$(p,q,c,d)\in\Phi$ で $p<x<q$, $d-c<2^{-n-1}$ となるものがあり、符号の性質 4（\ref{logic:rm-continuous-code}）から $p\le p_{i}<x<q_{i}\le q$ となる区間のコード $i$ を（コードの値がいくらでも大きくなるように）選べるので、$i\in U$ かつ $p_{i}<x<q_{i}$。よって $U$ は $[0,1]$ を覆う。ハイネ–ボレルの定理（\ref{logic:heine-borel-wkl}）で有限部分被覆 $U'$ をとり、その区間たちの**ルベーグ数**（$[0,1]$ の幅 $\delta$ の区間がどれも一つの $(p_{i},q_{i})$ に収まる正の有理数。有限個の有理区間から計算できる）を $\delta$ とする。$\lvert x-y\rvert<\delta$ なら $x,y$ は同じ $(p_{i},q_{i})$（$i\in U'$）に入り、$f(x),f(y)\in[c_{j},d_{j}]$ なので $\lvert f(x)-f(y)\rvert<2^{-n-1}<2^{-n}$。
:::

::: theorem WKL₀ と同値な定理 {#logic:wkl-equivalents keywords="theorems equivalent to WKL0: boundedness, maximum, Brouwer fixed point" index="WKL₀ と同値な定理|だぶりゅけーえるぜろとどうちなていり"}
$\mathsf{RCA}_{0}$ の上で、次はどれも $\mathsf{WKL}$ と同値である。
1. ハイネ–ボレルの定理（\ref{logic:heine-borel-wkl}）。
2. $[0,1]$ 上の連続関数は一様連続である。
3. $[0,1]$ 上の連続関数は有界である。
4. $[0,1]$ 上の有界な連続関数は上限をもつ。
5. $[0,1]$ 上の連続関数で上限をもつものは、最大値をとる。
6. ブラウワーの不動点定理（$n\ge2$ 次元の閉正方形からそれ自身への連続写像は不動点をもつ）。
:::

::: proof
1 は \ref{logic:heine-borel-wkl}、$\mathsf{WKL}\Rightarrow$ 2 は \ref{logic:wkl-uniform-continuity}。$\mathsf{WKL}\Rightarrow$ 3〜5 は、2 と同様に有限部分被覆から値の上界を計算し、さらに「最大値をとらない」と仮定して上限の近くの値をとる点の被覆を作り、有限部分被覆から上限より小さい上界が得られて矛盾する、という議論による（田中の本の定理 2.16）。逆向き（2〜5 から $\mathsf{WKL}$）は、$\mathsf{WKL}$ が成り立たないと仮定し、道をもたない無限二分木 $T$ の極小の非元 $B$ に対応する区間 $[a_{s},b_{s}]$（$s\in B$）を使う：これらは $[0,1]$ を「端点だけを共有して」覆う無限個の閉区間の族（**特異閉被覆**）になり、区間 $[a_{s},b_{s}]$ の上で高さ $\lvert s\rvert$ の山形の関数をつなぐと、連続だが有界でない関数ができる（3 の反例）。高さを変えれば 4・5 の反例も同様に作れる。6 は、$\mathsf{WKL}_{0}$ で一様連続性を使って有限の組合せ論（スペルナーの補題）に帰着させる通常の証明が通り、逆は特異閉被覆から不動点のない連続写像を作ることによる（田中の本の定理 2.17, 2.18）。本サイトでは、2〜6 の細部（とくに反例の関数の符号を作る部分）は省略した。
:::

::: hypcheck
- **$\Pi^{0}_{1}$ 帰納法**：\ref{logic:wkl-separation} の後半で「$s_{n}$ の延長が無限個ある」（$\Pi^{0}_{1}$）を $n$ について示すのに使った。
- **分離論理式の修正**：$\psi_{0},\psi_{1}$ を「先に証拠が見つかった方」にしたことで、互いに素であることが保証され、分離原理の仮定が満たされた。
- **区間縮小法**：ハイネ–ボレルの定理の前半で、道から $[0,1]$ の点を作るのに使った。
- **三進の区間を使ったこと**：後半で、区間の間に正の幅の隙間があるので、点がどちらの子の区間に入るかが計算で決められ、また $J_{s}$ が互いに交わらないようにできた。二進の区間では隣の区間と端点を共有するため、この議論が通らない。
- **ω モデルの健全性**：\ref{logic:wkl-not-rca} で、$\mathrm{REC}$ が $\mathsf{RCA}_{0}$ のモデルで $\mathsf{WKL}$ のモデルでないことから、証明できないことを結論した。
:::

## 問題 {#logic:sec-rm2-problems}

::: problem {#logic:prob-wkl-lindenbaum}
$\mathsf{WKL}_{0}$ で、「可算言語の無矛盾な命題論理の論理式の集合（の符号）は、極大無矛盾な集合に拡大できる」ことを示す証明の方針を述べよ（命題変数は $p_{0},p_{1},\dots$、論理式は数で符号化されているとする）。
:::

::: solution
論理式の集合 $\Gamma$ について、二分木 $T$ を「長さ $k$ の $t$ が $T$ に属する $\iff$ 付値 $p_{i}\mapsto t(i)$（$i<k$）が、$\Gamma$ の元のうちコードが $k$ 未満で変数が $p_{0},\dots,p_{k-1}$ だけのものをすべて真にする」で定める（有界な条件なので存在する）。$\Gamma$ が（有限的に）充足可能、すなわち命題論理の完全性（コンパクト性）の有限版により各有限部分が充足可能なら、$T$ は各長さに元をもつ無限木である。$\mathsf{WKL}$ で道 $f$ をとると、付値 $p_{i}\mapsto f(i)$ は $\Gamma$ のすべての元を真にし、その付値で真になる論理式全体（$\Delta^{0}_{1}$ で定義できる）が極大無矛盾な拡大になる。（有限部分の無矛盾性から充足可能性を得る部分は、$\mathsf{RCA}_{0}$ で真理表を有限に調べればよい。）
:::

::: problem {#logic:prob-kleene-tree-measure}
$\mathrm{REC}$ には、無限個の節点をもつが計算可能な道をもたない計算可能な二分木がある（\ref{logic:wkl-not-rca} の後の注意）。このような木では、道全体の集合は空でないが、計算可能な点を一つも含まないことを確かめよ。
:::

::: solution
木 $T$ は無限なので、（$\mathcal{P}(\N)$ 全体を集合の領域とする本当の数学で）ケーニッヒの補題により道をもつ。道は $A_{0}$ と $A_{1}$ を分離する集合の特性関数で、\ref{logic:recursively-inseparable} からどれも計算可能でない。したがって道の集合（カントール空間の空でない閉集合）は、計算可能な点を含まない。
:::

::: supplement
**前提の検討.**
- $\mathsf{RCA}_{0}$ の $\Delta^{0}_{1}$ 内包公理を $\Sigma^{0}_{1}$ 分離原理で置き換えた体系は $\mathsf{WKL}_{0}$ と同値になる（分離原理から $\Delta^{0}_{1}$ 内包公理が出る）。一方、$\Delta^{0}_{1}$ 内包公理を弱ケーニッヒの補題で置き換えただけでは同値にならない：集合の領域がほとんど空でも、弱ケーニッヒの補題は（無限の木がないので）自明に成り立ちうる。
- ハイネ–ボレルの定理を「可算な開被覆」に限ったのは、二階算術で表せる被覆が可算なものだけだからである。

**関連する結果.**
- *保存性.* $\mathsf{WKL}_{0}$ は $\Pi^{1}_{1}$ 文について $\mathsf{RCA}_{0}$ の保存拡大であり（ハーリントン）、$\Pi^{0}_{2}$ 文について $\mathsf{PRA}$ の保存拡大である（フリードマン）。したがって、$\mathsf{WKL}_{0}$ で証明できる算術の $\Pi^{0}_{2}$ 文は有限の立場（$\mathsf{PRA}$）で正当化でき、これは**ヒルベルトのプログラムの部分的な実現**と呼ばれている（シンプソン）。保存性の証明は \ref{pt:page-soa-wkl0-conservation} で扱う予定である。
- *低基底定理.* 計算可能な無限二分木は、跳躍が $\varnothing'$ から計算できる（**低い**）道をもつ（ヨックシュ–ソーア、\ref{comp:low-basis}）。これを繰り返すと、すべての元が低い $\mathsf{WKL}_{0}$ の ω モデルが作れ、$\varnothing'$ を含まないので $\mathsf{WKL}_{0}\neq\mathsf{ACA}_{0}$ が従う。

**高い視点から：コンパクト性は木の道.** 「無限の二分木は道をもつ」は、カントール空間 $2^{\N}$ がコンパクトであることの組合せ的な言い換えである：木の節点は基本開集合、木から除かれる節点は被覆の開集合、道は被覆されずに残る点に当たる。ハイネ–ボレルの定理との同値性（\ref{logic:heine-borel-wkl}）は、$[0,1]$ とカントール空間の間の連続な全射（二進展開）と、カントール集合の埋め込み（三進展開）を通して、二つのコンパクト性が互いに導けることを形式化したものである。比喩で言えば、$\mathsf{WKL}_{0}$ は「無限に分かれる道を進むとき、行き止まりにならない道が少なくとも一本は存在すると信じてよい」体系で、その道を具体的に計算する方法は与えない。この「存在だけを認め、計算は求めない」中間の強さが、解析学の多くの定理（コンパクト性に基づくもの）にちょうど合っている。
:::
