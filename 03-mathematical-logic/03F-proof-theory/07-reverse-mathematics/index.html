# 逆数学（Reverse Mathematics）

二階算術の部分体系を基準に、通常の数学の定理を証明するのに必要十分な公理を決める。RCA₀ での実数と連続関数、弱ケーニッヒの補題と同値な定理（ハイネ–ボレル、Σ⁰₁ 分離）、算術的内包と同値な定理（完備性、ケーニッヒの補題）、ラムゼーの定理。（田中一之『逆数学と2階算術』第 2 章に対応）

<p class="mn-msc">MSC2020: 03B30, 03F35</p>
