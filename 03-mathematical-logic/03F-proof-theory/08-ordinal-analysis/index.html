# 順序数解析（Ordinal Analysis）

カントール標準形と ε₀、標準的な ε₀ 順序、ω 規則をもつ無限シーケント計算とカット除去、ペアノ算術の埋め込みとゲンツェンの限界定理、ゲンツェンの整列性証明（PA の証明論的順序数は ε₀）。（新井『数学基礎論』第 8 章 §8.4 に対応）

<p class="mn-msc">MSC2020: 03F15, 03F05</p>
