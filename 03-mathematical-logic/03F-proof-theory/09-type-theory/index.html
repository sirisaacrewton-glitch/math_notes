# 型理論（Type Theory）

カリー＝ハワード＝ランベック対応を軸に、型と証明と圏の対応を扱う。直観主義論理の自然演繹と単純型付きラムダ計算の対応（証明＝項、証明の正規化＝β 簡約）と強正規化、ゲーデルの体系 T（高い型の原始再帰、アッカーマン関数）、System F（二階の型、還元可能性候補、データ型の符号化）。デカルト閉圏による解釈と健全性・完全性、構文圏と内部言語（ランベック対応）。依存型理論（Π 型・Σ 型・型理論的選択公理）、恒等型と道帰納法（亜群の法則・可縮性）、ホモトピー型理論の入口（同値・一価性公理・宇宙が集合でないこと・ヘドベリの定理）。

<p class="mn-msc">MSC2020: 03B40, 03B38, 03F55, 18C50</p>
