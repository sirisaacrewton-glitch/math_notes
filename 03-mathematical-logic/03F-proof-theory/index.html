# 証明論と型理論（Proof Theory & Type Theory）

シーケント計算とカット除去、算術の形式化とゲーデルの不完全性定理、証明可能性論理、二階算術とその部分体系、逆数学、順序数解析（ε₀ と PA）、型理論（カリー＝ハワード＝ランベック対応、ホモトピー型理論）。

<p class="mn-msc">MSC2020: 03F</p>

## 分野

<div class="mn-cards">
<a class="mn-card" href="01-sequent-calculus/index.html"><span class="mn-card-title">証明体系とカット除去</span><span class="mn-card-en">Proof Systems and Cut Elimination</span><span class="mn-card-desc">α 同値、導出図の固有変数・束縛変数の付け替え（高さとカットのない形を保つ代入）、シーケント計算 LK、自然演繹・LK・ヒルベルト流の同値性、ゲンツェンのカット除去定理、前原の方法による補間定理、ベートの定義可能性定理。（参考書なし。順序数解析の系列はこの後に置く）</span><span class="mn-card-count">6 ページ</span></a>
<a class="mn-card" href="02-incompleteness/index.html"><span class="mn-card-title">算術と不完全性定理</span><span class="mn-card-en">Arithmetic and the Incompleteness Theorems</span><span class="mn-card-desc">ペアノ算術、Σ 論理式と Σ₁ 完全性、β 関数と有限列のコード化、ロビンソン算術 Q と計算可能関数の表現可能性定理、構文の算術化と証明可能性述語、導出可能性条件、対角化定理、第一・第二不完全性定理、ロッサーとタルスキの定理、レーブの定理。（Boolos 第 2・3 章、田中編『不完全性定理と算術の体系』第 I 部に対応）</span><span class="mn-card-count">10 ページ</span></a>
<a class="mn-card" href="03-provability-logic/index.html"><span class="mn-card-title">証明可能性論理 GL</span><span class="mn-card-en">The Provability Logic GL</span><span class="mn-card-desc">算術的解釈と GL・GLS の健全性、閉様相論理式の標準形、反映原理、不動点定理、補間定理、ソロヴェイの算術的完全性定理。（Boolos 第 3 章後半・第 7〜9 章に対応）</span><span class="mn-card-count">8 ページ</span></a>
<a class="mn-card" href="04-provability-logic-extensions/index.html"><span class="mn-card-title">証明可能性論理の展開</span><span class="mn-card-en">Further Provability Logics</span><span class="mn-card-desc">Grz と S4 を保つ様相の解釈、集合論・解析学における様相論理、無矛盾性と ω 無矛盾性の結合証明可能性論理 GLB。（Boolos 第 12〜16 章に対応）</span><span class="mn-card-count">6 ページ</span></a>
<a class="mn-card" href="05-quantified-provability-logic/index.html"><span class="mn-card-title">量化された証明可能性論理</span><span class="mn-card-en">Quantified Provability Logic</span><span class="mn-card-desc">量化様相論理の算術的解釈、常に証明可能な論理式の集合と常に真な論理式の集合の決定不能性の程度、1 項述語 1 つの場合。（Boolos 第 17・18 章に対応）</span><span class="mn-card-count">4 ページ</span></a>
<a class="mn-card" href="06-second-order-arithmetic/index.html"><span class="mn-card-title">二階算術</span><span class="mn-card-en">Second-Order Arithmetic</span><span class="mn-card-desc">二階算術の言語と ω モデル、解析的階層、内包公理と部分体系（RCA₀, WKL₀, ACA₀, ATR₀, Π¹₁-CA₀）、ACA₀ の PA 上の保存性、選択公理・従属選択・超限帰納法と β モデル、強制法によるハーリントンの定理、半正則切断によるフリードマンの定理。（田中一之『逆数学と2階算術』第 2・3 章に対応）</span><span class="mn-card-count">5 ページ</span></a>
<a class="mn-card" href="07-reverse-mathematics/index.html"><span class="mn-card-title">逆数学</span><span class="mn-card-en">Reverse Mathematics</span><span class="mn-card-desc">二階算術の部分体系を基準に、通常の数学の定理を証明するのに必要十分な公理を決める。RCA₀ での実数と連続関数、弱ケーニッヒの補題と同値な定理（ハイネ–ボレル、Σ⁰₁ 分離）、算術的内包と同値な定理（完備性、ケーニッヒの補題）、ラムゼーの定理。（田中一之『逆数学と2階算術』第 2 章に対応）</span><span class="mn-card-count">4 ページ</span></a>
<a class="mn-card" href="08-ordinal-analysis/index.html"><span class="mn-card-title">順序数解析</span><span class="mn-card-en">Ordinal Analysis</span><span class="mn-card-desc">カントール標準形と ε₀、標準的な ε₀ 順序、ω 規則をもつ無限シーケント計算とカット除去、ペアノ算術の埋め込みとゲンツェンの限界定理、ゲンツェンの整列性証明（PA の証明論的順序数は ε₀）。（新井『数学基礎論』第 8 章 §8.4 に対応）</span><span class="mn-card-count">5 ページ</span></a>
<a class="mn-card" href="09-type-theory/index.html"><span class="mn-card-title">型理論</span><span class="mn-card-en">Type Theory</span><span class="mn-card-desc">カリー＝ハワード＝ランベック対応を軸に、型と証明と圏の対応を扱う。直観主義論理の自然演繹と単純型付きラムダ計算の対応（証明＝項、証明の正規化＝β 簡約）と強正規化、ゲーデルの体系 T（高い型の原始再帰、アッカーマン関数）、System F（二階の型、還元可能性候補、データ型の符号化）。デカルト閉圏による解釈と健全性・完全性、構文圏と内部言語（ランベック対応）。依存型理論（Π 型・Σ 型・型理論的選択公理）、恒等型と道帰納法（亜群の法則・可縮性）、ホモトピー型理論の入口（同値・一価性公理・宇宙が集合でないこと・ヘドベリの定理）。</span><span class="mn-card-count">8 ページ</span></a>
</div>
