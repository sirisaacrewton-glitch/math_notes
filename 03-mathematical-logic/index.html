# 数理論理学と数学基礎論（Mathematical Logic and Foundations）

一般論理（一階述語論理・様相論理）、モデル理論、計算可能性理論、集合論、証明論。

<p class="mn-msc">MSC2020: 03</p>

## 分野

<div class="mn-cards">
<a class="mn-card" href="03B-general-logic/index.html"><span class="mn-card-title">一般論理</span><span class="mn-card-en">General Logic</span><span class="mn-card-desc">命題論理と一階述語論理の構文・意味論・証明体系と完全性定理、様相論理（クリプキ意味論・完全性・決定可能性）。</span><span class="mn-card-count">21 ページ</span></a>
<a class="mn-card" href="03C-model-theory/index.html"><span class="mn-card-title">モデル理論</span><span class="mn-card-en">Model Theory</span><span class="mn-card-desc">構造と理論、コンパクト性、初等部分構造、ヴォートの判定法、量化子消去、型と可算モデル、飽和モデル、識別不能列、超積、安定性と非可算範疇性（モーリーの範疇性定理）。</span><span class="mn-card-count">28 ページ</span></a>
<a class="mn-card" href="03D-computability-theory/index.html"><span class="mn-card-title">計算理論</span><span class="mn-card-en">Theory of Computation</span><span class="mn-card-desc">オートマトンと形式言語、計算可能性理論（プログラミング言語 L、原始再帰関数と一般再帰関数、レジスタ機械とチューリング機械、決定可能性と還元、万能プログラム・smn 定理・再帰定理）、その発展（論理的理論の決定可能性、チューリング還元と算術的階層）、計算複雑性、コルモゴロフ複雑性とアルゴリズム的ランダムネス、型なしラムダ計算。</span><span class="mn-card-count">60 ページ</span></a>
<a class="mn-card" href="03E-set-theory/index.html"><span class="mn-card-title">集合論</span><span class="mn-card-en">Set Theory</span><span class="mn-card-desc">公理的集合論。基礎事項から無限組合せ論・構成可能集合・強制法まで。章立ては Kunen『Set Theory』(1980) を参考にしている。</span><span class="mn-card-count">61 ページ</span></a>
<a class="mn-card" href="03F-proof-theory/index.html"><span class="mn-card-title">証明論と型理論</span><span class="mn-card-en">Proof Theory &amp; Type Theory</span><span class="mn-card-desc">シーケント計算とカット除去、算術の形式化とゲーデルの不完全性定理、証明可能性論理、二階算術とその部分体系、逆数学、順序数解析（ε₀ と PA）、型理論（カリー＝ハワード＝ランベック対応、ホモトピー型理論）。</span><span class="mn-card-count">58 ページ</span></a>
</div>
