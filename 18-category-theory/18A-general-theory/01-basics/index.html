# 圏論の基礎（Basic Category Theory）

圏・関手・自然変換、米田の補題、極限と余極限、随伴、圏同値、随伴関手定理、位相空間の圏の随伴（始位相・終位相、完備性、ハウスドルフ化）。（Mac Lane『Categories for the Working Mathematician』第 I〜V 章に対応）

<p class="mn-msc">MSC2020: 18A</p>
