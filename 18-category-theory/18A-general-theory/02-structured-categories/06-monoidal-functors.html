# モノイダル関手と厳密化 {#cat:page-monoidal-functors keywords="monoidal functor, lax monoidal functor, strong monoidal functor, strict monoidal functor, monoidal natural transformation, monoidal equivalence, strictification theorem, every monoidal category is equivalent to a strict one, Cayley embedding"}

モノイダル圏（\ref{cat:page-monoidal}）の間の「構造を保つ関手」が**モノイダル関手**（\ref{cat:monoidal-functor}）である。ただし構造は等式ではなく射 $F(a)\square F(b)\to F(a\square b)$ で保たれ、それが同型のものを**強**、恒等射のものを**厳密**という。たとえば忘却関手 $(\mathbf{Ab},\otimes)\to(\mathbf{Set},\times)$ は強でないモノイダル関手で、環をその乗法モノイドに移す（\ref{cat:monoidal-functor-monoids}）。本ページの主定理は**厳密化定理**（\ref{cat:strictification}）で、すべてのモノイダル圏は、強モノイダル関手によって厳密モノイダル圏と圏同値になる。これにより、モノイダル圏の計算では「結合子と単位子を恒等射とみなしてよい」ことが正当化される。

> 資料：Mac Lane, *Categories for the Working Mathematician* 第 XI 章 §2–§3。厳密化定理で Mac Lane が「コヒーレンス定理から従う」とだけ書いた $\mathbf{S}$ の射の積の関手性・単位律、$G$ の公理、$GF\cong1$ のモノイダル性を、標準射の等式に帰着させて確かめた。また、コヒーレンス定理を「語の文字ごとに別の対象を入れた形」で使うことを明示した（\ref{cat:multivariable-coherence}）。

## 記法と定義の確認 {#cat:sec-mf-notation}

::: notation
- モノイダル圏 $(\mathbf{M},\square,e,\alpha,\lambda,\varrho)$、結合子 $\alpha_{a,b,c}\colon a\square(b\square c)\to(a\square b)\square c$、単位子 $\lambda_{a}\colon e\square a\to a$, $\varrho_{a}\colon a\square e\to a$、五角形・三角形の等式、厳密モノイダル圏、二項語・基本射・コヒーレンス定理は \ref{cat:monoidal-category}, \ref{cat:binary-words}, \ref{cat:coherence} のとおり。単位子の派生した三角形 $(\lambda_{b}\square1_{c})\circ\alpha_{e,b,c}=\lambda_{b\square c}$ は \ref{cat:monoidal-derived-triangles}。
- モノイダル圏のモノイド $(c,\mu,\eta)$ は \ref{cat:monoid-object}、圏同値（充満忠実で本質的全射）は \ref{cat:page-equivalence} のとおり。
- 二つ目のモノイダル圏の構造は $(\mathbf{M}',\square,e',\alpha',\lambda',\varrho')$ とプライムで区別する（積の記号は同じ $\square$ を使う）。
:::

## モノイダル関手 {#cat:sec-mf-functors}

::: definition モノイダル関手 {#cat:monoidal-functor keywords="monoidal functor, lax monoidal functor, strong monoidal functor, strict monoidal functor" index="モノイダル関手|ものいだるかんしゅ, 強モノイダル関手|きょうものいだるかんしゅ, 厳密モノイダル関手|げんみつものいだるかんしゅ"}
モノイダル圏 $\mathbf{M},\mathbf{M}'$ の間の**モノイダル関手** $(F,F_{2},F_{0})\colon\mathbf{M}\to\mathbf{M}'$ は、関手 $F\colon\mathbf{M}\to\mathbf{M}'$、$a,b$ について自然な射 $F_{2}(a,b)\colon F(a)\square F(b)\to F(a\square b)$、射 $F_{0}\colon e'\to F(e)$ の組で、次の三つの等式を満たすものである。
$$
\begin{aligned}
&F_{2}(a\square b,c)\circ(F_{2}(a,b)\square1)\circ\alpha'_{Fa,Fb,Fc}=F(\alpha_{a,b,c})\circ F_{2}(a,b\square c)\circ(1\square F_{2}(b,c)),\\
&F(\varrho_{a})\circ F_{2}(a,e)\circ(1\square F_{0})=\varrho'_{Fa},\qquad F(\lambda_{a})\circ F_{2}(e,a)\circ(F_{0}\square1)=\lambda'_{Fa}.
\end{aligned}
$$
（第一式の両辺は $Fa\square(Fb\square Fc)\to F((a\square b)\square c)$。）$F_{0}$ とすべての $F_{2}(a,b)$ が同型のとき**強モノイダル関手**、恒等射のとき（したがって $F(a\square b)=F(a)\square F(b)$, $F(e)=e'$ のとき）**厳密モノイダル関手**という。
:::

::: remark
文献によっては、上の意味のモノイダル関手を「緩い（lax）モノイダル関手」と呼び、「モノイダル関手」は強モノイダル関手を指すことがある。本サイトでは Mac Lane に従い、上の定義を「モノイダル関手」と呼ぶ。射の向きを逆にした $F(a\square b)\to F(a)\square F(b)$, $F(e)\to e'$ をもつものは**余モノイダル関手**（oplax）と呼ばれる。
:::

::: example
1. **忘却関手.** $U\colon(\mathbf{Ab},\otimes,\mathbb{Z})\to(\mathbf{Set},\times,1)$ は、$U_{2}(A,B)\colon UA\times UB\to U(A\otimes B)$, $(a,b)\mapsto a\otimes b$ と $U_{0}\colon1\to\mathbb{Z}$, $\ast\mapsto1$ でモノイダル関手になる。第一式は両辺とも $(a,(b,c))\mapsto(a\otimes b)\otimes c$、単位の式は $a\otimes1\mapsto a$ から従う。$U_{2}$ は全単射でない（$a\otimes b$ の形でない元がありうるし、$(2a,b)$ と $(a,2b)$ が同じ元に移る）ので強ではない。
2. **自由アーベル群.** 集合 $X$ 上の自由アーベル群 $\mathbb{Z}[X]$ は強モノイダル関手 $(\mathbf{Set},\times,1)\to(\mathbf{Ab},\otimes,\mathbb{Z})$ を与える。$F_{2}\colon\mathbb{Z}[X]\otimes\mathbb{Z}[Y]\to\mathbb{Z}[X\times Y]$ は $x\otimes y\mapsto(x,y)$、$F_{0}\colon\mathbb{Z}\to\mathbb{Z}[1]$ は $1\mapsto\ast$ である。$F_{2}$ が同型であることは、任意のアーベル群 $C$ について
$$
\begin{aligned}
\mathbf{Ab}(\mathbb{Z}[X]\otimes\mathbb{Z}[Y],C)&\cong\mathrm{Bil}(\mathbb{Z}[X]\times\mathbb{Z}[Y],C)\\
&\cong\mathbf{Set}(X\times Y,C)\cong\mathbf{Ab}(\mathbb{Z}[X\times Y],C)
\end{aligned}
$$
（テンソル積の普遍性、双線形写像は基底の組の上の値で決まり任意の値をとれること、自由アーベル群の普遍性）が $C$ について自然で、合成が $F_{2}$ との合成で与えられることと米田の補題（\ref{cat:yoneda-lemma}）から従う。
3. **積を保つ関手.** 有限の積によるモノイダル構造（\ref{cat:monoidal-category} の例）をもつ圏の間で、有限の積を保つ関手（たとえば右随伴、\ref{cat:adjoints-preserve-limits}）は、$F_{2}$ を標準同型 $Fa\times Fb\cong F(a\times b)$ の逆向き、$F_{0}$ を終対象の間の唯一の射として強モノイダル関手になる。三つの等式は、両辺が $F(a\times b\times c)$ や $F(a)$ への射で、射影との合成が等しいことから積の一意性で成り立つ。
:::

::: proposition モノイダル関手の合成 {#cat:monoidal-functor-composite keywords="composite of monoidal functors" index="モノイダル関手の合成|ものいだるかんしゅのごうせい"}
モノイダル関手 $(F,F_{2},F_{0})\colon\mathbf{M}\to\mathbf{M}'$, $(G,G_{2},G_{0})\colon\mathbf{M}'\to\mathbf{M}''$ について、
$$
(GF)_{2}(a,b)\defeq G(F_{2}(a,b))\circ G_{2}(Fa,Fb),\qquad(GF)_{0}\defeq G(F_{0})\circ G_{0}
$$
とすると、$(GF,(GF)_{2},(GF)_{0})$ はモノイダル関手である。$F,G$ が強（厳密）なら $GF$ も強（厳密）。
:::

::: proof
**自然性.** $G_{2}$ の自然性と $F_{2}$ の自然性に関手 $G$ を施したものを合成すればよい。

**第一式.** 左辺を変形する。$G_{2}$ の自然性（射 $F_{2}(a,b)$ と $1_{Fc}$ について）から
$$
\begin{aligned}
&G(F_{2}(a\square b,c))\circ G_{2}(F(a\square b),Fc)\\
&\qquad\circ\bigl((GF_{2}(a,b)\circ G_{2}(Fa,Fb))\square1\bigr)\circ\alpha''\\
&=G(F_{2}(a\square b,c))\circ G(F_{2}(a,b)\square1)\\
&\qquad\circ G_{2}(Fa\square Fb,Fc)\circ(G_{2}(Fa,Fb)\square1)\circ\alpha''.
\end{aligned}
$$
後半の $G_{2}(Fa\square Fb,Fc)\circ(G_{2}\square1)\circ\alpha''$ に $G$ の第一式を使うと $G(\alpha')\circ G_{2}(Fa,Fb\square Fc)\circ(1\square G_{2}(Fb,Fc))$ になる。前半と合わせた $G\bigl(F_{2}(a\square b,c)\circ(F_{2}(a,b)\square1)\circ\alpha'\bigr)$ に $F$ の第一式を使うと $G\bigl(F(\alpha)\circ F_{2}(a,b\square c)\circ(1\square F_{2}(b,c))\bigr)$。最後に $G_{2}$ の自然性（射 $1_{Fa}$ と $F_{2}(b,c)$ について）で $G(1\square F_{2}(b,c))\circ G_{2}(Fa,Fb\square Fc)=G_{2}(Fa,F(b\square c))\circ(1\square GF_{2}(b,c))$ と入れ替えると、右辺 $GF(\alpha)\circ(GF)_{2}(a,b\square c)\circ(1\square(GF)_{2}(b,c))$ が得られる。

**単位の式.** 右単位について、$G_{2}$ の自然性（射 $1$ と $F_{0}$）から
$$
\begin{aligned}
&GF(\varrho_{a})\circ GF_{2}(a,e)\circ G_{2}(Fa,Fe)\circ(1\square GF_{0})\circ(1\square G_{0})\\
&=G\bigl(F\varrho_{a}\circ F_{2}(a,e)\circ(1\square F_{0})\bigr)\circ G_{2}(Fa,e')\circ(1\square G_{0})\\
&=G(\varrho'_{Fa})\circ G_{2}(Fa,e')\circ(1\square G_{0})=\varrho''_{GFa}
\end{aligned}
$$
（$F$ の単位の式、次に $G$ の単位の式）。左単位も同様。強・厳密の保存は、同型（恒等射）の合成が同型（恒等射）であることから。
:::

::: definition モノイダル自然変換 {#cat:monoidal-natural-transformation keywords="monoidal natural transformation, monoidal equivalence" index="モノイダル自然変換|ものいだるしぜんへんかん, モノイダル同値|ものいだるどうち"}
モノイダル関手 $F,G\colon\mathbf{M}\to\mathbf{M}'$ の間の**モノイダル自然変換** $\theta\colon F\Rightarrow G$ は、自然変換で
$$
\theta_{a\square b}\circ F_{2}(a,b)=G_{2}(a,b)\circ(\theta_{a}\square\theta_{b}),\qquad\theta_{e}\circ F_{0}=G_{0}
$$
を満たすものである。強モノイダル関手 $F\colon\mathbf{M}\to\mathbf{M}'$, $G\colon\mathbf{M}'\to\mathbf{M}$ と、成分が同型のモノイダル自然変換 $GF\cong1_{\mathbf{M}}$, $FG\cong1_{\mathbf{M}'}$ があるとき、$\mathbf{M}$ と $\mathbf{M}'$ は**モノイダル同値**であるという（恒等関手は $1_{2}=1$, $1_{0}=1$ で厳密モノイダル関手とみる）。
:::

::: proposition モノイダル関手はモノイドを保つ {#cat:monoidal-functor-monoids keywords="monoidal functors preserve monoids, lax monoidal functor maps monoids to monoids" index="モノイダル関手とモノイド|ものいだるかんしゅとものいど"}
$(F,F_{2},F_{0})\colon\mathbf{M}\to\mathbf{M}'$ をモノイダル関手、$(c,\mu,\eta)$ を $\mathbf{M}$ のモノイドとすると、
$$
\mu'\defeq F(\mu)\circ F_{2}(c,c)\colon Fc\square Fc\to Fc,\qquad\eta'\defeq F(\eta)\circ F_{0}\colon e'\to Fc
$$
で $(Fc,\mu',\eta')$ は $\mathbf{M}'$ のモノイドである。
:::

::: proof
**結合律.** $F_{2}$ の自然性（射 $\mu$ と $1_{c}$）から $F_{2}(c,c)\circ(F\mu\square1)=F(\mu\square1)\circ F_{2}(c\square c,c)$ なので、
$$
\begin{aligned}
\mu'\circ(\mu'\square1)\circ\alpha'&=F\mu\circ F(\mu\square1)\circ F_{2}(c\square c,c)\circ(F_{2}(c,c)\square1)\circ\alpha'\\
&=F\mu\circ F(\mu\square1)\circ F(\alpha)\circ F_{2}(c,c\square c)\circ(1\square F_{2}(c,c))
\end{aligned}
$$
（2 行目は $F$ の第一式）。$\mathbf{M}$ の結合律 $\mu\circ(\mu\square1)\circ\alpha=\mu\circ(1\square\mu)$ を $F$ で移し、$F_{2}$ の自然性（射 $1_{c}$ と $\mu$）を逆向きに使うと、これは $F\mu\circ F_{2}(c,c)\circ(1\square F\mu)\circ(1\square F_{2}(c,c))=\mu'\circ(1\square\mu')$。

**単位律.** $F_{2}$ の自然性（射 $\eta$ と $1_{c}$）と $F$ の左単位の式、$\mathbf{M}$ の単位律 $\mu\circ(\eta\square1)=\lambda_{c}$ から
$$
\begin{aligned}
\mu'\circ(\eta'\square1)&=F\mu\circ F(\eta\square1)\circ F_{2}(e,c)\circ(F_{0}\square1)\\
&=F(\lambda_{c})\circ F_{2}(e,c)\circ(F_{0}\square1)=\lambda'_{Fc}.
\end{aligned}
$$
右の単位律も同様。
:::

::: hypcheck
- **$F_{2}$ の自然性**：$\mu$, $\eta$ を $F_{2}$ の内側から外側へ移すのに使った。
- **モノイダル関手の三つの等式**：第一式を結合律に、単位の式を単位律に使った。$F$ が強である必要はない（忘却関手 $U$ の例）。
:::
:::

::: example
1. 環 $R$ は $(\mathbf{Ab},\otimes,\mathbb{Z})$ のモノイドで（\ref{cat:monoid-object} の例）、忘却関手 $U$ はこれを乗法モノイド $(R,\cdot,1)$ に移す。
2. モノイド $M$（$(\mathbf{Set},\times)$ のモノイド）は、自由アーベル群の関手で $\mathbb{Z}[M]$ に移り、そのモノイドの構造は積 $\bigl(\sum m_{x}x\bigr)\bigl(\sum n_{y}y\bigr)=\sum m_{x}n_{y}\,xy$ である。これはモノイド環（$M$ が群なら群環）である。
:::

## 厳密化定理 {#cat:sec-mf-strictification}

厳密化の証明では、コヒーレンス定理を「語の各文字に別々の対象を入れた形」で使う。

::: remark 多変数のコヒーレンス {#cat:multivariable-coherence keywords="coherence with distinct objects in the letters" index="多変数のコヒーレンス|たへんすうのこひーれんす"}
長さ $n$ の二項語 $v$ と対象の列 $b_{1},\dots,b_{n}$ について、$v$ の文字 $\mathtt{x}$ に左から順に $b_{1},\dots,b_{n}$ を、$e$ に単位対象を入れた対象を $v(b_{1},\dots,b_{n})$ と書く。\ref{cat:coherence} の主張と証明は、文字ごとに別の対象を入れても、文字通りそのまま成り立つ：証明（\ref{cat:coherence-associativity}, \ref{cat:unit-removal}）で使うのは $\alpha,\lambda,\varrho$ の自然性・双関手性と五角形・三角形の等式だけで、文字に入る対象が互いに等しいことはどこにも使っていない。よって、同じ長さの語 $v,w$ の間の基本射の道の合成は道によらず、それを**標準射** $\mathrm{can}\colon v(b_{1},\dots,b_{n})\to w(b_{1},\dots,b_{n})$ と書く。標準射の合成、標準射どうしの $\square$、標準射の逆はふたたび標準射であり、語から自分自身への標準射は恒等射である（空の道）。また標準射は $b_{i}$ について自然である（基本射が自然なので）。
:::

対象の有限列 $s=[b_{1},\dots,b_{k}]$（空列 $\varnothing$ も含む）について、括弧をすべて左に寄せた積を
$$
F(\varnothing)\defeq e,\qquad F[b_{1}]\defeq b_{1},\qquad F[b_{1},\dots,b_{k}]\defeq F[b_{1},\dots,b_{k-1}]\square b_{k}
$$
とする。$F[b_{1},\dots,b_{k}]$ は長さ $k$ の語 $w^{(k)}$（\ref{cat:coherence-associativity} の証明の記号。$k=0$ なら $e$）に $b_{1},\dots,b_{k}$ を入れたものである。列の連結を $s\cdot t$ と書き、標準射
$$
\varphi_{s,t}\colon F(s)\square F(t)\to F(s\cdot t)
$$
をとる（左辺は語 $w^{(k)}\square w^{(l)}$、右辺は $w^{(k+l)}$ に同じ列 $s\cdot t$ を入れたもの）。とくに $\varphi_{\varnothing,t}=\lambda_{F(t)}$, $\varphi_{s,\varnothing}=\varrho_{F(s)}$, $\varphi_{s,[b]}=1$（語 $w^{(k)}\square\mathtt{x}$ は $w^{(k+1)}$ そのもの）。

::: theorem 厳密化定理 {#cat:strictification keywords="strictification theorem, every monoidal category is monoidally equivalent to a strict monoidal category" index="厳密化定理|げんみつかていり"}
任意のモノイダル圏 $\mathbf{M}$ について、厳密モノイダル圏 $\mathbf{S}$ と強モノイダル関手 $F\colon\mathbf{S}\to\mathbf{M}$, $G\colon\mathbf{M}\to\mathbf{S}$ で、$FG=1_{\mathbf{M}}$（モノイダル関手として）かつ $GF\cong1_{\mathbf{S}}$（モノイダル自然同型）となるものがある。とくに $\mathbf{M}$ は厳密モノイダル圏とモノイダル同値である。
:::

::: proof
**Step 1（圏 $\mathbf{S}$）.** $\mathbf{S}$ の対象を $\mathbf{M}$ の対象の有限列とし、射 $s\to t$ を $\mathbf{M}$ の射 $F(s)\to F(t)$ と定める：$\mathbf{S}(s,t)\defeq\mathbf{M}(F(s),F(t))$。合成と恒等射は $\mathbf{M}$ のものとする。これは明らかに圏である。

**Step 2（積）.** 対象の積を連結 $s\cdot t$、単位を空列 $\varnothing$ とする。射 $f\colon s\to t$, $g\colon u\to v$ の積を
$$
f\cdot g\defeq\varphi_{t,v}\circ(f\square g)\circ\varphi_{s,u}^{-1}\colon F(s\cdot u)\to F(t\cdot v)
$$
と定める。
- **関手性.** $(f'\cdot g')\circ(f\cdot g)=\varphi\circ(f'\square g')\circ\varphi^{-1}\circ\varphi\circ(f\square g)\circ\varphi^{-1}=(f'f)\cdot(g'g)$（$\square$ の関手性）。$1_{s}\cdot1_{u}=\varphi_{s,u}\varphi_{s,u}^{-1}=1$。
- **結合律.** $h\colon w\to y$ について、定義を展開すると
$$
\begin{aligned}
(f\cdot g)\cdot h&=\varphi_{tv,y}\circ(\varphi_{t,v}\square1)\circ((f\square g)\square h)\circ(\varphi_{s,u}^{-1}\square1)\circ\varphi_{su,w}^{-1},\\
f\cdot(g\cdot h)&=\varphi_{t,vy}\circ(1\square\varphi_{v,y})\circ(f\square(g\square h))\circ(1\square\varphi_{u,w}^{-1})\circ\varphi_{s,uw}^{-1}.
\end{aligned}
$$
$\alpha$ の自然性から $(f\square g)\square h=\alpha\circ(f\square(g\square h))\circ\alpha^{-1}$。代入すると、$(f\cdot g)\cdot h$ は $f\cdot(g\cdot h)$ の $f\square(g\square h)$ の左右の射をそれぞれ
$$
\varphi_{tv,y}\circ(\varphi_{t,v}\square1)\circ\alpha,\qquad\alpha^{-1}\circ(\varphi_{s,u}^{-1}\square1)\circ\varphi_{su,w}^{-1}
$$
に置き換えたものになる。これらと $\varphi_{t,vy}\circ(1\square\varphi_{v,y})$, $(1\square\varphi_{u,w}^{-1})\circ\varphi_{s,uw}^{-1}$ は、同じ語の間の標準射なので（\ref{cat:multivariable-coherence}）それぞれ等しい。よって $(f\cdot g)\cdot h=f\cdot(g\cdot h)$。
- **単位律.** $\varphi_{s,\varnothing}=\varrho_{F(s)}$ と $\varrho$ の自然性から $f\cdot1_{\varnothing}=\varrho\circ(f\square1_{e})\circ\varrho^{-1}=f$。同様に $\lambda$ の自然性から $1_{\varnothing}\cdot f=f$。

対象の連結は結合的で $\varnothing$ が単位なので、結合子と単位子を恒等射とすれば、その自然性は上の結合律・単位律そのものであり、五角形・三角形の等式は恒等射どうしの等式として成り立つ。よって $\mathbf{S}$ は厳密モノイダル圏である。

**Step 3（$F\colon\mathbf{S}\to\mathbf{M}$）.** 対象は $s\mapsto F(s)$、射は $f\mapsto f$ とし、$F_{2}(s,t)\defeq\varphi_{s,t}$, $F_{0}\defeq1_{e}\colon e\to F(\varnothing)=e$ とする。$F_{2}$ の自然性 $\varphi_{t,v}\circ(f\square g)=(f\cdot g)\circ\varphi_{s,u}$ は積の定義そのもの。第一式は、$\mathbf{S}$ の結合子が恒等射なので
$$
\varphi_{s\cdot t,u}\circ(\varphi_{s,t}\square1)\circ\alpha_{Fs,Ft,Fu}=\varphi_{s,t\cdot u}\circ(1\square\varphi_{t,u})
$$
となり、両辺は同じ語の間の標準射だから等しい。単位の式 $\varphi_{s,\varnothing}\circ(1\square1_{e})=\varrho_{F(s)}$, $\varphi_{\varnothing,s}\circ(1_{e}\square1)=\lambda_{F(s)}$ は $\varphi$ の値そのもの。$\varphi$ は同型なので $F$ は強モノイダル関手である。

**Step 4（$G\colon\mathbf{M}\to\mathbf{S}$）.** $G(b)\defeq[b]$, $G(f)\defeq f$（$F[b]=b$ なので $f\colon b\to c$ は $\mathbf{S}$ の射 $[b]\to[c]$）とし、$G_{2}(b,c)\colon[b]\cdot[c]=[b,c]\to[b\square c]$ を $\mathbf{M}$ の射 $1_{b\square c}\colon F[b,c]=b\square c\to b\square c$、$G_{0}\colon\varnothing\to[e]$ を $1_{e}$ とする。$G_{2}$ の自然性は $f\cdot g=\varphi_{[b'],[c']}\circ(f\square g)\circ\varphi_{[b],[c]}^{-1}=f\square g$（$\varphi_{[b],[c]}=1$）から。まず二つの積を計算しておく：$\varphi_{[a],[b,c]}$ は語 $\mathtt{x}\square(\mathtt{x}\square\mathtt{x})$ から $(\mathtt{x}\square\mathtt{x})\square\mathtt{x}$ への標準射すなわち $\alpha_{a,b,c}$ で、$\varphi_{[a\square b],[c]}=\varphi_{[a,b],[c]}=\varphi_{[a],[b\square c]}=1$ なので
$$
G_{2}(a,b)\cdot1_{[c]}=1_{(a\square b)\square c},\qquad1_{[a]}\cdot G_{2}(b,c)=1\circ1\circ\alpha_{a,b,c}^{-1}=\alpha_{a,b,c}^{-1}.
$$
- **第一式**（$\mathbf{S}$ の結合子は恒等射）：左辺 $G_{2}(a\square b,c)\circ(G_{2}(a,b)\cdot1)=1$、右辺 $G(\alpha_{a,b,c})\circ G_{2}(a,b\square c)\circ(1\cdot G_{2}(b,c))=\alpha\circ1\circ\alpha^{-1}=1$。
- **単位の式**：$1_{[b]}\cdot G_{0}=\varphi_{[b],[e]}\circ(1\square1_{e})\circ\varphi_{[b],\varnothing}^{-1}=\varrho_{b}^{-1}$ なので $G(\varrho_{b})\circ G_{2}(b,e)\circ(1\cdot G_{0})=\varrho_{b}\circ\varrho_{b}^{-1}=1_{[b]}$（$\mathbf{S}$ の単位子）。左も $G_{0}\cdot1_{[b]}=\lambda_{b}^{-1}$ から同様。

$G_{2},G_{0}$ は恒等射なので同型で、$G$ は強モノイダル関手である。

**Step 5（$FG=1$）.** $FG(b)=F[b]=b$, $FG(f)=f$。合成の構造（\ref{cat:monoidal-functor-composite}）は $(FG)_{2}(b,c)=F(G_{2}(b,c))\circ\varphi_{[b],[c]}=1$, $(FG)_{0}=F(G_{0})\circ F_{0}=1$ なので、$FG$ はモノイダル関手として恒等関手に等しい。

**Step 6（$GF\cong1$）.** $GF(s)=[F(s)]$ で、$\theta_{s}\colon s\to[F(s)]$ を $\mathbf{M}$ の射 $1_{F(s)}\colon F(s)\to F[F(s)]=F(s)$ とする。$f\colon s\to t$ について $GF(f)=f$ なので自然性は $f\circ1=1\circ f$。モノイダル性：$\theta_{s}\cdot\theta_{t}=\varphi_{[Fs],[Ft]}\circ1\circ\varphi_{s,t}^{-1}=\varphi_{s,t}^{-1}$ で、$(GF)_{2}(s,t)=G(\varphi_{s,t})\circ G_{2}(Fs,Ft)=\varphi_{s,t}$ だから
$$
(GF)_{2}(s,t)\circ(\theta_{s}\cdot\theta_{t})=1=\theta_{s\cdot t}\circ(1_{\mathbf{S}})_{2}(s,t).
$$
単位：$(GF)_{0}=G(F_{0})\circ G_{0}=1=\theta_{\varnothing}$。各 $\theta_{s}$ は同型。
:::

::: hypcheck
- **多変数のコヒーレンス**（\ref{cat:multivariable-coherence}）：$\mathbf{S}$ の積の結合律（Step 2）と $F$ の第一式（Step 3）で、「同じ語の間の二つの標準射が等しい」ことに使った。これがこの定理の唯一の非自明な材料である。
- **$\alpha,\lambda,\varrho$ の自然性**：積の結合律と単位律（Step 2）に使った。
- **$\varphi$ の具体的な値**（$\varphi_{s,\varnothing}=\varrho$, $\varphi_{\varnothing,s}=\lambda$, $\varphi_{s,[b]}=1$, $\varphi_{[a],[b,c]}=\alpha$）：Step 2–6 の計算で使った。いずれも標準射の定義（空の道、または一つの基本射）から。
:::

::: remark
$\mathbf{S}$ の対象は $\mathbf{M}$ の対象の列なので、$\mathbf{S}$ は「同型な対象を同一視して」作ったものではない。むしろ対象を増やし（$[b,c]$ と $[b\square c]$ は別の対象で、間に同型 $G_{2}$ がある）、括弧の付け方の情報を捨てることで結合律を等式にしている。\ref{cat:page-monoidal} で見たイズベルの議論のとおり、対象を同一視する方向の厳密化は一般には不可能である。
:::

## 問題 {#cat:sec-mf-problems}

::: problem {#cat:prob-mf-global-elements}
モノイダル圏 $\mathbf{M}$ について、$\mathbf{M}(e,-)\colon\mathbf{M}\to\mathbf{Set}$ は
$$
F_{2}(f,g)\defeq(f\square g)\circ\lambda_{e}^{-1}\colon e\to a\square b,\qquad F_{0}(\ast)\defeq1_{e}
$$
（$f\colon e\to a$, $g\colon e\to b$）で $(\mathbf{Set},\times,1)$ へのモノイダル関手になることを示せ。とくに $\mathbf{M}$ のモノイド $c$ について $\mathbf{M}(e,c)$ はモノイドである。
:::

::: solution
自然性は $\square$ の関手性から。第一式：$f\colon e\to a$, $g\colon e\to b$, $h\colon e\to c$ について、左辺は $((f\square g)\lambda_{e}^{-1}\square h)\lambda_{e}^{-1}=((f\square g)\square h)\circ(\lambda_{e}^{-1}\square1)\circ\lambda_{e}^{-1}$、右辺は $\alpha\circ(f\square(g\square h)\lambda_{e}^{-1})\lambda_{e}^{-1}=((f\square g)\square h)\circ\alpha_{e,e,e}\circ(1\square\lambda_{e}^{-1})\circ\lambda_{e}^{-1}$（$\alpha$ の自然性）。$(\lambda_{e}^{-1}\square1)\circ\lambda_{e}^{-1}$ と $\alpha_{e,e,e}\circ(1\square\lambda_{e}^{-1})\circ\lambda_{e}^{-1}$ は語 $e$ から $(e\square e)\square e$ への標準射なので等しい（\ref{cat:coherence}）。単位の式：$\varrho_{a}\circ(f\square1_{e})\circ\lambda_{e}^{-1}=f\circ\varrho_{e}\circ\lambda_{e}^{-1}=f$（$\varrho$ の自然性と $\lambda_{e}=\varrho_{e}$）、左も $\lambda_{a}\circ(1_{e}\square f)\circ\lambda_{e}^{-1}=f\circ\lambda_{e}\circ\lambda_{e}^{-1}=f$。後半は \ref{cat:monoidal-functor-monoids}。
:::

::: problem {#cat:prob-mf-cayley}
モノイダル圏 $\mathbf{M}$ について、自己関手の圏 $[\mathbf{M},\mathbf{M}]$ は、合成 $\circ$ を積、$1_{\mathbf{M}}$ を単位として厳密モノイダル圏である（射の積は水平合成）。$T(a)\defeq a\square-$, $T(f)\defeq f\square-$ と
$$
T_{2}(a,b)_{d}\defeq\alpha_{a,b,d}\colon a\square(b\square d)\to(a\square b)\square d,\qquad(T_{0})_{d}\defeq\lambda_{d}^{-1}\colon d\to e\square d
$$
で、$T\colon\mathbf{M}\to[\mathbf{M},\mathbf{M}]$ が強モノイダル関手になることを示せ（Mac Lane 第 XI 章 §3 演習 2）。
:::

::: solution
$T_{2}(a,b)\colon T(a)\circ T(b)\Rightarrow T(a\square b)$ は $\alpha$ の第 3 変数についての自然性で自然変換、$a,b$ についての自然性で $T_{2}$ は自然。成分が同型なので同型。第一式の $d$ 成分：水平合成 $T_{2}(a,b)\ast T(c)$ の $d$ 成分は $\alpha_{a,b,c\square d}$、$T(a)\ast T_{2}(b,c)$ の $d$ 成分は $1_{a}\square\alpha_{b,c,d}$ なので、示すべき式は
$$
\alpha_{a\square b,c,d}\circ\alpha_{a,b,c\square d}=(\alpha_{a,b,c}\square1_{d})\circ\alpha_{a,b\square c,d}\circ(1_{a}\square\alpha_{b,c,d})
$$
で、五角形の等式そのもの。右単位の式の $d$ 成分は $(\varrho_{a}\square1_{d})\circ\alpha_{a,e,d}\circ(1_{a}\square\lambda_{d}^{-1})=(1_{a}\square\lambda_{d})\circ(1_{a}\square\lambda_{d}^{-1})=1$（三角形の等式）。左単位の式の $d$ 成分は、$(T_{0}\ast T(a))_{d}=\lambda_{a\square d}^{-1}$ なので $(\lambda_{a}\square1_{d})\circ\alpha_{e,a,d}\circ\lambda_{a\square d}^{-1}=\lambda_{a\square d}\circ\lambda_{a\square d}^{-1}=1$（\ref{cat:monoidal-derived-triangles}）。$[\mathbf{M},\mathbf{M}]$ の単位子は恒等射なので、これで単位の式が成り立つ。
:::

::: supplement
**前提について.** 厳密化定理の証明では、$\mathbf{M}$ について何の仮定（小ささなど）も使っていない。使ったのはコヒーレンス定理だけである。逆に、Mac Lane 第 XI 章 §3 定理 2 は「強モノイダル関手で厳密モノイダル圏と同値なら、結合のコヒーレンスが成り立つ」ことを示している。ただし本ページの証明はコヒーレンスを使って厳密化したので、これを組み合わせてコヒーレンスを「証明」すると循環論法になる。循環しない道として、問題 \ref{cat:prob-mf-cayley} の $T$ の像（の充満化）を使って、コヒーレンスを使わずに厳密化する方法が Mac Lane の演習 3 に挙げられている（ここでは確かめていない）。

**似た定理.** 厳密化は「弱い構造は厳密な構造と同値」という型の定理の最初の例である。1 次元上の類似として、双圏（Mac Lane 第 XII 章 §6）はどれも 2 圏と双同値であることが知られている（Mac Lane–Paré, 1985 とされる。ここでは確かめていない）。一方、3 次元の類似（トライカテゴリー）では、完全な厳密化はできず「半厳密」までしかできないことが知られている（Gordon–Power–Street, 1995 とされる。未確認）。

**モノイダル関手の向き.** $F_{2}$ が同型でない（緩い）モノイダル関手は、\ref{cat:monoidal-functor-monoids} のようにモノイドを移すのに十分で、例が豊富である（忘却関手、$\mathbf{M}(e,-)$）。右随伴が積を保つように、モノイダル圏の間の随伴 $F\dashv U$ で $F$ が強モノイダルなら、$U$ には自然に緩いモノイダル関手の構造が入ることが知られている（「ドクトリン的随伴」、Kelly 1974 とされる。ここでは証明しない）。

**高い視点から：厳密化は「表記の自由」の保証.** 厳密化定理は、モノイダル圏で $a\square(b\square c)$ と $(a\square b)\square c$ を区別せず $a\,b\,c$ と書いてよいことを正当化する。比喩で言えば、$\mathbf{S}$ は「括弧を書かない帳簿」で、各ページ（対象）は文字の列、取引（射）は元の帳簿での取引そのものである。括弧の付け替えは帳簿の付け替え（$\varphi$）として裏で一貫して処理され、コヒーレンス定理がその付け替えの一貫性を保証する。圏論的には、モノイダル圏を対象、強モノイダル関手を射、モノイダル自然変換を 2 射とする 2 圏で、包含「厳密モノイダル圏 $\subset$ モノイダル圏」が各対象で同値を与える、という 2 圏論的な主張である。
:::
