# 構造をもつ圏（Categories with Structure）

デカルト閉圏とローヴェアの不動点定理、モノイダル圏とコヒーレンス定理、モノイドと作用、単体圏、閉圏とコンパクト生成空間、モノイダル関手と厳密化、対称・組紐モノイダル圏のコヒーレンスと組紐群、スマッシュ積と懸垂・ループ空間の随伴、強モノイダルな左随伴の右随伴（ドクトリン的随伴）、ローヴェアの距離空間（[0,∞] 上の豊穣圏と米田の補題）。（主に Mac Lane 第 IV 章 §6・§9–10、第 VII 章、第 XI 章に対応。アーベル圏は「ホモロジー代数」に置いた）

<p class="mn-msc">MSC2020: 18D, 18M</p>
