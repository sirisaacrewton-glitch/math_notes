# 代数系とコンパクトハウスドルフ空間のモナド性 {#cat:page-monadic-examples keywords="varieties of algebras are monadic, universal algebra, operators and identities, term algebra, free algebra in a variety, compact Hausdorff spaces are monadic over sets, ultrafilter monad, closure operator, Pare"}

ベックの定理（\ref{cat:beck-monadicity}）の二つの代表的な応用を示す。一つは、演算と等式で定まる**代数系**（群・環・束など）の圏の忘却関手がモナド的であること（\ref{cat:algebras-monadic}）。もう一つは、それとは一見無関係な**コンパクトハウスドルフ空間**の圏の忘却関手 $\mathbf{CHaus}\to\mathbf{Set}$ もモナド的であること（\ref{cat:chaus-monadic}）である。後者は、コンパクトハウスドルフ空間を「超フィルターの極限をとる演算をもつ代数系」とみなせることを意味する。

> 資料：Mac Lane, *Categories for the Working Mathematician* 第 VI 章 §8–§9（第 V 章 §6 の代数系の定義も使う）。§9 の証明は R. Paré による形とされる（Mac Lane の記述による）。Mac Lane が「容易」として略した部分（閉包作用素の公理の確認、創出の一意性）は補った。

## 記法と定義の確認 {#cat:sec-me-notation}

::: notation
- ベックの定理、絶対余等化子、余等化子の創出、比較関手は \ref{cat:beck-monadicity}, \ref{cat:split-fork}, \ref{cat:create-coequalizers}, \ref{cat:comparison-functor} のとおり。ベックの定理の条件 2（$G$ で移すと絶対余等化子をもつ対の余等化子を創出する）から、条件 1（比較関手が同型）が従う。
- 位相空間は、閉包作用素で決まる（クラトフスキーの閉包公理、\ref{top:kuratowski-closure}）。写像 $f$ が連続であることは、すべての部分集合 $S$ で $f(\overline{S})\subseteq\overline{f(S)}$ となることと同値（\ref{top:continuity-equivalents}）。コンパクト空間からハウスドルフ空間への連続写像は閉写像（\ref{top:compact-to-hausdorff}）で、とくに $f(\overline{S})=\overline{f(S)}$（$f(\overline{S})$ は $f(S)$ を含む閉集合なので $\supseteq$）。
- $\mathbf{Set}$ での余等化子は全射である（商集合への写像）。$e^{n}\colon B^{n}\to X^{n}$ は $e$ の $n$ 個の直積、$\mathcal{P}$ は順像による冪集合関手。
:::

## 代数系 {#cat:sec-me-varieties}

::: definition 代数系の多様体 {#cat:variety keywords="operators with arities, identities, (Omega, E)-algebras, variety of algebras, term algebra" index="代数系|だいすうけい, 多様体（普遍代数）|たようたいふへんだいすう, 項代数|こうだいすう"}
1. **型** $\Omega$ は、演算記号 $\omega$ とその項数 $n_{\omega}\in\mathbb{N}$ の集合である。$\Omega$ **代数** $A$ は、集合 $A$ と各 $\omega$ の解釈 $\omega_{A}\colon A^{n_{\omega}}\to A$ の組。準同型は、すべての演算と可換な写像 $f$（$f\circ\omega_{A}=\omega_{B}\circ f^{n_{\omega}}$）。
2. 変数の集合 $V$ 上の**項**を、変数と、$\omega(t_{1},\dots,t_{n_{\omega}})$ の形の記号列として帰納的に定める。変数 $x_{1},\dots,x_{n}$ の項 $u$ は、各 $\Omega$ 代数 $A$ に写像 $u_{A}\colon A^{n}\to A$（**導来演算**）を定める。
3. **等式**は項の組 $u\approx v$ で、$A$ が等式を**満たす**とは $u_{A}=v_{A}$ となること。等式の集合 $E$ のすべてを満たす $\Omega$ 代数を $(\Omega,E)$ **代数**といい、その圏を $(\Omega,E)\text{-}\mathbf{Alg}$ と書く。
:::

::: lemma 自由代数 {#cat:free-algebra-variety keywords="free (Omega,E)-algebra, term algebra modulo the congruence generated by the identities" index="自由代数（多様体）|じゆうだいすうたようたい"}
忘却関手 $G\colon(\Omega,E)\text{-}\mathbf{Alg}\to\mathbf{Set}$ は左随伴をもつ。
:::

::: proof
**Step 1（項代数）.** 集合 $X$ 上の項全体 $\mathrm{Tm}(X)$ は、演算を記号どおりに定めて $\Omega$ 代数になる。任意の $\Omega$ 代数 $A$ と写像 $a\colon X\to A$ に対し、$a$ を延長する準同型 $\bar{a}\colon\mathrm{Tm}(X)\to A$ がただ一つある（項の構成に関する再帰）。

**Step 2（等式で割る）.** $\mathrm{Tm}(X)$ 上の合同関係（演算と両立する同値関係）で、$E$ の等式 $u\approx v$ の変数に項を代入したものの組 $(u(t_{1},\dots),v(t_{1},\dots))$ をすべて含む最小のものを $\equiv_{E}$ とする（そのような合同関係全体の共通部分）。$FX\defeq\mathrm{Tm}(X)/{\equiv_{E}}$ は $\Omega$ 代数で、$E$ を満たす：$u_{FX}([t_{1}],\dots)=[u(t_{1},\dots)]=[v(t_{1},\dots)]=v_{FX}([t_{1}],\dots)$。

**Step 3（普遍性）.** $(\Omega,E)$ 代数 $A$ と $a\colon X\to A$ について、$\bar{a}$ の核 $\{(s,t):\bar{a}s=\bar{a}t\}$ は合同関係で、$A$ が $E$ を満たすので代入例をすべて含む。よって $\equiv_{E}\subseteq\ker\bar{a}$ で、$\bar{a}$ は $FX$ を経由する準同型 $FX\to A$ を一意に定める。$X\to GFX$, $x\mapsto[x]$ は普遍射なので、左随伴がある（\ref{cat:adjunction-from-universal}）。
:::

::: theorem 代数系の忘却関手はモナド的 {#cat:algebras-monadic keywords="the forgetful functor from a variety of algebras to sets is monadic" index="代数系のモナド性|だいすうけいのもなどせい"}
$G\colon(\Omega,E)\text{-}\mathbf{Alg}\to\mathbf{Set}$ が定めるモナドを $\mathsf{T}$ とすると、比較関手 $K\colon(\Omega,E)\text{-}\mathbf{Alg}\to\mathbf{Set}^{T}$ は圏の同型である。
:::

::: proof
ベックの定理の条件 2 を示す。準同型 $f,g\colon A\rightrightarrows B$ について、写像 $e\colon B\to X$ が $Gf,Gg$ の絶対余等化子であるとする。

**Step 1（演算の持ち上げ）.** 演算 $\omega$（項数 $n$）について、$f,g$ が準同型なので $\omega_{B}\circ f^{n}=f\circ\omega_{A}$, $\omega_{B}\circ g^{n}=g\circ\omega_{A}$。よって
$$
e\circ\omega_{B}\circ f^{n}=e\circ f\circ\omega_{A}=e\circ g\circ\omega_{A}=e\circ\omega_{B}\circ g^{n}.
$$
$e$ は絶対余等化子なので、関手 $(-)^{n}\colon\mathbf{Set}\to\mathbf{Set}$ で移した $e^{n}$ も $f^{n},g^{n}$ の余等化子。よって $\omega_{X}\circ e^{n}=e\circ\omega_{B}$ となる $\omega_{X}\colon X^{n}\to X$ がただ一つある。$e^{n}$ は全射なので、$e$ を準同型にする $X$ の演算はこれ以外にない。

**Step 2（等式）.** 項 $u$ について $u_{X}\circ e^{n}=e\circ u_{B}$ が、項の構成に関する帰納法で成り立つ（各演算で Step 1 の等式を使う）。$B$ が $u\approx v$ を満たすので $u_{X}\circ e^{n}=e\circ u_{B}=e\circ v_{B}=v_{X}\circ e^{n}$、$e^{n}$ は全射なので $u_{X}=v_{X}$。よって $X$ は $(\Omega,E)$ 代数。

**Step 3（余等化子）.** 準同型 $h\colon B\to C$ が $hf=hg$ を満たせば、集合として $h=h'\circ e$ となる写像 $h'$ がただ一つある。$h'$ は準同型：
$$
h'\circ\omega_{X}\circ e^{n}=h'\circ e\circ\omega_{B}=h\circ\omega_{B}=\omega_{C}\circ h^{n}=\omega_{C}\circ h'^{n}\circ e^{n},
$$
$e^{n}$ は全射なので $h'\circ\omega_{X}=\omega_{C}\circ h'^{n}$。

Step 1 で持ち上げ $(X,(\omega_{X}))$ と $e$ が一意に決まり、Step 3 でそれが余等化子なので、$G$ は余等化子を創出する。ベックの定理から $K$ は同型。

::: hypcheck
- **絶対性**：Step 1 で、$e^{n}$ が余等化子であることに使った（$n=0$ では $e^{0}=1_{1}$ で自明）。$\mathbf{Set}$ では余等化子 $e$ に対して $e^{n}$ が余等化子であることは一般にも成り立つが（直積が商と可換）、ここではそれを示す代わりに絶対性を仮定した。
- **等式が「すべての元について」の形であること**：Step 2 で、等式が導来演算の等しさ $u_{X}=v_{X}$ として商に移ることを使った。条件付きの公理（例：体の「$x\neq0$ なら逆元がある」）ではこの議論は通らず、実際、体の圏の忘却関手は左随伴をもたない（自由な体がない）。
:::
:::

## コンパクトハウスドルフ空間 {#cat:sec-me-chaus}

::: theorem コンパクトハウスドルフ空間のモナド性 {#cat:chaus-monadic keywords="CHaus is monadic over Set, ultrafilter monad, Manes" index="コンパクトハウスドルフ空間のモナド性|こんぱくとはうすどるふくうかんのもなどせい"}
（超フィルター補題と従属選択公理を仮定する。）忘却関手 $G\colon\mathbf{CHaus}\to\mathbf{Set}$ は左随伴をもち、モナド的である。
:::

::: proof
**Step 0（左随伴）.** 集合 $X$ に離散位相を入れた空間はチコノフ空間で、そのストーン–チェックのコンパクト化 $\beta X$ は、$X$ からコンパクトハウスドルフ空間 $K$ への任意の写像（離散空間からなので連続）を一意に延長する（\ref{top:stone-cech}）。よって $X\to G\beta X$ は普遍射で、$\beta\dashv G$。

以下、ベックの定理の条件 2 を示す。連続写像 $f,g\colon(X,\overline{\cdot}^{X})\rightrightarrows(Y,\overline{\cdot}^{Y})$（コンパクトハウスドルフ）と、$Gf,Gg$ の絶対余等化子 $e\colon Y\to W$ をとる。$e$ は全射である。

**Step 1（閉包作用素の持ち上げ）.** $f,g$ はコンパクトからハウスドルフへの連続写像なので閉写像で、$f(\overline{S})=\overline{f(S)}$、すなわち $\overline{\cdot}^{Y}\circ\mathcal{P}f=\mathcal{P}f\circ\overline{\cdot}^{X}$（$g$ も同様）。よって
$$
\mathcal{P}e\circ\overline{\cdot}^{Y}\circ\mathcal{P}f=\mathcal{P}e\circ\mathcal{P}f\circ\overline{\cdot}^{X}=\mathcal{P}e\circ\mathcal{P}g\circ\overline{\cdot}^{X}=\mathcal{P}e\circ\overline{\cdot}^{Y}\circ\mathcal{P}g.
$$
$e$ は絶対余等化子なので $\mathcal{P}e$ は $\mathcal{P}f,\mathcal{P}g$ の余等化子で、$c\circ\mathcal{P}e=\mathcal{P}e\circ\overline{\cdot}^{Y}$ となる $c\colon\mathcal{P}W\to\mathcal{P}W$ がただ一つある。具体的には、$T\subseteq W$ について $e(S)=T$ となる任意の $S$ をとり $c(T)=e(\overline{S})$（$e$ が全射なので $S$ はある。値は $S$ によらない）。

**Step 2（$c$ は閉包作用素）.** $T=e(S)$, $T_{i}=e(S_{i})$ とする。
- $c(\varnothing)=e(\overline{\varnothing})=\varnothing$。
- $T=e(S)\subseteq e(\overline{S})=c(T)$。
- $c(T)=e(\overline{S})$ なので、$S'\defeq\overline{S}$ について $c(c(T))=e(\overline{\overline{S}})=e(\overline{S})=c(T)$。
- $T_{1}\cup T_{2}=e(S_{1}\cup S_{2})$ なので、$c(T_{1}\cup T_{2})=e(\overline{S_{1}}\cup\overline{S_{2}})=c(T_{1})\cup c(T_{2})$。

\ref{top:kuratowski-closure} から、$c$ を閉包作用素とする位相が $W$ にただ一つある。$c(e(S))=e(\overline{S})$ なので、$e$ は連続かつ閉写像である。

**Step 3（コンパクトハウスドルフ）.** $W=e(Y)$ はコンパクト空間の連続像なのでコンパクト（\ref{top:compact-basic}）。一点集合は閉：$w=e(y)$ について $c(\{w\})=e(\overline{\{y\}})=e(\{y\})=\{w\}$（$Y$ はハウスドルフなので一点は閉）。$w_{1}\neq w_{2}$ について、$e^{-1}(w_{i})$ は閉集合の逆像なので閉で、互いに素。$Y$ は正規（\ref{top:compact-hausdorff-normal}）なので、互いに素な開集合 $U_{i}\supseteq e^{-1}(w_{i})$ がある。$C_{i}\defeq Y\setminus U_{i}$ は閉で $C_{1}\cup C_{2}=Y$、$e(C_{i})$ は閉で $e(C_{1})\cup e(C_{2})=W$、$w_{i}\notin e(C_{i})$。よって $V_{i}\defeq W\setminus e(C_{i})$ は $w_{i}$ の開近傍で、$V_{1}\cap V_{2}=W\setminus(e(C_{1})\cup e(C_{2}))=\varnothing$。

**Step 4（持ち上げの一意性）.** $W$ に別のコンパクトハウスドルフ位相 $\tau'$ があって $e$ が連続なら、$e$ はコンパクトからハウスドルフへの連続写像なので閉写像で、$\tau'$ の閉包 $\overline{\cdot}'$ について $\overline{e(S)}'=e(\overline{S})=c(e(S))$。すべての $T$ は $e(S)$ の形なので $\overline{\cdot}'=c$、位相は閉包作用素で決まるので $\tau'$ は Step 2 の位相に等しい。

**Step 5（余等化子）.** 連続写像 $h\colon Y\to Z$（$Z$ はコンパクトハウスドルフ）が $hf=hg$ を満たせば、集合として $h=h'\circ e$ となる $h'$ がただ一つある。$T=e(S)$ について
$$
h'(c(T))=h'(e(\overline{S}))=h(\overline{S})\subseteq\overline{h(S)}=\overline{h'(T)},
$$
よって $h'$ は連続（\ref{top:continuity-equivalents}）。

Step 2〜4 で持ち上げが一意に存在し、Step 5 でそれが余等化子なので、$G$ は余等化子を創出する。ベックの定理から $G$ はモナド的。

::: hypcheck
- **コンパクト性とハウスドルフ性**：Step 1 で $f,g$ が閉写像であること（$X$ コンパクト、$Y$ ハウスドルフ）、Step 3 で $W$ のコンパクト性（$Y$ コンパクト）と正規性（$Y$ コンパクトハウスドルフ）、Step 4 で $e$ が閉写像であることに使った。
- **絶対性**：Step 1 で、冪集合関手 $\mathcal{P}$ で移した $\mathcal{P}e$ が余等化子であることに使った。$\mathbf{Set}$ の単なる余等化子では、$\mathcal{P}e$ が余等化子になることは別に示す必要がある。
- **選択公理の弱い形**：左随伴の存在（ストーン–チェックのコンパクト化。\ref{top:stone-cech} の仮定）にだけ使った。
- コンパクトでない空間を含めた $\mathbf{Top}$ や、ハウスドルフでない空間ではモナド的でない（\ref{cat:monadic} の例、Step 1 の閉写像性が破れる）。
:::
:::

::: fact 超フィルターのモナド {#cat:ultrafilter-monad keywords="ultrafilter monad, compact Hausdorff spaces as algebras, Manes' theorem" index="超フィルターのモナド|ちょうふぃるたーのもなど"}
上のモナドは、$X$ に $X$ 上の超フィルター全体 $\beta X$ を対応させる**超フィルターのモナド**で、その代数は「各超フィルターに極限点を一つ対応させる写像」$\beta X\to X$ で、モナドの公理を満たすものである。これがちょうどコンパクトハウスドルフ位相の収束（コンパクト性は極限の存在、ハウスドルフ性は一意性）を表している。E. Manes の 1969 年の結果とされる（未確認）。
:::

::: supplement
**前提を変えると.** 条件付きの公理をもつ構造（体、整域、ネーター環など）の忘却関手はモナド的でない（多くは左随伴すらない）。また、無限の演算を許すと、自由代数が集合にならないことがある（完備ブール代数がその例として知られている）。

**類似の定理.** \ref{cat:algebras-monadic} の逆として、$\mathbf{Set}$ 上の**有限的**なモナド（有限個の変数の項で決まるもの）の代数の圏は、ある型と等式の代数系の圏と同型になる（ローヴェア理論の理論。範囲外）。コンパクトハウスドルフ空間のモナド（超フィルターのモナド）は有限的でなく、無限の項数の演算（超フィルターの極限）をもつ代数系である。

**高い視点から：位相は代数.** \ref{cat:chaus-monadic} は、コンパクトハウスドルフ空間を「点の集まりに、超フィルターの極限という演算が入ったもの」とみなしてよいことを言う。群が「積と逆元の演算をもつ集合」であるのと同じ意味で、コンパクトハウスドルフ空間は「極限の演算をもつ集合」であり、連続写像はその演算を保つ写像（準同型）である。比喩で言えば、位相を「近さの判定基準」と見る代わりに「無限個の点の多数決で一点を選ぶ規則」と見る見方である。
:::

## 問題 {#cat:sec-me-problems}

::: problem {#cat:prob-me-quotient-topology}
\ref{cat:chaus-monadic} の証明で $W$ に入れた位相は、$e\colon Y\to W$ による商位相（\ref{top:quotient-topology}）であることを示せ（Mac Lane 第 VI 章 §9 演習 1）。
:::

::: solution
$e$ は連続かつ閉な全射である。商位相は $e$ を連続にする最も強い位相なので、Step 2 の位相 $\tau$ は商位相 $\tau_{q}$ より弱い（$\tau\subseteq\tau_{q}$）。逆に $V\in\tau_{q}$（$e^{-1}(V)$ が開）とする。$C\defeq Y\setminus e^{-1}(V)$ は閉で、$e$ は閉写像なので $e(C)$ は $\tau$ で閉。$e$ は全射なので $e(C)=W\setminus V$（$e(y)\notin V\iff y\in C$）。よって $V$ は $\tau$ で開。
:::

::: problem {#cat:prob-me-abelian-groups}
アーベル群の圏 $\mathbf{Ab}$ が $(\Omega,E)\text{-}\mathbf{Alg}$ の形に書けることを確かめ、$\mathbf{Ab}\to\mathbf{Set}$ がモナド的であることを結論せよ。
:::

::: solution
$\Omega=\{+\ (2\text{ 項}),\ -\ (1\text{ 項}),\ 0\ (0\text{ 項})\}$、$E$ は $x+(y+z)\approx(x+y)+z$, $x+0\approx x$, $x+(-x)\approx0$, $x+y\approx y+x$。$(\Omega,E)$ 代数はアーベル群で、準同型は $+$ を保てば $-$ と $0$ も保つので、群準同型と一致する。\ref{cat:algebras-monadic} からモナド的。
:::
