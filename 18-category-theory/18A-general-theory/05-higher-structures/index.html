# 圏の中の構造と 2 圏（Structures in Categories）

内部圏と内部の図式、圏の神経、2 圏と 2 圏の中の随伴、2 関手と変形、単一集合による n 圏、双圏（両側加群とスパン）、交差加群と群の中の圏、神経の特徴づけ（セガール条件）。（主に Mac Lane 第 XII 章に対応）

<p class="mn-msc">MSC2020: 18D40, 18N10</p>
