# 圏と関手の一般論（General Theory of Categories and Functors）

圏論の基礎と構造をもつ圏。

<p class="mn-msc">MSC2020: 18A</p>

## 分野

<div class="mn-cards">
<a class="mn-card" href="01-basics/index.html"><span class="mn-card-title">圏論の基礎</span><span class="mn-card-en">Basic Category Theory</span><span class="mn-card-desc">圏・関手・自然変換、米田の補題、極限と余極限、随伴、圏同値、随伴関手定理。（Mac Lane『Categories for the Working Mathematician』第 I〜V 章に対応）</span><span class="mn-card-count">10 ページ</span></a>
<a class="mn-card" href="02-structured-categories/index.html"><span class="mn-card-title">構造をもつ圏</span><span class="mn-card-en">Categories with Structure</span><span class="mn-card-desc">デカルト閉圏とローヴェアの不動点定理、モノイダル圏とコヒーレンス定理、モノイドと作用、単体圏、閉圏とコンパクト生成空間、モノイダル関手と厳密化、対称・組紐モノイダル圏のコヒーレンスと組紐群。（Mac Lane 第 IV 章 §6・§9–10、第 VII 章、第 XI 章に対応。アーベル圏は「ホモロジー代数」に置いた）</span><span class="mn-card-count">8 ページ</span></a>
<a class="mn-card" href="03-monads/index.html"><span class="mn-card-title">モナドと代数</span><span class="mn-card-en">Monads and Algebras</span><span class="mn-card-desc">モナドとアイレンバーグ–ムーア代数、比較関手、クライスリ圏、分裂余等化子とベックのモナド性定理、普遍代数とコンパクトハウスドルフ空間のモナド性。（Mac Lane 第 VI 章に対応）</span><span class="mn-card-count">4 ページ</span></a>
<a class="mn-card" href="04-kan-extensions/index.html"><span class="mn-card-title">特別な極限とカン拡張</span><span class="mn-card-en">Special Limits and Kan Extensions</span><span class="mn-card-desc">フィルター付き余極限と有限極限の交換、終関手、エンドとコエンド、カン拡張（各点カン拡張・コエンドによる公式）、稠密性。（Mac Lane 第 IX・X 章に対応）</span><span class="mn-card-count">4 ページ</span></a>
<a class="mn-card" href="05-higher-structures/index.html"><span class="mn-card-title">圏の中の構造と 2 圏</span><span class="mn-card-en">Structures in Categories</span><span class="mn-card-desc">内部圏と内部の図式、圏の神経、2 圏と 2 圏の中の随伴、2 関手と変形、単一集合による n 圏、双圏（両側加群とスパン）、交差加群と群の中の圏。（Mac Lane 第 XII 章に対応）</span><span class="mn-card-count">2 ページ</span></a>
