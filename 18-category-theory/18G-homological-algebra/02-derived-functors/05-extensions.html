# Ext¹ と拡大 {#ha:page-extensions keywords="extension of modules, equivalence of extensions, split extension, Ext^1 classifies extensions, pushout extension, projective presentation, extensions of Z/p by Z/p, Yoneda Ext, Baer sum"}

$\mathrm{Ext}^{1}$（\ref{ha:ext}）は射影分解のコホモロジーとして定義したが、名前の由来は**拡大**（\ref{ha:extension}）にある：$R$ 加群 $c$ の $a$ による拡大、すなわち短完全列 $0\to a\to e\to c\to0$ の同値類は、$\mathrm{Ext}^{1}_{R}(c,a)$ の元と一対一に対応し、分裂する拡大がちょうど $0$ に対応する（\ref{ha:ext1-classifies}）。本ページでは、射影的な表示 $0\to k\to P\to c\to0$ を使ってこの対応を両方向に具体的に構成する。例として、$\mathbb{Z}/p$ の $\mathbb{Z}/p$ による拡大は $p$ 個の同値類をもち、そのうち $p-1$ 個は中央の群がすべて $\mathbb{Z}/p^{2}$ でありながら互いに同値でないこと（\ref{ha:ext-zp-zp}）を見る。

> 資料：本ページは特定の教科書の記述によらず、標準的な議論に従って組み立てた。

## 記法と定義の確認 {#ha:sec-ex-notation}

::: notation
- $R$ は環、加群は左 $R$ 加群、$\mathrm{Hom}=\mathrm{Hom}_{R}$。$\mathrm{Ext}^{n}=\mathrm{Ext}^{n}_{R}$ は第一変数の射影分解で定義したもの（\ref{ha:ext}）。
- $c$ の**射影的な表示**とは、短完全列 $0\to k\xrightarrow{i}P\xrightarrow{p}c\to0$ で $P$ が射影的なもの。$R\text{-}\mathbf{Mod}$ は十分な射影対象をもつ（\ref{ha:projective-basic} の 3）ので、つねに存在する。$P$ が射影的であるとは、全射 $q\colon e\to c$ と $h\colon P\to c$ に対し $q\beta=h$ となる $\beta\colon P\to e$（**持ち上げ**）があることである（\ref{ha:projective}）。
- $\mathrm{Ext}$ の第一変数の長完全列は \ref{ha:ext-long-exact} の 2、$\mathrm{Ext}^{n}(P,-)=0$（$n\ge1$, $P$ 射影的）は \ref{ha:ext-basic} の 3 のとおり。
:::

## 拡大とその同値 {#ha:sec-ex-extensions}

::: definition 拡大 {#ha:extension keywords="extension of c by a, morphism of extensions, equivalent extensions, split extension, Ext(c,a)" index="拡大（加群）|かくだいかぐん, 分裂する拡大|ぶんれつするかくだい"}
1. 加群 $c$ の $a$ による**拡大**とは、短完全列 $E\colon0\to a\xrightarrow{j}e\xrightarrow{q}c\to0$ のことである。
2. 拡大 $E$, $E'$（$0\to a\xrightarrow{j'}e'\xrightarrow{q'}c\to0$）の間の**射**とは、$\varphi j=j'$ かつ $q'\varphi=q$ を満たす準同型 $\varphi\colon e\to e'$ である。射が存在するとき $E\sim E'$ と書く。
3. 直和からなる拡大 $0\to a\to a\oplus c\to c\to0$（標準的な入射と射影）を**自明な拡大**、それと $\sim$ の関係にある拡大を**分裂する**拡大という。
:::

::: lemma 拡大の射は同型 {#ha:extension-morphism-iso keywords="a morphism of extensions is an isomorphism; equivalence of extensions is an equivalence relation" index="拡大の射|かくだいのしゃ"}
拡大の射 $\varphi\colon e\to e'$ は同型であり、その逆も拡大の射である。したがって $\sim$ は同値関係である。その同値類全体を $\mathcal{E}(c,a)$ と書く。
:::

::: proof
**単射.** $\varphi(x)=0$ なら $q(x)=q'\varphi(x)=0$ なので $x=j(y)$ と書け、$j'(y)=\varphi j(y)=0$ から $y=0$（$j'$ は単射）、よって $x=0$。

**全射.** $x'\in e'$ について、$q$ の全射性から $q(x)=q'(x')$ となる $x$ をとる。$q'(x'-\varphi(x))=0$ なので $x'-\varphi(x)=j'(y)=\varphi(j(y))$ と書け、$x'=\varphi(x+j(y))$。

逆写像 $\varphi^{-1}$ は $\varphi^{-1}j'=j$, $q\varphi^{-1}=q'$ を満たす。反射律は恒等写像、推移律は合成から。
:::

## Ext¹ による分類 {#ha:sec-ex-classification}

射影的な表示 $0\to k\xrightarrow{i}P\xrightarrow{p}c\to0$ を一つ固定する。\ref{ha:ext-long-exact} の 2 と $\mathrm{Ext}^{1}(P,a)=0$ から、完全列
$$
\mathrm{Hom}(P,a)\xrightarrow{i^{*}}\mathrm{Hom}(k,a)\xrightarrow{\partial}\mathrm{Ext}^{1}(c,a)\to0
$$
があり（$i^{*}(\gamma)=\gamma\circ i$）、$\partial$ は同型 $\mathrm{Hom}(k,a)/i^{*}\mathrm{Hom}(P,a)\cong\mathrm{Ext}^{1}(c,a)$ を引き起こす。以下、$\mathrm{Ext}^{1}(c,a)$ をこの商と同一視し、$\alpha\in\mathrm{Hom}(k,a)$ の類を $[\alpha]$ と書く。

::: lemma 押し出しによる拡大 {#ha:pushout-extension keywords="the extension e_alpha = (a + P)/{(alpha x, -i x)} obtained by pushing out a projective presentation" index="押し出しによる拡大|おしだしによるかくだい"}
$\alpha\colon k\to a$ について、$N_{\alpha}\defeq\{(\alpha(x),-i(x)):x\in k\}\subseteq a\oplus P$, $e_{\alpha}\defeq(a\oplus P)/N_{\alpha}$ とし、$j_{\alpha}(y)\defeq[y,0]$, $q_{\alpha}[y,z]\defeq p(z)$ とおく。すると $E_{\alpha}\colon0\to a\xrightarrow{j_{\alpha}}e_{\alpha}\xrightarrow{q_{\alpha}}c\to0$ は拡大である。
:::

::: proof
- *$q_{\alpha}$ は well-defined*：$q_{\alpha}$ を $a\oplus P$ 上の $(y,z)\mapsto p(z)$ とみると、$N_{\alpha}$ の元で $p(-i(x))=0$。
- *$q_{\alpha}$ は全射*：$p$ が全射。
- *$j_{\alpha}$ は単射*：$[y,0]=0$ なら $(y,0)=(\alpha(x),-i(x))$ となる $x$ があり、$i(x)=0$ から（$i$ は単射）$x=0$、よって $y=0$。
- *$\mathrm{im}\,j_{\alpha}=\ker q_{\alpha}$*：$q_{\alpha}j_{\alpha}=0$ は明らか。$q_{\alpha}[y,z]=0$ なら $p(z)=0$ なので $z=i(x)$ と書け、$(y,i(x))-(y+\alpha(x),0)=-(\alpha(x),-i(x))\in N_{\alpha}$ から $[y,z]=j_{\alpha}(y+\alpha(x))$。
:::

::: theorem Ext¹ は拡大を分類する {#ha:ext1-classifies keywords="Ext^1(c,a) is in natural bijection with equivalence classes of extensions; split extensions correspond to 0" index="Ext¹ と拡大の分類|えくすといちとかくだいのぶんるい"}
次の対応 $\Theta\colon\mathcal{E}(c,a)\to\mathrm{Ext}^{1}(c,a)$ は well-defined な全単射で、逆は $[\alpha]\mapsto[E_{\alpha}]$ である：拡大 $E\colon0\to a\xrightarrow{j}e\xrightarrow{q}c\to0$ について、$p$ の持ち上げ $\beta\colon P\to e$（$q\beta=p$）をとり、$j\alpha=\beta i$ を満たす $\alpha\colon k\to a$ をとって $\Theta(E)\defeq[\alpha]$ とする。特に、$E$ が分裂することと $\Theta(E)=0$ は同値である。
:::

::: proof
**Step 1（$\alpha$ の存在）.** $P$ の**射影性**から $\beta$ がある。$q\beta i=pi=0$ なので $\beta i$ の像は $\ker q=\mathrm{im}\,j$ に含まれ、$j$ は単射なので $j\alpha=\beta i$ となる $\alpha$ がただ一つある。

**Step 2（$\beta$ の選び方によらない）.** 別の持ち上げ $\beta'$ と対応する $\alpha'$ について、$q(\beta-\beta')=0$ なので、Step 1 と同様に $\beta-\beta'=j\gamma$ となる $\gamma\colon P\to a$ がある。すると $j(\alpha-\alpha')=(\beta-\beta')i=j\gamma i$ で、$j$ の単射性から $\alpha-\alpha'=\gamma i=i^{*}(\gamma)$。よって $[\alpha]=[\alpha']$。

**Step 3（同値な拡大で同じ値）.** 拡大の射 $\varphi\colon E\to E'$ について、$\varphi\beta$ は $E'$ での持ち上げ（$q'\varphi\beta=q\beta=p$）で、$\varphi\beta i=\varphi j\alpha=j'\alpha$。よって $E'$ でも同じ $\alpha$ がとれ、Step 2 から $\Theta(E')=\Theta(E)$。

**Step 4（$\Theta(E_{\alpha})=[\alpha]$）.** $E_{\alpha}$ では $\beta(z)\defeq[0,z]$ が持ち上げで、$\beta i(x)=[0,i(x)]=[\alpha(x),0]=j_{\alpha}\alpha(x)$（$(0,i(x))-(\alpha(x),0)\in N_{\alpha}$）。よって $\Theta(E_{\alpha})=[\alpha]$ で、$\Theta$ は全射。

**Step 5（$E\sim E_{\alpha}$）.** $E$ と、Step 1 の $\beta,\alpha$ について、$\varphi\colon e_{\alpha}\to e$, $\varphi[y,z]\defeq j(y)+\beta(z)$ を考える。$N_{\alpha}$ の元で $j\alpha(x)-\beta i(x)=0$ なので well-defined。$\varphi j_{\alpha}(y)=j(y)$, $q\varphi[y,z]=q\beta(z)=p(z)=q_{\alpha}[y,z]$ なので、$\varphi$ は拡大の射で、$E_{\alpha}\sim E$。

**Step 6（単射性）.** $\Theta(E)=\Theta(E')$ とし、それぞれ Step 1 の $\alpha,\alpha'$ をとると $\alpha'=\alpha+\gamma i$（$\gamma\colon P\to a$）。$\psi\colon e_{\alpha}\to e_{\alpha'}$, $\psi[y,z]\defeq[y-\gamma(z),z]$ は、$(\alpha(x),-i(x))\mapsto(\alpha(x)+\gamma i(x),-i(x))\in N_{\alpha'}$ なので well-defined で、拡大の射である（$z=0$ では恒等的、第二成分は不変）。Step 5 と合わせて $E\sim E_{\alpha}\sim E_{\alpha'}\sim E'$。

**分裂.** $E_{0}$ は $e_{0}=(a\oplus P)/(0\oplus i(k))\cong a\oplus c$（$[y,z]\mapsto(y,p(z))$）で、この同型は拡大の射なので $E_{0}$ は自明な拡大と同値。よって $E$ が分裂 $\iff E\sim E_{0}\iff\Theta(E)=[0]$。
:::

::: hypcheck
- **$P$ の射影性**：Step 1 で持ち上げ $\beta$ をとるのと、冒頭の完全列で $\mathrm{Ext}^{1}(P,a)=0$ を使うのとに使った。
- **$j$ の単射性・$\mathrm{im}\,j=\ker q$**：Step 1, 2 で射を $a$ を経由して書き直すのに使った。
- **$i$ の単射性**：\ref{ha:pushout-extension} で $j_{\alpha}$ が単射であることに使った。$i$ が単射でない（$k\to P$ が単に $\ker p$ への全射）だけでは、$\alpha$ が $\ker i$ 上で $0$ でないとき $E_{\alpha}$ は拡大にならない。
- **表示の選び方**：$\Theta$ は固定した表示を使って定義したが、$\mathrm{Ext}^{1}$ は射影分解の選び方によらず標準的な同型を除いて一意（\ref{ha:ext-basic} の 1）なので、別の表示でも同じ分類を与える（ここでは、二つの表示から得られる $\Theta$ が標準同型で移り合うことの確認は省略した）。
:::

::: corollary 分裂の判定 {#ha:ext1-splitting keywords="every extension of c splits iff Ext^1(c,-)=0 iff c is projective; every extension by an injective splits" index="拡大の分裂の判定|かくだいのぶんれつのはんてい"}
1. $c$ のすべての拡大が分裂することと、$c$ が射影的であることは同値である。
2. $a$ が入射的なら、$a$ によるすべての拡大は分裂する。
:::

::: proof
**1.** \ref{ha:ext1-classifies} から、すべての拡大が分裂することはすべての $a$ で $\mathrm{Ext}^{1}(c,a)=0$ であることと同値で、これは \ref{ha:ext-projective} から $c$ の射影性と同値。

**2.** $a$ が入射的なら、$i\colon k\to P$ は単射なので $i^{*}\colon\mathrm{Hom}(P,a)\to\mathrm{Hom}(k,a)$ は全射（入射性の定義）で、$\mathrm{Ext}^{1}(c,a)=0$。
:::

## ベール和 {#ha:sec-ex-baer}

::: definition ベール和 {#ha:baer-sum keywords="Baer sum of extensions via pullback along the diagonal and pushout along the codiagonal" index="ベール和|べーるわ"}
拡大 $E_{k}\colon0\to a\xrightarrow{j_{k}}e_{k}\xrightarrow{q_{k}}c\to0$（$k=1,2$）の**ベール和** $E_{1}+E_{2}$ を、
$$
e\defeq\{(x_{1},x_{2})\in e_{1}\oplus e_{2}:q_{1}x_{1}=q_{2}x_{2}\}/\{(j_{1}y,-j_{2}y):y\in a\}
$$
と $j(y)\defeq[(j_{1}y,0)]$, $q[(x_{1},x_{2})]\defeq q_{1}x_{1}$ で定める。
:::

::: theorem ベール和と Ext¹ の和 {#ha:baer-sum-ext keywords="the Baer sum is an extension and Theta(E1+E2) = Theta(E1)+Theta(E2); the classes of extensions form a group isomorphic to Ext^1" index="ベール和と Ext|べーるわとえくすと"}
$E_{1}+E_{2}$ は拡大で、$\Theta(E_{1}+E_{2})=\Theta(E_{1})+\Theta(E_{2})$。したがって、ベール和は同値類の上で矛盾なく定まり、$\mathcal{E}(c,a)$ は群になり、$\Theta$ は群の同型 $\mathcal{E}(c,a)\cong\mathrm{Ext}^{1}(c,a)$ である。
:::

::: proof
**拡大であること.** $q$ は well-defined（$q_{1}j_{1}y=0$）で全射（$z\in c$ に $q_{1}x_{1}=z=q_{2}x_{2}$ となる $x_{1},x_{2}$ をとる）。$j$ は単射：$(j_{1}y,0)=(j_{1}y',-j_{2}y')$ なら $j_{2}y'=0$ から $y'=0$、すると $j_{1}y=0$ から $y=0$。$\ker q\subseteq\mathrm{im}\,j$：$q_{1}x_{1}=0$ なら $q_{2}x_{2}=0$ で、$x_{k}=j_{k}y_{k}$、$[(j_{1}y_{1},j_{2}y_{2})]=[(j_{1}(y_{1}+y_{2}),0)]=j(y_{1}+y_{2})$。$qj=0$ は明らか。

**$\Theta$ の加法性.** 射影的な表示 $0\to k\xrightarrow{i}P\xrightarrow{p}c\to0$ と、$E_{k}$ の持ち上げ $\beta_{k}$, $\alpha_{k}$（$j_{k}\alpha_{k}=\beta_{k}i$）をとる。$\beta(z)\defeq[(\beta_{1}z,\beta_{2}z)]$ は $q_{1}\beta_{1}z=pz=q_{2}\beta_{2}z$ なので $e$ に値をとり、$q\beta=p$。さらに
$$
\beta i(x)=[(j_{1}\alpha_{1}x,\,j_{2}\alpha_{2}x)]=[(j_{1}(\alpha_{1}x+\alpha_{2}x),\,0)]=j\bigl((\alpha_{1}+\alpha_{2})x\bigr)
$$
（$(0,j_{2}y)\equiv(j_{1}y,0)$）。よって $\Theta(E_{1}+E_{2})=[\alpha_{1}+\alpha_{2}]$。

**同値類での定義.** $E_{1}\sim E_{1}'$ なら $\Theta(E_{1}+E_{2})=\Theta(E_{1}')+\Theta(E_{2})=\Theta(E_{1}'+E_{2})$ で、$\Theta$ の単射性（\ref{ha:ext1-classifies}）から $E_{1}+E_{2}\sim E_{1}'+E_{2}$。$\Theta$ は全単射で和を保つので、$\mathcal{E}(c,a)$ の和は $\mathrm{Ext}^{1}(c,a)$ の群構造を移したものとなり、群の公理を満たす（単位元は分裂する拡大の類）。
:::

## 例 {#ha:sec-ex-examples}

::: example $\mathbb{Z}/p$ の $\mathbb{Z}/p$ による拡大 {#ha:ext-zp-zp}
$p$ を素数、$R=\mathbb{Z}$, $a=c=\mathbb{Z}/p$ とする。表示 $0\to\mathbb{Z}\xrightarrow{p}\mathbb{Z}\to\mathbb{Z}/p\to0$ を使う。$i^{*}(\gamma)=\gamma\circ p=p\gamma=0$（$\mathbb{Z}/p$ への準同型を $p$ 倍すると $0$）なので、
$$
\mathrm{Ext}^{1}(\mathbb{Z}/p,\mathbb{Z}/p)\cong\mathrm{Hom}(\mathbb{Z},\mathbb{Z}/p)\cong\mathbb{Z}/p
$$
（\ref{ha:ext-z} とも一致）で、$\alpha(1)=u\in\mathbb{Z}/p$ が類を決める。
- $u=0$：自明な拡大 $\mathbb{Z}/p\oplus\mathbb{Z}/p$。
- $u\ne0$：$e_{u}=(\mathbb{Z}/p\oplus\mathbb{Z})/\langle(u,-p)\rangle$ で、$g\defeq[0,1]$ について $ng=0\iff(0,n)=m(u,-p)$ となる $m$ がある $\iff p\mid m$ かつ $n=-mp\iff p^{2}\mid n$。$e_{u}$ の位数は $p^{2}$（拡大なので $\lvert e_{u}\rvert=\lvert a\rvert\cdot\lvert c\rvert$）なので $e_{u}=\langle g\rangle\cong\mathbb{Z}/p^{2}$。$pg=[0,p]=[u,0]=j_{u}(u)$ なので、$j_{u}(1)=u^{-1}pg$、$q_{u}(g)=1$。

よって $u\ne0$ の $p-1$ 個の拡大はどれも中央が $\mathbb{Z}/p^{2}$ だが、$j$ が $1\mapsto u^{-1}p$ と異なり、\ref{ha:ext1-classifies} から互いに同値でない。拡大の同値は「中央の加群の同型」より細かい分類である。
:::

## 問題 {#ha:sec-ex-problems}

::: problem {#ha:prob-ex-z-z2}
$\mathbb{Z}$ の拡大 $0\to a\to e\to\mathbb{Z}\to0$ はすべて分裂することを、\ref{ha:ext1-classifies} を使わずに直接示せ。また \ref{ha:ext1-classifies} と整合することを確かめよ。
:::

::: solution
$q(x_{0})=1$ となる $x_{0}\in e$ をとり、$s(n)\defeq nx_{0}$ とすると $qs=1_{\mathbb{Z}}$。$\varphi\colon a\oplus\mathbb{Z}\to e$, $(y,n)\mapsto j(y)+s(n)$ は、$\varphi(y,0)=j(y)$, $q\varphi(y,n)=n$ を満たす拡大の射（自明な拡大から $E$ へ）なので、$E$ は分裂する。整合性：$\mathbb{Z}$ は自由なので射影的で、$\mathrm{Ext}^{1}(\mathbb{Z},a)=0$（\ref{ha:ext-basic} の 3）。
:::

::: problem {#ha:prob-ex-z4-z2}
$\mathbb{Z}/4$ の部分群 $2\mathbb{Z}/4\cong\mathbb{Z}/2$ による拡大 $0\to\mathbb{Z}/2\to\mathbb{Z}/4\to\mathbb{Z}/2\to0$ は分裂しないことを、直接と \ref{ha:ext-zp-zp} の両方で確かめよ。
:::

::: solution
**直接.** 分裂すれば $\mathbb{Z}/4\cong\mathbb{Z}/2\oplus\mathbb{Z}/2$（\ref{ha:extension-morphism-iso}）だが、左辺は位数 $4$ の元をもち、右辺はもたない。

**例から.** $p=2$ で $u=1$ の拡大は $j(1)=2g$, $q(g)=1$ で、これは問題の拡大そのもの。$u\ne0$ なので $\Theta\ne0$ で分裂しない。$p=2$ では $u\ne0$ は $u=1$ だけなので、$\mathbb{Z}/2$ の $\mathbb{Z}/2$ による拡大は、自明なものとこれの二つの同値類しかない。
:::

::: supplement
**前提を変えると.** $\mathcal{E}(c,a)$ には、拡大の**ベール和**（二つの拡大の引き戻しと押し出しで作る拡大）による群構造が定まり、$\Theta$ はこの和を $\mathrm{Ext}^{1}$ の和に移す群同型である（\ref{ha:baer-sum-ext}）。同様に、$n$ 項の完全列 $0\to a\to e_{n}\to\cdots\to e_{1}\to c\to0$ の適切な同値類が $\mathrm{Ext}^{n}(c,a)$ と対応することが知られている（**米田 Ext**）。米田 Ext は射影対象を使わずに定義できるので、十分な射影対象をもたないアーベル圏でも意味をもつ。

**似た定理.** 群 $\Pi$ の $\Pi$ 加群 $A$ による（$A$ を正規部分群とする）群の拡大のうち、共役作用が与えられたものの同値類は、群のコホモロジー $H^{2}(\Pi,A)$（\ref{cat:group-cohomology}）で分類されることが知られている。加群の拡大が $\mathrm{Ext}^{1}$ で分類されるのに対し群の拡大が $H^{2}=\mathrm{Ext}^{2}_{\mathbb{Z}\Pi}(\mathbb{Z},A)$ で分類されるのは、群の拡大では中央の対象が加群でなく群であるためである。\ref{ha:ext-z} の $\mathrm{Ext}^{1}_{\mathbb{Z}}(\mathbb{Z}/n,B)\cong B/nB$ は「$\mathbb{Z}/n$ の $B$ による拡大は、生成元の持ち上げの $n$ 倍が $B$ のどこに落ちるかで決まり、$nB$ の分だけ持ち上げの取り直しで動かせる」と読める。

**高い視点から：Ext¹ は「貼り合わせ方」の集まり.** 拡大 $0\to a\to e\to c\to0$ は、$a$ と $c$ という二つの部品を、どう貼り合わせて一つの加群 $e$ を作るかの記録である。自明な貼り合わせ（直和）が $0$ に当たり、$\mathrm{Ext}^{1}(c,a)$ の他の元は「ねじれた」貼り合わせを表す。比喩で言えば、$c$ の生成元を $e$ に持ち上げると、$c$ では成り立っていた関係式（$k$ の元）が $e$ ではずれて $a$ に落ちる。そのずれ $\alpha\colon k\to a$ が貼り合わせの「のりしろ」で、持ち上げ方を変えるとずれは $i^{*}\gamma$ だけ動くので、のりしろの本質は商 $\mathrm{Hom}(k,a)/i^{*}\mathrm{Hom}(P,a)$ にある。位相幾何では、空間の上の束が「貼り合わせの関数」で決まり、その取り直しを割ったものがコホモロジーで分類されるのと同じ構図である。
