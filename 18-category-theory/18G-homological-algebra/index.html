# ホモロジー代数（Homological Algebra）

鎖複体と長完全列、射影・入射分解、導来関手 Ext と Tor、スペクトル系列、導来圏。

<p class="mn-msc">MSC2020: 18G</p>

## 分野

<div class="mn-cards">
<a class="mn-card" href="01-abelian-categories/index.html"><span class="mn-card-title">アーベル圏</span><span class="mn-card-en">Abelian Categories</span><span class="mn-card-desc">零対象・核・余核、前加法圏と双積、加法圏と加法関手、アーベル圏・像の分解・完全列・完全関手、図式の補題（五項補題・蛇の補題）、鎖複体とホモロジーの長完全列。（Mac Lane 第 VIII 章に対応。長完全列は資料なし）</span><span class="mn-card-count">4 ページ</span></a>
<a class="mn-card" href="02-derived-functors/index.html"><span class="mn-card-title">導来関手</span><span class="mn-card-en">Derived Functors</span><span class="mn-card-desc">射影対象と射影分解、比較定理、左導来関手と長完全列、Ext（両変数の長完全列、Z 上の計算、射影性の特徴づけ、群のコホモロジー）と Tor の紹介、入射加群（ベールの判定法、可除群、十分な入射対象）、Ext¹ による拡大の分類、テンソル積と Tor・平坦加群、入射分解による Ext と平衡性、シャヌエルの補題と射影次元、δ 関手の普遍性（グロタンディーク）と Tor の平衡性。（資料なし。標準的な議論に従って組み立てた）</span><span class="mn-card-count">9 ページ</span></a>
