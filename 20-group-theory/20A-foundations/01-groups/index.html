# 群と準同型（Groups and Homomorphisms）

群の定義と例（対称群・二面体群・四元数群・行列群）、一般結合法則と冪、部分群と生成された部分群、元の位数、巡回群とその部分群、剰余類とラグランジュの定理、正規部分群と剰余群、準同型定理、直積と半直積（雪江『代数学 1』第 2 章に対応）。

<p class="mn-msc">MSC2020: 20A05</p>
