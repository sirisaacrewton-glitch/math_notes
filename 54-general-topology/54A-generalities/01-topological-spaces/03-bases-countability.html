# 開基と可算公理 {#top:page-bases-countability keywords="base of a topology, subbase, neighbourhood base, first countable, second countable, separable, Lindelof, Sorgenfrey line, lower limit topology"}

位相を一つずつ開集合を並べて与えるのは手間がかかる。距離空間で開球だけを指定すれば開集合がすべて決まったように、開集合を作るための「部品」を指定すれば十分である。これが**開基**（\ref{top:base}）と**準開基**（\ref{top:subbase}）であり、各点のまわりの部品が**基本近傍系**（\ref{top:neighborhood-base}）である。部品が可算個で足りるかどうかによって、**第一可算**・**第二可算**の公理が定まる（\ref{top:second-countable}）。第二可算な空間は可分かつリンデレーフで、距離空間ではこれらは同値になる（\ref{top:metric-countability}）。

> 資料：内田伏一『集合と位相』§17–§18。

## 記法と定義の確認 {#top:sec-bc-notation}

::: notation
- 位相、生成される位相、近傍、閉包、稠密、可分は \ref{top:page-topologies}, \ref{top:page-closure-interior} のとおり（\ref{top:topological-space}, \ref{top:intersection-of-topologies}, \ref{top:neighborhood}, \ref{top:closure-neighborhood}, \ref{top:separable-space}）。
- 可算は「有限または可算無限」の意味とする。可算個の可算集合の和が可算であることには可算選択公理を使う。選択公理を使う箇所は明記する。
:::

## 開基と準開基 {#top:sec-bc-bases}

::: definition 開基 {#top:base keywords="base (basis) of a topology" index="開基|かいき, 基底（位相の）|きていいそうの"}
位相空間 $(X,\mathcal{O})$ について、$\mathcal{B}\subseteq\mathcal{O}$ が**開基**であるとは、すべての開集合が $\mathcal{B}$ の元の和として書けることをいう。同値な言い換え：開集合 $U$ と $x\in U$ に対し、$x\in B\subseteq U$ となる $B\in\mathcal{B}$ がある。
:::

::: proof
（言い換えの同値性）「⇒」：$U=\bigcup_{\lambda}B_{\lambda}$ なら $x$ はある $B_{\lambda}$ に属する。「⇐」：$U=\bigcup\{B\in\mathcal{B}:B\subseteq U\}$（右辺は $U$ に含まれ、各 $x\in U$ を含む）。
:::

::: theorem 開基となる条件 {#top:base-criterion keywords="criterion for a family of sets to be a base of some topology" index="開基の条件|かいきのじょうけん"}
集合 $X$ と $\mathcal{B}\subseteq\mathcal{P}(X)$ について、$\mathcal{B}$ がある位相の開基であるための必要十分条件は、次の二つである。
- (B1) $X=\bigcup\mathcal{B}$。
- (B2) $B_{1},B_{2}\in\mathcal{B}$, $x\in B_{1}\cap B_{2}$ なら、$x\in B\subseteq B_{1}\cap B_{2}$ となる $B\in\mathcal{B}$ がある。

このとき、$\mathcal{B}$ を開基とする位相はただ一つで、$\mathcal{O}_{\mathcal{B}}\defeq\{\bigcup\mathcal{C}:\mathcal{C}\subseteq\mathcal{B}\}$ である。
:::

::: proof
**必要性.** (B1)：$X$ は開集合なので開基の元の和。(B2)：$B_{1}\cap B_{2}$ は開集合なので、開基の言い換えから。

**一意性.** $\mathcal{B}$ が開基なら、開集合は $\mathcal{B}$ の元の和で、$\mathcal{B}$ の元の和は開集合なので、位相は $\mathcal{O}_{\mathcal{B}}$ に限る。

**十分性.** $\mathcal{O}_{\mathcal{B}}$ が位相であることを示す。(O1)：$\varnothing=\bigcup\varnothing$、$X=\bigcup\mathcal{B}$（B1）。(O3)：和の和は和。(O2)：$U=\bigcup\mathcal{C}_{1}$, $V=\bigcup\mathcal{C}_{2}$ とする。$x\in U\cap V$ なら $x\in B_{1}\cap B_{2}$（$B_{i}\in\mathcal{C}_{i}$）で、(B2) から $x\in B\subseteq B_{1}\cap B_{2}\subseteq U\cap V$ となる $B\in\mathcal{B}$ がある。よって $U\cap V=\bigcup\{B\in\mathcal{B}:B\subseteq U\cap V\}\in\mathcal{O}_{\mathcal{B}}$。$\mathcal{B}$ が開基であることは定義から。

::: hypcheck
- **(B2)**：(O2) の証明にだけ使った。外すと偽：$X=\{0,1,2\}$, $\mathcal{B}=\{\{0,1\},\{1,2\}\}$ は (B1) を満たすが、$\{1\}=\{0,1\}\cap\{1,2\}$ を $\mathcal{B}$ の元の和に書けない。
:::
:::

::: definition 準開基 {#top:subbase keywords="subbase (subbasis) of a topology" index="準開基|じゅんかいき, 部分基|ぶぶんき"}
$\mathcal{S}\subseteq\mathcal{O}$ が位相 $\mathcal{O}$ の**準開基**であるとは、$\mathcal{S}$ の元の有限個の共通部分の全体が開基になることをいう（$0$ 個の共通部分は $X$ とする）。
:::

::: proposition 準開基の生成する位相 {#top:subbase-generates keywords="every family of subsets is a subbase of the topology it generates" index="準開基と生成される位相|じゅんかいきとせいせいされるいそう"}
任意の $\mathcal{S}\subseteq\mathcal{P}(X)$ について、$\mathcal{S}$ を準開基とする位相がただ一つあり、それは $\mathcal{S}$ が生成する位相（\ref{top:intersection-of-topologies}）、すなわち $\mathcal{S}$ を含む最弱の位相に等しい。
:::

::: proof
$\mathcal{B}\defeq\{S_{1}\cap\cdots\cap S_{n}:n\ge0,S_{i}\in\mathcal{S}\}$ は (B1)（$n=0$ で $X\in\mathcal{B}$）と (B2)（二つの有限共通部分の共通部分は有限共通部分）を満たすので、\ref{top:base-criterion} からそれを開基とする位相 $\mathcal{O}_{\mathcal{B}}$ がただ一つある。$\mathcal{O}_{\mathcal{B}}\supseteq\mathcal{S}$。$\mathcal{S}$ を含む任意の位相は (O2), (O3) から $\mathcal{B}$ の元とその和を含むので、$\mathcal{O}_{\mathcal{B}}$ を含む。よって $\mathcal{O}_{\mathcal{B}}$ は最弱。
:::

::: example
1. $\R$ の通常の位相では、開区間の全体、有理数を端点とする開区間の全体（可算個）が開基、開半直線 $(a,\infty)$, $(-\infty,a)$ の全体が準開基である（開区間 $(a,b)=(a,\infty)\cap(-\infty,b)$）。開半直線の全体は開基ではない（$(0,1)$ を含む開半直線はない）。
2. 距離空間では開球の全体が開基（距離位相の定義）、$B(x,1/n)$（$x\in X$, $n\ge1$）の全体も開基である。
3. **ゾルゲンフライ直線（下限位相）.** $\R$ で半開区間 $[a,b)$ の全体は (B1), (B2) を満たし（$[a,b)\cap[c,d)=[\max(a,c),\min(b,d))$）、それが開基となる位相を**下限位相**、得られる空間をゾルゲンフライ直線 $\R_{\ell}$ という。$(a,b)=\bigcup_{n}[a+1/n,b)$ なので、通常の位相より強い。$[a,b)$ は開かつ閉（補集合 $(-\infty,a)\cup[b,\infty)$ も開）。
:::

## 基本近傍系と可算公理 {#top:sec-bc-countability}

::: definition 基本近傍系 {#top:neighborhood-base keywords="neighbourhood base (local base)" index="基本近傍系|きほんきんぼうけい, 近傍基|きんぼうき"}
点 $x$ の近傍の族 $\mathcal{V}(x)$ が $x$ の**基本近傍系**であるとは、$x$ の任意の近傍 $N$ が、ある $V\in\mathcal{V}(x)$ を含む（$V\subseteq N$）ことをいう。
:::

::: example
距離空間で、$\{B(x,1/n):n\ge1\}$ は $x$ の可算な基本近傍系。開基 $\mathcal{B}$ について、$\{B\in\mathcal{B}:x\in B\}$ は $x$ の基本近傍系。
:::

::: definition 可算公理・リンデレーフ {#top:second-countable keywords="first countable, second countable, Lindelof space" index="第一可算公理|だいいちかさんこうり, 第二可算公理|だいにかさんこうり, 第 2 可算|だいにかさん, リンデレーフ空間|りんでれーふくうかん"}
1. 各点が可算な基本近傍系をもつ空間を**第一可算**（第一可算公理を満たす）という。
2. 可算な開基をもつ空間を**第二可算**という。
3. 開集合による任意の被覆（和が $X$ になる開集合の族）が可算な部分被覆をもつ空間を**リンデレーフ**という。
:::

::: proposition 第二可算な空間の性質 {#top:second-countable-properties keywords="second countable implies first countable, separable, and Lindelof" index="第二可算な空間の性質|だいにかさんなくうかんのせいしつ"}
（可算選択公理）第二可算な空間は、第一可算、可分、リンデレーフである。
:::

::: proof
可算な開基 $\mathcal{B}=\{B_{n}:n\in\N\}$ をとる。

**第一可算.** $\{B_{n}:x\in B_{n}\}$ は $x$ の可算な基本近傍系。

**可分.** 空でない各 $B_{n}$ から点 $d_{n}$ を選ぶ（可算選択）。$D\defeq\{d_{n}\}$ は可算で、空でない開集合 $U$ は空でない $B_{n}\subseteq U$ を含むので $D$ と交わる。\ref{top:dense-characterization} から稠密。

**リンデレーフ.** 開被覆 $\mathcal{U}$ をとる。$N\defeq\{n:B_{n}\subseteq U\text{ となる }U\in\mathcal{U}\text{ がある}\}$ とし、各 $n\in N$ に $B_{n}\subseteq U_{n}$ となる $U_{n}\in\mathcal{U}$ を選ぶ（可算選択）。$x\in X$ は $x\in U\in\mathcal{U}$ となる $U$ をもち、$x\in B_{n}\subseteq U$ となる $n$ があるので $n\in N$ で $x\in U_{n}$。よって $\{U_{n}:n\in N\}$ は可算な部分被覆。

::: hypcheck
- **可算選択公理**：可分性で各 $B_{n}$ から点を、リンデレーフ性で各 $n$ に $U_{n}$ を選ぶのに使った。第一可算性には使わない。
- **逆は成り立たない**：ゾルゲンフライ直線は第一可算・可分・リンデレーフ（\ref{top:sorgenfrey-lindelof}）だが、第二可算でない（\ref{top:sorgenfrey-not-second-countable}）。非可算集合上の離散空間は第一可算だが、可分でもリンデレーフでもない。
:::
:::

::: proposition 距離空間の可算性 {#top:metric-countability keywords="for metric spaces: second countable iff separable iff Lindelof" index="距離空間の可算性|きょりくうかんのかさんせい"}
（可算選択公理）距離空間は第一可算である。距離空間について、第二可算・可分・リンデレーフは互いに同値である。
:::

::: proof
**第一可算.** $\{B(x,1/n)\}_{n\ge1}$。

**可分 ⇒ 第二可算.** 可算な稠密集合 $D$ をとり、$\mathcal{B}\defeq\{B(d,1/n):d\in D,n\ge1\}$（可算）とする。開集合 $U$ と $x\in U$ について $B(x,2/n)\subseteq U$ となる $n$ をとる。$B(x,1/n)$ は $D$ と交わるので $d\in D$ で $d(x,d)<1/n$。すると $x\in B(d,1/n)$ で、$y\in B(d,1/n)$ なら $d(x,y)<2/n$ なので $B(d,1/n)\subseteq B(x,2/n)\subseteq U$。

**リンデレーフ ⇒ 可分.** 各 $n$ について開被覆 $\{B(x,1/n):x\in X\}$ の可算な部分被覆 $\{B(x_{n,k},1/n)\}_{k}$ をとる（各 $n$ で一つ選ぶのに可算選択）。$D\defeq\{x_{n,k}\}$ は可算で、任意の $x$ と $n$ について $x\in B(x_{n,k},1/n)$ となる $k$ があるので、$B(x,1/n)\cap D\neq\varnothing$。よって稠密。

**第二可算 ⇒ リンデレーフ・可分**は \ref{top:second-countable-properties}。

::: hypcheck
- **距離**：可分 ⇒ 第二可算で、三角不等式（$B(d,1/n)\subseteq B(x,2/n)$）を使った。一般の空間では偽（ゾルゲンフライ直線）。
:::
:::

::: proposition ゾルゲンフライ直線は第二可算でない {#top:sorgenfrey-not-second-countable keywords="the Sorgenfrey line is first countable, separable, Lindelof but not second countable" index="ゾルゲンフライ直線|ぞるげんふらいちょくせん"}
ゾルゲンフライ直線 $\R_{\ell}$ は第一可算かつ可分だが、第二可算でない。したがって距離化可能でない。
:::

::: proof
**第一可算.** $\{[x,x+1/n)\}_{n}$。**可分.** $[a,b)$ は有理数を含むので $\mathbb{Q}$ は稠密。

**第二可算でない.** 可算な開基 $\mathcal{B}=\{B_{0},B_{1},\dots\}$ があったとする（番号付けを一つ固定する）。各 $x\in\R$ について、開集合 $[x,x+1)$ と点 $x$ に対し $x\in B_{n}\subseteq[x,x+1)$ となる $n$ があり、そのような $B_{n}$ の最小元は $x$ である（$x\in B_{n}\subseteq[x,\infty)$）。そのような $n$ の最小値を $n(x)$ とすると、$\min B_{n(x)}=x$ なので $x\mapsto n(x)$ は単射 $\R\to\N$ となり、$\R$ が非可算であることに反する。

**距離化不能.** 距離空間なら \ref{top:metric-countability} から可分 ⇒ 第二可算となるが、そうでない。

::: hypcheck
- **半開区間の最小元**：第二可算でないことの核心は、開基の元が「左端点」で区別されることである。通常の位相では開区間に最小元がないので、この議論は使えない（実際 $\R$ は第二可算）。
:::
:::

::: supplement
**前提を変えると.** リンデレーフ性は可分性と違い、閉部分空間に遺伝する。ゾルゲンフライ直線はリンデレーフだが、その二乗 $\R_{\ell}\times\R_{\ell}$（ゾルゲンフライ平面）はリンデレーフでない（反対角線 $\{(x,-x)\}$ が非可算な離散閉部分空間）。この例は、リンデレーフ性も正規性も積で保たれないことを示す標準的な例である（\ref{top:sorgenfrey-plane}）。

**類似の概念.** 開基の最小の濃度を空間の**重さ**、稠密集合の最小の濃度を**稠密度**という。濃度関数の大小関係を調べるのが基数関数の理論で、集合論的位相の主題の一つである（ススリンの問題、\ref{set:page-suslin-problem}）。

**高い視点から：開基は位相の「生成元」.** 準開基は群の生成元、開基は生成元の積（ここでは有限共通部分）に当たる。位相 $\mathcal{O}$ は準開基から「有限の共通部分と任意の和」で生成される。比喩で言えば、準開基は「基本的な観測」（たとえば「$x>a$」「$x<b$」）で、開基はそれを有限個組み合わせた観測、開集合はその任意個の選言である。第二可算性は、観測の種類が可算個で足りること、すなわち空間が「可算個の質問で記述できる」ことを意味する。
:::

## 問題 {#top:sec-bc-problems}

::: problem {#top:prob-sorgenfrey-finer}
ゾルゲンフライ直線の位相は通常の位相より真に強いことを示せ。また、$[0,1)$ は $\R_{\ell}$ で開かつ閉であることを確かめよ。
:::

::: solution
$(a,b)=\bigcup_{n\ge1,\,a+1/n<b}[a+1/n,b)$ なので通常の開集合は $\R_{\ell}$ で開。$[0,1)$ は通常の位相で開でない（$0$ を含む開区間は負の数を含む）ので真に強い。$[0,1)$ の補集合 $(-\infty,0)\cup[1,\infty)=\bigcup_{n}[-n,0)\cup\bigcup_{n}[1,n)$ は開。
:::

::: problem {#top:prob-cofinite-countability}
非可算集合上の補有限位相は、可分だが第一可算でないことを示せ。
:::

::: solution
可分：可算無限部分集合 $D$ は稠密（空でない開集合は補集合が有限なので $D$ と交わる。可算無限部分集合の存在には可算選択を使う）。第一可算でない：点 $x$ の可算な基本近傍系 $\{V_{n}\}$ があるとし、各 $V_{n}$ は開集合 $U_{n}\ni x$ を含む。$\bigcap_{n}U_{n}$ の補集合 $\bigcup_{n}U_{n}^{c}$ は可算集合の可算和なので可算（可算選択）で、$X$ は非可算なので $y\neq x$ で $y\in\bigcap U_{n}$ となるものがある。$X\setminus\{y\}$ は $x$ の開近傍だが、どの $V_{n}$ も含まない（$y\in U_{n}\subseteq V_{n}$）。
:::
