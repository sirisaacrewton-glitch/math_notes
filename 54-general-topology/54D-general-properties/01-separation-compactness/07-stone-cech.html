# 完全正則空間とストーン–チェックのコンパクト化 {#top:page-stone-cech keywords="completely regular space, Tychonoff space, embedding into cubes, compactification, Stone-Cech compactification, universal property"}

ハウスドルフ空間 $X$ を、コンパクトなハウスドルフ空間の中に稠密に埋め込むことを**コンパクト化**という。一点コンパクト化（\ref{top:one-point-compactification}）は局所コンパクトな空間にしか使えないが、点と閉集合を連続関数で分けられる空間（**完全正則空間**、\ref{top:completely-regular}）なら、立方体 $[0,1]^{I}$ に埋め込むことでコンパクト化が作れる（\ref{top:tychonoff-embedding}）。その中で最大のものが**ストーン–チェックのコンパクト化** $\beta X$ で、「コンパクトハウスドルフ空間への連続写像は一意に延長できる」という普遍性で特徴づけられる（\ref{top:stone-cech}）。

> 資料：標準的な構成（立方体への埋め込みの閉包）を本サイトで書き下ろした。参考：R. Engelking, *General Topology*, §3.5–§3.6。

## 記法と定義の確認 {#top:sec-sc-notation}

::: notation
- 分離公理・ウリゾーンの補題・チコノフの定理は前ページまでのとおり（\ref{top:separation-axioms}, \ref{top:urysohn-lemma}, \ref{top:tychonoff}）。
- $C(X,[0,1])$ は $X$ から $[0,1]$ への連続写像全体の集合。
- 集合 $I$ について $[0,1]^{I}$ は直積位相をもつ立方体で、$p_{i}$ は第 $i$ 射影（\ref{top:product-topology}）。写像 $g\colon Z\to[0,1]^{I}$ が連続であることと、すべての $p_{i}\circ g$ が連続であることは同値（\ref{top:product-maps}）。
- **埋め込み**は、像への同相写像になる連続写像（\ref{top:homeomorphism} の 3）。
- 議論は $\ZF$ で行い、選択公理（とその弱い形）を使う箇所は明記する。
:::

## 完全正則空間 {#top:sec-sc-completely-regular}

::: definition 完全正則空間・チコノフ空間 {#top:completely-regular keywords="completely regular space, Tychonoff space, T3 1/2" index="完全正則空間|かんぜんせいそくくうかん, チコノフ空間|ちこのふくうかん, T₃½ 空間|てぃーさんかにぶんのいちくうかん"}
位相空間 $X$ が**完全正則**であるとは、閉集合 $F$ と点 $x\notin F$ に対し、連続関数 $f\colon X\to[0,1]$ で $f(x)=0$ かつ $f[F]\subseteq\{1\}$ となるものがあることをいう。完全正則かつ $T_{1}$ の空間を**チコノフ空間**（**$T_{3\frac{1}{2}}$ 空間**）という。
:::

::: proposition 完全正則性の基本性質 {#top:completely-regular-basic keywords="T4 implies Tychonoff implies T3; subspaces and products of completely regular spaces; metric and locally compact Hausdorff spaces are Tychonoff" index="完全正則性の基本性質|かんぜんせいそくせいのきほんせいしつ"}
1. 完全正則なら正則。とくにチコノフ空間は $T_{3}$。
2. $T_{4}$ 空間はチコノフ空間である（DC を使う）。
3. 完全正則空間の部分空間・直積は完全正則。チコノフ空間の部分空間・直積はチコノフ空間。
4. 距離空間はチコノフ空間である（選択公理を使わない）。
5. 局所コンパクトなハウスドルフ空間はチコノフ空間である（DC を使う）。
:::

::: proof
**1.** $f$ を点 $x$ と閉集合 $F$ を分ける関数とすると、$f^{-1}[[0,1/2)]$ と $f^{-1}[(1/2,1]]$ が $x$ と $F$ を分離する開集合。

**2.** $T_{1}$ から $\{x\}$ は閉（\ref{top:separation-implications}）で、$x\notin F$ なら $\{x\}$ と $F$ は交わらない閉集合。ウリゾーンの補題（\ref{top:urysohn-lemma}。ここで DC）を適用する。

**3, 部分空間.** $A\subseteq X$ の閉集合は $F\cap A$（$F$ は $X$ で閉）の形。$x\in A\setminus F$ なら $X$ で $x$ と $F$ を分ける $f$ をとり、$f|_{A}$ を使う。$T_{1}$ も部分空間に遺伝する。

**3, 直積.** $X=\prod_{i\in I}X_{i}$, $F$ を閉集合、$x\notin F$ とする。$X\setminus F$ は $x$ の開近傍なので、基本開集合 $W=\bigcap_{i\in J}p_{i}^{-1}[W_{i}]$（$J\subseteq I$ は有限、$W_{i}$ は $x_{i}$ の開近傍）で $x\in W\subseteq X\setminus F$ となるものがある（\ref{top:product-base}）。各 $i\in J$ について、$X_{i}$ で $x_{i}$ と閉集合 $X_{i}\setminus W_{i}$ を分ける $f_{i}$ を選ぶ（$J$ は有限なので選択公理は要らない）。
$$
f(y)\defeq\max_{i\in J}f_{i}(y_{i})
$$
とおく（$J=\varnothing$ なら $W=X$ で $F=\varnothing$ となり、定数 $0$ でよい）。有限個の連続関数の最大値なので連続で、$f(x)=0$。$y\in F$ なら $y\notin W$ なので、ある $i\in J$ で $y_{i}\notin W_{i}$、よって $f(y)\ge f_{i}(y_{i})=1$。$T_{1}$ は直積に遺伝する（点 $x$ の補集合は $\bigcup_{i}p_{i}^{-1}[X_{i}\setminus\{x_{i}\}]$）。

**4.** 閉集合 $F\neq\varnothing$ と $x\notin F$ をとる。$F$ は閉なので $d(x,F)>0$（\ref{top:metric-normal} の証明を参照）。
$$
f(y)\defeq\min\Bigl\{1,\ \frac{d(y,x)}{d(x,F)}\Bigr\}
$$
は連続で $f(x)=0$。$y\in F$ なら $d(y,x)\ge d(x,F)$ なので $f(y)=1$。$F=\varnothing$ なら定数 $0$ でよい。$T_{1}$ は \ref{top:metric-normal}。

**5.** 一点コンパクト化 $X^{*}$ はコンパクトハウスドルフ（\ref{top:one-point-properties} の 2, 3）なので正規（\ref{top:compact-hausdorff-normal}）、よって $T_{4}$ で、2 からチコノフ空間。$X$ はその部分空間なので 3 による。
:::

::: example
1. 正則だが完全正則でない $T_{1}$ 空間が存在する（ティホノフのコルク抜きなど。L. A. Steen, J. A. Seebach, *Counterexamples in Topology* に収録。ここでは扱わない）。
2. 完全正則だが正規でない空間：ゾルゲンフライ平面 $\R_{\ell}\times\R_{\ell}$ は、正規なゾルゲンフライ直線の直積なので完全正則（3）だが、正規でない（\ref{top:regular-hereditary} の後の注意）。ニェミツキ平面（\ref{top:niemytzki-plane}）も同様の例である。
:::

## 立方体への埋め込み {#top:sec-sc-embedding}

::: theorem チコノフの埋め込み定理 {#top:tychonoff-embedding keywords="a space is Tychonoff iff it embeds in a cube [0,1]^I iff it is a subspace of a compact Hausdorff space" index="チコノフの埋め込み定理|ちこのふのうめこみていり, 立方体|りっぽうたい"}
$X$ をチコノフ空間とし、$\Phi\defeq C(X,[0,1])$ とおく。
$$
e\colon X\to[0,1]^{\Phi},\qquad e(x)\defeq\bigl(\varphi(x)\bigr)_{\varphi\in\Phi}
$$
は埋め込みである。したがって次は同値である（2 ⇒ 1 には DC、1 ⇒ 2 には超フィルター補題を使う）。
1. $X$ はチコノフ空間。
2. $X$ はあるコンパクトハウスドルフ空間の部分空間と同相。
:::

::: proof
**連続性.** $p_{\varphi}\circ e=\varphi$ は連続なので、$e$ は連続（\ref{top:product-maps}）。

**単射.** $x\neq y$ なら、$\{y\}$ は閉で $x\notin\{y\}$ なので、完全正則性から $\varphi(x)=0$, $\varphi(y)=1$ となる $\varphi\in\Phi$ がある。$e(x)_{\varphi}\neq e(y)_{\varphi}$。

**$e$ は $e[X]$ への開写像.** $U\subseteq X$ を開とし、$\Phi_{U}\defeq\{\varphi\in\Phi:\varphi[X\setminus U]\subseteq\{1\}\}$ とおく。次を示す。
$$
e[U]=e[X]\cap\bigcup_{\varphi\in\Phi_{U}}p_{\varphi}^{-1}\bigl[[0,1)\bigr]
$$
右辺は $e[X]$ の開集合なので、これで $e[U]$ が $e[X]$ で開であることが分かる。
- 「$\subseteq$」：$x\in U$ なら、完全正則性（閉集合 $X\setminus U$ と点 $x$）から $\varphi(x)=0$ となる $\varphi\in\Phi_{U}$ があり、$e(x)\in p_{\varphi}^{-1}[[0,1)]$。
- 「$\supseteq$」：$e(y)_{\varphi}<1$ となる $\varphi\in\Phi_{U}$ があれば、$\varphi(y)<1$ なので $y\notin X\setminus U$、すなわち $y\in U$。$e$ は単射なので $e(y)\in e[U]$。

（各 $x$ ごとに関数を選ぶ代わりに、条件を満たす関数すべての和をとったので、選択公理は使っていない。）

以上から $e$ は $X$ から $e[X]$ への連続な開全単射、すなわち埋め込みである。

**1 ⇒ 2.** $[0,1]$ はコンパクトハウスドルフ（\ref{top:interval-compact}）で、その直積 $[0,1]^{\Phi}$ はチコノフの定理（\ref{top:tychonoff-hausdorff}。超フィルター補題を使う）からコンパクトハウスドルフ。$X$ は $e$ によりその部分空間と同相。

**2 ⇒ 1.** コンパクトハウスドルフ空間は $T_{4}$（\ref{top:compact-hausdorff-normal}）なので、\ref{top:completely-regular-basic} の 2（DC）からチコノフ空間。その部分空間もチコノフ空間（同 3）。

::: hypcheck
- **完全正則性**：単射性と開写像性の両方に使った。
- **$T_{1}$**：単射性で $\{y\}$ が閉であることに使った。$T_{1}$ がないと $e$ は単射でなくなり得る（密着空間では $\Phi$ は定数関数だけ）。
- **超フィルター補題・DC**：同値性の証明でだけ使い、$e$ が埋め込みであることには使っていない。
:::
:::

## ストーン–チェックのコンパクト化 {#top:sec-sc-stone-cech}

::: definition コンパクト化 {#top:compactification keywords="compactification of a space" index="コンパクト化|こんぱくとか"}
位相空間 $X$ の**コンパクト化**とは、コンパクトハウスドルフ空間 $K$ と埋め込み $h\colon X\to K$ の対 $(K,h)$ で、$h[X]$ が $K$ で稠密なものをいう。
:::

\ref{top:tychonoff-embedding} から、コンパクト化をもつ空間はチコノフ空間に限る（超フィルター補題と DC のもとで）。

::: definition ストーン–チェックのコンパクト化 {#top:stone-cech-def keywords="Stone-Cech compactification beta X, closure of the image in the cube" index="ストーン–チェックのコンパクト化|すとーんちぇっくのこんぱくとか"}
チコノフ空間 $X$ について、\ref{top:tychonoff-embedding} の $e\colon X\to[0,1]^{\Phi}$ の像の閉包を $\beta X\defeq\overline{e[X]}$ とおき、$e$ を $X\to\beta X$ とみなす。$(\beta X,e)$ を $X$ の**ストーン–チェックのコンパクト化**という。
:::

::: theorem ストーン–チェックのコンパクト化の普遍性 {#top:stone-cech keywords="universal property of the Stone-Cech compactification: maps to compact Hausdorff spaces extend uniquely" index="ストーン–チェックのコンパクト化の普遍性|すとーんちぇっくのこんぱくとかのふへんせい"}
（超フィルター補題と DC を仮定する。）$X$ をチコノフ空間とする。
1. $(\beta X,e)$ は $X$ のコンパクト化である。
2. $K$ がコンパクトハウスドルフ空間で $f\colon X\to K$ が連続なら、連続写像 $F\colon\beta X\to K$ で $F\circ e=f$ となるものが**ただ一つ**ある。
:::

::: proof
**1.** $\beta X$ はコンパクトハウスドルフ空間 $[0,1]^{\Phi}$ の閉集合なので、コンパクト（\ref{top:compact-basic}）でハウスドルフ（\ref{top:hausdorff-properties} の 1）。$e$ は埋め込みで、$e[X]$ は閉包 $\beta X$ で稠密。

**2, 存在.** $K$ はチコノフ空間（\ref{top:tychonoff-embedding} の 2 ⇒ 1。DC）なので、$\Psi\defeq C(K,[0,1])$ について $e_{K}\colon K\to[0,1]^{\Psi}$ は埋め込みである。写像
$$
T\colon[0,1]^{\Phi}\to[0,1]^{\Psi},\qquad T(t)_{\psi}\defeq t_{\psi\circ f}
$$
を考える（$\psi\in\Psi$ なら $\psi\circ f\in\Phi$）。$p_{\psi}\circ T=p_{\psi\circ f}$ は射影なので連続で、$T$ は連続（\ref{top:product-maps}）。$x\in X$ について
$$
T(e(x))_{\psi}=e(x)_{\psi\circ f}=\psi(f(x))=e_{K}(f(x))_{\psi}
$$
なので、$T\circ e=e_{K}\circ f$。連続写像は閉包を閉包の中に移す（\ref{top:continuity-equivalents} の 4）ので、
$$
T[\beta X]\subseteq\overline{T[e[X]]}=\overline{e_{K}[f[X]]}\subseteq\overline{e_{K}[K]}=e_{K}[K]
$$
最後の等号は、$e_{K}[K]$ がコンパクト（連続像）で、ハウスドルフ空間 $[0,1]^{\Psi}$ の中で閉であることによる（\ref{top:compact-hausdorff-closed}）。$e_{K}$ は $K$ から $e_{K}[K]$ への同相写像なので、$F\defeq e_{K}^{-1}\circ T|_{\beta X}\colon\beta X\to K$ は連続で、$F\circ e=e_{K}^{-1}\circ e_{K}\circ f=f$。

**2, 一意性.** $F,F'$ がともに条件を満たせば、両者は稠密な $e[X]$ 上で一致し、$K$ はハウスドルフなので $F=F'$（\ref{top:hausdorff-properties} の 2）。

::: hypcheck
- **$K$ のハウスドルフ性**：一意性と、$e_{K}[K]$ が閉であることに使った（実際は $[0,1]^{\Psi}$ のハウスドルフ性を使い、$e_{K}$ が単射であることに $K$ の $T_{1}$ 性を使った）。
- **$K$ のコンパクト性**：$e_{K}[K]$ が閉であることに使った。$K=\R$ などでは延長は一般に存在しない（下の例 2）。
- **超フィルター補題**：$[0,1]^{\Phi}$ のコンパクト性。**DC**：$K$ がチコノフ空間であること（ウリゾーンの補題）。
:::
:::

::: proposition 普遍性による一意性と最大性 {#top:stone-cech-unique keywords="uniqueness of beta X up to homeomorphism; every compactification is a quotient of beta X" index="ストーン–チェックのコンパクト化の一意性|すとーんちぇっくのこんぱくとかのいちいせい"}
（\ref{top:stone-cech} と同じ仮定。）
1. コンパクト化 $(K,h)$ が \ref{top:stone-cech} の 2 と同じ普遍性をもてば、同相写像 $\theta\colon\beta X\to K$ で $\theta\circ e=h$ となるものがある。
2. 任意のコンパクト化 $(K,h)$ について、$h$ の延長 $F\colon\beta X\to K$ は全射である。
:::

::: proof
**1.** $\beta X$ の普遍性から $h$ の延長 $F\colon\beta X\to K$ が、$K$ の普遍性から $e$ の延長 $G\colon K\to\beta X$ がある。$G\circ F\circ e=G\circ h=e$ なので、$G\circ F$ と恒等写像はともに「$e$ の延長」であり、普遍性の一意性から $G\circ F=\mathrm{id}_{\beta X}$。同様に $F\circ G=\mathrm{id}_{K}$。$\theta\defeq F$。

**2.** $F[\beta X]$ はコンパクトなので $K$ で閉（\ref{top:compact-hausdorff-closed}）で、$h[X]=F[e[X]]$ を含む。$h[X]$ は稠密なので $F[\beta X]=K$。
:::

::: corollary 有界連続関数の延長 {#top:stone-cech-bounded-functions}
（同じ仮定。）チコノフ空間 $X$ 上の有界連続関数 $g\colon X\to\R$ は、ただ一つの連続関数 $\beta X\to\R$ に延長される（$e$ を通して）。
:::

::: proof
$g$ の値は閉区間 $[a,b]$ に入り、$[a,b]$ はコンパクトハウスドルフ。\ref{top:stone-cech} の 2 を $K=[a,b]$ に適用する。
:::

::: example
1. **コンパクトハウスドルフ空間 $X$**：$(X,\mathrm{id})$ は普遍性をもつ（$f$ 自身が延長）ので、\ref{top:stone-cech-unique} の 1 から $\beta X\cong X$。
2. **$X=[0,1)$**：一点コンパクト化は $[0,1]$ である。しかし $g(x)\defeq\sin\bigl(1/(1-x)\bigr)$ は有界連続で、$x\to1$ で極限をもたないので $[0,1]$ 上に延長できない。よって $[0,1]$ は普遍性をもたず、$\beta[0,1)$ は $[0,1]$ と（$X$ を固定する形で）同相でない。\ref{top:stone-cech-unique} の 2 から、$[0,1]$ は $\beta[0,1)$ の連続全射像である。
3. **$X=\N$（離散）**：$\beta\N$ は $\N$ 上の超フィルター全体の空間と同一視でき、濃度は $2^{2^{\aleph_{0}}}$ である（\ref{top:beta-n-cardinality}）。
:::

::: supplement
**前提を変えると.** 超フィルター補題も DC も使わずに $\beta X$ を作る方法は、一般には期待できない。たとえば $\N$ 上の非単項超フィルターの存在は $\ZF$ では証明できないことが知られており（T. Jech, *The Axiom of Choice*）、$\beta\N$ を超フィルターの空間として作る方法は $\ZF$ だけでは機能しない。

**類似の構成.** 一点コンパクト化は、局所コンパクトハウスドルフ空間の「最小の」コンパクト化である（非コンパクトな場合。\ref{top:one-point-unique}）。\ref{top:stone-cech-unique} の 2 は $\beta X$ が「最大の」コンパクト化であることを述べる。ブール代数のストーン空間（\ref{top:stone-representation}）は、超フィルターで点を作るという点で $\beta\N$ の構成と同じ発想に立つ。

**関数環から見ると.** \ref{top:stone-cech-bounded-functions} は、$X$ 上の有界連続関数の環 $C_{b}(X)$ と $\beta X$ 上の連続関数の環 $C(\beta X)$ が、制限によって同型であることを意味する。コンパクトハウスドルフ空間はその連続関数環から復元できる（環としてはゲルファント–コルモゴロフの定理、C* 環としては可換なゲルファント–ナイマルクの定理。関数解析で扱う）。この意味で、$\beta X$ は「$C_{b}(X)$ が見ている空間」である。
:::

::: intuition 高い視点から：反射としての βX
チコノフ空間と連続写像の圏を $\mathbf{Tych}$、コンパクトハウスドルフ空間の充満部分圏を $\mathbf{CHaus}$ とする。\ref{top:stone-cech} の 2 は、$e\colon X\to\beta X$ が「$X$ から $\mathbf{CHaus}$ への普遍射」であることを述べている。したがって $\beta$ は包含関手 $\mathbf{CHaus}\to\mathbf{Tych}$ の左随伴に延び、$\mathbf{CHaus}$ は $\mathbf{Tych}$ の反射部分圏になる（\ref{cat:adjunction-from-universal}, \ref{cat:reflective-subcategory}）。\ref{top:stone-cech-unique} の 1 は、普遍射が同型を除いて一意であることの特別な場合である。

比喩で言えば、$\beta X$ は「群に対する自由アーベル化」のような**自由な**コンパクト化である。アーベル化がアーベル群への準同型をすべて受け止めるのと同じく、$\beta X$ はコンパクトハウスドルフ空間への写像をすべて受け止める。その代わり、余計な関係を課さないので非常に大きくなる（$\beta\N$ の濃度）。
:::

## 問題 {#top:sec-sc-problems}

::: problem {#top:prob-beta-n-isolated}
（\ref{top:stone-cech} の仮定のもとで。）$\N$ を離散空間とする。各 $n\in\N$ について、$\{e(n)\}$ が $\beta\N$ の開集合であることを示せ。
:::

::: solution
$\chi\colon\N\to\{0,1\}$ を $n$ で $1$、それ以外で $0$ とする（離散空間なので連続）。$\{0,1\}$（離散）はコンパクトハウスドルフなので、延長 $\widetilde{\chi}\colon\beta\N\to\{0,1\}$ がある。$O\defeq\widetilde{\chi}^{-1}[\{1\}]$ は開で、$O\cap e[\N]=\{e(n)\}$。$\beta\N$ はハウスドルフなので一点集合は閉で、$O\setminus\{e(n)\}$ は開集合であり、$e[\N]$ と交わらない。$e[\N]$ は稠密なので $O\setminus\{e(n)\}=\varnothing$、すなわち $\{e(n)\}=O$ は開。
:::

::: problem {#top:prob-open-in-compact-lc}
コンパクトハウスドルフ空間 $K$ の開部分集合 $U$ は（部分空間として）局所コンパクトであることを示せ。とくに、チコノフ空間 $X$ について $e[X]$ が $\beta X$ で開なら、$X$ は局所コンパクトである。
:::

::: solution
$x\in U$ をとる。$K$ は正規かつ $T_{1}$（\ref{top:compact-hausdorff-normal}）なので正則で、\ref{top:regular-normal-characterization} の 1 から $x\in V\subseteq\overline{V}\subseteq U$ となる開集合 $V$ がある。$\overline{V}$ はコンパクト空間の閉集合なのでコンパクト（\ref{top:compact-basic}）で、$U$ の中の $x$ の近傍である。後半は、$X$ が $e$ により $e[X]$ と同相であることから従う。
:::
