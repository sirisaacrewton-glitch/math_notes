# ブール代数とストーンの表現定理 {#top:page-stone-duality keywords="Stone representation theorem, Stone space, Boolean space, ultrafilters of a Boolean algebra, clopen algebra, field of sets, Stone duality, zero-dimensional compact Hausdorff space"}

有限集合の部分集合全体はブール代数である。逆に、すべてのブール代数は、ある集合の部分集合からなるブール代数（**集合体**）と同型である——これが**ストーンの表現定理**（\ref{top:stone-representation}）である。表現に使う集合は、ブール代数の超フィルター全体 $S(\mathbb{B})$ で、これには自然な位相が入り、コンパクトハウスドルフで開かつ閉な集合の基をもつ空間（**ストーン空間**）になる（\ref{top:stone-space-of-ba}）。$\mathbb{B}$ は $S(\mathbb{B})$ の開かつ閉な集合の全体として復元され、逆にストーン空間は開かつ閉な集合のブール代数から復元される（\ref{top:stone-space-recovered}）。この往復は、ブール代数の圏とストーン空間の圏の反変な圏同値（**ストーン双対性**、\ref{top:stone-duality}）を与える。

> 資料：内田『集合と位相』、小山『位相空間論』にはこの話題の扱いがないため、標準的な構成を本サイトで組み立てた。

## 記法と定義の確認 {#top:sec-sd-notation}

::: notation
- ブール代数 $\mathbb{B}$（$\mathbf{0}\neq\mathbf{1}$ を仮定する）、補元 $-a$、その基本性質は \ref{set:boolean-algebra}, \ref{set:boolean-algebra-basic} のとおり。フィルター・超フィルターは \ref{set:boolean-ccc-filter}、その性質（上に閉じ $\wedge$ で閉じる、超フィルター $U$ は各 $b$ について $b$ と $-b$ のちょうど一方を含む）は \ref{set:boolean-filter-basic}、超フィルターの存在（有限交叉性をもつ集合は超フィルターに含まれる。$\mathrm{AC}$ を使う）は \ref{set:boolean-ultrafilter} のとおり。
- ブール代数の**準同型**は、$\wedge$, $\vee$, $-$, $\mathbf{0}$, $\mathbf{1}$ を保つ写像。全単射な準同型を**同型**という。
- 位相空間 $X$ の開かつ閉な集合（**閉開集合**）全体を $\mathrm{Clop}(X)$ と書く。これは $\cap$, $\cup$, 補集合で閉じ、$X\neq\varnothing$ ならブール代数である。
- コンパクト、ハウスドルフ、コンパクトからハウスドルフへの連続な全単射は同相（\ref{top:compact}, \ref{top:hausdorff}, \ref{top:compact-to-hausdorff}）。閉集合族の有限交叉性による特徴づけは \ref{top:compact-equivalents}。
- 体系は $\ZFC$（選択公理を使う箇所は明記する）。
:::

## ストーン空間 {#top:sec-sd-stone-space}

::: definition ストーン空間 {#top:stone-space keywords="Stone space, Boolean space, zero-dimensional compact Hausdorff space" index="ストーン空間|すとーんくうかん, 閉開集合|へいかいしゅうごう, 零次元|れいじげん"}
コンパクトハウスドルフ空間で、閉開集合全体が開基をなすもの（**零次元**）を**ストーン空間**という。
:::

::: example
1. 有限離散空間、カントール集合 $2^{\mathbb{N}}$（\ref{top:product-topology} の積位相）はストーン空間。
2. $[0,1]$ はコンパクトハウスドルフだが、閉開集合は $\varnothing$ と全体だけ（連結、\ref{top:connected}）なのでストーン空間でない。
:::

::: definition ブール代数のストーン空間 {#top:stone-space-of-ba-def keywords="space of ultrafilters of a Boolean algebra, basic clopen sets [b]" index="超フィルターの空間|ちょうふぃるたーのくうかん"}
ブール代数 $\mathbb{B}$ の超フィルター全体を $S(\mathbb{B})$ とし、$b\in\mathbb{B}$ について $[b]\defeq\{U\in S(\mathbb{B}):b\in U\}$ とおく。
:::

::: lemma 基本集合の演算 {#top:stone-basic-sets keywords="b -> [b] preserves meets, joins and complements" index="ストーン写像|すとーんしゃぞう"}
$[b\wedge c]=[b]\cap[c]$、$[b\vee c]=[b]\cup[c]$、$[-b]=S(\mathbb{B})\setminus[b]$、$[\mathbf{0}]=\varnothing$、$[\mathbf{1}]=S(\mathbb{B})$。さらに（$\mathrm{AC}$）$b\neq\mathbf{0}$ なら $[b]\neq\varnothing$。
:::

::: proof
超フィルター $U$ について示す。

**Step 1（交わり）.** $b\wedge c\in U$ なら、上に閉じているので $b,c\in U$。逆に $b,c\in U$ なら $b\wedge c\in U$（\ref{set:boolean-filter-basic} の 2）。

**Step 2（補元・$\mathbf{0}$・$\mathbf{1}$）.** $-b\in U$ と $b\notin U$ は同値（\ref{set:boolean-filter-basic} の 3）。$U\subseteq\mathbb{B}^{+}$ なので $\mathbf{0}\notin U$。$U\neq\varnothing$ で上に閉じているので $\mathbf{1}\in U$。

**Step 3（結び）.** $b\in U$ なら $b\le b\vee c$ から $b\vee c\in U$（$c$ も同様）。逆に $b\vee c\in U$ かつ $b\notin U$ なら $-b\in U$ で、Step 1 から $(b\vee c)\wedge-b\in U$。分配律で
$$
(b\vee c)\wedge-b=(b\wedge-b)\vee(c\wedge-b)=c\wedge-b\le c,
$$
よって $c\in U$。

**Step 4（空でないこと）.** $b\neq\mathbf{0}$ なら $\{b\}$ は有限交叉性をもつので、$b$ を含む超フィルターがある（\ref{set:boolean-ultrafilter}）。

::: hypcheck
- **分配律**：Step 3 で使った。分配束でない束では「結びに属するなら片方に属する」は成り立たない。
- **選択公理**：Step 4 の超フィルターの存在だけに使った（ブール素イデアル定理と呼ばれる、$\mathrm{AC}$ より真に弱い原理で足りることが知られている）。
:::
:::

::: theorem ストーン空間であること {#top:stone-space-of-ba keywords="the ultrafilter space of a Boolean algebra is a Stone space; clopen sets are exactly the [b]" index="ストーン空間の構成|すとーんくうかんのこうせい"}
（$\mathrm{AC}$）$\{[b]:b\in\mathbb{B}\}$ を開基とする位相で、$S(\mathbb{B})$ はストーン空間であり、その閉開集合はちょうど $[b]$（$b\in\mathbb{B}$）の形の集合である。
:::

::: proof
**Step 1（開基）.** $\{[b]\}$ は $S(\mathbb{B})=[\mathbf{1}]$ を覆い、交わりで閉じる（\ref{top:stone-basic-sets}）ので開基になる（\ref{top:base-criterion}）。

**Step 2（零次元）.** $[b]$ の補集合は $[-b]$ で開なので、$[b]$ は閉開集合。よって閉開集合が開基をなす。

**Step 3（ハウスドルフ）.** $U\neq V$ なら、$b\in U\setminus V$ がある（どちらも極大なので、一方が他方を含むことはない）。$-b\in V$ で、$U\in[b]$, $V\in[-b]$, $[b]\cap[-b]=[\mathbf{0}]=\varnothing$。

**Step 4（コンパクト）.** 開基の元による被覆について示せば十分である（任意の開被覆の各開集合を開基の元の和に分ければよい）。$\{[b_{i}]\}_{i\in I}$ が $S(\mathbb{B})$ を覆い、有限部分被覆をもたないとする。任意の有限個 $i_{1},\dots,i_{n}$ について $[b_{i_{1}}]\cup\cdots\cup[b_{i_{n}}]\neq S(\mathbb{B})$ なので、補集合をとって
$$
[-b_{i_{1}}\wedge\cdots\wedge-b_{i_{n}}]=S(\mathbb{B})\setminus\bigl([b_{i_{1}}]\cup\cdots\cup[b_{i_{n}}]\bigr)\neq\varnothing,
$$
とくに $-b_{i_{1}}\wedge\cdots\wedge-b_{i_{n}}\neq\mathbf{0}$（$[\mathbf{0}]=\varnothing$）。よって $\{-b_{i}\}$ は有限交叉性をもち、それを含む超フィルター $U$ がある（\ref{set:boolean-ultrafilter}）。$U$ はどの $b_{i}$ も含まないので、どの $[b_{i}]$ にも属さず、被覆であることに反する。

**Step 5（閉開集合の形）.** $C$ を閉開集合とする。開なので開基の元の和 $C=\bigcup_{j}[c_{j}]$。閉なのでコンパクト（コンパクト空間の閉集合）で、有限個で覆える：$C=[c_{1}]\cup\cdots\cup[c_{m}]=[c_{1}\vee\cdots\vee c_{m}]$。

::: hypcheck
- **超フィルターの極大性**：Step 3（$b\in U\setminus V$ の存在）と、$[-b]$ が補集合であること（\ref{set:boolean-filter-basic} の 3）に使った。
- **選択公理**：Step 4（有限交叉性から超フィルター）に使った。
- **コンパクト性**：Step 5 で、閉開集合が有限個の基本集合の和であることに使った。
:::
:::

## ストーンの表現定理 {#top:sec-sd-representation}

::: theorem ストーンの表現定理 {#top:stone-representation keywords="Stone representation theorem: every Boolean algebra is isomorphic to a field of sets" index="ストーンの表現定理|すとーんのひょうげんていり, 集合体|しゅうごうたい"}
（$\mathrm{AC}$）$b\mapsto[b]$ は、ブール代数の同型 $\mathbb{B}\cong\mathrm{Clop}(S(\mathbb{B}))$ である。とくに、すべてのブール代数は、ある集合の部分集合からなり $\cap,\cup$, 補集合で閉じたブール代数（**集合体**）と同型である。
:::

::: proof
**Step 1（準同型）.** \ref{top:stone-basic-sets}。

**Step 2（単射）.** $b\neq c$ とする。$b\wedge-c=\mathbf{0}$ かつ $c\wedge-b=\mathbf{0}$ なら、\ref{set:boolean-algebra-basic} の 2 から $b\le c$ かつ $c\le b$ で $b=c$ となり矛盾。よって、たとえば $b\wedge-c\neq\mathbf{0}$ で、$[b\wedge-c]=[b]\setminus[c]\neq\varnothing$（\ref{top:stone-basic-sets}）。$[b]\neq[c]$。

**Step 3（全射）.** \ref{top:stone-space-of-ba} の閉開集合の形。

::: hypcheck
- **選択公理**：Step 2 の $[b\wedge-c]\neq\varnothing$（超フィルターの存在）に使った。これがないと、超フィルターが少なすぎて異なる元を区別できない可能性がある。
:::
:::

::: theorem ストーン空間の復元 {#top:stone-space-recovered keywords="a Stone space is homeomorphic to the ultrafilter space of its clopen algebra" index="ストーン空間の復元|すとーんくうかんのふくげん"}
空でないストーン空間 $X$ について、$x\mapsto U_{x}\defeq\{C\in\mathrm{Clop}(X):x\in C\}$ は同相写像 $X\to S(\mathrm{Clop}(X))$ である。
:::

::: proof
**Step 1（$U_{x}$ は超フィルター）.** $U_{x}$ は $\varnothing$ を含まず、上に閉じ、$\cap$ で閉じる（\ref{set:boolean-filter-basic} の 2 の条件）。各 $C$ について $x\in C$ か $x\in X\setminus C$ のちょうど一方。この性質をもつ空でないフィルターは超フィルターである（真に大きいフィルター $V$ があれば、$C\in V\setminus U_{x}$ について $X\setminus C\in U_{x}\subseteq V$ となり、$\varnothing=C\cap(X\setminus C)\in V$ となって矛盾）。

**Step 2（単射）.** $x\neq y$ とする。ハウスドルフなので $y$ を含まない $x$ の開近傍があり、閉開集合が開基なので、その中に $x\in C$ となる閉開集合 $C$ がある。$C\in U_{x}\setminus U_{y}$。

**Step 3（全射）.** $V\in S(\mathrm{Clop}(X))$ とする。$V$ は閉集合の族で有限交叉性をもつ（$\wedge$ で閉じ $\varnothing$ を含まない）ので、コンパクト性から $\bigcap V\neq\varnothing$（\ref{top:compact-equivalents}）。$x\in\bigcap V$ をとると $V\subseteq U_{x}$、$V$ の極大性から $V=U_{x}$。

**Step 4（同相）.** 基本集合 $[C]$ の逆像は $\{x:C\in U_{x}\}=C$ で開なので連続。$X$ はコンパクト、$S(\mathrm{Clop}(X))$ はハウスドルフ（\ref{top:stone-space-of-ba}）なので、連続な全単射は同相（\ref{top:compact-to-hausdorff}）。

::: hypcheck
- **零次元性**：Step 2 で、点を閉開集合で分けるのに使った。$[0,1]$ では $\mathrm{Clop}=\{\varnothing,[0,1]\}$ で、$S(\mathrm{Clop})$ は一点になる。
- **コンパクト性**：Step 3（超フィルターに対応する点の存在）と Step 4 に使った。
- **選択公理は使っていない**：\ref{top:stone-space-of-ba} のハウスドルフ性（Step 4 で使う）は選択公理なしで示されている。
:::
:::

::: theorem ストーン双対性 {#top:stone-duality keywords="Stone duality: the category of Boolean algebras is dually equivalent to the category of Stone spaces" index="ストーン双対性|すとーんそうついせい"}
（$\mathrm{AC}$）ブール代数と準同型の圏 $\mathbf{Bool}$ と、空でないストーン空間と連続写像の圏 $\mathbf{Stone}$ について、$\mathbf{Bool}^{\mathrm{op}}$ と $\mathbf{Stone}$ は圏同値である。関手は
$$
\begin{aligned}
S&\colon\mathbf{Bool}^{\mathrm{op}}\to\mathbf{Stone},\ \ S(f)(U)\defeq f^{-1}(U),\\
\mathrm{Clop}&\colon\mathbf{Stone}\to\mathbf{Bool}^{\mathrm{op}},\ \ \mathrm{Clop}(g)(C)\defeq g^{-1}(C).
\end{aligned}
$$
:::

::: proof
**Step 1（$S$ は関手）.** 準同型 $f\colon\mathbb{A}\to\mathbb{B}$ と $U\in S(\mathbb{B})$ について、$f^{-1}(U)$ は超フィルター：$\mathbf{0}\notin f^{-1}(U)$（$f\mathbf{0}=\mathbf{0}$）、上に閉じる（$a\le a'$ なら $fa\le fa'$）、$\wedge$ で閉じる、各 $a$ について $fa$ と $f(-a)=-fa$ のちょうど一方が $U$ に入る（\ref{top:stone-space-recovered} の Step 1 と同じ理由で超フィルター）。連続性：$S(f)^{-1}([a])=\{U:fa\in U\}=[fa]$ は開。恒等射と合成を保つことは逆像の性質。

**Step 2（$\mathrm{Clop}$ は関手）.** 連続写像の逆像は閉開集合を閉開集合に移し、$\cap,\cup$, 補集合を保つので準同型。

**Step 3（自然同型）.** $\sigma_{\mathbb{B}}\colon\mathbb{B}\to\mathrm{Clop}(S(\mathbb{B}))$, $b\mapsto[b]$ は同型（\ref{top:stone-representation}）。自然性：$f\colon\mathbb{A}\to\mathbb{B}$ について $\mathrm{Clop}(S(f))([a])=S(f)^{-1}([a])=[fa]=\sigma_{\mathbb{B}}(fa)$。$\tau_{X}\colon X\to S(\mathrm{Clop}(X))$, $x\mapsto U_{x}$ は同相（\ref{top:stone-space-recovered}）。自然性：$g\colon X\to Y$ について $S(\mathrm{Clop}(g))(U_{x})=\{C:g^{-1}(C)\in U_{x}\}=\{C:gx\in C\}=U_{gx}$。

よって $\mathrm{Clop}\circ S\cong1$, $S\circ\mathrm{Clop}\cong1$ で、圏同値（\ref{cat:equivalence-of-categories}）。
:::

::: supplement
**一般化.** 分配束とスペクトル空間・プリーストリー空間の双対性、可換 C* 環とコンパクトハウスドルフ空間の双対性（ゲルファント–ナイマルク）など、「代数の圏」と「空間の圏」の反変な同値は数多く知られており、ストーン双対性はその原型とされる。

**前提を変えると.** 選択公理（の弱い形）を外すと、超フィルターをもたない（あるいは少ない）ブール代数がありうるため、表現定理は証明できない。表現定理はブール素イデアル定理と（$\ZF$ 上で）同値であることが知られている（範囲外）。

**類似の定理.** 命題論理の完全性定理（\ref{logic:page-prop-completeness}）は、論理式を証明可能な同値で割ったリンデンバウム代数（ブール代数）の超フィルターが「付値」に当たることから、表現定理とほぼ同じ内容になる：導けない論理式 $\varphi$ について $-[\varphi]\neq\mathbf{0}$ を含む超フィルターが、$\varphi$ を偽にする付値を与える。また、離散空間 $X$ のストーン–チェックのコンパクト化（\ref{top:page-stone-cech}）は、冪集合のブール代数 $\mathcal{P}(X)$ のストーン空間 $S(\mathcal{P}(X))$（$X$ 上の超フィルター全体）として作れる。

**高い視点から：点は超フィルター.** ストーン双対性は、「空間の点」を「閉開集合のどれに属するかの一貫した判断」（超フィルター）で置き換えられることを言う。比喩で言えば、ブール代数は「はい／いいえで答えられる質問の体系」、超フィルターは「すべての質問への矛盾のない回答表」で、ストーン空間は「回答表の全体」である。圏論的には、二元ブール代数 $\mathbf{2}$ と二点離散空間 $2$ が両方の圏に住む「双対化対象」で、$S(\mathbb{B})\cong\mathbf{Bool}(\mathbb{B},\mathbf{2})$（超フィルター $U$ は特性関数 $\mathbb{B}\to\mathbf{2}$）、$\mathrm{Clop}(X)\cong\mathbf{Stone}(X,2)$ と書ける。
:::

## 問題 {#top:sec-sd-problems}

::: problem {#top:prob-sd-finite}
有限ブール代数は、ある有限集合の冪集合と同型であることを示せ。とくに元の個数は $2^{n}$ の形である。
:::

::: solution
有限ブール代数 $\mathbb{B}$ のストーン空間 $S(\mathbb{B})$ は有限なハウスドルフ空間なので離散で、閉開集合はすべての部分集合。表現定理から $\mathbb{B}\cong\mathcal{P}(S(\mathbb{B}))$。（有限の場合、超フィルターの存在には選択公理は要らない：$b\neq\mathbf{0}$ の下にある極小な非零元 $a$（原子）をとれば、$\{c:a\le c\}$ が超フィルター。）
:::

::: problem {#top:prob-sd-cantor}
有限集合と補有限集合からなる $\mathbb{N}$ の部分集合のブール代数 $\mathbb{F}$ のストーン空間は、$\mathbb{N}$ の一点コンパクト化（\ref{top:one-point-compactification}）と同相であることを示せ。
:::

::: solution
$\mathbb{F}$ の超フィルターは、各 $n$ についての単項超フィルター $U_{n}=\{A:n\in A\}$ と、補有限集合全体 $U_{\infty}$ だけである（超フィルター $U$ が有限集合 $A$ を含めば、$A$ のある一点 $\{n\}$ を含み（$A=\bigcup_{n\in A}\{n\}$ と \ref{top:stone-basic-sets} の結び）$U=U_{n}$。有限集合を含まなければ補有限集合をすべて含み $U=U_{\infty}$）。基本集合 $[\{n\}]=\{U_{n}\}$ は開なので $U_{n}$ は孤立点、$U_{\infty}$ の基本近傍は $[A]$（$A$ 補有限）$=\{U_{\infty}\}\cup\{U_{n}:n\in A\}$。これは一点コンパクト化 $\mathbb{N}\cup\{\infty\}$ の位相そのものである。
:::
