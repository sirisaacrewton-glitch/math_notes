# 位相空間の一般的な性質（Fairly General Properties）

分離公理、コンパクト性とチコノフの定理、局所コンパクト性、連結性、ウリゾーンの補題とティーツェの拡張定理、パラコンパクト性。

<p class="mn-msc">MSC2020: 54D</p>

## 分野

<div class="mn-cards">
<a class="mn-card" href="01-separation-compactness/index.html"><span class="mn-card-title">分離公理・コンパクト性・連結性</span><span class="mn-card-en">Separation, Compactness and Connectedness</span><span class="mn-card-desc">分離公理、コンパクト空間、チコノフの定理、局所コンパクトと一点コンパクト化、連結性、ウリゾーンの補題とティーツェの拡張定理、ストーン–チェックのコンパクト化、パラコンパクト性と 1 の分割、可算コンパクト性・点列コンパクト性・擬コンパクト性、βℕ の濃度と点列、有理数の位相的特徴づけ（シェルピンスキーの定理）、マイケルの定理（σ 局所有限な細分とパラコンパクト性、正則リンデレーフ空間）、マイケルの選択定理。（内田『集合と位相』§21–§25、小山『位相空間論』第 7 章を参考）</span><span class="mn-card-count">18 ページ</span></a>
