# 距離空間のコンパクト性 {#top:page-compact-metric keywords="totally bounded, sequentially compact, Bolzano-Weierstrass property, compact metric spaces, Lebesgue number lemma, Heine-Cantor theorem, uniform continuity"}

一般の位相空間では、コンパクト性（有限部分被覆）と点列コンパクト性（収束部分列）は異なる概念である（\ref{top:compact} の後の補足）。距離空間では両者は一致し、さらに「**完備かつ全有界**」とも同値になる（\ref{top:compact-metric-equivalents}）。全有界とは「どんなに細かい解像度でも、有限個の点で全体を近似できる」という性質であり、コンパクト性を「有限の近似ができて（全有界）、穴がない（完備）」と分解して理解できる。応用として、ルベーグ数の補題（\ref{top:lebesgue-number}）と、コンパクト距離空間上の連続写像が一様連続であること（\ref{top:heine-cantor}）を示す。

> 資料：内田伏一『集合と位相』§22, §27。文章と証明は本サイトで書き下ろした。

## 記法と定義の確認 {#top:sec-cmt-notation}

::: notation
- 距離空間・コーシー列・完備・直径・一様連続は \ref{top:metric-topology}, \ref{top:complete-metric} とその記法のとおり。
- コンパクト性は \ref{top:compact}（任意の開被覆が有限部分被覆をもつ）。有限交叉性による言い換えは \ref{top:compact-equivalents}。
- 点 $x$ が集合 $A$ の**集積点**であるとは、$x$ のどの近傍も $x$ 以外の $A$ の点を含むことをいう。距離空間（$T_{1}$）では、このとき $x$ のどの近傍も $A$ の点を無限個含む（有限個なら、それらを除いた小さい球がとれる）。
- 点列 $(x_{n})$ の**部分列**とは、狭義単調増加な $n_{1}<n_{2}<\cdots$ による $(x_{n_{k}})_{k}$ をいう。
- 議論は $\ZF$ で行い、選択公理（可算選択・DC）を使う箇所は明記する。
:::

## 全有界性と点列コンパクト性 {#top:sec-cmt-definitions}

::: definition 全有界・ε 網 {#top:totally-bounded keywords="totally bounded metric space, epsilon-net" index="全有界|ぜんゆうかい, ε 網|いぷしろんもう"}
距離空間 $X$ と $\varepsilon>0$ について、有限集合 $F\subseteq X$ で $X=\bigcup_{a\in F}B(a,\varepsilon)$ となるものを **$\varepsilon$ 網**という。すべての $\varepsilon>0$ について $\varepsilon$ 網があるとき、$X$ は**全有界**であるという。
:::

全有界なら有界である（$1$ 網 $F$ について、直径は $2+\max_{a,b\in F}d(a,b)$ 以下）。逆は成り立たない（下の例）。

::: definition 点列コンパクト・ボルツァーノ–ワイエルシュトラス性 {#top:sequentially-compact keywords="sequentially compact, limit point compact, Bolzano-Weierstrass property" index="点列コンパクト|てんれつこんぱくと, ボルツァーノ–ワイエルシュトラス性|ぼるつぁーのわいえるしゅとらすせい"}
位相空間 $X$ が**点列コンパクト**であるとは、すべての点列が収束する部分列をもつことをいう。$X$ の無限部分集合がつねに集積点をもつとき、$X$ は**ボルツァーノ–ワイエルシュトラス性**をもつという。
:::

::: lemma 全有界性とコーシー部分列 {#top:totally-bounded-cauchy keywords="totally bounded iff every sequence has a Cauchy subsequence" index="全有界性の言い換え|ぜんゆうかいせいのいいかえ"}
距離空間 $X$ について次は同値である（DC を使う）。
1. $X$ は全有界。
2. $X$ のすべての点列はコーシー部分列をもつ。
:::

::: proof
**1 ⇒ 2.** 点列 $(x_{n})$ をとる。帰納的に、無限集合 $I_{k}\subseteq\N$ と点 $a_{k}$ を、$I_{0}\defeq\N$、
$$
I_{k}\subseteq I_{k-1},\qquad n\in I_{k}\Rightarrow d(x_{n},a_{k})<2^{-k}
$$
となるように選ぶ。$k$ 段目：$2^{-k}$ 網 $F$ をとると、$I_{k-1}=\bigcup_{a\in F}\{n\in I_{k-1}:d(x_{n},a)<2^{-k}\}$ は有限個の集合の和で、$I_{k-1}$ が無限なのでどれかが無限。その $a$ を $a_{k}$、その集合を $I_{k}$ とする（網と $a$ の選択が前の段に依存するので DC）。次に $n_{k}$ を「$n_{k}\in I_{k}$ かつ $n_{k}>n_{k-1}$ となる最小のもの」と定める（$I_{k}$ は無限なので存在し、選択は要らない）。$j\ge k$ なら $n_{j}\in I_{j}\subseteq I_{k}$ なので、
$$
d(x_{n_{j}},x_{n_{k}})\le d(x_{n_{j}},a_{k})+d(a_{k},x_{n_{k}})<2\cdot2^{-k}
$$
よって $(x_{n_{k}})$ はコーシー列。

**2 ⇒ 1.** 全有界でないとし、$\varepsilon$ 網のない $\varepsilon>0$ をとる。帰納的に $x_{n}\notin\bigcup_{i<n}B(x_{i},\varepsilon)$ となる点を選ぶ（$\{x_{0},\ldots,x_{n-1}\}$ は $\varepsilon$ 網でないので選べる。DC）。$i\neq j$ なら $d(x_{i},x_{j})\ge\varepsilon$ なので、どの部分列もコーシー列でない。
:::

## コンパクト性の同値な条件 {#top:sec-cmt-equivalents}

::: theorem 距離空間のコンパクト性 {#top:compact-metric-equivalents keywords="for metric spaces: compact iff sequentially compact iff complete and totally bounded iff Bolzano-Weierstrass property" index="距離空間のコンパクト性|きょりくうかんのこんぱくとせい"}
距離空間 $X$ について次は同値である（DC を使う）。
1. $X$ はコンパクト。
2. $X$ はボルツァーノ–ワイエルシュトラス性をもつ。
3. $X$ は点列コンパクト。
4. $X$ は完備かつ全有界。
:::

::: proof
**1 ⇒ 2.** 無限集合 $A$ が集積点をもたないとする。開集合 $U$ で $U\cap A$ が高々一点のもの全体 $\mathcal{U}$ を考える。集積点がないので、各点 $x$ にはそのような開近傍があり、$\mathcal{U}$ は開被覆である。有限部分被覆 $U_{1},\ldots,U_{m}$ をとると、$A=\bigcup_{i}(U_{i}\cap A)$ は高々 $m$ 点で、$A$ が無限であることに反する（選択は使っていない）。

**2 ⇒ 3.** 点列 $(x_{n})$ をとる。値の集合 $A\defeq\{x_{n}\}$ が有限なら、ある値 $a$ を無限個の $n$ でとり、それらの $n$ を小さい順に並べると定数の部分列が得られる。$A$ が無限なら集積点 $x$ がある。$n_{k}$ を「$n_{k}>n_{k-1}$ かつ $d(x_{n_{k}},x)<1/k$ となる最小の $n$」と定める。存在すること：$B(x,1/k)$ は $A$ の点を無限個含み、$n\le n_{k-1}$ の $x_{n}$ は有限個なので、$n>n_{k-1}$ の $x_{n}$ が $B(x,1/k)$ に入る。$x_{n_{k}}\to x$（選択は使っていない）。

**3 ⇒ 4.** **完備**：コーシー列は収束部分列をもつので収束する（\ref{top:cauchy-basic} の 3）。**全有界**：収束部分列はコーシー列（\ref{top:cauchy-basic} の 1）なので、\ref{top:totally-bounded-cauchy} の 2 ⇒ 1（DC）。

**4 ⇒ 1.** 有限部分被覆をもたない開被覆 $\mathcal{U}$ があるとする。閉球を $\bar{B}(x,r)\defeq\{y:d(x,y)\le r\}$ と書き、「有限個の $\mathcal{U}$ の元で覆えない」を「覆えない」と略す。帰納的に点 $x_{n}$ を、
$$
C_{n}\defeq\bar{B}(x_{1},2^{-1})\cap\cdots\cap\bar{B}(x_{n},2^{-n})
$$
が覆えないように選ぶ（$C_{0}\defeq X$ は仮定から覆えない）。$n$ 段目：$2^{-n}$ 網 $F$ をとると、$C_{n-1}=\bigcup_{a\in F}(C_{n-1}\cap\bar{B}(a,2^{-n}))$ は有限個の和なので、どれかが覆えない。その $a$ を $x_{n}$ とする（DC）。

覆えない集合は空でないので $C_{n+1}\neq\varnothing$ で、その点 $y$ について $d(x_{n},x_{n+1})\le d(x_{n},y)+d(y,x_{n+1})\le 2^{-n}+2^{-n-1}<2^{1-n}$。よって $m>n$ なら $d(x_{n},x_{m})<\sum_{k\ge n}2^{1-k}=2^{2-n}$ で、$(x_{n})$ はコーシー列。完備性からある $x$ に収束する。$x\in U\in\mathcal{U}$ とし、$B(x,r)\subseteq U$ となる $r>0$ をとる。$n$ を $2^{-n}+d(x_{n},x)<r$ となるようにとると、$\bar{B}(x_{n},2^{-n})\subseteq B(x,r)\subseteq U$ なので、$C_{n}\subseteq\bar{B}(x_{n},2^{-n})$ は $U$ 一つで覆える。これは矛盾である。

::: hypcheck
- **完備性**（4 ⇒ 1）：中心の列の極限 $x$ の存在に使った。$(0,1)$ は全有界だが完備でなく、コンパクトでない。
- **全有界性**（4 ⇒ 1）：各段で有限個の閉球に分けられることに使った。$\R$ は完備だが全有界でなく、コンパクトでない。
- **距離の存在**：2 ⇒ 3 で可算な基本近傍系 $B(x,1/k)$ を、3 ⇒ 4 と 4 ⇒ 1 でコーシー列を使った。一般の位相空間では 1 と 3 は同値でない（$\omega_{1}$ は点列コンパクトだがコンパクトでない）。
- **DC**：3 ⇒ 4 と 4 ⇒ 1。1 ⇒ 2 ⇒ 3 は選択公理を使っていない。
:::
:::

::: corollary ボルツァーノ–ワイエルシュトラスの定理 {#top:bolzano-weierstrass keywords="bounded sequences in R^n have convergent subsequences" index="ボルツァーノ–ワイエルシュトラスの定理|ぼるつぁーのわいえるしゅとらすのていり"}
$\R^{n}$ の有界な点列は収束する部分列をもつ。
:::

::: proof
有界な点列は閉直方体 $[-R,R]^{n}$ に含まれ、これはコンパクト（\ref{top:heine-borel}）。\ref{top:compact-metric-equivalents} の 1 ⇒ 2 ⇒ 3（選択公理を使わない部分）を $[-R,R]^{n}$ に適用する。
:::

::: example 有界閉集合でコンパクトでないもの
$C([0,1],\R)$ に一様距離 $\rho$ を入れる（完備、\ref{top:bounded-functions-complete}）。$n\ge1$ について、$[2^{-n},2^{1-n}]$ の中点で値 $1$ をとり、その区間の外で $0$ の連続な山形の関数 $h_{n}$ を考える。台は互いに交わらないので、$m\neq n$ なら $\rho(h_{m},h_{n})=1$。したがって閉単位球 $\{f:\rho(f,0)\le1\}$ は有界閉集合（完備空間の閉集合なので完備）だが、$(h_{n})$ はコーシー部分列をもたず、全有界でない。よってコンパクトでない。
:::

## ルベーグ数と一様連続性 {#top:sec-cmt-lebesgue}

::: lemma ルベーグ数の補題 {#top:lebesgue-number keywords="Lebesgue number lemma for compact metric spaces" index="ルベーグ数|るべーぐすう, ルベーグ数の補題|るべーぐすうのほだい"}
$X$ をコンパクト距離空間、$\mathcal{U}$ を開被覆とする。$\delta>0$ があって、直径が $\delta$ 未満の任意の部分集合は $\mathcal{U}$ のある元に含まれる（$\delta$ を $\mathcal{U}$ の**ルベーグ数**という）。この証明は選択公理を使わない。
:::

::: proof
$X=\varnothing$ なら自明。有限部分被覆 $U_{1},\ldots,U_{m}$ をとる。ある $U_{i}=X$ なら任意の $\delta$ でよい。そうでなければ、各 $X\setminus U_{i}$ は空でない閉集合で、
$$
g(x)\defeq\frac{1}{m}\sum_{i=1}^{m}d(x,X\setminus U_{i})
$$
は連続（各項は 1-リプシッツ）である。$x\in U_{i}$ となる $i$ では $d(x,X\setminus U_{i})>0$（$X\setminus U_{i}$ は閉）なので、$g(x)>0$。最大値の定理（\ref{top:extreme-value}）から $g$ は最小値 $\delta>0$ をとる。$\operatorname{diam}A<\delta$, $x\in A$ とすると、$g(x)\ge\delta$ なので、ある $i$ で $d(x,X\setminus U_{i})\ge\delta$（平均が $\delta$ 以上なら、どれかの項は $\delta$ 以上）。$A\subseteq B(x,\delta)\subseteq U_{i}$。（$A=\varnothing$ なら自明。）
:::

::: theorem ハイネ–カントールの定理 {#top:heine-cantor keywords="continuous maps on compact metric spaces are uniformly continuous" index="ハイネ–カントールの定理|はいねかんとーるのていり, 一様連続性（コンパクト）|いちようれんぞくせいこんぱくと"}
$X$ をコンパクト距離空間、$Y$ を距離空間とする。連続写像 $f\colon X\to Y$ は一様連続である（選択公理を使わない）。
:::

::: proof
$\varepsilon>0$ について、$\mathcal{U}\defeq\{f^{-1}[B(y,\varepsilon/2)]:y\in Y\}$ は開被覆（$x\in f^{-1}[B(f(x),\varepsilon/2)]$）。ルベーグ数 $\delta$ をとる（\ref{top:lebesgue-number}）。$d(x,x')<\delta$ なら $\{x,x'\}$ の直径は $\delta$ 未満なので、ある $y$ で $f(x),f(x')\in B(y,\varepsilon/2)$、よって $e(f(x),f(x'))<\varepsilon$。
:::

::: proposition コンパクト距離空間は第二可算 {#top:compact-metric-second-countable keywords="compact metric spaces are separable and second countable" index="コンパクト距離空間の可分性|こんぱくときょりくうかんのかぶんせい"}
コンパクト距離空間は可分で、第二可算である（可算選択公理を使う）。
:::

::: proof
各 $n$ について、開被覆 $\{B(x,1/n):x\in X\}$ の有限部分被覆の中心の集合 $F_{n}$ を選ぶ（可算選択）。$D\defeq\bigcup_{n}F_{n}$ は可算で、どの開球 $B(x,r)$ も、$1/n<r$ となる $n$ の $F_{n}$ の点 $a$ で $x\in B(a,1/n)$ となるものを含むので、$D$ は稠密。\ref{top:metric-countability} から第二可算。
:::

::: supplement
**前提を変えると.** 関数空間 $C(K,\R)$（$K$ はコンパクト距離空間）の部分集合が相対コンパクト（閉包がコンパクト）であることは、一様有界かつ同程度連続であることと同値である（**アスコリ–アルツェラの定理**）。これは \ref{top:compact-metric-equivalents} の「完備かつ全有界」を関数空間で読み替えたものである（関数解析の系列で扱う予定）。

**類似の定理.** すべての空でないコンパクト距離空間は、カントール集合の連続像であることが知られている（アレクサンドロフ–ハウスドルフの定理、\ref{top:alexandroff-hausdorff}）。

**選択公理について.** 上の証明で DC を使ったのは「全有界 ⇒ コーシー部分列」と「完備かつ全有界 ⇒ コンパクト」の部分である。選択公理なしでは、コンパクトと点列コンパクトが一致しない距離空間のモデルがあるかどうかについて、本サイトでは確認していない。
:::

::: intuition 高い視点から：有限の解像度と穴のなさ
全有界性は「どの解像度 $\varepsilon$ で見ても、空間は有限個の画素で描ける」という性質である。完備性は「画素を細かくしていった極限に、必ず点がある」という性質である。この二つを合わせると、無限の開被覆を有限個で済ませられる（コンパクト）。\ref{top:compact-metric-equivalents} の 4 ⇒ 1 の証明は、まさに画素を半分ずつ細かくしながら「覆えない画素」を追いかけ、その極限点で矛盾を導く議論である。

完備化（\ref{top:completion}）と合わせると、「全有界な距離空間の完備化はコンパクト」と言える。$\mathbb{Q}\cap[0,1]$ を完備化すると $[0,1]$ になるのはその例である。
:::

## 問題 {#top:sec-cmt-problems}

::: problem {#top:prob-isometry-compact-surjective}
コンパクト距離空間 $X$ から自分自身への等長写像 $f$ は全射であることを示せ。
:::

::: solution
$x\notin f[X]$ とする。$f[X]$ はコンパクト（連続像）なので閉（\ref{top:compact-hausdorff-closed}）で、$\varepsilon\defeq d(x,f[X])>0$。$x_{n}\defeq f^{n}(x)$ とおく。$m>n$ なら、等長性を $n$ 回使って $d(x_{n},x_{m})=d(x,f^{m-n}(x))\ge\varepsilon$（$f^{m-n}(x)\in f[X]$）。よって $(x_{n})$ はコーシー部分列をもたず、\ref{top:compact-metric-equivalents} の 1 ⇒ 3 ⇒ 4 と \ref{top:totally-bounded-cauchy} に反する。（直接には、1 ⇒ 2 ⇒ 3 で収束部分列があり、それはコーシー列である、としてもよい。この場合は選択公理を使わない。）
:::

::: problem {#top:prob-no-lebesgue-number}
$(0,1)$ の開被覆 $\{(1/n,1):n\ge2\}$ はルベーグ数をもたないことを示せ。
:::

::: solution
$\delta>0$ をとり、$A\defeq(0,\delta/2)\cap(0,1)$ とおく。$A$ は空でなく、直径は $\delta/2$ 以下なので $\delta$ 未満。各 $k\ge2$ について、$t\defeq\min\{\delta/4,\ 1/(2k)\}$ は $A$ に属し、$t<1/k$ なので $t\notin(1/k,1)$。よって $A$ はどの $(1/k,1)$ にも含まれず、$\delta$ はルベーグ数でない。$(0,1)$ がコンパクトでないことと整合する。
:::
