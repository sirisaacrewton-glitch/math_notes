# デュグンジの拡張定理 {#top:page-dugundji keywords="Dugundji extension theorem, extension of continuous maps from closed subsets of metric spaces into normed spaces, convex hull, linear extension operator, absolute extensor, retract of convex sets"}

ティーツェの拡張定理（\ref{top:tietze}）は、正規空間の閉集合上の連続関数を $\R$ や $\R^{n}$ に値をとるまま全体へ延長する。距離空間に限ると、値域をはるかに広く、任意の**ノルム空間**（無限次元でもよい）にとれ、しかも延長の値を元の関数の値の**凸包**の中に収められる。さらに延長の仕方を関数によらずに固定でき、延長は関数について線形になる。これが**デュグンジの拡張定理**（J. Dugundji, 1951）である。証明の道具は、ストーンの定理（距離空間のパラコンパクト性、\ref{top:stone-paracompact}）と、距離関数で作る 1 の分割だけである。

> 資料：本ページは特定の教科書の記述によらず、標準的な議論（Dugundji, "An extension of Tietze's theorem", *Pacific J. Math.* 1 (1951) の方針）に従って組み立てた。定数の取り方などの細部は本サイトで書き下ろした。

## 記法と定義の確認 {#top:sec-dg-notation}

::: notation
- $(X,d)$ は距離空間。$A\subset X$ と $x\in X$ について $d(x,A)\defeq\inf_{a\in A}d(x,a)$（$A\neq\varnothing$）。$x\mapsto d(x,A)$ は $1$ リプシッツで、$A$ が閉なら $d(x,A)=0\iff x\in A$。
- $B(x,r)\defeq\{z:d(z,x)<r\}$ は開球。
- $E$ は実ノルム空間で、ノルムを $\lVert\cdot\rVert$ と書く。$E$ の部分集合 $K$ の**凸包** $\operatorname{conv}K$ は、$K$ の元の有限個の凸結合 $\sum_{i=1}^{m}t_{i}k_{i}$（$t_{i}\ge0$, $\sum t_{i}=1$）全体である。部分集合 $C$ が**凸**とは $\operatorname{conv}C=C$ のこと。
- 局所有限・細分・パラコンパクト・1 の分割は \ref{top:locally-finite}, \ref{top:paracompact}, \ref{top:partition-of-unity}。局所有限な族の閉包も局所有限であること（\ref{top:locally-finite-closure}）と、台が局所有限な連続関数の和が連続であること（\ref{top:locally-finite-sum}）を使う。
- 距離空間はパラコンパクトである（ストーンの定理、\ref{top:stone-paracompact}。選択公理を使う）。
:::

## 補題：距離関数による 1 の分割 {#top:sec-dg-partition}

::: lemma 距離空間の 1 の分割 {#top:metric-partition-of-unity keywords="partition of unity on a metric space built from distance functions, subordinate to a locally finite open cover" index="距離空間の 1 の分割|きょりくうかんのいちのぶんかつ"}
$(Y,d)$ を距離空間、$(U_{s})_{s\in S}$ を $Y$ の局所有限な開被覆とする。このとき連続関数 $\varphi_{s}\colon Y\to[0,1]$ で、次をみたすものがある。

1. $\{y:\varphi_{s}(y)>0\}=U_{s}$。
2. 族 $(\operatorname{supp}\varphi_{s})_{s}$ は局所有限で、各 $y$ で $\sum_{s}\varphi_{s}(y)=1$（実質的に有限和）。
:::

::: proof
**Step 1（各 $U_{s}$ を正の部分にもつ関数）.** $U_{s}\neq Y$ のとき $\lambda_{s}(y)\defeq d(y,Y\setminus U_{s})$、$U_{s}=Y$ のとき $\lambda_{s}\equiv1$ とおく。$\lambda_{s}$ は連続（距離関数は $1$ リプシッツ）で $\lambda_{s}\ge0$。$Y\setminus U_{s}$ は**閉**（$U_{s}$ が**開**）なので、$\lambda_{s}(y)>0\iff y\notin Y\setminus U_{s}\iff y\in U_{s}$。よって $\{\lambda_{s}>0\}=U_{s}$。

**Step 2（和の連続性）.** $\operatorname{supp}\lambda_{s}=\overline{U_{s}}$ であり、$(U_{s})$ が**局所有限**なので $(\overline{U_{s}})$ も局所有限（\ref{top:locally-finite-closure}）。よって $\lambda\defeq\sum_{s}\lambda_{s}$ は各点で有限和として定まり連続（\ref{top:locally-finite-sum}）。$(U_{s})$ が**被覆**なので、各 $y$ はある $U_{s}$ に属し、$\lambda(y)\ge\lambda_{s}(y)>0$。

**Step 3（正規化）.** $\varphi_{s}\defeq\lambda_{s}/\lambda$ とおく。連続関数を正の連続関数で割ったので連続で、$0\le\varphi_{s}\le1$、$\{\varphi_{s}>0\}=\{\lambda_{s}>0\}=U_{s}$、$\operatorname{supp}\varphi_{s}=\overline{U_{s}}$（局所有限）、$\sum_{s}\varphi_{s}=\lambda/\lambda=1$。
:::

一般のパラコンパクト・ハウスドルフ空間でも 1 の分割は存在する（\ref{top:partition-of-unity-existence}）が、距離空間では上のように距離関数から直接作れ、正の部分がちょうど $U_{s}$ になる。

## デュグンジの拡張定理 {#top:sec-dg-theorem}

::: lemma 影の点の評価 {#top:dugundji-shadow keywords="choice of points a_s in A with d(x,a_s) < 3 d(x,A) for x in U_s" index="デュグンジの影の点|でゅぐんじのかげのてん"}
$(X,d)$ を距離空間、$A\subset X$ を空でない閉集合、$A\neq X$ とし、$Y\defeq X\setminus A$ とおく。このとき、$Y$ の局所有限な開被覆 $(U_{s})_{s\in S}$（各 $U_{s}\neq\varnothing$）と点 $a_{s}\in A$ を、次がなりたつように選べる：$x\in U_{s}$ なら
$$
d(x,a_{s})<3\,d(x,A),
$$
したがって任意の $a\in A$ について $d(a_{s},a)<4\,d(x,a)$。
:::

::: proof
**Step 1（被覆の作成）.** $A$ が**閉**なので $Y$ は開で、$y\in Y$ なら $\delta_{y}\defeq d(y,A)>0$。開球 $B_{y}\defeq B(y,\delta_{y}/4)$ は $B_{y}\subset Y$ をみたす：$z\in B_{y}$ なら $d(z,A)\ge\delta_{y}-d(z,y)>\tfrac{3}{4}\delta_{y}>0$。よって $(B_{y})_{y\in Y}$ は距離空間 $Y$ の開被覆である。

**Step 2（局所有限な細分）.** $Y$ は距離空間なので**パラコンパクト**（\ref{top:stone-paracompact}）。$(B_{y})$ の局所有限な開細分をとり、空集合を除いたものを $(U_{s})_{s\in S}$ とする（空集合を除いても被覆で局所有限）。各 $s$ について $U_{s}\subset B_{y_{s}}$ となる $y_{s}\in Y$ を一つ選ぶ。

**Step 3（影の点の選択）.** $\delta_{s}\defeq d(y_{s},A)>0$ なので $2\delta_{s}>\delta_{s}=\inf_{a\in A}d(y_{s},a)$ であり、$d(y_{s},a_{s})<2\delta_{s}$ となる $a_{s}\in A$ がとれる（各 $s$ で一つ選ぶ。選択公理）。

**Step 4（評価）.** $x\in U_{s}$ とする。$d(x,y_{s})<\delta_{s}/4$ だから
$$
d(x,a_{s})\le d(x,y_{s})+d(y_{s},a_{s})<\tfrac{1}{4}\delta_{s}+2\delta_{s}=\tfrac{9}{4}\delta_{s}.
$$
一方 Step 1 と同じ計算で $d(x,A)\ge\delta_{s}-d(x,y_{s})>\tfrac{3}{4}\delta_{s}$、すなわち $\delta_{s}<\tfrac{4}{3}d(x,A)$。合わせて $d(x,a_{s})<\tfrac{9}{4}\cdot\tfrac{4}{3}d(x,A)=3\,d(x,A)$。

最後に $a\in A$ なら $d(x,A)\le d(x,a)$ なので
$$
d(a_{s},a)\le d(a_{s},x)+d(x,a)<3\,d(x,A)+d(x,a)\le4\,d(x,a).
$$
:::

::: theorem デュグンジの拡張定理 {#top:dugundji keywords="Dugundji extension theorem: continuous maps from a closed subset of a metric space into a normed space extend with values in the convex hull" index="デュグンジの拡張定理|でゅぐんじのかくちょうていり"}
$(X,d)$ を距離空間、$A\subset X$ を空でない閉集合、$E$ を実ノルム空間、$f\colon A\to E$ を連続写像とする。このとき連続写像 $F\colon X\to E$ で、$F|_{A}=f$ かつ $F(X)\subset\operatorname{conv}f(A)$ をみたすものがある。
:::

::: proof
$A=X$ なら $F=f$ でよい。$A\neq X$ とし、$Y\defeq X\setminus A$ について \ref{top:dugundji-shadow} の $(U_{s})_{s\in S}$ と $(a_{s})$ をとる。$(U_{s})$ は距離空間 $Y$ の局所有限な開被覆なので、\ref{top:metric-partition-of-unity} の 1 の分割 $(\varphi_{s})$ をとる。

**Step 1（定義）.**
$$
F(x)\defeq\begin{cases}f(x)&(x\in A),\\[2pt]\displaystyle\sum_{s\in S}\varphi_{s}(x)\,f(a_{s})&(x\in Y).\end{cases}
$$
$x\in Y$ のとき、$\varphi_{s}(x)\neq0$ となる $s$ は有限個で（台の族が局所有限）、係数は非負で和が $1$。よって $F(x)$ は有限個の $f(a_{s})\in f(A)$ の凸結合であり、$F(x)\in\operatorname{conv}f(A)$。$x\in A$ では $F(x)=f(x)\in f(A)$。ゆえに $F(X)\subset\operatorname{conv}f(A)$。

**Step 2（$Y$ の点での連続性）.** $y\in Y$ とする。台の族が局所有限なので、$y$ の $Y$ における開近傍 $W$ で、$W$ と交わる台が $\operatorname{supp}\varphi_{s_{1}},\dots,\operatorname{supp}\varphi_{s_{m}}$ だけのものがある。$W$ 上 $F=\sum_{i=1}^{m}\varphi_{s_{i}}\,f(a_{s_{i}})$ で、これは連続な実数値関数と定ベクトルの積の有限和なので、$E$ のノルム位相で連続（スカラー倍と加法は連続）。$Y$ は $X$ で**開**（$A$ が**閉**）だから $W$ も $X$ で開であり、$F$ は $y$ で（$X$ 上の写像として）連続。

**Step 3（$A$ の点での連続性）.** $a\in A$、$\varepsilon>0$ とする。$f$ は $a$ で**連続**なので、$\eta>0$ で「$a'\in A$, $d(a',a)<\eta\Rightarrow\lVert f(a')-f(a)\rVert<\varepsilon$」となるものがある。$d(x,a)<\eta/4$ とする。

- $x\in A$ なら $\lVert F(x)-F(a)\rVert=\lVert f(x)-f(a)\rVert<\varepsilon$。
- $x\in Y$ なら、$\varphi_{s}(x)>0$ となる各 $s$ について $x\in U_{s}$（\ref{top:metric-partition-of-unity} の 1）なので、\ref{top:dugundji-shadow} より $d(a_{s},a)<4d(x,a)<\eta$、よって $\lVert f(a_{s})-f(a)\rVert<\varepsilon$。$\sum_{s}\varphi_{s}(x)=1$ を使うと
$$
\begin{aligned}
\lVert F(x)-F(a)\rVert&=\Bigl\lVert\sum_{s}\varphi_{s}(x)\bigl(f(a_{s})-f(a)\bigr)\Bigr\rVert\\
&\le\sum_{s}\varphi_{s}(x)\,\lVert f(a_{s})-f(a)\rVert\le\varepsilon.
\end{aligned}
$$
ここでノルムの三角不等式と斉次性（$\lVert tv\rVert=t\lVert v\rVert$, $t\ge0$）を使った。

よって $F$ は $a$ で連続。Step 2, 3 から $F$ は $X$ 上連続である。
:::

::: hypcheck
- **$X$ が距離空間**：ストーンの定理（\ref{top:dugundji-shadow} の Step 2）、距離関数による 1 の分割（\ref{top:metric-partition-of-unity}）、影の点の評価 $d(a_{s},a)<4d(x,a)$（Step 4）のすべてで使った。とくに最後の評価が、$A$ の点での連続性（定理の Step 3）の鍵である。
- **$A$ が閉**：$d(y,A)>0$（$y\notin A$）により球 $B_{y}$ が $Y$ に収まること、$Y$ が開で $Y$ 上の連続性が $X$ 上の連続性になること（Step 2）に使った。
- **$A\neq\varnothing$**：$d(\cdot,A)$ と影の点 $a_{s}$ の存在に使った（$A=\varnothing$ なら $\operatorname{conv}f(A)=\varnothing$ で結論が意味をもたない）。
- **$E$ がノルム空間**：凸結合が定義できること（ベクトル空間）、有限和・スカラー倍の連続性（Step 2）、三角不等式と斉次性による凸結合の評価（Step 3）に使った。Step 3 で本質的なのは「$f(a)$ の $\varepsilon$ 近傍が**凸**である」ことだけである。
- **$f$ の連続性**：$A$ の点での連続性（Step 3）にのみ使った。$Y$ の点での連続性は $f$ の連続性を使わない。
- **選択公理**：ストーンの定理と、$y_{s}$, $a_{s}$ の選択に使った。
:::

## 系 {#top:sec-dg-corollaries}

::: corollary 線形な拡張作用素 {#top:dugundji-linear keywords="Dugundji: simultaneous linear extension operator of norm one from C_b(A) to C_b(X)" index="線形拡張作用素|せんけいかくちょうさようそ"}
$(X,d)$ を距離空間、$A\subset X$ を空でない閉集合とする。写像 $\operatorname{Ext}\colon C(A,E)\to C(X,E)$ で、次をみたすものがある（$E$ は任意の実ノルム空間で、$\operatorname{Ext}$ の作り方は $E$ によらない）。

1. $\operatorname{Ext}$ は線形で、$\operatorname{Ext}(f)|_{A}=f$。
2. $\sup_{X}\lVert\operatorname{Ext}(f)\rVert=\sup_{A}\lVert f\rVert$（両辺 $+\infty$ も許す）。
:::

::: proof
**Step 1.** $A=X$ なら恒等写像でよい。$A\neq X$ なら、\ref{top:dugundji} の証明で $(U_{s})$, $(a_{s})$, $(\varphi_{s})$ は $X$ と $A$ だけから選ばれ、$f$ によらない。そこで $\operatorname{Ext}(f)$ を同じ式で定める。\ref{top:dugundji} により $\operatorname{Ext}(f)$ は $f$ の連続な延長。

**Step 2（線形性）.** $x\in A$ では $\operatorname{Ext}(f)(x)=f(x)$ で線形。$x\in Y$ では $\operatorname{Ext}(f)(x)=\sum_{s}\varphi_{s}(x)f(a_{s})$ で、各項が $f$ について線形な有限和なので線形。

**Step 3（ノルム）.** $\operatorname{Ext}(f)(X)\subset\operatorname{conv}f(A)$ であり、閉球 $\{v:\lVert v\rVert\le M\}$（$M\defeq\sup_{A}\lVert f\rVert$）は凸で $f(A)$ を含むので $\operatorname{conv}f(A)$ も含む。よって $\sup_{X}\lVert\operatorname{Ext}(f)\rVert\le M$。逆の不等式は $\operatorname{Ext}(f)$ が $f$ の延長であることから。
:::

::: corollary 凸集合への写像の延長 {#top:dugundji-convex keywords="convex subsets of normed spaces are absolute extensors for metric spaces; closed convex sets are retracts" index="凸集合への写像の延長|とつしゅうごうへのしゃぞうのえんちょう, 絶対拡張子|ぜったいかくちょうし"}
$C$ をノルム空間 $E$ の空でない凸部分集合とする。距離空間 $X$ の閉集合 $A$ 上の連続写像 $f\colon A\to C$ は、連続写像 $F\colon X\to C$ に延長できる。特に $C$ が距離空間 $X$ の閉集合として（部分空間の位相で）埋め込まれていれば、$C$ は $X$ のレトラクト（連続写像 $r\colon X\to C$ で $r|_{C}=\mathrm{id}$ となるものがある）である。
:::

::: proof
$f(A)\subset C$ かつ $C$ が**凸**なので $\operatorname{conv}f(A)\subset\operatorname{conv}C=C$。\ref{top:dugundji} の $F$ は $F(X)\subset\operatorname{conv}f(A)\subset C$ をみたす。後半は、$X$ の閉集合 $C$ 上の恒等写像 $C\to C$（ここで値域の $C$ は $E$ の凸集合とみる）に前半を適用すればよい。
:::

$C=[0,1]$ や $C=\R^{n}$ のときは、距離空間の場合のティーツェの拡張定理（\ref{top:tietze}, \ref{top:tietze-rn}）が値の範囲の制御つきで再び得られる。

## 問題 {#top:sec-dg-problems}

::: problem {#top:prob-dg-retract-convex}
$E$ をノルム空間、$C\subset E$ を空でない**閉**凸集合とする。$C$ が $E$ のレトラクトであることを \ref{top:dugundji-convex} から導け。さらに、$C$ が閉でないとき、たとえば $E=\R$, $C=(0,1)$ のとき、$C$ は $E$ のレトラクトでないことを示せ。
:::

::: solution
**閉の場合.** $E$ はノルムから定まる距離 $d(u,v)=\lVert u-v\rVert$ で距離空間であり、$C$ はその閉集合。\ref{top:dugundji-convex} の後半を $X=E$ に適用すればよい。

**$C=(0,1)\subset\R$ の場合.** レトラクト $r\colon\R\to(0,1)$ があったとする。$r$ は連続、$\R$ は連結なので $r(\R)$ は連結であり、$r|_{(0,1)}=\mathrm{id}$ から $r(\R)\supset(0,1)$、よって $r(\R)=(0,1)$。一方 $x_{n}\defeq1/n\in(0,1)$ について $r(x_{n})=1/n\to0$ であり、$r$ の連続性から $r(0)=\lim r(x_{n})=0\notin(0,1)$。矛盾。（一般に、ハウスドルフ空間のレトラクトは閉集合である：$C=\{x:r(x)=x\}$。）
:::

::: problem {#top:prob-dg-real-line}
$A\subset\R$ を空でない閉集合、$E$ をノルム空間、$f\colon A\to E$ を連続とする。$\R\setminus A$ は互いに交わらない開区間の和である（\ref{top:dugundji} を使わずに認めてよい）。有界な区間 $(p,q)$（$p,q\in A$）では $F$ を $f(p)$ と $f(q)$ の線形補間、非有界な区間 $(-\infty,q)$ や $(p,\infty)$ では定数 $f(q)$, $f(p)$ として $F$ を定める。$F$ が連続で $F(\R)\subset\operatorname{conv}f(A)$ をみたすことを示せ。
:::

::: solution
**値の範囲.** 各区間上で $F(x)$ は $f(p)$, $f(q)$ の凸結合か、$f(A)$ の値そのものである。

**$\R\setminus A$ の点.** 各開区間の上で $F$ は線形関数か定数なので連続であり、開区間は $\R$ の開集合だから $F$ はその点で連続。

**$a\in A$ での連続性（右側）.** $\varepsilon>0$ をとり、$f$ の連続性から $\eta>0$ を「$a'\in A$, $\lvert a'-a\rvert<\eta\Rightarrow\lVert f(a')-f(a)\rVert<\varepsilon$」となるようにとる。
- **ある $t>0$ で $(a,a+t)\cap A=\varnothing$ の場合.** $a$ はある成分区間 $(a,q)$（$q\in A$ または $q=\infty$）の左端であり、$[a,q)$ 上で $F$ は $f(a)$ から始まる線形補間か定数 $f(a)$ なので、$a$ で右連続。
- **そうでない場合.** $a<a'<a+\eta$ となる $a'\in A$ がとれる。$x\in(a,a')$ とする。$x\in A$ なら $\lVert F(x)-f(a)\rVert<\varepsilon$。$x\notin A$ なら、$x$ を含む成分区間 $(p,q)$ は $A$ の点 $a$, $a'$ を含まないので $a\le p<x<q\le a'$。よって $p,q\in A$, $\lvert p-a\rvert<\eta$, $\lvert q-a\rvert<\eta$ で、$\lVert f(p)-f(a)\rVert<\varepsilon$, $\lVert f(q)-f(a)\rVert<\varepsilon$。$F(x)$ は $f(p)$, $f(q)$ の凸結合なので、三角不等式と斉次性から $\lVert F(x)-f(a)\rVert<\varepsilon$。

左側も対称に示せる。よって $F$ は $a$ で連続。
:::

::: problem {#top:prob-dg-not-convex}
\ref{top:dugundji} で「値を $\operatorname{conv}f(A)$ に収める」ことを「値を $f(A)$ に収める」に強めることはできない。$X=[0,1]$, $A=\{0,1\}$, $E=\R$, $f(0)=0$, $f(1)=1$ として、このことを確かめよ。
:::

::: solution
$F\colon[0,1]\to\R$ が連続で $F(0)=0$, $F(1)=1$ なら、中間値の定理（$[0,1]$ の連結性）により $F$ は値 $1/2$ をとる。$1/2\notin f(A)=\{0,1\}$ なので、値を $f(A)$ に収める延長は存在しない。値域 $\{0,1\}$ は凸でなく、\ref{top:dugundji-convex} の仮定をみたさない。
:::

::: supplement
**前提を変えると.**
- **値域.** デュグンジのもとの定理は、値域を**局所凸**位相線形空間としている（Dugundji 1951）。証明は本ページと同じで、Step 3 で $f(a)$ の凸な近傍を使えばよい。局所凸でない空間への拡張の可否については、ここでは確かめていない。
- **定義域.** 定義域を正規空間に広げると、$\R$ や $\R^{n}$ 値ならティーツェの定理（\ref{top:tietze}）で延長できるが、線形な拡張作用素（\ref{top:dugundji-linear}）は一般に存在しない。たとえば $\beta\N$ の閉集合 $\beta\N\setminus\N$（\ref{top:page-beta-n}）について、有界線形な拡張作用素 $\operatorname{Ext}\colon C(\beta\N\setminus\N)\to C(\beta\N)$ があれば、$\mathrm{id}-\operatorname{Ext}\circ\rho$（$\rho$ は制限）は $C(\beta\N)\cong\ell^{\infty}$ から $\rho$ の核 $\cong c_{0}$（$0$ に収束する数列）への有界な射影になり、$c_{0}$ が $\ell^{\infty}$ で補完可能になる。しかし、$c_{0}$ は $\ell^{\infty}$ は $\ell^{\infty}$ で補完可能でないことが知られている（フィリップスの定理、R. S. Phillips 1940。ここでは証明しない）。
- **閉集合の仮定.** 外せない。$A=(0,1]\subset[0,1]$ 上の $\sin(1/x)$ は延長できない（\ref{top:page-urysohn-tietze} の補足）。

**似た定理.** 距離空間に限らず、$\R$ 値の延長だけならティーツェの定理（正規空間）がある。また、ある種の距離空間のクラスに対する「絶対拡張子（AE）」「絶対近傍レトラクト（ANR）」の理論は、本定理（凸集合は距離空間に対する AE）を出発点とする、と一般に言われている。

**高い視点から.** 制限写像 $\rho\colon C(X,E)\to C(A,E)$, $F\mapsto F|_{A}$ は線形写像である。\ref{top:dugundji-linear} は、$\rho$ が線形な**切断**（右逆）$\operatorname{Ext}$ をもつ、すなわち $\rho$ が線形写像の圏で**分裂全射**であることを言っている。しかも $\operatorname{Ext}$ は値域 $E$ によらない一つの式で与えられ、$E$ について自然である：連続線形写像 $T\colon E\to E'$ について $\operatorname{Ext}(T\circ f)=T\circ\operatorname{Ext}(f)$（$T$ が有限和と係数を保つため）。比喩で言えば、$A$ の外の各点 $x$ は、近くにいる $A$ の「代表者」$a_{s}$ たちの意見 $f(a_{s})$ を重み $\varphi_{s}(x)$ で平均して自分の値を決める。$x$ が $A$ に近づくほど代表者たちも $A$ の同じ場所に寄ってくる（影の点の評価 $d(a_{s},a)<4d(x,a)$）ので、平均は境界の値に滑らかにつながる。値域に要求されるのは「平均がとれる」こと、つまり凸結合の構造だけであり、だから凸集合が自然な値域になる。
:::
