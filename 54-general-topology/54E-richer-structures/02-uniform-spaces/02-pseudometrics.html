# 擬距離と一様構造 {#top:page-uniform-pseudometrics keywords="pseudometric, uniformity generated by pseudometrics, metrization lemma for uniformities, uniformly continuous pseudometric, pseudometrizable uniformity, countable base, uniformizable space, completely regular space"}

距離から一様構造が作られた（\ref{top:page-uniform-spaces}）ように、**擬距離**（異なる点の距離が $0$ になってもよい距離）の族からも一様構造が作られる（\ref{top:pseudometric-uniformity}）。本ページの主定理は、逆に**すべての一様構造は擬距離の族から作られる**ことである（\ref{top:uniformity-from-pseudometrics}）。その鍵は、近縁の列から擬距離を組み立てる**距離化補題**（\ref{top:unif-metrization-lemma}）で、ここから「可算基をもつハウスドルフ一様構造は距離化可能」（\ref{top:countable-base-metrizable}）と、「一様構造から来る位相はちょうど完全正則な位相」（\ref{top:uniformizable-completely-regular}）が従う。

> 資料：本ページは特定の教科書の記述によらず、標準的な議論に従って組み立てた（距離化補題の証明は、鎖の長さに関する帰納法で $f(x_{0},x_{k})\le2\sum f(x_{i},x_{i+1})$ を示す、よく知られた形を自分で再構成した）。

## 記法と定義の確認 {#top:sec-up-notation}

::: notation
- 一様構造・近縁・基・定める位相・一様連続・始一様構造は \ref{top:uniformity}, \ref{top:unif-base}, \ref{top:unif-topology}, \ref{top:unif-continuous}, \ref{top:initial-uniformity} のとおり。$U^{\circ n}$ は $U$ の $n$ 個の合成。
- 完全正則空間は \ref{top:completely-regular} のとおり（$T_{1}$ は含めない）。
:::

## 擬距離の族 {#top:sec-up-pseudometrics}

::: definition 擬距離とその一様構造 {#top:pseudometric-uniformity keywords="pseudometric, uniformity generated by a family of pseudometrics" index="擬距離|ぎきょり, 擬距離の一様構造|ぎきょりのいちようこうぞう"}
集合 $X$ 上の**擬距離**とは、関数 $d\colon X\times X\to[0,\infty)$ で、$d(x,x)=0$, $d(x,y)=d(y,x)$, $d(x,z)\le d(x,y)+d(y,z)$ を満たすものをいう（$x\ne y$ で $d(x,y)=0$ も許す）。擬距離の空でない族 $\mathcal{D}$ について、
$$
U(d_{1},\dots,d_{n};\varepsilon)\defeq\{(x,y):d_{i}(x,y)<\varepsilon\ (i=1,\dots,n)\}\qquad(d_{i}\in\mathcal{D},\ \varepsilon>0)
$$
の全体は \ref{top:unif-base} の 1 の条件を満たし（(c) は三角不等式から $U(\cdots;\varepsilon/2)\circ U(\cdots;\varepsilon/2)\subseteq U(\cdots;\varepsilon)$）、一様構造の基になる。これを $\mathcal{D}$ の**生成する一様構造**という。一つの擬距離 $d$ の生成する一様構造と一致する一様構造を**擬距離化可能**という。
:::

::: lemma 一様連続な擬距離 {#top:unif-continuous-pseudometric keywords="a pseudometric is uniformly continuous iff its epsilon-entourages belong to the uniformity; such pseudometrics are continuous" index="一様連続な擬距離|いちようれんぞくなぎきょり"}
一様空間 $(X,\mathcal{U})$ 上の擬距離 $d$ が、すべての $\varepsilon>0$ で $\{d<\varepsilon\}\defeq\{(x,y):d(x,y)<\varepsilon\}\in\mathcal{U}$ を満たすとき、$d$ を**一様連続な擬距離**と呼ぶ。このとき $d\colon X\times X\to\mathbb{R}$ は直積一様構造について一様連続で、特に各 $x$ で $d(x,-)\colon X\to\mathbb{R}$ は連続である。
:::

::: proof
三角不等式から $\lvert d(x,y)-d(x',y')\rvert\le d(x,x')+d(y,y')$。よって $(x,x')\in\{d<\varepsilon/2\}$, $(y,y')\in\{d<\varepsilon/2\}$ なら $\lvert d(x,y)-d(x',y')\rvert<\varepsilon$。この条件を満たす $((x,y),(x',y'))$ の集合は、直積一様構造の基の元（二つの射影による逆像の共通部分）であり、それが $\{(s,t)\in\mathbb{R}^{2}:\lvert s-t\rvert<\varepsilon\}$ の $d\times d$ による逆像に含まれる。連続性は \ref{top:unif-continuous-basic} と、$y\mapsto(x,y)$ の一様連続性から。
:::

## 距離化補題 {#top:sec-up-metrization}

::: lemma 距離化補題 {#top:unif-metrization-lemma keywords="metrization lemma: a sequence of symmetric entourages with U_{n+1}^3 in U_n yields a pseudometric" index="距離化補題（一様空間）|きょりかほだいいちようくうかん"}
$X\times X$ の対称な部分集合の列 $(U_{n})_{n\ge0}$ が、$U_{0}=X\times X$、すべての $n$ で $\Delta_{X}\subseteq U_{n}$ かつ $U_{n+1}\circ U_{n+1}\circ U_{n+1}\subseteq U_{n}$ を満たすとする。このとき、擬距離 $d$ で、すべての $n\ge0$ について
$$
U_{n+1}\subseteq\{d<2^{-n}\}\subseteq U_{n}
$$
となるものがある。
:::

::: proof
**Step 1（$f$ の定義）.** $\Delta\subseteq U_{n+1}$ から $U_{n+1}\subseteq U_{n+1}^{\circ3}\subseteq U_{n}$ なので列は減少する。$f(x,y)\defeq2^{-m}$（$m$ は $(x,y)\in U_{m}$ となる最大の $m$）、すべての $U_{m}$ に属するなら $f(x,y)\defeq0$ とする。$U_{0}=X\times X$ なので $f\le1$ で、$f$ は対称（各 $U_{n}$ が対称）、$f(x,x)=0$。減少性から
$$
f(x,y)\le2^{-n}\iff(x,y)\in U_{n}.\tag{$\ast$}
$$

**Step 2（$d$ の定義）.** $d(x,y)\defeq\inf\sum_{i=0}^{k-1}f(x_{i},x_{i+1})$（$k\ge1$, $x_{0}=x$, $x_{k}=y$ となるすべての有限列についての下限）。列をつなげれば三角不等式、逆順にすれば対称性、$k=1$, $x_{0}=x_{1}=x$ で $d(x,x)=0$ が得られ、$d$ は擬距離。$k=1$ の列から $d\le f$。

**Step 3（鍵の不等式）.** すべての列 $x_{0},\dots,x_{k}$ について
$$
f(x_{0},x_{k})\le2\sum_{i=0}^{k-1}f(x_{i},x_{i+1})
$$
を $k$ に関する帰納法で示す。$k=1$ は明らか。$k\ge2$ とし、右辺の和を $a$ とする。$2a\ge1$ なら $f\le1$ より成り立つので、$2a<1$ とする。$m$ を、$\sum_{i<m}f(x_{i},x_{i+1})\le a/2$ となる最大の $m\in\{0,\dots,k\}$ とする（$m=0$ では和は $0$）。$m=k$ なら $a\le a/2$ で $a=0$。

- $a=0$ のとき：すべての $f(x_{i},x_{i+1})=0$ なので、($\ast$) より各 $(x_{i},x_{i+1})$ はすべての $U_{n}$ に属する。帰納法の仮定（長さ $k-1$ の列 $x_{1},\dots,x_{k}$）から $f(x_{1},x_{k})=0$ で、$(x_{0},x_{1}),(x_{1},x_{k})\in U_{n+1}$ から $(x_{0},x_{k})\in U_{n+1}^{\circ3}\subseteq U_{n}$（$\Delta\subseteq U_{n+1}$ を三つ目に使う）がすべての $n$ で成り立ち、$f(x_{0},x_{k})=0$。
- $a>0$ のとき：$m<k$ で、$m$ の最大性から $\sum_{i\le m}f(x_{i},x_{i+1})>a/2$、したがって $\sum_{i=m+1}^{k-1}f(x_{i},x_{i+1})<a/2$。帰納法の仮定（長さ $m<k$ と $k-m-1<k$ の列。長さ $0$ のときは $f=0$）から
$$
f(x_{0},x_{m})\le a,\qquad f(x_{m},x_{m+1})\le a,\qquad f(x_{m+1},x_{k})\le a.
$$
$2^{-n}\le a<2^{-n+1}$ となる $n$ をとる（$2a<1$ より $n\ge2$）。$f$ の値は $0$ か $2$ のべきなので、$f\le a<2^{-n+1}$ は $f\le2^{-n}$ を意味し、($\ast$) より三つの組はどれも $U_{n}$ に属する。よって $(x_{0},x_{k})\in U_{n}^{\circ3}\subseteq U_{n-1}$ で、$f(x_{0},x_{k})\le2^{-n+1}\le2a$。

**Step 4（はさみうち）.** Step 2, 3 から $\tfrac12f\le d\le f$。$(x,y)\in U_{n+1}$ なら $d\le f\le2^{-n-1}<2^{-n}$。$d(x,y)<2^{-n}$ なら $f(x,y)\le2d<2^{-n+1}$ で、$f$ の値の形から $f\le2^{-n}$、($\ast$) より $(x,y)\in U_{n}$。
:::

::: hypcheck
- **$U_{n+1}^{\circ3}\subseteq U_{n}$**：Step 3 で三つの組をつなぐのに使った。二つの合成 $U_{n+1}^{\circ2}\subseteq U_{n}$ だけでは、列を二つに分けたときの「真ん中の一辺」を吸収できない。
- **$f$ の値が $0$ か $2$ のべき**：Step 3, 4 で、$f<2^{-n+1}$ から $f\le2^{-n}$ を得るのに使った。
- **対称性**：Step 1 で $f$ の対称性、したがって $d$ の対称性に使った。
:::

::: theorem 一様構造は擬距離の族から作られる {#top:uniformity-from-pseudometrics keywords="every uniformity is generated by the family of its uniformly continuous pseudometrics" index="一様構造と擬距離|いちようこうぞうとぎきょり"}
一様空間 $(X,\mathcal{U})$ について、$\mathcal{U}$ は一様連続な擬距離（\ref{top:unif-continuous-pseudometric}）全体の生成する一様構造に等しい。
:::

::: proof
一様連続な擬距離全体を $\mathcal{D}$ とする。定義から $\mathcal{D}$ の生成する一様構造の基の元は $\mathcal{U}$ に属するので、それは $\mathcal{U}$ に含まれる。逆に $U\in\mathcal{U}$ をとる。$U_{0}\defeq X\times X$、$U_{1}$ を $U$ に含まれる対称な近縁、$U_{n+1}$ を $U_{n+1}^{\circ3}\subseteq U_{n}$ となる対称な近縁（\ref{top:unif-base} の 2）とし、\ref{top:unif-metrization-lemma} の $d$ をとる。$2^{-n}\le\varepsilon$ なら $\{d<\varepsilon\}\supseteq\{d<2^{-n}\}\supseteq U_{n+1}\in\mathcal{U}$ なので $d\in\mathcal{D}$。そして $\{d<1/2\}\subseteq U_{1}\subseteq U$。よって $U$ は $\mathcal{D}$ の生成する一様構造に属する。
:::

::: corollary 可算基と距離化 {#top:countable-base-metrizable keywords="a uniformity is pseudometrizable iff it has a countable base; Hausdorff with countable base is metrizable" index="一様構造の距離化|いちようこうぞうのきょりか"}
一様構造 $\mathcal{U}$ が擬距離化可能であることと、可算な基をもつことは同値である。さらに $\mathcal{U}$ が可算な基をもち、定める位相がハウスドルフなら、$\mathcal{U}$ はある**距離**の距離一様構造である。
:::

::: proof
擬距離 $d$ が生成するなら $\{d<1/n\}$ が可算基。逆に可算基 $(B_{k})_{k\ge1}$ があれば、$U_{0}\defeq X\times X$、$U_{n+1}$ を $B_{n+1}$ に含まれ $U_{n+1}^{\circ3}\subseteq U_{n}$ を満たす対称な近縁とし、\ref{top:unif-metrization-lemma} の $d$ をとる。$\{d<2^{-n}\}$ は近縁 $U_{n+1}$ を含むので $\mathcal{U}$ に属し、$n\ge1$ なら $U_{n}\subseteq B_{n}$ に含まれる。$(B_{n})$ は基なので、$d$ の生成する一様構造は $\mathcal{U}$ に一致する。ハウスドルフなら $\bigcap\mathcal{U}=\Delta_{X}$（\ref{top:unif-separation}）で、$d(x,y)=0$ ならすべての $U_{n}\subseteq B_{n}$ に属するので $(x,y)\in\bigcap_{n}B_{n}=\bigcap\mathcal{U}$（$(B_{n})$ は基）、$x=y$。よって $d$ は距離。
:::

## 一様化可能な空間 {#top:sec-up-uniformizable}

::: theorem 一様化可能性と完全正則性 {#top:uniformizable-completely-regular keywords="a topological space is uniformizable iff it is completely regular" index="一様化可能|いちようかかのう"}
位相空間 $(X,\tau)$ について、次は同値である。
1. $\tau$ を定める一様構造がある（$X$ は**一様化可能**）。
2. $X$ は完全正則である。
:::

::: proof
**1 ⇒ 2.** 閉集合 $F$ と $x\notin F$ をとる。\ref{top:unif-topology} より $U[x]\cap F=\emptyset$ となる $U\in\mathcal{U}$ がある。\ref{top:uniformity-from-pseudometrics} の証明のとおり、一様連続な擬距離 $d$ で $\{d<1/2\}\subseteq U$ となるものをとる。$g(y)\defeq\min\{1,2d(x,y)\}$ は連続（\ref{top:unif-continuous-pseudometric}）で $g(x)=0$。$y\in F$ なら $y\notin U[x]$ なので $(x,y)\notin\{d<1/2\}$、$d(x,y)\ge1/2$ で $g(y)=1$。

**2 ⇒ 1.** 連続関数 $h\colon X\to[0,1]$ 全体を $C$ とし、擬距離 $d_{h}(x,y)\defeq\lvert h(x)-h(y)\rvert$（$h\in C$）の族の生成する一様構造 $\mathcal{U}$ を考える。その位相での $x$ の近傍基は $\{y:\lvert h_{i}(x)-h_{i}(y)\rvert<\varepsilon,\ i=1,\dots,n\}$ の形（\ref{top:unif-topology}）で、これは $\tau$ で開（$h_{i}$ の連続性）。逆に $x\in O\in\tau$ なら、完全正則性から $h\in C$ で $h(x)=0$, $h[X\setminus O]\subseteq\{1\}$ となるものがあり、$\{y:d_{h}(x,y)<1\}\subseteq O$。よって両者の開集合は一致する。
:::

::: hypcheck
- **距離化補題**：1 ⇒ 2 で、近縁 $U$ から $[0,1]$ 値の連続関数を作るのに使った。一様空間の定義だけからは連続関数は直接得られない。
- **完全正則性**：2 ⇒ 1 で、開集合 $O$ に入る擬距離球を作るのに使った。
- $T_{1}$ 性は仮定していない。ハウスドルフな一様空間の位相はチコノフ空間で、逆にチコノフ空間の位相はハウスドルフな一様構造から来る。
:::

## 問題 {#top:sec-up-problems}

::: problem {#top:prob-up-hausdorff}
擬距離の族 $\mathcal{D}$ の生成する一様構造の位相がハウスドルフであることと、$\mathcal{D}$ が点を分離する（$x\ne y$ なら $d(x,y)>0$ となる $d\in\mathcal{D}$ がある）ことは同値であることを示せ。
:::

::: solution
\ref{top:unif-separation} の 2 より、ハウスドルフ $\iff$ 近縁の共通部分が $\Delta_{X}$。基の元 $U(d_{1},\dots,d_{n};\varepsilon)$ の共通部分は $\{(x,y):\text{すべての }d\in\mathcal{D}\text{ で }d(x,y)=0\}$ に等しい（$\supseteq$ は明らか。$\subseteq$：$d(x,y)>0$ なら $\varepsilon=d(x,y)$ の $U(d;\varepsilon)$ に入らない）。これが $\Delta_{X}$ であることは、$\mathcal{D}$ が点を分離することにほかならない。
:::

::: problem {#top:prob-up-two-entourages}
\ref{top:unif-metrization-lemma} の Step 1 の $f$ そのものは一般に三角不等式を満たさないことを、$X=\{0,1,2\}$ と
$$
\begin{gathered}
U_{0}=U_{1}=X\times X,\qquad U_{2}=\Delta\cup\{(0,1),(1,0),(1,2),(2,1)\},\\
U_{3}=\Delta\cup\{(1,2),(2,1)\},\qquad U_{n}=\Delta\ (n\ge4)
\end{gathered}
$$
で確かめよ（補題の仮定を満たすことも確かめよ）。
:::

::: solution
**仮定.** どれも対称で $\Delta$ を含む。$U_{1}^{\circ3},U_{2}^{\circ3}\subseteq X\times X=U_{0}=U_{1}$。$U_{3}$ は $\{1,2\}$ の中の組と $\Delta$ だけからなり、合成しても $\{1,2\}$ の外に出ないので $U_{3}^{\circ3}=U_{3}\subseteq U_{2}$。$n\ge4$ では $U_{n}^{\circ3}=\Delta\subseteq U_{n-1}$。

**$f$ の値.** $(0,1)$ は $U_{2}$ に属し $U_{3}$ に属さないので $f(0,1)=1/4$。$(1,2)$ は $U_{3}$ に属し $U_{4}$ に属さないので $f(1,2)=1/8$。$(0,2)$ は $U_{1}$ に属し $U_{2}$ に属さないので $f(0,2)=1/2$。よって $f(0,2)=1/2>3/8=f(0,1)+f(1,2)$ で、$f$ は三角不等式を満たさない。Step 2 の下限で $d(0,2)\le3/8$ となり、Step 3 の不等式 $f(0,2)\le2\cdot3/8$ は成り立っている。
:::

::: supplement
**前提を変えると.** \ref{top:countable-base-metrizable} の位相版として、位相空間が距離化可能であることと、可算基をもつハウスドルフな一様構造から来ることは同値になる。これと比べて、ウリゾーンの距離化定理（\ref{top:urysohn-metrization}）は第二可算性という別の条件を使う。一様構造を一つ固定しないと「完備」や「全有界」は語れない（\ref{top:ex-arctan-uniformity}）。

**似た定理.** 位相群の左一様構造は単位元の近傍基が可算なら擬距離化可能であり、ここから「第一可算なハウスドルフ位相群は距離化可能」（バーコフ–角谷の定理）が従う（\ref{top:birkhoff-kakutani}）。

**高い視点から：近縁の列は「目盛りの刻み方」.** 距離化補題は、目盛りのない物差しの列 $U_{0}\supseteq U_{1}\supseteq\cdots$ に「$2^{-n}$」という目盛りを刻む作業である。素朴に刻んだ $f$ は三角不等式を満たさないので、あらゆる中継点を経由した最短の道のり $d$ に直す。条件 $U_{n+1}^{\circ3}\subseteq U_{n}$ は「三歩の小股は一歩の大股を超えない」という保証で、これが「道のりに直しても目盛りが半分以下には縮まない」（$\frac12f\le d$）ことを支える。比喩で言えば、地図上の各地点間に「近い・やや近い・遠い」という印だけを付けた旅人が、あらゆる経由地をたどる最短ルートを計算して、初めて本物の距離表を作るようなものである。
:::
