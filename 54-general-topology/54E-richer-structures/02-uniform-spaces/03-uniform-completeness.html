# 一様空間の完備性 {#top:page-uniform-completeness keywords="Cauchy filter, complete uniform space, totally bounded uniform space, compact iff complete and totally bounded, unique uniformity on a compact Hausdorff space, extension of uniformly continuous maps, completion of a uniform space"}

一様空間では、**コーシーフィルター**（\ref{top:cauchy-filter}）を使って完備性が定義できる。距離空間では、これはコーシー列による完備性と一致する（\ref{top:metric-complete-filters}）。本ページでは、(1) コンパクト $\iff$ 完備かつ全有界（\ref{top:compact-complete-totally-bounded}）、(2) コンパクトハウスドルフ空間の一様構造は対角線の近傍全体としてただ一つに決まり、そこからの連続写像は一様連続であること（\ref{top:compact-unique-uniformity}）、(3) 稠密な部分集合上の一様連続写像は完備な空間へ一意に延長できること（\ref{top:unif-extension}）、(4) ハウスドルフ一様空間の**完備化**の存在と一意性（\ref{top:unif-completion}）を示す。

> 資料：本ページは特定の教科書の記述によらず、標準的な議論に従って組み立てた。完備化の存在は、擬距離ごとの距離空間の完備化（\ref{top:completion-exists}）の直積に埋め込む方法で示した。

## 記法と定義の確認 {#top:sec-uc-notation}

::: notation
- 一様構造・近縁・定める位相・閉包と近縁・分離性・一様連続・始一様構造（直積・部分一様構造）は \ref{top:uniformity}, \ref{top:unif-topology}, \ref{top:unif-closure}, \ref{top:unif-separation}, \ref{top:unif-continuous}, \ref{top:initial-uniformity} のとおり。擬距離と一様連続な擬距離は \ref{top:pseudometric-uniformity}, \ref{top:unif-continuous-pseudometric}, \ref{top:uniformity-from-pseudometrics} のとおり。
- フィルター、その収束と集積点、像フィルター、コンパクト性のフィルターによる言い換え、超フィルターは \ref{top:filter-convergence}, \ref{top:image-filter}, \ref{top:compact-equivalents}, \ref{top:ultrafilter-cluster} のとおり。距離空間の完備性・全有界性・完備化は \ref{top:complete-metric}, \ref{top:totally-bounded}, \ref{top:completion-exists} のとおり。
:::

## コーシーフィルターと完備性 {#top:sec-uc-complete}

::: definition コーシーフィルターと完備性 {#top:cauchy-filter keywords="Cauchy filter, U-small set, complete uniform space" index="コーシーフィルター|こーしーふぃるたー, 完備（一様空間）|かんびいちようくうかん"}
一様空間 $(X,\mathcal{U})$ の部分集合 $F$ が $U$ **小さい**とは $F\times F\subseteq U$ となることをいう。$X$ 上のフィルター $\mathcal{F}$ が**コーシー**であるとは、すべての $U\in\mathcal{U}$ について $U$ 小さい $F\in\mathcal{F}$ があることをいう。すべてのコーシーフィルターが収束するとき、$X$ は**完備**であるという。
:::

::: lemma コーシーフィルターの基本性質 {#top:cauchy-filter-basic keywords="convergent filters are Cauchy; a Cauchy filter converges to its cluster points; images of Cauchy filters under uniformly continuous maps are Cauchy" index="コーシーフィルターの性質|こーしーふぃるたーのせいしつ"}
1. 収束するフィルターはコーシーである。
2. コーシーフィルター $\mathcal{F}$ の集積点 $x$ には $\mathcal{F}$ が収束する。
3. 一様連続写像 $f$ によるコーシーフィルターの像フィルター $f_{*}\mathcal{F}$ はコーシーである。
:::

::: proof
**1.** $\mathcal{F}\to x$, $U\in\mathcal{U}$ とする。対称な $V$ で $V\circ V\subseteq U$ となるものをとる。$V[x]$ は近傍なので $V[x]\in\mathcal{F}$。$y,z\in V[x]$ なら $(y,x)\in V$（対称）, $(x,z)\in V$ より $(y,z)\in V\circ V\subseteq U$。

**2.** $U\in\mathcal{U}$ について、対称な $V$ で $V\circ V\subseteq U$ とし、$V$ 小さい $F\in\mathcal{F}$ をとる。$x\in\overline{F}$ なので $V[x]\cap F$ に点 $y$ がある。$z\in F$ なら $(x,y)\in V$, $(y,z)\in V$ で $(x,z)\in U$。よって $F\subseteq U[x]$ で $U[x]\in\mathcal{F}$。\ref{top:unif-topology} の近傍基により $\mathcal{F}\to x$。

**3.** $f\colon X\to Y$, $W\in\mathcal{V}$ について、$U\defeq(f\times f)^{-1}[W]\in\mathcal{U}$ で、$U$ 小さい $F\in\mathcal{F}$ の像 $f[F]$ は $W$ 小さく、$f[F]\in f_{*}\mathcal{F}$。
:::

::: proposition 距離空間との整合性 {#top:metric-complete-filters keywords="a metric space is complete (Cauchy sequences) iff its metric uniformity is complete (Cauchy filters)" index="コーシーフィルターとコーシー列|こーしーふぃるたーとこーしーれつ"}
距離空間 $(X,d)$ がコーシー列について完備であることと、距離一様構造について（コーシーフィルターについて）完備であることは同値である。
:::

::: proof
**⇐.** コーシー列 $(x_{n})$ について、末尾 $\{x_{m}:m\ge n\}$ の生成するフィルターはコーシーで、収束先 $x$ の各近傍がある末尾を含むので $x_{n}\to x$。

**⇒.** コーシーフィルター $\mathcal{F}$ について、$\{d<1/n\}$ 小さい $F_{n}\in\mathcal{F}$ をとり、$x_{n}\in F_{1}\cap\cdots\cap F_{n}$（フィルターなので空でない）を選ぶ。$m\ge n$ なら $x_{m},x_{n}\in F_{n}$ で $d(x_{m},x_{n})<1/n$ なので $(x_{n})$ はコーシー列で、ある $x$ に収束する。$x$ は $\mathcal{F}$ の集積点：$F\in\mathcal{F}$, $\varepsilon>0$ について、$1/n<\varepsilon/2$ かつ $d(x_{n},x)<\varepsilon/2$ となる $n$ をとり、$y\in F\cap F_{n}$ を選ぶと $d(x,y)\le d(x,x_{n})+d(x_{n},y)<\varepsilon$。よって $x\in\overline{F}$。\ref{top:cauchy-filter-basic} の 2 より $\mathcal{F}\to x$。
:::

::: proposition 完備な部分空間 {#top:unif-complete-closed keywords="closed subsets of complete spaces are complete; complete subspaces of Hausdorff spaces are closed; products of complete spaces are complete" index="完備な部分空間|かんびなぶぶんくうかん"}
1. 完備な一様空間の閉集合は（部分一様構造について）完備である。
2. ハウスドルフな一様空間の完備な部分空間は閉集合である。
3. 完備な一様空間の族の直積は完備である。
:::

::: proof
**1.** $A\subseteq X$ を閉集合、$\mathcal{F}$ を $A$ 上のコーシーフィルターとする。$\mathcal{F}$ の生成する $X$ 上のフィルター $\mathcal{F}'$ もコーシー（部分一様構造の近縁は $U\cap(A\times A)$ の形）で、ある $x$ に収束する。各 $F\in\mathcal{F}$ について $x\in\overline{F}\subseteq A$ なので $x\in A$ で、$\mathcal{F}\to x$（$A$ の近傍は $X$ の近傍と $A$ の交わり）。

**2.** $A$ を完備な部分空間、$x\in\overline{A}$ とする。$\{N\cap A:N\text{ は }x\text{ の近傍}\}$ は $A$ 上のフィルターで、$X$ で $x$ に収束するのでコーシー（\ref{top:cauchy-filter-basic} の 1。コーシー性は部分一様構造でも同じ）。完備性からある $a\in A$ に収束し、$X$ でも $a$ に収束する。$x\ne a$ なら、ハウスドルフ性から交わらない近傍 $N_{x}\ni x$, $N_{a}\ni a$ があり、収束からどちらもこのフィルターの生成する $X$ 上のフィルターに属して $\emptyset=N_{x}\cap N_{a}$ が属することになり矛盾。よって $x=a\in A$。

**3.** 直積上のコーシーフィルター $\mathcal{F}$ について、射影 $p_{i}$ は一様連続（始一様構造）なので $(p_{i})_{*}\mathcal{F}$ はコーシーで、ある $x_{i}$ に収束する。\ref{top:image-filter} の 3 より $\mathcal{F}\to(x_{i})_{i}$（直積一様構造の位相は直積位相）。
:::

## 全有界性とコンパクト性 {#top:sec-uc-compact}

::: definition 全有界 {#top:unif-totally-bounded keywords="totally bounded uniform space, precompact" index="全有界（一様空間）|ぜんゆうかいいちようくうかん"}
一様空間 $(X,\mathcal{U})$ が**全有界**であるとは、すべての $U\in\mathcal{U}$ に対し、有限集合 $E\subseteq X$ で $U[E]=X$ となるものがあることをいう。距離一様構造については、これは \ref{top:totally-bounded} の全有界性と一致する（$U[E]$ は $E$ の点を中心とする半径 $\varepsilon$ の球の和）。
:::

::: theorem コンパクト ⇔ 完備かつ全有界 {#top:compact-complete-totally-bounded keywords="a uniform space is compact iff complete and totally bounded" index="コンパクトと完備・全有界|こんぱくとかんびぜんゆうかい"}
一様空間がコンパクトであることと、完備かつ全有界であることは同値である（⇐ では超フィルター補題を使う）。
:::

::: proof
**⇒（完備）.** コーシーフィルターはコンパクト性から集積点をもち（\ref{top:compact-equivalents}）、\ref{top:cauchy-filter-basic} の 2 よりそこに収束する。

**⇒（全有界）.** $U\in\mathcal{U}$ について、開近縁 $V\subseteq U$（\ref{top:unif-closure} の 3）をとる。$\{V[x]:x\in X\}$ は開被覆（$V[x]$ は開：$V$ が開なので $y\mapsto(x,y)$ による逆像）で、有限部分被覆 $V[x_{1}],\dots,V[x_{n}]$ がある。$E=\{x_{1},\dots,x_{n}\}$ について $U[E]\supseteq V[E]=X$。

**⇐.** \ref{top:compact-equivalents} より、任意のフィルター $\mathcal{G}$ が集積点をもつことを示す。超フィルター補題により $\mathcal{G}\subseteq\mathcal{H}$ となる超フィルター $\mathcal{H}$ をとる。$\mathcal{H}$ はコーシー：$U\in\mathcal{U}$ について、対称な $V$ で $V\circ V\subseteq U$ とし、有限集合 $E$ で $V[E]=X$ となるものをとる。$X=\bigcup_{e\in E}V[e]\in\mathcal{H}$ で $\mathcal{H}$ は超フィルターなので、ある $V[e]\in\mathcal{H}$（有限個の和が超フィルターに属すれば、どれかが属する）。$y,z\in V[e]$ なら $(y,e)\in V$, $(e,z)\in V$ で $(y,z)\in U$、すなわち $V[e]$ は $U$ 小さい。完備性から $\mathcal{H}\to x$ となる $x$ があり、$x$ は $\mathcal{H}$ の、したがって $\mathcal{G}\subseteq\mathcal{H}$ の集積点。
:::

::: hypcheck
- **超フィルター補題**：⇐ で、全有界性を「超フィルターがコーシーになる」形で使うために必要とした。
- **$V\circ V\subseteq U$**：⇐ で、半径 $V$ の「球」$V[e]$ が $U$ 小さいことに使った（距離の場合の「半径 $\varepsilon/2$ の球の直径は $\varepsilon$ 以下」にあたる）。
:::

::: theorem コンパクトハウスドルフ空間の一様構造 {#top:compact-unique-uniformity keywords="a compact Hausdorff space has exactly one compatible uniformity, the neighbourhoods of the diagonal; continuous maps from compact spaces are uniformly continuous" index="コンパクト空間の一様構造の一意性|こんぱくとくうかんのいちようこうぞうのいちいせい"}
$X$ をコンパクトハウスドルフ空間とする。
1. $X$ の位相を定める一様構造はただ一つで、それは $X\times X$ における対角線 $\Delta_{X}$ の近傍全体である。
2. この一様構造について、$X$ から任意の一様空間への連続写像は一様連続である。
:::

::: proof
**存在.** $X$ は正規（\ref{top:compact-hausdorff-normal}）なのでウリゾーンの補題から完全正則で、一様化可能（\ref{top:uniformizable-completely-regular}）。

**1.** $\mathcal{U}$ を $X$ の位相を定める一様構造とする。各 $U\in\mathcal{U}$ は開近縁 $\mathrm{int}\,U\supseteq\Delta_{X}$ を含む（\ref{top:unif-closure} の 3）ので $\Delta_{X}$ の近傍。逆に、$N$ を $\Delta_{X}$ の開近傍とし、$N\notin\mathcal{U}$ と仮定する。閉で対称な近縁全体を $\mathcal{C}$ とすると、各 $C\in\mathcal{C}$ について $C\not\subseteq N$（$C\subseteq N$ なら $N\in\mathcal{U}$）、すなわち $C\setminus N\ne\emptyset$。$\{C\setminus N:C\in\mathcal{C}\}$ は閉集合の族で、$\mathcal{C}$ が基であることから有限交叉性をもつ（$C_{1}\cap C_{2}$ は $\mathcal{C}$ の元を含む）。$X\times X$ はコンパクト（\ref{top:heine-borel}）なので共通部分に点 $(x,y)$ がある。$\mathcal{C}$ は基なので $\bigcap\mathcal{C}=\bigcap\mathcal{U}=\Delta_{X}$（\ref{top:unif-separation} の 2）で、$(x,y)\in\Delta_{X}\subseteq N$。これは $(x,y)\notin N$ に反する。よって $\mathcal{U}$ は $\Delta_{X}$ の近傍全体に等しく、位相だけから決まる。

**2.** $f\colon X\to(Y,\mathcal{V})$ を連続とし、$W\in\mathcal{V}$ をとる。開近縁 $W'\subseteq W$ について、$(f\times f)^{-1}[W']$ は開集合（$f\times f$ は連続）で $\Delta_{X}$ を含む。1 より近縁で、それを含む $(f\times f)^{-1}[W]$ も近縁。
:::

::: hypcheck
- **コンパクト性**：1 で $X\times X$ のコンパクト性を、閉集合族の有限交叉性の形で使った。コンパクトでないと、たとえば $\mathbb{R}$ では \ref{top:ex-arctan-uniformity} のように同じ位相に異なる一様構造がある。
- **ハウスドルフ性**：1 で $\bigcap\mathcal{U}=\Delta_{X}$ に使った。
:::

## 延長と完備化 {#top:sec-uc-completion}

::: theorem 一様連続写像の延長 {#top:unif-extension keywords="uniformly continuous maps from a dense subset into a complete Hausdorff uniform space extend uniquely" index="一様連続写像の延長（一様空間）|いちようれんぞくしゃぞうのえんちょういちようくうかん"}
$D$ を一様空間 $X$ の稠密な部分集合、$Y$ を完備でハウスドルフな一様空間、$f\colon D\to Y$ を（部分一様構造について）一様連続とする。このとき一様連続な $F\colon X\to Y$ で $F|_{D}=f$ となるものがただ一つある。
:::

::: proof
**Step 1（極限の存在）.** $x\in X$ について $\mathcal{B}_{x}\defeq\{f[V[x]\cap D]:V\in\mathcal{U}\}$ を考える。$D$ は稠密で $V[x]$ は近傍なので各元は空でなく、$V_{1}\cap V_{2}$ を考えればフィルター基になる。コーシー性：$W\in\mathcal{V}$ について、一様連続性から $V\in\mathcal{U}$ で「$a,b\in D$, $(a,b)\in V\Rightarrow(f(a),f(b))\in W$」となるものをとり、対称な $V'$ で $V'\circ V'\subseteq V$ とする。$a,b\in V'[x]\cap D$ なら $(a,b)\in V$ なので、$f[V'[x]\cap D]$ は $W$ 小さい。$Y$ は完備なので $\mathcal{B}_{x}$ の生成するフィルターはある点に収束し、ハウスドルフなのでその点は一意（二つの極限の交わらない近傍がともにフィルターに属すると、空集合が属してしまう）。これを $F(x)$ とする。すなわち、$F(x)$ の各近傍 $N$ に対し $f[V[x]\cap D]\subseteq N$ となる $V$ がある。

**Step 2（延長）.** $a\in D$ なら、$f$ の連続性（\ref{top:unif-continuous-basic}）から、$f(a)$ の各近傍 $N$ に対し $f[V[a]\cap D]\subseteq N$ となる $V$ がある。よって $\mathcal{B}_{a}$ の生成するフィルターは $f(a)$ に収束し、極限の一意性から $F(a)=f(a)$。

**Step 3（一様連続）.** $W\in\mathcal{V}$ をとり、$W$ に含まれる閉近縁 $W_{0}$（\ref{top:unif-closure} の 3）について、一様連続性から「$a,b\in D$, $(a,b)\in V\Rightarrow(f(a),f(b))\in W_{0}$」となる近縁をとり、それに含まれる開近縁（\ref{top:unif-closure} の 3）を改めて $V$ とする。$(x,y)\in V$ とし、$(F(x),F(y))$ の近傍 $N_{1}\times N_{2}$ をとる。Step 1 から $f[V_{1}[x]\cap D]\subseteq N_{1}$, $f[V_{1}[y]\cap D]\subseteq N_{2}$ となる $V_{1}$ があり、$V$ は開なので、$V_{1}$ を小さくとり直して $V_{1}[x]\times V_{1}[y]\subseteq V$ としてよい（\ref{top:unif-closure} の 2 の近傍基）。$D$ は稠密なので $a\in V_{1}[x]\cap D$, $b\in V_{1}[y]\cap D$ がとれ、$(a,b)\in V$ から $(f(a),f(b))\in W_{0}\cap(N_{1}\times N_{2})$。よって $(F(x),F(y))\in\overline{W_{0}}=W_{0}\subseteq W$。したがって $V\subseteq(F\times F)^{-1}[W]$ で、$F$ は一様連続。

**Step 4（一意性）.** 二つの連続な延長は $D$ 上で一致し、$Y$ はハウスドルフなので、\ref{top:hausdorff-properties} の 2 より $X$ 全体で一致する。
:::

::: theorem 完備化 {#top:unif-completion keywords="every Hausdorff uniform space has a completion, unique up to uniform isomorphism" index="完備化（一様空間）|かんびかいちようくうかん"}
ハウスドルフな一様空間 $X$ について、完備でハウスドルフな一様空間 $\widehat{X}$ と、$X$ からその稠密な部分空間への一様同型 $\iota$ がある。$(\widehat{X},\iota)$ は一様同型を除いて一意である：別の $(\widetilde{X},\kappa)$ があれば、一様同型 $\theta\colon\widehat{X}\to\widetilde{X}$ で $\theta\circ\iota=\kappa$ となるものがある。
:::

::: proof
**Step 1（擬距離ごとの完備化）.** 一様連続な擬距離全体を $\mathcal{D}$ とする。$d\in\mathcal{D}$ について、$x\sim_{d}y\iff d(x,y)=0$ による商集合 $X_{d}$ に距離 $\bar{d}([x],[y])\defeq d(x,y)$ を入れ（三角不等式から代表元によらない）、その完備化 $(\widehat{X_{d}},\iota_{d})$ をとる（\ref{top:completion-exists}）。$\pi_{d}\colon X\to\widehat{X_{d}}$, $x\mapsto\iota_{d}([x])$ について、$\widehat{X_{d}}$ の距離一様構造の $\pi_{d}$ による引き戻しは $d$ の一様構造である（$\iota_{d}$ は等長）。

**Step 2（埋め込み）.** $P\defeq\prod_{d\in\mathcal{D}}\widehat{X_{d}}$（直積一様構造）と $e\defeq(\pi_{d})_{d}\colon X\to P$ を考える。$e$ の始一様構造は、$\pi_{d}$ たちの始一様構造、すなわち $\mathcal{D}$ の生成する一様構造で、\ref{top:uniformity-from-pseudometrics} より $X$ の一様構造に等しい。$X$ はハウスドルフなので $\mathcal{D}$ は点を分離し（\ref{top:prob-up-hausdorff}）、$e$ は単射。$e[X]$ の部分一様構造の $e$ による引き戻しは $e$ の始一様構造（始一様構造の基を比べればよい）なので、$e\colon X\to e[X]$ は一様同型。

**Step 3（完備性）.** 各 $\widehat{X_{d}}$ は完備な距離空間なので一様空間として完備（\ref{top:metric-complete-filters}）、$P$ は完備（\ref{top:unif-complete-closed} の 3）でハウスドルフ。$\widehat{X}\defeq\overline{e[X]}$ は閉集合なので完備（同 1）でハウスドルフ、$e[X]$ は稠密。$\iota\defeq e$ とする。

**Step 4（一意性）.** $\kappa\circ\iota^{-1}\colon\iota[X]\to\widetilde{X}$ は一様連続なので、\ref{top:unif-extension} により一様連続な $\theta\colon\widehat{X}\to\widetilde{X}$ に延長される。同様に $\iota\circ\kappa^{-1}$ の延長 $\theta'$ をとる。$\theta'\circ\theta$ は $\iota[X]$ 上で恒等写像なので、延長の一意性から $\widehat{X}$ 上で恒等写像。同様に $\theta\circ\theta'=1$。
:::

::: hypcheck
- **ハウスドルフ性**：Step 2 で $e$ の単射性に、\ref{top:unif-extension} で極限の一意性に使った。ハウスドルフでない一様空間でも、$\bigcap\mathcal{U}$ で割った商をとれば同様の完備化が得られることが知られている（ここでは扱わない）。
- **距離空間の完備化**：Step 1 で使った。そこでは選択公理は不要とされている（\ref{top:completion-exists}）が、Step 4 の一意性には極限の選び方は関わらない（ハウスドルフ性で一意に決まる）。
:::

::: proposition 全有界な空間の完備化はコンパクト {#top:totally-bounded-completion-compact keywords="the completion of a totally bounded Hausdorff uniform space is compact" index="全有界な空間の完備化|ぜんゆうかいなくうかんのかんびか"}
全有界なハウスドルフ一様空間 $X$ の完備化 $\widehat{X}$ はコンパクトである。
:::

::: proof
$\widehat{X}$ の近縁 $W$ について、$V\circ V\subseteq W$ となる対称な近縁 $V$ をとる。$X$（$\iota$ で同一視）は全有界なので、有限集合 $E\subseteq X$ で $X\subseteq V[E]$。$z\in\widehat{X}$ について、$X$ は稠密なので $(z,x)\in V$ となる $x\in X$ があり、$(x,e)\in V$ となる $e\in E$ があるので $(z,e)\in W$。よって $W[E]=\widehat{X}$ で、$\widehat{X}$ は全有界。完備なので \ref{top:compact-complete-totally-bounded} からコンパクト。
:::

::: theorem ストーン–チェックのコンパクト化は完備化 {#top:stone-cech-completion keywords="beta X is the completion of X with the uniformity generated by C(X,[0,1])" index="ストーン–チェックのコンパクト化と完備化|すとーんちぇっくのこんぱくとかとかんびか"}
チコノフ空間 $X$ に、連続関数 $f\colon X\to[0,1]$ 全体による始一様構造（\ref{top:initial-uniformity}）$\mathcal{U}_{\beta}$ を入れる。その完備化 $\widehat{X}$ と埋め込み $\iota$ は、ストーン–チェックのコンパクト化の普遍性（\ref{top:stone-cech}）をもち、したがって $\beta X$ と同相である（$X$ を固定して）。
:::

::: proof
**Step 1（$\mathcal{U}_{\beta}$ は $X$ の位相を定め、ハウスドルフで全有界）.** \ref{top:initial-uniformity} の 2 から $\mathcal{U}_{\beta}$ の位相は連続関数 $X\to[0,1]$ 全体の始位相で、$X$ は完全正則なのでもとの位相と一致する（点と閉集合を分離する関数がある）。$T_{1}$ と合わせてハウスドルフ。全有界：近縁の基は、有限個の $f_{1},\dots,f_{k}$ と $\varepsilon$ による $\{(x,y):\lvert f_{i}(x)-f_{i}(y)\rvert<\varepsilon\ (i\le k)\}$ の形で、$[0,1]^{k}$ を有限個の一辺 $\varepsilon/2$ の小さな箱に分け、空でない逆像から一点ずつ選べば有限集合 $E$ が得られる。

**Step 2（$\widehat{X}$ はコンパクトハウスドルフ）.** \ref{top:totally-bounded-completion-compact}。

**Step 3（普遍性）.** $K$ をコンパクトハウスドルフ空間、$g\colon X\to K$ を連続とする。$K$ の一様構造はただ一つ（\ref{top:compact-unique-uniformity}）で、それは連続関数 $\varphi\colon K\to[0,1]$ 全体による始一様構造に等しい（後者は $K$ の位相を定める一様構造なので、一意性による）。各 $\varphi\circ g$ は連続関数 $X\to[0,1]$ なので $\mathcal{U}_{\beta}$ について一様連続で、\ref{top:initial-uniformity} の 1 から $g$ は一様連続。$K$ は完備でハウスドルフ（\ref{top:compact-complete-totally-bounded}）なので、\ref{top:unif-extension} から一様連続な延長 $G\colon\widehat{X}\to K$ がある。連続な延長の一意性は、$X$ が稠密で $K$ がハウスドルフであることから。

よって $(\widehat{X},\iota)$ はストーン–チェックのコンパクト化の普遍性をもち、\ref{top:stone-cech-unique} から $\beta X$ と同相。
:::

## 問題 {#top:sec-uc-problems}

::: problem {#top:prob-uc-arctan}
\ref{top:ex-arctan-uniformity} の二つの一様構造について、$(\mathbb{R},d)$ は完備だが $(\mathbb{R},d')$ は完備でないことを示し、$(\mathbb{R},d')$ の完備化を求めよ。
:::

::: solution
$(\mathbb{R},d)$ の完備性は実数の完備性（\ref{top:reals-complete}）。$x_{n}\defeq n$ について $d'(x_{m},x_{n})=\lvert\arctan m-\arctan n\rvert\to0$（$\arctan n\to\pi/2$）なのでコーシー列だが、$\mathbb{R}$ のどの点にも $d'$ で収束しない（$d'$ の位相は通常の位相で、$(n)$ は有界でない）。$\arctan\colon(\mathbb{R},d')\to(-\pi/2,\pi/2)$ は等長で、像は $[-\pi/2,\pi/2]$ で稠密、$[-\pi/2,\pi/2]$ は完備（閉区間）。よって完備化は $[-\pi/2,\pi/2]$（$\mathbb{R}$ に $\pm\infty$ を付け加えたもの）である。
:::

::: problem {#top:prob-uc-heine-cantor}
\ref{top:compact-unique-uniformity} の 2 から、コンパクト距離空間上の連続写像は一様連続であること（ハイネ–カントールの定理 \ref{top:heine-cantor}）を導け。
:::

::: solution
コンパクト距離空間 $(X,d)$ はハウスドルフで、距離一様構造は $X$ の位相を定める。\ref{top:compact-unique-uniformity} の 1 より、それはただ一つの一様構造なので、2 の一様連続性は距離一様構造についての一様連続性、すなわち $\varepsilon$–$\delta$ の一様連続性（\ref{top:unif-continuous}）である。
:::

::: supplement
**前提を変えると.** 全有界な一様空間の完備化はコンパクトである（\ref{top:totally-bounded-completion-compact}）。特にチコノフ空間 $X$ に、連続関数 $X\to[0,1]$ 全体から作った全有界な一様構造を入れて完備化すると、ストーン–チェックのコンパクト化（\ref{top:page-stone-cech}）が得られる（\ref{top:stone-cech-completion}）。

**似た定理.** \ref{top:unif-extension} は距離空間の場合（\ref{top:uniform-extension}）の一般化である。\ref{top:compact-unique-uniformity} の 2 はハイネ–カントールの定理の一般化で、距離を使わずに「対角線の近傍」という位相的な言葉だけで述べられている。位相線形空間や位相群でも、群の構造から来る一様構造について同様の完備化が考えられる。

**高い視点から：完備化は「反射」.** 完備でハウスドルフな一様空間の圏は、ハウスドルフ一様空間と一様連続写像の圏の反射部分圏であり、完備化 $X\mapsto\widehat{X}$ がその反射子（包含関手の左随伴）である。これは \ref{top:unif-extension} が述べる普遍性「完備な空間への一様連続写像は $\widehat{X}$ を一意に通る」の言い換えにほかならない（\ref{cat:reflective-subcategory}）。比喩で言えば、完備化は穴の空いた布に、布目（一様構造）に沿って当て布をする作業で、布目が決まっていればどこに何を当てるかは一通りに決まる。同じ位相でも布目が違えば（\ref{top:prob-uc-arctan}）、当て布の仕方も異なる。
:::
