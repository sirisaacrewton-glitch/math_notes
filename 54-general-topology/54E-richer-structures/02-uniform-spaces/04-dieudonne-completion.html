# デュドネの完備化 {#top:page-dieudonne-completion keywords="universal uniformity, finest compatible uniformity, continuous pseudometrics, Dieudonne complete, topologically complete space, Dieudonne completion, paracompact spaces are Dieudonne complete, the rationals are Dieudonne complete"}

完全正則空間には、位相と両立する一様構造がたくさんある。その中で**最も細かい**もの（**普遍一様構造**、\ref{top:universal-uniformity}）は、すべての連続な擬距離が生成する一様構造で、任意の一様空間への連続写像を一様連続にする。位相と両立する完備な一様構造をもつ空間を**デュドネ完備**といい（\ref{top:dieudonne-complete}）、普遍一様構造で完備化したものを**デュドネの完備化** $\mu X$ という。本ページでは、$\mu X$ の普遍性を示し、主定理として**パラコンパクト空間はデュドネ完備**であること（デュドネ 1939、\ref{top:paracompact-dieudonne}）を、1 の分割から作った連続擬距離によって証明する。帰結として、完備距離化可能でない $\mathbb{Q}$ もデュドネ完備である。

> 資料：本ページは特定の教科書の記述によらず、標準的な議論に従って組み立てた。主定理の証明の擬距離の作り方は本サイトで書き下ろした。

## 記法と定義の確認 {#top:sec-dc-notation}

::: notation
- 一様構造・一様連続・擬距離の生成する一様構造・一様構造は一様連続な擬距離で生成されることは \ref{top:uniformity}, \ref{top:unif-continuous}, \ref{top:pseudometric-uniformity}, \ref{top:uniformity-from-pseudometrics}。一様連続な擬距離は \ref{top:unif-continuous-pseudometric}。
- コーシーフィルター・完備・コーシーフィルターは集積点に収束すること・一様連続写像の延長・完備化は \ref{top:cauchy-filter}, \ref{top:cauchy-filter-basic}, \ref{top:unif-extension}, \ref{top:unif-completion}。
- 完全正則・チコノフ空間は \ref{top:completely-regular}。一様化可能 $\iff$ 完全正則（\ref{top:uniformizable-completely-regular}）。
- パラコンパクト（ハウスドルフを含む）・1 の分割の存在・局所有限な和の連続性は \ref{top:paracompact}, \ref{top:partition-of-unity-existence}, \ref{top:locally-finite-sum}。
- 位相空間 $X$ 上の擬距離 $d$ が**連続**とは、$d\colon X\times X\to\mathbb{R}$ が（積位相について）連続であることをいう。
:::

## 普遍一様構造 {#top:sec-dc-universal}

::: definition 普遍一様構造 {#top:universal-uniformity keywords="universal uniformity of a Tychonoff space generated by all continuous pseudometrics" index="普遍一様構造|ふへんいちようこうぞう"}
チコノフ空間 $X$ 上の連続な擬距離の全体が生成する一様構造（\ref{top:pseudometric-uniformity}）を $X$ の**普遍一様構造** $\mathcal{U}_{X}$ という。
:::

::: proposition 普遍一様構造の性質 {#top:universal-uniformity-properties keywords="the universal uniformity induces the topology, is the finest compatible uniformity, and makes every continuous map into a uniform space uniformly continuous" index="普遍一様構造の性質|ふへんいちようこうぞうのせいしつ"}
$X$ をチコノフ空間とする。
1. $\mathcal{U}_{X}$ の定める位相は $X$ の位相に等しい。
2. $X$ の位相を定める任意の一様構造 $\mathcal{V}$ について $\mathcal{V}\subseteq\mathcal{U}_{X}$。
3. 一様空間 $Y$ への任意の連続写像 $f\colon X\to Y$ は、$(X,\mathcal{U}_{X})$ から一様連続である。
:::

::: proof
**1.** 連続な擬距離 $d$ と $x\in X$ について、$B_{d}(x,r)=\{y:d(x,y)<r\}$ は連続関数 $y\mapsto d(x,y)$ の逆像なので開集合。$\mathcal{U}_{X}$ の位相での $x$ の基本近傍は有限個のこのような球の共通部分なので、$X$ の開集合を含む。逆に、$x\in W$（$W$ は開）について、**完全正則性**から連続な $g\colon X\to[0,1]$ で $g(x)=0$, $g|_{X\setminus W}=1$ となるものがある。$d(y,z)\defeq\lvert g(y)-g(z)\rvert$ は連続な擬距離で、$B_{d}(x,1)\subseteq W$。よって $W$ は $\mathcal{U}_{X}$ の位相でも $x$ の近傍。

**2.** \ref{top:uniformity-from-pseudometrics} から $\mathcal{V}$ は $\mathcal{V}$ について一様連続な擬距離 $e$ の全体で生成される。$e$ は $\mathcal{V}$ の位相、すなわち $X$ の位相で $X\times X$ 上連続（一様連続な擬距離の $\varepsilon$ 近縁は $\mathcal{V}$ に属し、$\lvert e(y,z)-e(y',z')\rvert\le e(y,y')+e(z,z')$ から連続）。よって $e$ は $\mathcal{U}_{X}$ を生成する擬距離の一つで、$\mathcal{V}$ の基の元はすべて $\mathcal{U}_{X}$ に属する。

**3.** $Y$ の一様構造は $Y$ 上の一様連続な擬距離 $e$ で生成される（\ref{top:uniformity-from-pseudometrics}）。$e_{f}(x,x')\defeq e(f(x),f(x'))$ は $X$ 上の擬距離で、$e$ の連続性と $f$ の連続性から連続。よって $\{(x,x'):e(f(x),f(x'))<\varepsilon\}\in\mathcal{U}_{X}$ で、$f$ は一様連続。
:::

## デュドネ完備性 {#top:sec-dc-complete}

::: definition デュドネ完備 {#top:dieudonne-complete keywords="Dieudonne complete (topologically complete): admits a compatible complete uniformity" index="デュドネ完備|でゅどねかんび, 位相的完備|いそうてきかんび"}
チコノフ空間 $X$ が**デュドネ完備**（**位相的完備**）であるとは、$X$ の位相を定める完備な一様構造があることをいう。
:::

::: proposition 普遍一様構造による判定 {#top:dieudonne-via-universal keywords="X is Dieudonne complete iff its universal uniformity is complete" index="デュドネ完備性の判定|でゅどねかんびせいのはんてい"}
チコノフ空間 $X$ がデュドネ完備であることと、$(X,\mathcal{U}_{X})$ が完備であることは同値である。
:::

::: proof
**⇐** は定義（\ref{top:universal-uniformity-properties} の 1 から $\mathcal{U}_{X}$ は位相を定める）。**⇒**：$\mathcal{V}$ を位相を定める完備な一様構造とする。$\mathcal{U}_{X}$ のコーシーフィルター $\mathcal{F}$ は、$\mathcal{V}\subseteq\mathcal{U}_{X}$（\ref{top:universal-uniformity-properties} の 2）なので $\mathcal{V}$ についてもコーシーで、$\mathcal{V}$ の完備性から収束する。収束は位相だけで決まるので、$\mathcal{U}_{X}$ についても収束する。
:::

::: theorem デュドネの完備化 {#top:dieudonne-completion keywords="Dieudonne completion mu X: completion of the universal uniformity; universal property for maps into Dieudonne complete spaces" index="デュドネの完備化|でゅどねのかんびか"}
チコノフ空間 $X$ について、$(X,\mathcal{U}_{X})$ の完備化（\ref{top:unif-completion}）を $\mu X$ と書く。$\mu X$ はデュドネ完備なチコノフ空間で、$X$ を稠密な部分空間として含み、次の普遍性をもつ：デュドネ完備な空間 $Y$ への連続写像 $f\colon X\to Y$ は、連続写像 $\mu f\colon\mu X\to Y$ にただ一つ延長される。
:::

::: proof
**$\mu X$ の性質.** $X$ はチコノフなので $T_{1}$ で、$\mathcal{U}_{X}$ はハウスドルフ（\ref{top:unif-separation}）。完備化はハウスドルフで完備な一様空間なので、その位相は完全正則（一様化可能、\ref{top:uniformizable-completely-regular}）かつハウスドルフ、すなわちチコノフで、完備な一様構造をもつのでデュドネ完備。

**延長の存在.** $Y$ に位相を定める完備な一様構造 $\mathcal{W}$ をとる（$Y$ はデュドネ完備で、チコノフなのでハウスドルフ）。\ref{top:universal-uniformity-properties} の 3 から $f\colon(X,\mathcal{U}_{X})\to(Y,\mathcal{W})$ は一様連続。$X$ は $\mu X$ で稠密なので、\ref{top:unif-extension} から一様連続、とくに連続な延長がある。

**一意性.** 二つの連続な延長は稠密な $X$ の上で一致し、$Y$ はハウスドルフなので全体で一致する。
:::

## パラコンパクト空間はデュドネ完備 {#top:sec-dc-paracompact}

::: lemma 一様な大きさの近傍をもつ擬距離 {#top:normal-cover-pseudometric keywords="for an open cover of a paracompact space there is a continuous pseudometric whose unit balls refine the cover" index="開被覆に従う擬距離|かいひふくにしたがうぎきょり"}
$X$ をパラコンパクト空間、$\mathcal{V}$ を開被覆とする。連続な擬距離 $d$ で、各 $y\in X$ について $B_{d}(y,1)$ が $\mathcal{V}$ のある元に含まれるものがある。
:::

::: proof
**Step 1（1 の分割の正規化）.** $\mathcal{V}$ に従属する 1 の分割 $(p_{s})_{s\in S}$ をとる（\ref{top:partition-of-unity-existence}）。各点の近傍で $0$ でない $p_{s}$ は有限個なので、$m(x)\defeq\max_{s}p_{s}(x)$ は、各点の近傍で有限個の連続関数の最大として連続で、$\sum_{s}p_{s}=1$ から $m>0$。$u_{s}\defeq p_{s}/m$ とおくと、$u_{s}$ は連続、$\operatorname{supp}u_{s}=\operatorname{supp}p_{s}$、そして各 $x$ で $\max_{s}u_{s}(x)=1$。

**Step 2（擬距離）.** $d(y,z)\defeq\sum_{s}\lvert u_{s}(y)-u_{s}(z)\rvert$ とおく。$(y,z)\in X\times X$ の近傍として、$y$ の近傍と $z$ の近傍で、それぞれ有限個の台としか交わらないものの積をとると、その上で和は有限個の連続関数の和なので、$d$ は連続。擬距離の公理は各項から。

**Step 3（球の大きさ）.** $y\in X$ について $u_{s}(y)=1$ となる $s$ をとる。$d(y,z)<1$ なら $\lvert u_{s}(y)-u_{s}(z)\rvert<1$ なので $u_{s}(z)>0$、すなわち $z\in\operatorname{supp}p_{s}$。台は $\mathcal{V}$ のある元 $V$ に含まれるので $B_{d}(y,1)\subseteq V$。
:::

::: theorem デュドネの定理 {#top:paracompact-dieudonne keywords="Dieudonne: paracompact Hausdorff spaces are Dieudonne complete" index="デュドネの定理|でゅどねのていり"}
（AC）パラコンパクト空間はデュドネ完備である。
:::

::: proof
パラコンパクト空間は正規（\ref{top:paracompact-normal}）でハウスドルフなのでチコノフ。\ref{top:dieudonne-via-universal} から、$\mathcal{U}_{X}$ のコーシーフィルター $\mathcal{F}$ が収束することを示せばよい。\ref{top:cauchy-filter-basic} の 2 から、$\mathcal{F}$ が集積点をもつことを示せば十分。

集積点がないとすると、各 $x$ について、開近傍 $V_{x}$ と $F_{x}\in\mathcal{F}$ で $V_{x}\cap F_{x}=\varnothing$ となるものがある（集積点でないことの定義：$x$ のある近傍が $\mathcal{F}$ のある元と交わらない）。開被覆 $\{V_{x}\}$ に \ref{top:normal-cover-pseudometric} を使い、連続な擬距離 $d$ をとる。$\{(y,z):d(y,z)<1\}\in\mathcal{U}_{X}$ なので、$\mathcal{F}$ が**コーシー**であることから、$F\times F\subseteq\{d<1\}$ となる $F\in\mathcal{F}$ がある。$y\in F$ をとると $F\subseteq B_{d}(y,1)\subseteq V_{x}$（ある $x$）。すると $F\cap F_{x}\subseteq V_{x}\cap F_{x}=\varnothing$ となり、フィルターの元の共通部分が空であることに反する。
:::

::: hypcheck
- **パラコンパクト性**：\ref{top:normal-cover-pseudometric} の 1 の分割にだけ使った。そこで本質的なのは「各点で最大値が $1$ になるように正規化しても連続」という局所有限性である。
- **完全正則性**：\ref{top:universal-uniformity-properties} の 1（連続な擬距離が位相を生成すること）に使った。
- **完備化の存在**：デュドネの完備化の構成に使った。
- **選択公理**：1 の分割と集積点でないことの証拠 $V_{x},F_{x}$ の選択に使った。
:::

::: corollary デュドネ完備な空間の例 {#top:dieudonne-examples keywords="metric spaces, regular Lindelof spaces, and in particular the rationals are Dieudonne complete" index="デュドネ完備な空間の例|でゅどねかんびなくうかんのれい"}
距離化可能空間と、$T_{3}$ のリンデレーフ空間はデュドネ完備である。とくに $\mathbb{Q}$ はデュドネ完備だが、完備距離化可能ではない。
:::

::: proof
距離化可能空間はパラコンパクト（\ref{top:stone-paracompact}）、$T_{3}$ のリンデレーフ空間もパラコンパクト（\ref{top:regular-lindelof-paracompact}）なので、\ref{top:paracompact-dieudonne} から。$\mathbb{Q}$ が完備距離化可能でないことは \ref{top:gdelta-characterization}。
:::

$\mathbb{Q}$ の例は、「デュドネ完備」が「完備な**距離**がある」よりずっと弱いことを示している：$\mathbb{Q}$ の普遍一様構造は通常の距離の一様構造より真に細かく、通常の距離でコーシーな列（$\sqrt{2}$ に収束する有理数列）は、普遍一様構造ではコーシーでない（$\mathbb{Q}$ 上の連続関数 $q\mapsto1/(q-\sqrt{2})$ に沿って発散するので、擬距離 $\lvert1/(y-\sqrt{2})-1/(z-\sqrt{2})\rvert$ について小さくならない）。

## 問題 {#top:sec-dc-problems}

::: problem {#top:prob-dc-compact}
コンパクトハウスドルフ空間 $K$ については、普遍一様構造は位相を定める唯一の一様構造であり、$\mu K=K$ であることを示せ。
:::

::: solution
コンパクトハウスドルフ空間の位相を定める一様構造はただ一つ（\ref{top:compact-unique-uniformity}）なので、それが $\mathcal{U}_{K}$ である。コンパクトな一様空間は完備（\ref{top:compact-complete-totally-bounded}）なので、完備化は $K$ 自身。
:::

::: problem {#top:prob-dc-closed-subspace}
デュドネ完備な空間の閉部分空間はデュドネ完備であることを示せ。
:::

::: solution
$X$ の位相を定める完備な一様構造 $\mathcal{V}$ をとり、閉集合 $A$ に部分一様構造 $\mathcal{V}_{A}$（\ref{top:initial-uniformity}）を入れる。その位相は部分空間の位相。$\mathcal{V}_{A}$ のコーシーフィルター $\mathcal{F}$ の $X$ への像は（包含は一様連続なので \ref{top:cauchy-filter-basic} の 3）$X$ のコーシーフィルターで、ある $x$ に収束する。$\mathcal{F}$ の元はすべて $A$ に含まれるので $x\in\overline{A}=A$。$A$ の中でも $x$ に収束する。（完備な空間の閉部分空間は完備：\ref{top:unif-complete-closed} からも従う。）
:::

::: supplement
**前提を変えると.**
- **逆向き.** デュドネ完備でもパラコンパクトとは限らない（デュドネ完備性は任意の直積と閉部分空間で保たれるが、パラコンパクト性は直積で保たれない：ゾルゲンフライ平面 \ref{top:sorgenfrey-plane} はデュドネ完備だがパラコンパクトでない）。直積で保たれることは、各因子の完備な一様構造の積一様構造が完備であることから従う（ここでは確かめていない）。
- **ヒューイット実コンパクト化.** 普遍一様構造の代わりに、実数値連続関数全体で生成される一様構造を使うと**実コンパクト化** $\upsilon X$ が得られる。$X\subseteq\mu X\subseteq\upsilon X\subseteq\beta X$ であり、可測基数がなければ $\mu X=\upsilon X$ となることが知られている（シロタの定理。ここでは扱わない）。
- **デュドネ完備でない例.** 順序数の空間 $[0,\omega_{1})$ はデュドネ完備でなく、$\mu[0,\omega_{1})=[0,\omega_{1}]$ であることが知られている（$[0,\omega_{1})$ 上の連続な実数値関数はある段から先で定数になることを使う。ここでは確かめていない）。

**似た定理.** チェック完備性（\ref{top:page-cech-complete}）・完備距離化可能性（\ref{top:page-complete-metrizability}）も「完備性の位相的な版」である。距離化可能空間では完備距離化可能 $\iff$ チェック完備（\ref{top:cech-complete-metric}）だが、デュドネ完備性はすべての距離化可能空間がもつ、最も弱い版である。

**高い視点から.** 一様構造は「点どうしの近さを比べる物差し」で、位相が同じでも物差しは何通りもある。普遍一様構造は「位相が許す最も細かい物差し」で、すべての連続関数の変化を感知する。比喩で言えば、普遍一様構造で完備であるとは「どんなに敏感な観測装置で見ても、収束しそうで収束しない点列（フィルター）がない」ことで、$\mathbb{Q}$ の $\sqrt{2}$ への点列は、粗い物差し（通常の距離）では収束しそうに見えるが、$1/(q-\sqrt{2})$ という装置で見ると激しく揺れて収束しそうにすら見えない。パラコンパクト性は、1 の分割によって「十分に敏感な装置を自分で組み立てられる」性質である。
:::
