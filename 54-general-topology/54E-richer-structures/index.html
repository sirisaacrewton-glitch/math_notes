# 豊かな構造をもつ位相空間（Spaces with Richer Structures）

距離空間、完備性、ベールのカテゴリー定理、距離化定理、一様空間。

<p class="mn-msc">MSC2020: 54E</p>

## 分野

<div class="mn-cards">
<a class="mn-card" href="01-metric-spaces/index.html"><span class="mn-card-title">距離空間</span><span class="mn-card-en">Metric Spaces</span><span class="mn-card-desc">距離と距離位相、完備性と完備化、ベールのカテゴリー定理、全有界性とコンパクト性、ウリゾーンの距離化定理、ストーンの定理と長田–スミルノフの距離化定理、完備距離化可能性とポーランド空間、至るところ微分不可能な連続関数（ベールの定理の応用）、デュグンジの拡張定理（ノルム空間値の延長と線形拡張作用素）、ℕ^ℕ の特徴づけ（アレクサンドロフ–ウリゾーンの定理、無理数、ポーランド空間は ℕ^ℕ の連続像）、チェック完備性（コンパクト化によらないこと、ベール性、距離化可能空間での完備距離化可能性との一致）。（内田『集合と位相』§26–§27、小山『位相空間論』を参考）</span><span class="mn-card-count">10 ページ</span></a>
<a class="mn-card" href="02-uniform-spaces/index.html"><span class="mn-card-title">一様空間</span><span class="mn-card-en">Uniform Spaces</span><span class="mn-card-desc">近縁による一様構造、一様構造の定める位相、一様連続写像と始一様構造、擬距離による一様構造と距離化補題、完全正則性との対応、完備性と完備化。（資料なし。標準的な定義に従って組み立てた）</span><span class="mn-card-count">3 ページ</span></a>
