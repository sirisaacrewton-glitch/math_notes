# 位相空間の反例（Counterexamples in Topology）

ニェミツキ平面（完全正則だが正規でない可分空間、ジョーンズの補題）、ゾルゲンフライ直線と平面、チコノフの板、アレクサンドロフの二重矢印空間など、一般位相の性質を区別する代表的な空間。

<p class="mn-msc">MSC2020: 54G20</p>
