# 位相群 {#top:page-topological-groups keywords="topological group, homogeneity, neighbourhoods of the identity, symmetric neighbourhood, closure of a subgroup, open subgroups are closed, coset space, quotient group, T0 implies Hausdorff and regular, discrete subgroups are closed"}

**位相群**（\ref{top:topological-group}）は、群の演算が連続になるように位相を入れた群である。平行移動が同相写像なので、位相群の位相は**単位元の近傍**だけで決まり（\ref{top:tg-neighbourhoods}）、空間のどこを見ても同じ形をしている。本ページでは、部分群の閉包・開部分群（\ref{top:tg-subgroups}）、剰余空間と商群（\ref{top:tg-quotient}）を扱い、位相群では $T_{0}$ 性だけでハウスドルフかつ正則になること（\ref{top:tg-separation}）を示す。

> 資料：本ページは特定の教科書の記述によらず、標準的な議論に従って組み立てた。

## 記法と定義の確認 {#top:sec-tg-notation}

::: notation
- 群 $G$ の単位元を $e$ と書く。部分集合 $A,B\subseteq G$ と $g\in G$ について $AB\defeq\{ab:a\in A,b\in B\}$, $A^{-1}\defeq\{a^{-1}:a\in A\}$, $gA\defeq\{g\}A$。$A=A^{-1}$ のとき**対称**という。
- 近傍・閉包・商写像・分離公理は \ref{top:neighborhood}, \ref{top:closure-neighborhood}, \ref{top:quotient-topology}, \ref{top:separation-axioms} のとおり。正則性の閉近傍による言い換えは \ref{top:regular-normal-characterization}。
:::

## 定義と単位元の近傍 {#top:sec-tg-definition}

::: definition 位相群 {#top:topological-group keywords="topological group" index="位相群|いそうぐん"}
群 $G$ と $G$ 上の位相の組が**位相群**であるとは、乗法 $G\times G\to G$, $(x,y)\mapsto xy$ と逆元 $G\to G$, $x\mapsto x^{-1}$ がともに連続であることをいう（$G\times G$ には直積位相を入れる）。
:::

::: example
1. $(\mathbb{R}^{n},+)$, 円周群 $S^{1}=\{z\in\mathbb{C}:\lvert z\rvert=1\}$（乗法）、任意の群に離散位相を入れたもの。
2. $GL_{n}(\mathbb{R})\subseteq\mathbb{R}^{n^{2}}$（部分空間）：積の成分は多項式、逆行列の成分は余因子を行列式で割った有理式（分母は $GL_{n}$ 上で $0$ でない）なので連続。
3. $(\mathbb{Q},+)$ は $\mathbb{R}$ の部分群として位相群（部分群に部分空間の位相を入れたものは位相群）。
:::

::: proposition 位相群の基本性質 {#top:tg-neighbourhoods keywords="translations are homeomorphisms; neighbourhoods are translates of neighbourhoods of e; symmetric neighbourhoods with V V in U" index="単位元の近傍|たんいげんのきんぼう, 平行移動|へいこういどう"}
$G$ を位相群とする。
1. 各 $g$ について左平行移動 $x\mapsto gx$、右平行移動 $x\mapsto xg$、逆元 $x\mapsto x^{-1}$ は同相写像である。したがって、$g$ の近傍全体は $\{gU:U\text{ は }e\text{ の近傍}\}=\{Ug:U\text{ は }e\text{ の近傍}\}$。
2. $e$ の任意の近傍 $U$ に、$e$ の対称な開近傍 $V$ で $VV\subseteq U$ となるものがある。
3. $A\subseteq G$ について、$\overline{A}=\bigcap_{U}AU$（$U$ は $e$ の近傍全体）。特に $e$ の近傍 $V$ について $\overline{V}\subseteq VV^{-1}$。
:::

::: proof
**1.** $x\mapsto gx$ は乗法と $x\mapsto(g,x)$ の合成で連続、逆写像 $x\mapsto g^{-1}x$ も連続。右平行移動と逆元（自分自身が逆写像）も同様。同相写像は近傍を近傍に写すので、$N$ が $g$ の近傍であることと $g^{-1}N$ が $e$ の近傍であることは同値。

**2.** 乗法は $(e,e)$ で連続で $ee=e\in U$ なので、$e$ の開近傍 $W_{1},W_{2}$ で $W_{1}W_{2}\subseteq U$ となるものがある。$W\defeq W_{1}\cap W_{2}$, $V\defeq W\cap W^{-1}$（逆元が同相写像なので開）とすれば $V$ は対称で $VV\subseteq W_{1}W_{2}\subseteq U$。

**3.** $x\in\overline{A}\iff$ すべての $e$ の近傍 $U$ で $xU^{-1}\cap A\ne\emptyset$（$xU^{-1}$ は $x$ の近傍全体を動く）$\iff$ ある $a\in A$, $u\in U$ で $xu^{-1}=a$、すなわち $x=au\in AU$。後半：$\overline{V}\subseteq V\cdot V^{-1}$（$U\defeq V^{-1}$ ととる）。
:::

## 部分群と商 {#top:sec-tg-subgroups}

::: proposition 部分群 {#top:tg-subgroups keywords="closure of a (normal) subgroup is a (normal) subgroup; open subgroups are closed; a connected group is generated by any neighbourhood of e" index="開部分群|かいぶぶんぐん"}
$G$ を位相群、$H$ をその部分群とする。
1. $\overline{H}$ は部分群で、$H$ が正規部分群なら $\overline{H}$ も正規部分群である。
2. $H$ が開なら $H$ は閉でもある。
3. $G$ が連結なら、$e$ の任意の近傍 $U$ は $G$ を生成する。
:::

::: proof
**1.** $(x,y)\mapsto xy^{-1}$ は連続で $H\times H$ を $H$ に写すので、$\overline{H\times H}=\overline{H}\times\overline{H}$ を $\overline{H}$ に写す。正規なら各 $g$ について $x\mapsto gxg^{-1}$ は同相写像で $H$ を $H$ に写すので $\overline{H}$ を $\overline{H}$ に写す。

**2.** $G\setminus H=\bigcup_{g\notin H}gH$ は開集合 $gH$ の和なので開。

**3.** $U$ の生成する部分群 $H$ は $U$ を含み、$h\in H$ について $hU\subseteq H$ なので開。2 から閉でもあり、空でないので連結性から $H=G$。
:::

::: theorem 剰余空間と商群 {#top:tg-quotient keywords="coset space G/H with quotient topology; the projection is open; G/H is Hausdorff iff H is closed; quotient groups are topological groups" index="剰余空間|じょうよくうかん, 商群（位相群）|しょうぐんいそうぐん"}
$H$ を位相群 $G$ の部分群とし、左剰余類の集合 $G/H$ に射影 $\pi\colon G\to G/H$ による商位相を入れる。
1. $\pi$ は開写像である。
2. $G/H$ がハウスドルフであることと $H$ が閉であることは同値である。
3. $H$ が正規部分群なら、$G/H$ は位相群である。
:::

::: proof
**1.** 開集合 $U$ について $\pi^{-1}[\pi[U]]=UH=\bigcup_{h\in H}Uh$ は開なので、商位相の定義から $\pi[U]$ は開。

**2.** ハウスドルフなら一点 $\pi(e)$ は閉で、$H=\pi^{-1}(\pi(e))$ は閉。逆に $H$ が閉で $xH\ne yH$ とすると $x^{-1}y\notin H$。写像 $(v_{1},v_{2})\mapsto v_{1}^{-1}x^{-1}yv_{2}$ は連続で、$(e,e)$ を開集合 $G\setminus H$ の点 $x^{-1}y$ に写すので、$e$ の開近傍 $V$ で $V^{-1}x^{-1}yV\cap H=\emptyset$ となるものがある。$\pi[xV]$, $\pi[yV]$ は 1 より $xH,yH$ の開近傍で、交わらない：$xv_{1}H=yv_{2}H$（$v_{i}\in V$）なら $v_{1}^{-1}x^{-1}yv_{2}\in H$ となり矛盾。

**3.** 乗法 $m\colon G/H\times G/H\to G/H$ は well-defined な群演算で、$m\circ(\pi\times\pi)=\pi\circ m_{G}$。$\pi\times\pi$ は開写像の積なので開な連続全射、したがって商写像（\ref{top:quotient-map-criteria}）で、$\pi\circ m_{G}$ は連続なので $m$ は連続（\ref{top:quotient-universal}）。逆元も同様に $\pi$（開な連続全射）を通して連続。
:::

::: hypcheck
- **乗法の連続性**：1 で $Uh$ が開であること（右平行移動）、2 で $V$ の存在、3 で $m_{G}$ の連続性に使った。
- **$\pi$ が開写像**：3 で $\pi\times\pi$ が商写像であることに使った。一般の商写像の積は商写像とは限らない（\ref{top:product-quotient-counterexample}）ので、開写像であることが効いている。
:::

## 分離性 {#top:sec-tg-separation}

::: theorem 位相群の分離性 {#top:tg-separation keywords="for topological groups T0 implies T1 implies Hausdorff and regular" index="位相群の分離性|いそうぐんのぶんりせい"}
位相群 $G$ について、次は同値である：(a) $T_{0}$、(b) $T_{1}$、(c) ハウスドルフ、(d) $\{e\}$ が閉。さらに、どの位相群も正則である。
:::

::: proof
**正則.** \ref{top:tg-neighbourhoods} の 2, 3 から、$e$ の近傍 $U$ に対し対称な $V$ で $\overline{V}\subseteq VV^{-1}=VV\subseteq U$。よって $e$ の閉近傍が近傍基をなし、平行移動ですべての点で同様（\ref{top:regular-normal-characterization}）。

**(a) ⇒ (d).** $g\ne e$ とし、$g\notin\overline{\{e\}}$、すなわち $g$ の近傍で $e$ を含まないものがあることを示す。$T_{0}$ から、(i) $g$ の近傍で $e$ を含まないものがあるか、(ii) $e$ の近傍 $U$ で $g$ を含まないものがある。(ii) の場合、$gU^{-1}$ は $g$ の近傍で、$e\in gU^{-1}$ なら $g^{-1}\in U^{-1}$、すなわち $g\in U$ となって矛盾するので、$e\notin gU^{-1}$。いずれでも $g\notin\overline{\{e\}}$ で、$\{e\}$ は閉。

**(d) ⇒ (c).** \ref{top:tg-quotient} の 2 で $H=\{e\}$（$G/\{e\}=G$）。

**(c) ⇒ (b) ⇒ (a)** は一般に成り立つ。
:::

## 問題 {#top:sec-tg-problems}

::: problem {#top:prob-tg-discrete-closed}
ハウスドルフな位相群の離散な部分群（部分空間として離散）は閉であることを示せ。
:::

::: solution
$H$ を離散な部分群とし、$e$ の近傍 $U$ で $U\cap H=\{e\}$ となるものをとる。対称な開近傍 $V$ で $VV\subseteq U$ とする。$x\in\overline{H}\setminus H$ があるとする。$G$ は $T_{1}$ なので、$x$ の近傍 $xV$ は $H$ の点を無限個含む（有限個なら、それらを除いた $x$ の近傍で $H$ と交わらないものがとれる）。異なる $h_{1},h_{2}\in H\cap xV$ をとると $h_{1}^{-1}h_{2}\in V^{-1}x^{-1}xV=VV\subseteq U$ で、$h_{1}^{-1}h_{2}\in H\setminus\{e\}$ に反する。
:::

::: problem {#top:prob-tg-circle}
$\mathbb{R}/\mathbb{Z}$（商群、商位相）は円周群 $S^{1}$ と位相群として同型であることを示せ。
:::

::: solution
$\varphi\colon\mathbb{R}\to S^{1}$, $t\mapsto e^{2\pi it}$ は連続な全射準同型で核は $\mathbb{Z}$。誘導される $\bar{\varphi}\colon\mathbb{R}/\mathbb{Z}\to S^{1}$ は連続な全単射準同型（商写像の普遍性）。$\mathbb{R}/\mathbb{Z}$ は $[0,1]$ の連続像なのでコンパクト（$\pi[[0,1]]=\mathbb{R}/\mathbb{Z}$）、$S^{1}$ はハウスドルフなので、$\bar{\varphi}$ は同相写像（\ref{top:compact-to-hausdorff}）。
:::

::: supplement
**前提を変えると.** 乗法の連続性だけを要求し逆元の連続性を外したもの（半位相群・準位相群）では、ここでの議論の多くが成り立たない。たとえば $\mathbb{R}$ に下限位相（ゾルゲンフライ直線）を入れたものは加法が連続だが逆元が連続でない。局所コンパクトなハウスドルフ位相群には、平行移動で不変な測度（ハール測度）がただ一つ（定数倍を除いて）存在することが知られている（ここでは扱わない）。

**似た定理.** 位相群の左一様構造（\ref{top:page-group-uniformities}）を使うと、位相群はすべて完全正則であり、第一可算なハウスドルフ位相群は距離化可能であることが示される。\ref{top:tg-quotient} の 3 は、群の準同型定理の位相版の出発点である。

**高い視点から：位相群は「どこから見ても同じ景色」.** 位相群では平行移動がすべて同相写像なので、単位元の周りの景色を知れば、どの点の周りの景色も分かる。比喩で言えば、模様が一様に繰り返される壁紙のようなもので、一枚のタイル（単位元の近傍）の模様が全体を決める。$T_{0}$ だけでハウスドルフかつ正則になるのはこの一様性のためであり、一様空間（\ref{top:page-uniform-spaces}）の典型例でもある。
:::
