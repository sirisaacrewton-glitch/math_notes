# 一般位相（General Topology）

位相空間と連続写像、部分空間・直積・商、分離公理、コンパクト性とチコノフの定理、連結性、ウリゾーンの補題とティーツェの拡張定理、パラコンパクト性、距離空間と距離化、関数空間とアスコリ–アルツェラの定理、超空間とフラクタル集合、一様空間、局所連結性とカントール集合、完全写像、位相群。

<p class="mn-msc">MSC2020: 54</p>
