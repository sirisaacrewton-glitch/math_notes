## 最初の節の見出し {#pre:sec-slug-first}

::: definition 用語の名前 {#pre:term keywords="English name" index="用語の名前|ようごのなまえ"}
定義の本文。定義される語は **太字** にする（太字の語は自動で索引語になる）。
:::

::: intuition
定義を導入する意図・直感（自然言語で短く）。定義の直後に置くと枠の中に小さく表示される。
:::

::: example
定義がそのまま理解しにくいときの例。例 1：…。例 2（当てはまらない例）：…。
:::

::: theorem 定理の名前 {#pre:main-theorem keywords="English name of the theorem" index="定理の名前|ていりのなまえ"}
主張。長い式や関係演算子が複数ある式はディスプレイにする：
$$
\sum_{i<n} a_{i} \le \prod_{i<n} b_{i}
\label{pre:eq-main}
$$
:::

::: intuition
主張の直感的な意味。なぜこれを考えるのか。
:::

::: example
主張に付随する例（証明に付随する例なら proof の後に置く）。
:::

::: proof
**Step 1（何をするか）.** 途中式を省略しない。「明らか」で飛ばさない。\eqref{pre:eq-main} の左辺を … と評価する。

**Step 2.** \ref{pre:lemma-a} より …。ここで前提「$\kappa$ は正則」を使う。

**Step 3.** したがって主張が成り立つ。

::: hypcheck
- **前提「$\kappa$ は正則」**：Step 2 で … に使った。外すと偽（反例：$\kappa=\aleph_{\omega}$ のとき …）。
- **前提「…」**：使わなかった／本質的でない（弱めて … でもよい）。
- **公理**：選択公理は Step 1 の … で使う（それ以外は $\ZF$）。
:::
:::

::: supplement
**一般化.** 主張だけ述べ、有名なものは別記事へ：\ref[一般化された定理の名前]{pre:planned-generalization}（未執筆なら「（未執筆）」表示になり、書かれると自動でリンクになる）。

**前提を変えると.** 反例や、成り立たなくなる理由。

**類似の定理.** \nameref{set:cantor} と同じ対角線論法。

**高い視点.** 本質的なときだけ書く（こじつけない）。
:::
