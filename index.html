# Summa Mathematica（数学大全）

数学を分野ごとに体系化したノート。定義・定理・証明にラベルを付け、ページをまたいでワンクリックで参照できます。

## 基礎論（Foundations）

<div class="mn-cards">
<a class="mn-card" href="03-mathematical-logic/03B-general-logic/index.html"><span class="mn-card-title">一般論理</span><span class="mn-card-en">General Logic</span><span class="mn-card-desc">命題論理と一階述語論理の構文・意味論・証明体系と完全性定理、様相論理（クリプキ意味論・完全性・決定可能性）。</span><span class="mn-card-count">19 ページ</span></a>
<a class="mn-card" href="03-mathematical-logic/03C-model-theory/index.html"><span class="mn-card-title">モデル理論</span><span class="mn-card-en">Model Theory</span><span class="mn-card-desc">構造と理論、コンパクト性、初等部分構造、ヴォートの判定法、量化子消去、型と可算モデル、飽和モデル、識別不能列、超積、安定性と非可算範疇性（モーリーの範疇性定理）。</span><span class="mn-card-count">18 ページ</span></a>
<a class="mn-card" href="03-mathematical-logic/03D-computability-theory/index.html"><span class="mn-card-title">計算理論</span><span class="mn-card-en">Theory of Computation</span><span class="mn-card-desc">オートマトンと形式言語、計算可能性理論（プログラミング言語 L、原始再帰関数と一般再帰関数、レジスタ機械とチューリング機械、決定可能性と還元、万能プログラム・smn 定理・再帰定理）、その発展（論理的理論の決定可能性、チューリング還元と算術的階層）、計算複雑性、コルモゴロフ複雑性とアルゴリズム的ランダムネス、型なしラムダ計算。</span><span class="mn-card-count">47 ページ</span></a>
<a class="mn-card" href="03-mathematical-logic/03E-set-theory/index.html"><span class="mn-card-title">集合論</span><span class="mn-card-en">Set Theory</span><span class="mn-card-desc">公理的集合論。基礎事項から無限組合せ論・構成可能集合・強制法まで。章立ては Kunen『Set Theory』(1980) を参考にしている。</span><span class="mn-card-count">59 ページ</span></a>
<a class="mn-card" href="03-mathematical-logic/03F-proof-theory/index.html"><span class="mn-card-title">証明論と型理論</span><span class="mn-card-en">Proof Theory &amp; Type Theory</span><span class="mn-card-desc">シーケント計算とカット除去、算術の形式化とゲーデルの不完全性定理、証明可能性論理、二階算術とその部分体系、逆数学、順序数解析（ε₀ と PA）、型理論（カリー＝ハワード＝ランベック対応、ホモトピー型理論）。</span><span class="mn-card-count">56 ページ</span></a>
<a class="mn-card" href="18-category-theory/18A-general-theory/index.html"><span class="mn-card-title">圏論</span><span class="mn-card-en">Category Theory</span><span class="mn-card-desc">圏・関手・自然変換、極限と随伴、構造をもつ圏、トポス。</span><span class="mn-card-count">34 ページ</span></a>
</div>

## 代数（Algebra）

<div class="mn-cards">
<a class="mn-card" href="18-category-theory/18G-homological-algebra/index.html"><span class="mn-card-title">ホモロジー代数</span><span class="mn-card-en">Homological Algebra</span><span class="mn-card-desc">鎖複体と長完全列、射影・入射分解、導来関手 Ext と Tor、スペクトル系列、導来圏。</span><span class="mn-card-count">8 ページ</span></a>
</div>

## 幾何・位相（Geometry and Topology）

<div class="mn-cards">
<a class="mn-card" href="54-general-topology/index.html"><span class="mn-card-title">一般位相</span><span class="mn-card-en">General Topology</span><span class="mn-card-desc">位相空間と連続写像、部分空間・直積・商、分離公理、コンパクト性とチコノフの定理、連結性、ウリゾーンの補題とティーツェの拡張定理、パラコンパクト性、距離空間と距離化、関数空間とアスコリ–アルツェラの定理、超空間とフラクタル集合、一様空間、局所連結性とカントール集合、完全写像、位相群。</span><span class="mn-card-count">37 ページ</span></a>
</div>
